sisten.", "w": {"a": "Observasi saja berisiko tension berulang.", "b": "Torakotomi bukan langkah rutin setelah dekompresi.", "c": "CT toraks bukan prioritas pada pasien yang baru distabilkan.", "e": "Bronkodilator tidak relevan."}, "hy": "Urutan: dekompresi jarum (ICS 4–5 antara linea aksilaris anterior dan midaksilaris pada dewasa, ATLS 10th) → chest tube ICS 5.", "ev": [{"deck": "GD", "page": 51, "quote": "Obstructive - Tension pneumothorax"}], "refs": ["tb_atls"]}, {"id": "A036", "sec": "anes", "stem": "Temuan yang paling khas untuk tension pneumothorax adalah", "vig": "Pria 58 tahun datang dengan sesak berat setelah batuk hebat. A: bicara 1 kata, tampak panik. B: RR 40x/menit, SpO₂ 78% dengan nasal kanul; hemitoraks kanan ekspansi minimal, hipersonor, trakea deviasi ke kiri. C: TD 80/45 mmHg, nadi 135x/menit, CRT 5 detik. D: GCS 14. E: suhu 37,8 °C. Diagnosis klinis mengarah ke tension pneumothorax.", "opts": ["Suara usus hilang", "Hipersonor + deviasi trakea + distres", "Stridor", "Perkusi redup", "Ronki basah"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "b", "topic": "GD", "st": "peng", "deb": null, "note": null, "gl": null, "r": "Tension pneumotoraks khas ditandai hipersonor pada perkusi (udara di pleura), deviasi trakea ke sisi kontralateral (mediastinum terdorong), dan distres napas berat dengan gangguan hemodinamik. Slide Gawat Darurat mendaftar deviasi trakea, asimetri dada, dan hilangnya suara napas sebagai temuan Look–Listen–Feel pada gangguan ventilasi. Systematic review Roberts dkk. (2015) menunjukkan gambaran klinis bergantung pada status ventilasi. Pada pasien yang bernapas spontan, distres napas dan takikardia lebih dominan, sedangkan hipotensi lebih sering pada pasien dengan ventilasi tekanan positif.", "w": {"a": "Suara usus hilang adalah tanda ileus/peritonitis.", "c": "Stridor adalah tanda sumbatan jalan napas atas.", "d": "Perkusi redup berarti cairan atau konsolidasi (hemotoraks, efusi).", "e": "Ronki basah berarti cairan di alveoli (edema, pneumonia)."}, "hy": "Hipersonor dengan deviasi trakea kontralateral berarti tension pneumotoraks. Redup unilateral dengan syok berarti hemotoraks masif.", "ev": [{"deck": "GD", "page": 37, "quote": "Deviasi trakhea"}], "refs": ["roberts2015", "tb_atls"]}, {"id": "A037", "sec": "anes", "stem": "Seorang pasien datang dengan tanda-tanda dehidrasi. Pemeriksaan menunjukkan turgor kulit menurun, mukosa mulut kering, dan nadi sedikit meningkat, tetapi tekanan darah masih dalam batas normal. Berdasarkan tanda klinis tersebut, derajat dehidrasi pasien paling mungkin adalah:", "vig": null, "opts": ["Syok hipovolemik", "Dehidrasi sedang", "Dehidrasi ringan", "Dehidrasi berat", "Tidak dehidrasi"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "c", "topic": "SHOCK", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Tabel Tanda Klinis Dehidrasi di slide Syok menuliskan dehidrasi ringan (defisit 3–5%) dengan takikardia/nadi lemah, lidah kering, turgor turun, urin pekat, dan mengantuk. Dehidrasi sedang (6–8%) sudah disertai hipotensi ortostatik, lidah keriput, dan urin berkurang. Dehidrasi berat (>10%) berarti nadi tak teraba, akral dingin, sianosis, dan koma. Pasien ini memiliki turgor menurun, mukosa kering, dan nadi sedikit meningkat dengan TD normal, sehingga paling cocok dengan dehidrasi ringan.", "w": {"a": "Syok hipovolemik disertai tanda hipoperfusi: akral dingin, CRT memanjang, hipotensi.", "b": "Dehidrasi sedang sudah ada hipotensi ortostatik dan lidah keriput.", "d": "Dehidrasi berat ditandai nadi tak teraba, sianosis, dan koma.", "e": "Turgor menurun dan mukosa kering adalah tanda dehidrasi."}, "hy": "Estimasi defisit = BB × % dehidrasi. Berikan 50% dalam 8 jam pertama dan 50% dalam 16 jam berikutnya, di luar cairan rumatan (slide Terapi Cairan).", "ev": [{"deck": "SHOCK", "page": 34, "quote": "Lidah kering, turgor turun"}], "refs": []}, {"id": "A038", "sec": "anes", "stem": "Pasien somnolen, RR 8x/menit, PaCO₂ 56 mmHg, pH 7,15. Ini menunjukkan gagal napas tipe:", "vig": null, "opts": ["Tipe III (atelektasis pascaoperasi)", "Gangguan metabolik campuran", "Tipe II (hiperkapnik)", "Alkalosis respiratorik", "Tipe I (hipoksemik)"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "c", "topic": "AB", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Pasien somnolen dengan RR 8x/menit (hipoventilasi), PaCO₂ 56 mmHg, dan pH 7,15 menunjukkan asidosis respiratorik akut akibat kegagalan ventilasi: gagal napas tipe II (hiperkapnik). RR rendah dengan penurunan kesadaran menunjukkan masalah di kendali napas sentral, misalnya akibat sedatif atau opioid. Slide Asam-Basa mencantumkan \"diseases affecting central control of breathing\" dan \"sedative or neuromuscular blocking agents\" sebagai etiologi asidosis respiratorik.", "w": {"a": "\"Tipe III\" (perioperatif/atelektasis) adalah klasifikasi tambahan yang tidak sesuai dengan gambaran ini.", "b": "Gangguan primernya respiratorik (PaCO₂ tinggi), bukan metabolik.", "d": "Alkalosis respiratorik disertai PaCO₂ rendah dan pH tinggi.", "e": "Tipe I ditandai PaCO₂ normal atau rendah."}, "hy": "RR rendah dengan PaCO₂ tinggi berarti masalah \"pompa\"/drive. Cari opioid atau benzodiazepin, lalu pertimbangkan antidot (nalokson/flumazenil, slide hlm. 44).", "ev": [{"deck": "AB", "page": 39, "quote": "pH < 7.4 as a result of PaCO2 > 40 mmHg"}, {"deck": "AB", "page": 40, "quote": "Sedative or neuromuscular blocking agents"}], "refs": ["roussos2003"]}, {"id": "A039", "sec": "anes", "stem": "Gagal napas akut didefinisikan sebagai ketidakmampuan sistem respirasi untuk:", "vig": null, "opts": ["Menjaga suhu tubuh", "Mempertahankan PaCO₂ < 30 mmHg", "Memenuhi kebutuhan metabolik tubuh", "Menjaga tekanan darah stabil", "Mengatur keseimbangan elektrolit"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "c", "topic": "AB", "st": "luar", "deb": null, "note": null, "gl": null, "r": "Gagal napas akut didefinisikan sebagai ketidakmampuan sistem respirasi melakukan pertukaran gas yang memenuhi kebutuhan metabolik tubuh, yaitu memasok O₂ dan membuang CO₂ yang dihasilkan metabolisme. Hasilnya adalah hipoksemia (PaO₂ <60 mmHg) dan/atau hiperkapnia (PaCO₂ >50 mmHg). Roussos & Koutsoukou (2003) membaginya menjadi kegagalan paru (lung failure, hipoksemik) dan kegagalan pompa (pump failure, hiperkapnik).", "w": {"a": "Termoregulasi bukan fungsi utama sistem respirasi.", "b": "PaCO₂ <30 mmHg adalah hipokapnia, bukan target.", "d": "Tekanan darah adalah fungsi sistem kardiovaskular.", "e": "Keseimbangan elektrolit terutama diatur ginjal."}, "hy": "Batas angka: PaO₂ <60 mmHg (udara ruangan) dan/atau PaCO₂ >50 mmHg dengan pH <7,35.", "ev": [], "refs": ["roussos2003"]}, {"id": "A040", "sec": "anes", "stem": "Seorang pasien mendapat lidokain dosis besar untuk infiltrasi kulit. Setelah beberapa menit muncul gejala gelisah, kesemutan di bibir, dan tinitus. Diagnosis yang paling tepat?", "vig": null, "opts": ["Hipoglikemia", "Anafilaksis", "Toksisitas sistemik anestesi lokal (toksisitas SSP)", "Stroke iskemik", "Vertigo perifer"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "c", "topic": "LA", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Lidokain dosis besar yang diikuti gelisah, kesemutan bibir (perioral), dan tinitus dalam beberapa menit adalah gambaran klasik toksisitas sistemik anestesi lokal tahap SSP. Slide mencatat bahwa gejala SSP muncul lebih dulu daripada gejala kardiovaskular. Onsetnya <5 menit bila obat masuk intravaskular dan ±20 menit bila lewat infiltrasi.", "w": {"a": "Hipoglikemia bisa menyebabkan gelisah, tetapi tidak menimbulkan tinitus dan kesemutan perioral yang terkait waktu injeksi.", "b": "Anafilaksis disertai urtikaria, bronkospasme, dan hipotensi.", "d": "Stroke iskemik menimbulkan defisit neurologis fokal.", "e": "Vertigo perifer tidak menimbulkan kesemutan bibir."}, "hy": "Dosis maksimal lidokain: 3 mg/kg tanpa adrenalin, 7 mg/kg dengan adrenalin (tabel dosis di slide).", "ev": [{"deck": "LA", "page": 24, "quote": "GEJALA SSP LEBIH DULU TIMBUL DARIPADA GEJALA KARDIOVASKULER"}], "refs": []}, {"id": "A041", "sec": "anes", "stem": "Seorang pasien 45 tahun datang ke IGD dengan sesak, gelisah, SpO₂ 82% memakai nasal kanul 3 L/menit, RR 32x/menit, retraksi otot bantu napas. TD 110/70 mmHg, nadi 110x/menit. Apa langkah awal yang paling tepat?", "vig": null, "opts": ["Melakukan intubasi segera tanpa preoksigenasi", "Memberikan diuretik", "Memberikan dopamin", "Mengganti ke masker non-rebreathing (NRBM) 10–15 L/menit", "Menaikkan O₂ nasal kanul menjadi 6 L/menit"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "d", "topic": "GD", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Pasien hipoksemia berat (SpO₂ 82%) dengan distres (RR 32, retraksi) tetapi hemodinamik stabil dan masih bernapas spontan. Nasal kanul hanya memberi FiO₂ sekitar 24–44% meskipun aliran dinaikkan. Langkah awal yang tepat adalah segera beralih ke sungkup dengan reservoir (non-rebreathing mask) 10–15 L/menit yang memberi FiO₂ jauh lebih tinggi (60–100% menurut slide). Setelah itu, respons dievaluasi untuk eskalasi lebih lanjut.", "w": {"a": "Intubasi tanpa preoksigenasi berbahaya karena desaturasi cepat; lagi pula belum tentu perlu intubasi.", "b": "Diuretik tidak tepat sebelum etiologi jelas.", "c": "Dopamin tidak diindikasikan karena TD normal.", "e": "Nasal kanul 6 L/menit pun FiO₂-nya hanya sekitar 44%, tidak memadai."}, "hy": "FiO₂ alat (slide): nasal 1–6 L/menit → 24–44%; face mask 8–10 L/menit → 40–60%; masker dengan reservoir → 60–100%; Jackson Rees → 100%.", "ev": [{"deck": "GD", "page": 44, "quote": "Dengan reservoir bag Flow O2 : 6-10 lpm FiO2 : 60%- 100%"}], "refs": []}, {"id": "A042", "sec": "anes", "stem": "Pasien mengalami cardiac arrest. Monitor menunjukkan VF. Tindakan paling tepat sesuai algoritma adalah:", "vig": null, "opts": ["Melakukan ventilasi 20x/menit", "Memberikan adrenalin terlebih dahulu", "Menunggu sampai gelombang menjadi lebih \"coarse\"", "Melakukan satu kali defibrilasi, kemudian lanjutkan CPR 2 menit", "Melakukan 3 kali shock berturut-turut"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "d", "topic": "CPR", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "VF adalah ritme shockable, dan setiap menit tanpa defibrilasi menurunkan peluang hidup. Algoritme modern memberi satu kali syok (bifasik 150–200 J atau monofasik 360 J), lalu langsung melanjutkan CPR 2 menit tanpa mengecek ritme atau nadi, baru kemudian ritme dievaluasi. Slide CPR menekankan \"a single shock (dulu 3x)\" dan CPR segera setelahnya. Adrenalin pada VF diberikan setelah syok kedua, sedangkan amiodaron setelah syok ketiga.", "w": {"a": "Ventilasi 20x/menit menyebabkan hiperventilasi. Setelah airway lanjut, targetnya 1 napas tiap 6 detik (10x/menit).", "b": "Pada VF, defibrilasi didahulukan daripada adrenalin.", "c": "Jangan menunggu; segera defibrilasi.", "e": "Tiga kali syok beruntun adalah protokol lama yang sudah ditinggalkan."}, "hy": "Fine VF yang meragukan (asistol atau VF?) jangan didefibrilasi; lanjutkan CPR (slide).", "ev": [{"deck": "CPR", "page": 39, "quote": "Setelah a single shock, segera CPR lagi 2 menit tanpa check ECG sudah ROSC atau belum"}], "refs": ["panchal2020"]}, {"id": "A043", "sec": "anes", "stem": "Agen anestesi inhalasi yang memiliki kelarutan darah/gas (blood/gas solubility) paling rendah adalah:", "vig": null, "opts": ["Desfluran", "Sevofluran", "Halotan", "Isofluran", "Enfluran"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "FARM", "st": "luar", "deb": null, "note": null, "gl": null, "r": "Koefisien partisi darah/gas menentukan kecepatan induksi dan pemulihan. Makin rendah kelarutan agen dalam darah, makin cepat konsentrasi alveolar mendekati konsentrasi inspirasi. Desfluran memiliki koefisien terendah, yaitu sekitar 0,42 (Eger 1987, dengan kode awal I-653), lebih rendah dari sevofluran (±0,65) dan isofluran (±1,4). Halotan (±2,4) dan enfluran (±1,8) lebih larut. Nilai selain desfluran adalah angka textbook standar, karena topik ini tidak ada di PPT.", "w": {"b": "Sevofluran juga rendah (±0,65), tetapi masih di atas desfluran.", "c": "Halotan paling larut di antara pilihan (±2,4), sehingga induksi dan pemulihannya paling lambat.", "d": "Isofluran ±1,4.", "e": "Enfluran ±1,8."}, "hy": "Kelarutan rendah berarti induksi dan pemulihan cepat. Potensi (MAC) berbanding terbalik dengan kelarutan dalam lemak (oil/gas), bukan dengan darah/gas.", "ev": [], "refs": ["eger1987", "tb_morgan"]}, {"id": "A044", "sec": "anes", "stem": "Tujuan utama pemberian anestesi umum adalah:", "vig": null, "opts": ["Menghasilkan sedasi, analgesia, dan relaksasi", "Menghentikan ventilasi spontan", "Menurunkan tekanan darah", "Menghilangkan rasa lapar", "Menekan refleks muntah"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "INTRO", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Tujuan anestesi umum adalah mencapai trias anestesi: hipnosis (sedasi sampai hilang kesadaran), analgesia, dan relaksasi otot. Slide Intro memperluasnya menjadi pentad (hipnosis, amnesia, analgesia, imobilitas, paralisis). Tidak ada satu obat pun yang aman memberi semuanya, sehingga dipakai balanced anesthesia, misalnya propofol ditambah opioid ditambah pelumpuh otot.", "w": {"b": "Henti napas spontan adalah efek samping atau konsekuensi pelumpuh otot, bukan tujuan.", "c": "Penurunan tekanan darah adalah efek samping.", "d": "Menghilangkan rasa lapar tidak relevan.", "e": "Refleks muntah memang tertekan, tetapi itu konsekuensi, bukan tujuan utama."}, "hy": "Rute: IV untuk induksi cepat (propofol, ketamin, tiopental); inhalasi untuk rumatan (sevofluran, desfluran, N₂O).", "ev": [{"deck": "INTRO", "page": 7, "quote": "Hypnosis: Unconsciousness and loss of awareness"}, {"deck": "INTRO", "page": 16, "quote": "Polypharmacy is required to safely achieve the complete triad"}], "refs": []}, {"id": "A045", "sec": "anes", "stem": "Resusitasi cairan awal yang paling tepat adalah", "vig": "Perempuan 42 tahun datang dengan demam tinggi, nyeri perut kanan bawah hebat, dan sesak progresif sejak 12 jam. A: masih bisa bicara 2–3 kata, tidak ada stridor, sekret minimal. B: RR 34x/menit, SpO₂ 86% dengan nasal kanul 3 L/menit, retraksi dinding dada, ronki basah bilateral. C: TD 92/56 mmHg, nadi 124x/menit, CRT 4 detik, akral dingin, perut distensi. D: GCS 15, tampak gelisah. E: suhu 38,7 °C. BGA (FiO₂ 0,32): pH 7,29 / PaCO₂ 28 mmHg / PaO₂ 55 mmHg / HCO₃⁻ 15 mEq/L. USG abdomen: cairan bebas dan tanda peritonitis. Pasien perlu laparotomi emergensi.", "opts": ["Transfusi PRC", "Hindari cairan karena risiko overload", "Dopamin", "Albumin 5%", "Kristaloid 20–30 mL/kg"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "e", "topic": "SHOCK", "st": "ppt", "deb": null, "note": "Data BGA dan USG pada kasus ini sempat terpotong di versi sebelumnya; kini sudah dilengkapi sesuai soal asli.", "gl": "Slide memakai Hour-1 Bundle (30 mL/kg). SSC 2021 tetap menyarankan minimal 30 mL/kg dalam 3 jam pertama, tetapi rekomendasinya kini lemah (weak, low quality) dan menekankan penilaian respons cairan secara dinamis.", "r": "Perempuan dengan demam, peritonitis, takikardia, CRT 4 detik, TD 92/56, dan asidosis metabolik menunjukkan sepsis dengan hipoperfusi akibat sumber abdomen. Resusitasi awal sesuai Hour-1 Bundle Surviving Sepsis Campaign (slide Syok) adalah kristaloid ±30 mL/kg dalam 3 jam pertama pada hipotensi atau laktat ≥4, sambil memberi antibiotik spektrum luas, kultur, kontrol sumber (laparotomi), dan vasopresor bila MAP <65 setelah cairan. Ada catatan: SSC 2021 menurunkan kekuatan rekomendasi 30 mL/kg menjadi \"weak\" dan menekankan penilaian respons cairan secara dinamis. Pasien ini sudah ada ronki basah bilateral, jadi cairan diberikan sambil memantau tanda kelebihan cairan.", "w": {"a": "PRC tidak diindikasikan tanpa anemia berat atau perdarahan.", "b": "Menghindari cairan sama sekali pada syok septik salah, walaupun respons tetap harus dipantau.", "c": "Dopamin bukan vasopresor pertama syok septik (slide Farmakologi); lini pertama adalah noradrenalin.", "d": "Albumin dipertimbangkan bila kristaloid sudah dalam jumlah besar, bukan lini pertama."}, "hy": "Hour-1 bundle: laktat, kultur darah sebelum antibiotik, antibiotik spektrum luas, kristaloid 30 mL/kg (bila hipotensi atau laktat ≥4), vasopresor untuk MAP ≥65.", "ev": [{"deck": "SHOCK", "page": 27, "quote": "Initial Resuscitation for Sepsis and Septic Shock"}], "refs": ["evans2021"]}, {"id": "A046", "sec": "anes", "stem": "Perfusi dingin + CRT 4 detik + takikardia → jenis syok apa?", "vig": "Perempuan 42 tahun datang dengan demam tinggi, nyeri perut kanan bawah hebat, dan sesak progresif sejak 12 jam. A: masih bisa bicara 2–3 kata, tidak ada stridor, sekret minimal. B: RR 34x/menit, SpO₂ 86% dengan nasal kanul 3 L/menit, retraksi dinding dada, ronki basah bilateral. C: TD 92/56 mmHg, nadi 124x/menit, CRT 4 detik, akral dingin, perut distensi. D: GCS 15, tampak gelisah. E: suhu 38,7 °C. BGA (FiO₂ 0,32): pH 7,29 / PaCO₂ 28 mmHg / PaO₂ 55 mmHg / HCO₃⁻ 15 mEq/L. USG abdomen: cairan bebas dan tanda peritonitis. Pasien perlu laparotomi emergensi.", "opts": ["Sepsis", "Kardiogenik", "Obstruktif", "Neurogenik", "Hipovolemik"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "ICU2", "st": "peng", "deb": "Pertanyaan yang hanya menyebut \"perfusi dingin + CRT 4 detik + takikardia\" tanpa konteks lebih cocok dengan syok hipovolemik. Dalam konteks kasus 46–50, kunci a (sepsis) lebih tepat.", "note": null, "gl": null, "r": "Dalam konteks kasus (demam 38,7 °C, peritonitis, asidosis metabolik, takipnea), tanda hipoperfusi berupa akral dingin, CRT 4 detik, dan takikardia paling mungkin merupakan syok septik. Sepsis memang klasik digambarkan sebagai \"warm shock\" karena vasodilatasi. Namun pada sepsis abdomen dengan kehilangan cairan ke rongga ketiga (third spacing) atau disfungsi miokard septik, pasien dapat datang dengan \"cold shock\" yang perifernya dingin. Slide ICU juga mengingatkan bahwa gambaran campuran sering terjadi, misalnya kardiomiopati septik.", "w": {"b": "Tidak ada riwayat jantung atau tanda pompa gagal sebagai penyebab primer.", "c": "Tidak ada tanda obstruksi (tension, tamponade, emboli paru).", "d": "Syok neurogenik disertai bradikardia dan akral hangat setelah cedera medula spinalis.", "e": "Hipovolemia (third spacing) memang ikut berperan, tetapi penyebab dasarnya infeksi, jadi klasifikasi utamanya sepsis."}, "hy": "Akral dingin tidak menyingkirkan sepsis. Laktat dan konteks klinis menentukan.", "ev": [{"deck": "ICU2", "page": 26, "quote": "Life-threatening organ dysfunction caused by a dysregulated host response to infection"}], "refs": []}, {"id": "A047", "sec": "anes", "stem": "Interpretasi BGA: pH rendah + HCO₃⁻ rendah + PaCO₂ rendah. Apa artinya?", "vig": "Perempuan 42 tahun datang dengan demam tinggi, nyeri perut kanan bawah hebat, dan sesak progresif sejak 12 jam. A: masih bisa bicara 2–3 kata, tidak ada stridor, sekret minimal. B: RR 34x/menit, SpO₂ 86% dengan nasal kanul 3 L/menit, retraksi dinding dada, ronki basah bilateral. C: TD 92/56 mmHg, nadi 124x/menit, CRT 4 detik, akral dingin, perut distensi. D: GCS 15, tampak gelisah. E: suhu 38,7 °C. BGA (FiO₂ 0,32): pH 7,29 / PaCO₂ 28 mmHg / PaO₂ 55 mmHg / HCO₃⁻ 15 mEq/L. USG abdomen: cairan bebas dan tanda peritonitis. Pasien perlu laparotomi emergensi.", "opts": ["Normal", "Alkalosis respiratorik", "Alkalosis campuran", "Asidosis respiratorik", "Asidosis metabolik dengan kompensasi respiratorik"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "e", "topic": "AB", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "pH 7,29 berarti asidemia. HCO₃⁻ 15 (<24) menunjukkan gangguan primer metabolik, yaitu asidosis metabolik. PaCO₂ 28 (<40) berarti paru melakukan hiperventilasi sebagai kompensasi. Menurut rumus Winter di slide ICU, PaCO₂ yang diharapkan = 1,5 × 15 + 8 ± 2 = 28,5–32,5. Menurut rumus di slide Asam-Basa, 40 − 1,2 × (24 − 15) = 29,2. PaCO₂ 28 berada di sekitar batas bawah rentang tersebut, sehingga interpretasinya asidosis metabolik dengan kompensasi respiratorik. Penyebabnya kemungkinan asidosis laktat akibat sepsis.", "w": {"a": "pH 7,29 tidak normal.", "b": "Alkalosis respiratorik disertai pH tinggi.", "c": "Tidak ada komponen alkalosis yang dominan.", "d": "Asidosis respiratorik disertai PaCO₂ tinggi."}, "hy": "Langkah BGA: konsistensi internal → pH → PaCO₂ → HCO₃⁻ → anion gap (bila asidosis metabolik) → akut/kronik → kompensasi.", "ev": [{"deck": "AB", "page": 28, "quote": "1.2 mmHg decrease in PaCO2 for every 1 mEq/L fall in HCO3-"}], "refs": []}, {"id": "A048", "sec": "anes", "stem": "Kapan pasien ini perlu diintubasi?", "vig": "Perempuan 42 tahun datang dengan demam tinggi, nyeri perut kanan bawah hebat, dan sesak progresif sejak 12 jam. A: masih bisa bicara 2–3 kata, tidak ada stridor, sekret minimal. B: RR 34x/menit, SpO₂ 86% dengan nasal kanul 3 L/menit, retraksi dinding dada, ronki basah bilateral. C: TD 92/56 mmHg, nadi 124x/menit, CRT 4 detik, akral dingin, perut distensi. D: GCS 15, tampak gelisah. E: suhu 38,7 °C. BGA (FiO₂ 0,32): pH 7,29 / PaCO₂ 28 mmHg / PaO₂ 55 mmHg / HCO₃⁻ 15 mEq/L. USG abdomen: cairan bebas dan tanda peritonitis. Pasien perlu laparotomi emergensi.", "opts": ["Setelah di kamar operasi", "Saat RR > 20x/menit", "Segera tanpa preoksigenasi", "Bila PaO₂ < 70 mmHg", "Bila gagal mempertahankan SpO₂ > 90% meski dengan NRBM, atau terjadi kelelahan napas"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "e", "topic": "GD", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Indikasi intubasi pada gagal napas ditentukan oleh kegagalan oksigenasi atau ventilasi meskipun terapi O₂ sudah maksimal, tanda kelelahan otot napas, atau ketidakmampuan melindungi jalan napas. Angka RR atau PaO₂ tunggal tidak menentukan. Pasien ini masih bisa bicara 2–3 kata, GCS 15, dan SpO₂ 86% dengan nasal kanul. Langkah pertama adalah eskalasi oksigen (NRBM). Bila tetap gagal mempertahankan SpO₂ >90% atau muncul kelelahan, intubasi dengan preoksigenasi. Slide Gawat Darurat memuat tabel kriteria intubasi/ventilasi berdasarkan mekanika napas, oksigenasi, dan ventilasi.", "w": {"a": "Menunda sampai di kamar operasi berbahaya bila pasien sudah gagal napas sebelumnya.", "b": "RR >20 terlalu rendah sebagai ambang intubasi.", "c": "Intubasi tanpa preoksigenasi menyebabkan desaturasi berat.", "d": "PaO₂ <70 saja bukan indikasi; nilai dulu respons terhadap O₂."}, "hy": "Kriteria ventilasi mekanik (slide): RR >35 atau <10, kapasitas vital <15 mL/kg, PaO₂ <70 dengan masker O₂, PaCO₂ >60 (kecuali hiperkapnia kronik).", "ev": [{"deck": "GD", "page": 40, "quote": "Intubation Ventilation tracheostomy Criteria"}], "refs": []}, {"id": "A049", "sec": "anes", "stem": "SpO₂ 86% dengan nasal kanul disertai distres. Intervensi berikutnya adalah", "vig": "Perempuan 42 tahun datang dengan demam tinggi, nyeri perut kanan bawah hebat, dan sesak progresif sejak 12 jam. A: masih bisa bicara 2–3 kata, tidak ada stridor, sekret minimal. B: RR 34x/menit, SpO₂ 86% dengan nasal kanul 3 L/menit, retraksi dinding dada, ronki basah bilateral. C: TD 92/56 mmHg, nadi 124x/menit, CRT 4 detik, akral dingin, perut distensi. D: GCS 15, tampak gelisah. E: suhu 38,7 °C. BGA (FiO₂ 0,32): pH 7,29 / PaCO₂ 28 mmHg / PaO₂ 55 mmHg / HCO₃⁻ 15 mEq/L. USG abdomen: cairan bebas dan tanda peritonitis. Pasien perlu laparotomi emergensi.", "opts": ["Nebulizer", "HFNC", "Tunggu saturasi membaik", "Naikkan nasal kanul ke 10 L/menit", "Ganti ke NRBM 10–15 L/menit"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "e", "topic": "GD", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "SpO₂ 86% dengan nasal kanul 3 L/menit disertai distres berarti oksigenasi tidak adekuat. Nasal kanul hanya memberi FiO₂ sekitar 24–44%, dan menaikkan aliran di atas 6 L/menit tidak menambah FiO₂ secara bermakna, malah mengeringkan mukosa. Langkah berikutnya yang paling tepat adalah mengganti ke NRBM 10–15 L/menit, lalu menilai respons dan eskalasi ke HFNC/NIV atau intubasi bila gagal.", "w": {"a": "Nebulizer tidak mengatasi hipoksemia akibat pneumonia atau edema.", "b": "HFNC bisa dipakai sebagai eskalasi berikutnya, tetapi langkah cepat dan sederhana yang diajarkan adalah NRBM.", "c": "Menunggu saturasi membaik membiarkan hipoksemia berlanjut.", "d": "Nasal kanul 10 L/menit tidak lazim dan tidak menaikkan FiO₂ secara efektif."}, "hy": "Nasal kanul: setiap tambahan 1 L/menit menaikkan FiO₂ sekitar 4%, dengan batas atas efektif ±6 L/menit.", "ev": [{"deck": "GD", "page": 44, "quote": "Dengan reservoir bag Flow O2 : 6-10 lpm FiO2 : 60%- 100%"}], "refs": []}, {"id": "A050", "sec": "anes", "stem": "Definition of pain according to IASP (2020):", "vig": null, "opts": ["An unpleasant sensory and emotional experience associated with, or resembling that associated with, actual or potential tissue damage", "An unpleasant sensory and emotional experience not associated with actual or potential tissue damage", "Pain is an unpleasant sensory and emotional experience associated with actual or potential tissue damage, or described in terms of such damage"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": true, "img": null, "pool": "all", "key": "a", "topic": "PATFIS", "st": "ppt", "deb": null, "note": "Soal IUP ini hanya tercatat dengan 3 opsi.", "gl": null, "r": "Definisi nyeri IASP revisi 2020: \"An unpleasant sensory and emotional experience associated with, or resembling that associated with, actual or potential tissue damage.\" Frasa \"or resembling that associated with\" menggantikan \"or described in terms of such damage\" dari definisi 1979. Perubahan ini mengakui nyeri pada individu yang tidak bisa mengungkapkannya secara verbal, seperti bayi, pasien demensia, atau pasien terintubasi (Raja dkk., 2020). Slide Patofisiologi Nyeri menampilkan kedua definisi tersebut.", "w": {"b": "\"Not associated with ... tissue damage\" keliru; definisi justru mengaitkannya dengan kerusakan jaringan, aktual maupun potensial.", "c": "Ini definisi lama IASP 1979, bukan versi 2020."}, "hy": "Inti revisi 2020: nyeri selalu pengalaman personal, dan ketidakmampuan berkomunikasi tidak meniadakan nyeri.", "ev": [{"deck": "PATFIS", "page": 7, "quote": "Revised IASP Definition of Pain 2020"}], "refs": ["raja2020"]}, {"id": "R001", "sec": "radio", "stem": "Honeycomb pattern pada foto toraks dapat dijumpai pada kondisi:", "vig": null, "opts": ["Pneumonia", "Tumor paru dengan nekrosis sentral", "Edema paru", "Bronkiektasis", "Efusi pleura kronik"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "d", "topic": "LUNG", "st": "peng", "deb": "Honeycombing sejati adalah tanda fibrosis paru (tidak ada di opsi). Bronkiektasis dipilih sebagai mimik kistik terdekat.", "note": null, "gl": null, "r": "Honeycomb atau honeycombing adalah kumpulan ruang kistik berdinding tebal yang tersusun berlapis seperti sarang lebah. Slide menempatkannya sebagai pola interstisial stadium akhir (end-stage), terutama pada fibrosis paru (UIP/IPF). Fibrosis tidak ada di pilihan. Di antara opsi, bronkiektasis paling tepat karena bronkiektasis kistik pada foto toraks memberikan gambaran ring shadow multipel yang menyerupai sarang lebah. Fleischner Society menegaskan bahwa honeycombing sejati adalah tanda fibrosis dan harus dibedakan dari bronkiektasis kistik.", "w": {"a": "Pneumonia memberi konsolidasi dengan air bronchogram.", "b": "Tumor dengan nekrosis sentral memberi kavitas tunggal berdinding tebal.", "c": "Edema paru memberi Kerley B, bat-wing, dan cuffing.", "e": "Efusi kronik memberi opasitas homogen di pleura atau fibrotoraks."}, "hy": "Ring shadow dan tramline (dinding bronkus menebal) adalah tanda bronkiektasis (slide Lung hlm. 33).", "ev": [{"deck": "LUNG", "page": 7, "quote": "Honeycomb pattern (end-stage disease)"}, {"deck": "LUNG", "page": 23, "quote": "Cystic bronchiectasis"}], "refs": ["hansell2008"]}, {"id": "R002", "sec": "radio", "stem": "Pada foto toraks proyeksi lateral, bagian jantung yang terletak retrosternal adalah", "vig": null, "opts": ["Atrium kanan", "Ventrikel kanan", "Atrium kiri dan atrium kanan", "Ventrikel kiri", "Atrium kiri"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 3, "inc": false, "img": null, "pool": "all", "key": "b", "topic": "THORAX", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Pada foto toraks lateral, bagian jantung paling anterior yang menempel pada sternum (ruang retrosternal) adalah ventrikel kanan, yang normalnya menyinggung kurang dari 1/3 bagian bawah sternum. Batas posterior dibentuk vena kava inferior, ventrikel kiri, atrium kiri, arteri pulmonalis, dan arkus aorta. Pembesaran ventrikel kanan tampak sebagai ruang retrosternal yang menyempit atau terisi.", "w": {"a": "Atrium kanan membentuk batas kanan pada proyeksi PA, bukan bagian retrosternal.", "c": "Atrium kiri berada di posterior, sedangkan atrium kanan di kanan.", "d": "Ventrikel kiri membentuk batas posterior-inferior pada proyeksi lateral.", "e": "Atrium kiri adalah bagian paling posterior jantung."}, "hy": "Proyeksi PA: batas kiri dibentuk ventrikel kiri, konus pulmonalis, dan arkus aorta; batas kanan dibentuk atrium kanan dan VCS. Proyeksi lateral: anterior dibentuk ventrikel kanan; posterior dibentuk atrium dan ventrikel kiri.", "ev": [{"deck": "THORAX", "page": 22, "quote": "Ventrikel kanan merupakan bagian terdepan"}], "refs": []}, {"id": "R003", "sec": "radio", "stem": "Gambaran normal tiroid pada USG adalah:", "vig": null, "opts": ["Hyperechoic dengan kalsifikasi", "Hypoechoic dengan kalsifikasi", "Heterogen hypoechoic", "Homogen hypoechoic", "Homogen hyperechoic"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "e", "topic": "THYR", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Parenkim tiroid normal pada USG tampak homogen dengan ekogenitas sedang sampai tinggi (hiperekoik terhadap otot leher), dengan kapsul berupa garis tipis hipoekoik (slide). Penurunan ekogenitas yang difus dan heterogen mengarah ke tiroiditis (misalnya Hashimoto). Nodul hipoekoik dengan mikrokalsifikasi adalah tanda curiga ganas.", "w": {"a": "Kalsifikasi tidak ada pada tiroid normal.", "b": "Hipoekoik dengan kalsifikasi adalah tanda curiga keganasan.", "c": "Heterogen hipoekoik khas tiroiditis.", "d": "Tiroid normal tidak hipoekoik."}, "hy": "Fitur nodul tiroid curiga ganas di slide hlm. 17: komposisi dominan solid, hipoekogenitas yang lebih nyata, dan tepi spikulasi, tidak tegas, atau ireguler.", "ev": [{"deck": "THYR", "page": 10, "quote": "Normal parenchyma – homogeneous medium to high level echoes"}], "refs": []}, {"id": "R004", "sec": "radio", "stem": "Double duct sign akibat sumbatan (obstruksi) dapat ditemukan pada keadaan:", "vig": null, "opts": ["Pankreatitis akut", "Duodenitis akut", "Adenokarsinoma kaput pankreas", "Kolelitiasis", "Kolesistitis akut"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "c", "topic": "IRA", "st": "luar", "deb": null, "note": null, "gl": null, "r": "Double duct sign adalah dilatasi simultan duktus koledokus (CBD) dan duktus pankreatikus (Wirsung). Tanda ini menunjukkan obstruksi di level papila atau kaput pankreas, tempat kedua duktus bermuara bersama. Penyebab tersering dan terpenting adalah adenokarsinoma kaput pankreas, diikuti tumor ampula/periampula dan kolangiokarsinoma distal (Ahualli, Radiology 2007). Pankreatitis kronik dan batu di ampula lebih jarang. Topik ini tidak ada di PPT.", "w": {"a": "Pankreatitis akut tidak khas menyebabkan obstruksi kedua duktus.", "b": "Duodenitis akut tidak menyebabkan double duct sign.", "d": "Kolelitiasis (batu kandung empedu) tidak menyumbat duktus pankreatikus, kecuali batu besar terjepit di ampula.", "e": "Kolesistitis akut tidak melibatkan duktus pankreatikus."}, "hy": "Double duct sign tanpa massa yang terlihat tetap harus dicurigai keganasan pankreas atau periampula sampai terbukti sebaliknya.", "ev": [], "refs": ["ahualli2007"]}, {"id": "R005", "sec": "radio", "stem": "Seorang pasien laki-laki datang ke IGD dengan keluhan nyeri abdomen kanan atas setelah trauma KLL. Abdomen tampak membesar dan distensi. Pada foto polos abdomen didapatkan ground glass appearance terutama di perifer. Hasil CT scan abdomen seperti di bawah ini. Diagnosisnya adalah", "vig": null, "opts": ["Perforasi usus", "Udara bebas intraperitoneal", "Gastritis", "Laserasi hepar", "Laserasi lien"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": "oc_p10_x30", "pool": "all", "key": "d", "topic": "ABD", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Pasien trauma KLL dengan nyeri kanan atas dan abdomen distensi memiliki foto polos dengan ground-glass di perifer, yang menunjukkan cairan atau darah bebas (hemoperitoneum). CT dengan kontras memperlihatkan area hipodens linier/ireguler di parenkim hepar yang ditunjuk panah, dengan cairan perihepatik. Gambaran ini adalah laserasi hepar. Slide Kegawatdaruratan GI mendaftar cedera organ padat pada trauma abdomen: laserasi, hematoma, kontusio, dan devaskularisasi.", "w": {"a": "Perforasi usus ditandai udara bebas, bukan defek parenkim hepar.", "b": "Udara bebas tampak hitam (densitas udara), bukan hipodens di hepar.", "c": "Gastritis bukan cedera trauma yang tampak seperti ini.", "e": "Lien berada di kiri atas, sedangkan lesi di gambar berada di hepar (kanan)."}, "hy": "Trauma abdomen pada pasien stabil diperiksa dengan CT kontras (fase arteri dan portal). Pada pasien tidak stabil, gunakan FAST/E-FAST (slide).", "ev": [{"deck": "ABD", "page": 5, "quote": "LACERATION? HEMATOMAS? CONTUSIONS?"}], "refs": []}, {"id": "R006", "sec": "radio", "stem": "Laki-laki 56 tahun dengan keluhan hemiplegia kanan mendadak sejak sekitar 2 jam yang lalu. Hasil MRI seperti di bawah ini. Sekuens (sequence) apa yang paling sensitif untuk stroke akut seperti ini?", "vig": null, "opts": ["T1 FSE", "GRE", "DWI", "T2FSE", "FLAIR"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": "oc_p11_x33", "pool": "all", "key": "c", "topic": "SRI", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "DWI (diffusion-weighted imaging) adalah sekuens MRI paling sensitif untuk infark akut. Edema sitotoksik membatasi gerak molekul air dan menimbulkan hiperintensitas DWI dengan ADC rendah dalam hitungan menit setelah onset, jauh sebelum CT atau sekuens T2/FLAIR berubah. Slide dr. Sri membandingkan CT dengan MRI (FLAIR, T2, Diffusion) pada infark akut, dan lesi paling jelas tampak pada diffusion.", "w": {"a": "T1 FSE kurang sensitif pada fase akut.", "b": "GRE/SWI sensitif untuk darah atau mikrohemoragi, bukan infark akut.", "d": "T2 FSE baru positif setelah beberapa jam (edema vasogenik).", "e": "FLAIR positif setelah sekitar 4,5–6 jam. Mismatch DWI-FLAIR dipakai untuk memperkirakan onset."}, "hy": "CT awal untuk menyingkirkan perdarahan (slide hlm. 3). Tanda dini infark di CT: hyperdense MCA sign, sulci effacement, hilangnya diferensiasi substansia alba–grisea (slide hlm. 15).", "ev": [{"deck": "SRI", "page": 6, "quote": "Diffusion"}], "refs": []}, {"id": "R007", "sec": "radio", "stem": "Perhatikan foto di bawah ini, khususnya posisi diafragma kanan dan kiri serta corakan parunya. Apa interpretasi Anda?", "vig": null, "opts": ["Efusi pleura bilateral", "Pneumonia bilateral", "Pasca-mastektomi", "Bat wing appearance", "Emfisema paru bilateral"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": "oc_p11_x34", "pool": "all", "key": "e", "topic": "THORAX", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Foto toraks memperlihatkan paru hiperinflasi bilateral: diafragma kanan dan kiri rendah serta mendatar (flat), lapang paru hiperlusen dengan corakan vaskular perifer berkurang, dan jantung ramping atau memanjang (tear drop heart). Kombinasi ini adalah gambaran emfisema paru bilateral. Slide dr. Hartono menyebut emfisema menghasilkan jantung \"tear drop\".", "w": {"a": "Efusi bilateral tampak sebagai sudut kostofrenikus tumpul dan meniscus sign.", "b": "Pneumonia bilateral tampak sebagai konsolidasi.", "c": "Post-mastektomi tampak sebagai hiperlusensi unilateral karena jaringan lunak berkurang, bukan diafragma mendatar.", "d": "Bat-wing adalah opasitas perihiler pada edema paru."}, "hy": "Tanda hiperinflasi: lebih dari 6 iga anterior atau lebih dari 10 iga posterior terlihat di atas diafragma, diafragma datar, ruang retrosternal melebar (lateral), dan jantung tear drop. Pada inspirasi normal terlihat 9–10 iga posterior (slide Pengantar Radiologi).", "ev": [{"deck": "THORAX", "page": 17, "quote": "Emphysema à “tear drop”"}], "refs": []}, {"id": "R008", "sec": "radio", "stem": "Seorang laki-laki 35 tahun datang ke RS dengan keluhan tungkai kiri membengkak sejak 2 minggu yang lalu disertai nyeri. Saat ini di daerah pembengkakan terdapat lubang kecil yang mengeluarkan nanah berbau. Dari foto didiagnosis osteomielitis os femur sinistra, dengan gambaran celah/lubang pada korteks os femur. Istilah untuk temuan radiologis ini adalah", "vig": null, "opts": ["Kloaka", "Involukrum", "Fistula", "Sinus tract", "Sekuester"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "OSTEO", "st": "ppt", "deb": null, "note": "Foto pada soal asli tidak ikut terlampir di kedua rekap. Soal tetap bisa dijawab dari deskripsi di stem: celah/lubang pada korteks tulang.", "gl": null, "r": "Pada osteomielitis, celah atau lubang di korteks tulang yang menjadi jalan keluar pus dari kavum medula ke jaringan lunak disebut kloaka. Bila jalurnya berlanjut sampai menembus kulit dan mengeluarkan nanah (seperti lubang kecil bernanah berbau pada pasien ini), jalur di jaringan lunak itu disebut sinus tract. Pertanyaan menanyakan celah di korteks tulang, jadi jawabannya kloaka.", "w": {"b": "Involukrum adalah selubung tulang baru reaktif yang mengelilingi sekuester.", "c": "Fistula adalah hubungan abnormal antara dua permukaan epitel.", "d": "Sinus tract adalah saluran dari tulang ke permukaan kulit, bukan celah di korteks.", "e": "Sekuester adalah fragmen tulang nekrotik yang tampak densitas tinggi."}, "hy": "Sekuester = tulang mati (dense) → involukrum = cangkang tulang baru → kloaka = lubang korteks → sinus tract = saluran ke kulit.", "ev": [{"deck": "OSTEO", "page": 27, "quote": "Cloaca Cortical – periosteal defect through which pus drains from an infected medullary cavity"}], "refs": []}, {"id": "R009", "sec": "radio", "stem": "Pasien perempuan dengan karsinoma kolon. Hasil CT scan seperti di bawah ini. Diagnosis yang paling sesuai adalah:", "vig": null, "opts": ["Fibrosis hepar", "Karsinoma hepatoseluler (HCC)", "Metastasis hepar", "Sirosis hepar", "Sirosis hepar dengan nodul regeneratif"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": "oc_p12_x38", "pool": "all", "key": "c", "topic": "IRA", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Pada pasien dengan karsinoma kolon, CT hepar yang menunjukkan lesi fokal multipel dengan ukuran bervariasi, hipodens, dan kadang menyangat di tepi (target/bull’s-eye) paling sesuai dengan metastasis hepar. Hepar adalah lokasi metastasis hematogen tersering dari kanker kolorektal melalui vena porta. Slide dr. Ira menyebut gambaran metastasis bervariasi, umumnya multipel.", "w": {"a": "Fibrosis tidak membentuk lesi fokal multipel.", "b": "HCC umumnya terjadi pada sirosis atau hepatitis, dengan pola arterial enhancement dan washout.", "d": "Sirosis tampak sebagai hepar mengecil, kontur nodular, dan pembesaran lobus kaudatus.", "e": "Nodul regeneratif terjadi pada sirosis, bukan pada pasien kanker kolon."}, "hy": "Konteks klinis (kanker primer) dengan lesi hepar multipel berarti metastasis sampai terbukti sebaliknya.", "ev": [{"deck": "IRA", "page": 61, "quote": "Liver metastases : The finding varied , depend on the primary site Commonly multiple"}], "refs": []}, {"id": "R010", "sec": "radio", "stem": "Seorang perempuan 45 tahun datang ke RS dengan keluhan nyeri pada tungkai bawah sejak 2 bulan yang lalu. Pasien memiliki riwayat jatuh sebelumnya, dan setelah itu tungkainya mulai membengkak hingga saat ini. Dilakukan foto femur kiri proyeksi AP dan lateral (di bawah ini). Diagnosisnya adalah", "vig": null, "opts": ["Osteosarkoma", "Osteomielitis", "Fraktur lama dengan kalus", "Fraktur lama dengan osteomielitis", "Fraktur lama dengan osteosarkoma"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": "oc_p12_x39", "pool": "all", "key": "b", "topic": "OSTEO", "st": "ppt", "deb": "Gambar soal tidak menunjukkan garis fraktur yang jelas, tetapi opsi d bisa dibela karena ada riwayat jatuh.", "note": null, "gl": null, "r": "Foto femur AP/lateral memperlihatkan gambaran campuran sklerotik-litik pada diafisis dan metafisis distal, dengan penebalan korteks yang ireguler dan reaksi periosteal yang menyatu dengan korteks, tanpa garis fraktur yang jelas. Klinisnya nyeri dan bengkak tungkai selama 2 bulan. Gambaran ini paling sesuai dengan osteomielitis (kronik). Slide Osteomielitis mendaftar temuan osteomielitis kronik: periosteal new bone yang tebal, penebalan korteks bizarre, sekuester dan involukrum, sinus tract, serta kadang fraktur lama atau deformitas. Riwayat jatuh sering ditemukan, tetapi tidak membuktikan fraktur.", "w": {"a": "Osteosarkoma memberi destruksi agresif dengan massa jaringan lunak dan reaksi periosteal sunburst atau Codman.", "c": "Kalus fraktur lama mengelilingi garis fraktur yang jelas.", "d": "Kombinasi fraktur lama dan osteomielitis mungkin terjadi (slide hlm. 25), tetapi garis fraktur tidak tampak jelas.", "e": "Kombinasi fraktur lama dan osteosarkoma tidak didukung gambaran."}, "hy": "Osteomielitis akut: perubahan tulang baru tampak 5–7 hari (anak) sampai 10–14 hari (dewasa). Tanda awalnya pembengkakan jaringan lunak (slide Fraktur hlm. 38).", "ev": [{"deck": "OSTEO", "page": 25, "quote": "Bizarre cortical thickening"}, {"deck": "OSTEO", "page": 25, "quote": "Old fracture or deformity may be noted in some cases"}], "refs": []}, {"id": "R011", "sec": "radio", "stem": "Pada neonatus dengan kecurigaan perdarahan otak, pilihan modalitas imaging yang tepat adalah", "vig": null, "opts": ["Foto skull", "USG kepala bayi", "MRI", "PET scan", "CT scan"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "b", "topic": "RADI", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Pada neonatus, fontanel anterior yang masih terbuka berfungsi sebagai jendela akustik, sehingga USG kepala (kranial) dapat menilai perdarahan intraventrikular atau germinal matrix di samping inkubator. Pemeriksaan ini tanpa radiasi, tanpa sedasi, portabel, dan dapat diulang. Karena itu USG kepala adalah modalitas pilihan pertama untuk skrining perdarahan otak neonatus, terutama bayi prematur. Slide Pengantar Radiologi mencantumkan \"Head (neonatal, via fontanelle)\" sebagai aplikasi USG.", "w": {"a": "Foto skull tidak menilai parenkim atau perdarahan.", "c": "MRI sangat baik tetapi butuh transport dan sedasi; menjadi lini kedua.", "d": "PET tidak berperan pada kasus ini.", "e": "CT memberi radiasi pada bayi dan menjadi lini kedua bila USG tidak memadai."}, "hy": "USG tidak dapat menilai otak dewasa karena tertutup tulang (slide hlm. 32). Pada bayi bisa, berkat fontanel.", "ev": [{"deck": "RADI", "page": 30, "quote": "Head (neonatal, via fontanelle)"}, {"deck": "RADI", "page": 32, "quote": "No radiation: safe in pregnancy and children"}], "refs": []}, {"id": "R012", "sec": "radio", "stem": "Penderita berusia 67 tahun datang ke UGD dengan keluhan hemiplegia kanan mendadak. Pada CT scan didapatkan lesi hiperdens (bright) dengan densitas 60 HU (densitas tinggi). Apa diagnosis Anda?", "vig": null, "opts": ["Tumor solid", "Infark tromboemboli akut", "Perdarahan epidural", "Perdarahan intraserebral", "Meningitis"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "d", "topic": "SRI", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Lesi hiperdens dengan densitas sekitar 60 HU di parenkim otak pada pasien dengan hemiplegia mendadak adalah perdarahan intraserebral akut. Bekuan darah akut memiliki densitas sekitar 50–70 HU, lebih tinggi dari parenkim otak (sekitar 20–40 HU). Infark akut justru hipodens atau bahkan normal pada jam-jam awal. Perdarahan epidural bersifat ekstraaksial dan bikonveks di bawah kalvaria, sehingga tidak sesuai dengan lesi parenkim pada stroke.", "w": {"a": "Tumor solid umumnya iso sampai hipodens dengan edema dan bermanifestasi subakut.", "b": "Infark akut hipodens atau belum tampak.", "c": "EDH berbentuk bikonveks ekstraaksial dan berhubungan dengan trauma.", "e": "Meningitis tidak membentuk lesi hiperdens fokal."}, "hy": "Darah akut hiperdens; subakut isodens (perhatikan SDH isodens); kronik hipodens.", "ev": [{"deck": "SRI", "page": 3, "quote": "CT is easier than MRI to exclude hemorrhage"}], "refs": []}, {"id": "R013", "sec": "radio", "stem": "Penderita datang ke UGD dengan gejala demam, kejang, kaku kuduk, dan kesadaran menurun. Pemeriksaan/pertimbangan apa yang paling sesuai untuk kondisi ini?", "vig": null, "opts": ["Perlu CT scan kepala tanpa kontras", "Harus dipikirkan kemungkinan adanya meningoensefalitis", "Perlu CT scan kepala dengan kontras", "A dan B betul", "B dan C betul"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "e", "topic": "SRI", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Demam, kejang, kaku kuduk, dan penurunan kesadaran harus dipikirkan sebagai meningoensefalitis. Slide dr. Sri menyatakan bahwa pencitraan infeksi dengan CT atau MRI membutuhkan kontras, karena penyangatan meningen, abses (ring enhancement), atau serebritis hanya terlihat setelah kontras. Jadi pernyataan yang benar adalah B dan C. Pada praktik klinis, CT tanpa kontras sering dilakukan dulu sebelum pungsi lumbal untuk menyingkirkan peningkatan TIK atau massa, tetapi untuk menilai infeksi, kontras diperlukan.", "w": {"a": "CT tanpa kontras saja tidak cukup untuk menilai infeksi (slide).", "b": "Benar, tetapi tidak lengkap.", "c": "Benar, tetapi tidak lengkap.", "d": "Kombinasi A dan B menggabungkan pernyataan kurang tepat (A) dengan pernyataan benar (B)."}, "hy": "Stroke tidak butuh kontras untuk deteksi infark atau perdarahan (slide hlm. 3). Infeksi dan tumor butuh kontras.", "ev": [{"deck": "SRI", "page": 32, "quote": "CT & MRI FOR INFECTION IMAGING Need contrast study"}], "refs": []}, {"id": "R014", "sec": "radio", "stem": "Laki-laki 21 tahun dibawa ke UGD setelah kecelakaan lalu lintas dengan trauma kapitis dan kesadaran menurun, GCS E3V4M5 (= 12). Pemeriksaan radiologi apa yang Anda usulkan?", "vig": null, "opts": ["CT scan kepala tanpa kontras", "CT scan kepala dengan kontras", "MRI kepala dengan kontras", "Foto sinar-X skull (kepala) proyeksi AP dan lateral", "MRI kepala tanpa kontras"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "BRAIN", "st": "ppt", "deb": null, "note": "Rekap menulis \"GCS 345\", dibaca sebagai E3 V4 M5 (total 12).", "gl": null, "r": "Cedera kepala dengan penurunan kesadaran (GCS 3-4-5 = 12) membutuhkan pemeriksaan yang cepat, tersedia luas, dan sensitif untuk perdarahan akut (EDH, SDH, SAH, ICH) serta fraktur. Pemeriksaan itu adalah CT kepala tanpa kontras. Darah akut sudah hiperdens tanpa kontras, dan kontras justru dapat menutupi perdarahan. Slide Cedera Kepala menyebut CT sebagai metode paling efisien dan terbaik untuk fraktur basis kranii.", "w": {"b": "Kontras tidak diperlukan dan dapat mengaburkan darah.", "c": "MRI lambat, sulit pada pasien tidak stabil, dan kontras tidak perlu.", "d": "Foto skull tidak menilai perdarahan intrakranial.", "e": "MRI membantu pada DAI (diffuse axonal injury) di fase lanjut, tetapi bukan pemeriksaan awal."}, "hy": "MRI unggul untuk DAI; CT unggul untuk fraktur, darah akut, dan situasi darurat (slide hlm. 38).", "ev": [{"deck": "BRAIN", "page": 17, "quote": "CT scan is the most efficient method"}, {"deck": "BRAIN", "page": 38, "quote": "CT Scan plays important role in emergency"}], "refs": []}, {"id": "R015", "sec": "radio", "stem": "Indikasi foto Waters adalah untuk mengevaluasi:", "vig": null, "opts": ["Nasofaring", "Kondilus mandibula", "Os mastoid", "Sinus paranasal", "Sela tursika"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "d", "topic": "THYR", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Proyeksi Waters (occipitomental) dibuat dengan kepala menengadah sehingga piramida petrosus terproyeksi di bawah sinus maksilaris. Dengan cara ini sinus maksilaris, frontalis, dan etmoidalis terlihat jelas, dan proyeksi ini dipakai untuk mengevaluasi sinus paranasalis, misalnya sinusitis dengan air-fluid level atau penebalan mukosa. Slide menyebut Waters sebagai modalitas foto polos untuk penyakit sinus paranasal sebelum CT atau MRI.", "w": {"a": "Nasofaring dinilai dengan foto lateral jaringan lunak, CT, atau MRI.", "b": "Kondilus mandibula dinilai dengan proyeksi TMJ atau panoramik.", "c": "Mastoid dinilai dengan proyeksi Schuller atau Stenvers dan CT temporal.", "e": "Sella tursika dinilai dengan foto lateral kepala."}, "hy": "CT sinus adalah standar untuk sinusitis kronik dan perencanaan bedah. Foto Waters sebagai skrining awal.", "ev": [{"deck": "THYR", "page": 30, "quote": "Disease in paranasal sinuses Imaging modalities : 1. X ray : Waters"}], "refs": []}, {"id": "R016", "sec": "radio", "stem": "Seorang perempuan 50 tahun dengan riwayat kanker payudara saat ini mengeluh nyeri di tulang-tulang. Dokter mencurigai proses metastasis. Pemeriksaan imaging yang paling tepat untuk mendeteksi kelainan tulang multipel (seluruh tubuh) adalah", "vig": null, "opts": ["PET scan", "USG skrining", "CT scan seluruh tubuh", "Foto radiografi seluruh tubuh", "MRI seluruh tubuh"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "FRAKT", "st": "peng", "deb": "Whole-body MRI (e) secara bukti setara PET. Kunci a dipilih karena sejalan dengan arah slide (pencitraan nuklir whole-body).", "note": null, "gl": null, "r": "Untuk mencari metastasis tulang multipel di seluruh tubuh dibutuhkan pemeriksaan whole-body yang sensitif. Slide Fraktur & Tumor menyebut bone scintigraphy dengan uptake multipel untuk metastasis osteoblastik, tetapi bone scan tidak ada di pilihan. Di antara opsi, PET scan (kedokteran nuklir, whole-body) paling tepat. Meta-analisis Yang dkk. (2011) menunjukkan sensitivitas PET (89,7%) dan MRI (90,6%) per pasien setara dan lebih tinggi dari bone scan (86%) dan CT (72,9%). Spesifisitas PET sedikit lebih tinggi.", "w": {"b": "USG tidak dapat menilai tulang.", "c": "CT seluruh tubuh paling rendah sensitivitasnya untuk metastasis tulang (meta-analisis).", "d": "Survei radiografi seluruh tubuh tidak sensitif; lesi baru terlihat setelah kehilangan mineral sekitar 30–50%.", "e": "Whole-body MRI setara PET secara akurasi, tetapi lebih lama, mahal, dan terbatas ketersediaannya. Kunci kemungkinan mengarah ke kedokteran nuklir."}, "hy": "Pada kanker payudara atau prostat dengan nyeri tulang, bone scan adalah pemeriksaan klasik; PET-CT adalah alternatif modern.", "ev": [{"deck": "FRAKT", "page": 63, "quote": "Bone Scintigraphy: Osteoblastic mets with Multiple uptakes in bone scintigraphy"}], "refs": ["yang2011"]}, {"id": "R017", "sec": "radio", "stem": "Seorang perempuan 40 tahun datang untuk skrining payudara tanpa keluhan. Riwayat ibu kandungnya menderita kanker payudara. Pemeriksaan yang dilakukan adalah", "vig": null, "opts": ["PET scan", "MRI payudara", "Mamografi diagnostik", "USG payudara", "Mamografi proyeksi CC dan MLO"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "e", "topic": "LIES", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Perempuan 40 tahun asimtomatik dengan riwayat ibu kanker payudara datang untuk skrining. Pemeriksaannya adalah mamografi skrining dengan dua proyeksi standar per payudara: craniocaudal (CC) dan mediolateral oblique (MLO). Mamografi diagnostik untuk pasien bergejala atau dengan temuan abnormal yang membutuhkan proyeksi tambahan (spot, magnifikasi). Slide dr. Lies menyebut mamografi untuk skrining pasien asimtomatik, dengan baseline usia 35 tahun bila berisiko dan setiap 2 tahun pada usia 40–50.", "w": {"a": "PET tidak dipakai untuk skrining.", "b": "MRI payudara untuk risiko sangat tinggi (misalnya BRCA), bukan skrining rutin.", "c": "Mamografi diagnostik untuk pasien bergejala.", "d": "USG adalah tambahan pada payudara padat, bukan skrining tunggal."}, "hy": "Mamografi unggul untuk mikrokalsifikasi, tetapi kurang sensitif pada payudara padat (wanita muda), sehingga perlu USG (slide Pengantar Radiologi hlm. 27).", "ev": [{"deck": "LIES", "page": 20, "quote": "Screening asymptomatic patients baseline : 35 yo patient at risk 40-50 yo / 2 y"}], "refs": []}, {"id": "R018", "sec": "radio", "stem": "Seorang perempuan 45 tahun dengan perdarahan pervaginam. Pemeriksaan imaging untuk skrining awal yang paling tepat adalah", "vig": null, "opts": ["USG", "PET scan", "MRI", "BOF", "CT scan"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "LIES", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Perdarahan per vaginam pada perempuan 45 tahun (perimenopause) membutuhkan evaluasi uterus dan adneksa, seperti penebalan endometrium, mioma, polip, atau massa. Modalitas skrining awal yang paling tepat adalah USG (transvaginal atau transabdominal) karena tanpa radiasi, murah, tersedia luas, dan sangat baik menilai endometrium serta adneksa. MRI dan CT dipakai untuk staging bila ada keganasan (slide dr. Lies hlm. 43).", "w": {"b": "PET untuk staging atau restaging keganasan.", "c": "MRI untuk staging lokal (serviks, uterus), bukan skrining awal.", "d": "BOF tidak menilai organ reproduksi.", "e": "CT memberi radiasi dan kurang detail untuk endometrium."}, "hy": "Pada perdarahan pascamenopause, ketebalan endometrium >4 mm pada TVUS menjadi indikasi biopsi.", "ev": [{"deck": "LIES", "page": 43, "quote": "Ultrasonography (TVUS, TRUS, TAS)"}], "refs": []}, {"id": "R019", "sec": "radio", "stem": "Seorang pasien datang ke IGD dengan keluhan nyeri epigastrium yang sering kambuh sejak 3 bulan terakhir. Pasien sebelumnya sering minum kortikosteroid karena alergi dan suka makanan pedas. Modalitas pemeriksaan radiologi yang dapat dilakukan adalah", "vig": null, "opts": ["Foto polos abdomen", "Foto polos abdomen posisi LLD", "Barium enema", "Foto toraks", "Upper GI study"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "e", "topic": "GI", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Nyeri epigastrium kronik pada pemakai kortikosteroid yang suka makanan pedas mengarah ke gastritis atau ulkus peptikum. Pemeriksaan radiologis yang menilai mukosa dan lumen gaster-duodenum adalah studi kontras saluran cerna atas: upper GI study atau barium meal/OMD. Foto polos tidak dapat memperlihatkan mukosa gaster, dan barium enema menilai kolon. Endoskopi adalah standar klinis, tetapi soal menanyakan modalitas radiologi.", "w": {"a": "Foto polos tidak menilai mukosa.", "b": "LLD dipakai untuk mencari udara bebas atau perforasi.", "c": "Barium enema menilai kolon.", "d": "Foto toraks tidak relevan, kecuali curiga perforasi (udara subdiafragma)."}, "hy": "Studi kontras GI (slide Pengantar Radiologi hlm. 20–21): esofagografi, upper GI series, follow-through, barium enema.", "ev": [{"deck": "GI", "page": 11, "quote": "CONTRAST STUDY : BARIUM MEAL"}], "refs": []}, {"id": "R020", "sec": "radio", "stem": "Perbedaan usus besar (kolon) dengan usus halus (small bowel) pada foto polos abdomen adalah", "vig": null, "opts": ["Usus besar mempunyai haustra", "Lumen usus besar berisi cairan", "Diameter usus besar lebih kecil", "Usus halus tidak tampak pada foto polos", "Pada proyeksi LLD tampak air-fluid level dalam usus besar"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "GI", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Pada foto polos abdomen, kolon dikenali dari haustra, yaitu lipatan yang tidak melintasi seluruh lebar lumen. Kolon juga terletak di perifer (pigura), diameternya lebih besar, dan sering berisi feses. Usus halus memiliki valvulae conniventes (plika sirkularis) yang melintasi seluruh lebar lumen (gambaran tumpukan koin), letaknya sentral, dan diameternya lebih kecil. Slide GI menyebut hilangnya haustra sebagai tanda pada volvulus dan kolitis, yang menegaskan haustra sebagai ciri kolon.", "w": {"b": "Kolon lebih sering berisi feses dan udara, bukan cairan.", "c": "Diameter kolon lebih besar.", "d": "Usus halus dapat terlihat bila berisi udara.", "e": "Air-fluid level juga muncul pada usus halus, misalnya pada ileus."}, "hy": "Aturan 3-6-9: diameter usus halus >3 cm, kolon >6 cm, dan sekum >9 cm dianggap dilatasi.", "ev": [{"deck": "GI", "page": 44, "quote": "Loss of haustra"}], "refs": []}, {"id": "R021", "sec": "radio", "stem": "Pada pasien dengan diagnosis klinis Ca rektosigmoid, modalitas radiologi yang paling baik adalah", "vig": null, "opts": ["Barium enema", "Kedokteran nuklir", "CT scan abdomen dengan kontras", "Foto polos abdomen", "USG"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "c", "topic": "GI", "st": "peng", "deb": "Barium enema (a) juga sering dianggap benar karena apple core sign adalah ciri khas di slide. Kunci c dipilih karena kemampuan staging.", "note": null, "gl": null, "r": "Pertanyaannya meminta modalitas radiologi terbaik untuk pasien yang diagnosis klinisnya sudah Ca rektosigmoid. Tujuannya bukan hanya melihat tumor, tetapi juga staging: invasi lokal, kelenjar getah bening, dan metastasis jauh seperti hepar dan paru. CT abdomen dengan kontras menjawab semuanya sekaligus. Barium enema memang memberi gambaran klasik apple core dan shoulder sign (slide GI), tetapi hanya menilai lumen. Untuk staging lokal kanker rektum, MRI pelvis adalah standar, tetapi tidak ada di pilihan.", "w": {"a": "Barium enema hanya menunjukkan lumen (apple core) dan tidak dapat menilai staging.", "b": "Kedokteran nuklir tidak menjadi pemeriksaan utama.", "d": "Foto polos tidak menilai tumor.", "e": "USG terhalang gas usus."}, "hy": "Kolonoskopi dengan biopsi untuk diagnosis, CT toraks-abdomen-pelvis dengan kontras untuk staging, dan MRI pelvis untuk staging lokal rektum.", "ev": [{"deck": "GI", "page": 47, "quote": "Carcinoma LARGE BOWEL -Apple core -Shoulder sign"}, {"deck": "GI", "page": 26, "quote": "WITHOUT CONTRAST WITH CONTRAST"}], "refs": []}, {"id": "R022", "sec": "radio", "stem": "Laki-laki 66 tahun dengan nyeri abdomen kronis, BAB berdarah, dan berat badan menurun. Dilakukan barium enema (di bawah ini). Diagnosis yang tepat adalah", "vig": null, "opts": ["Divertikel kolon", "Kolitis dengan mukosa ireguler", "Apendisitis kronis", "Massa maligna intralumen kolon", "Massa maligna intralumen usus halus"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": "oc_p14_x44", "pool": "all", "key": "d", "topic": "GI", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Laki-laki 66 tahun dengan nyeri abdomen kronik, BAB darah, dan berat badan turun berarti curiga keganasan kolon. Pada barium enema tampak penyempitan lumen kolon yang anuler dan ireguler dengan tepi menggantung (shoulder sign), dikenal sebagai apple core lesion. Ini gambaran massa ganas intralumen kolon (karsinoma kolon).", "w": {"a": "Divertikel tampak sebagai kantong kontras di luar dinding (additional shadow).", "b": "Kolitis tampak sebagai mukosa ireguler difus dengan hilangnya haustra tanpa penyempitan fokal berbentuk apple core.", "c": "Apendisitis kronik tidak tampak seperti ini pada barium enema.", "e": "Lesi berada di kolon, bukan usus halus."}, "hy": "Apple core = karsinoma kolon. Coiled spring = intususepsi. Bird beak/rat tail = akalasia (esofagus) atau volvulus (kolon).", "ev": [{"deck": "GI", "page": 47, "quote": "Carcinoma LARGE BOWEL -Apple core -Shoulder sign"}], "refs": []}, {"id": "R023", "sec": "radio", "stem": "Berikut ini yang TIDAK menyokong akalasia adalah", "vig": null, "opts": ["Hilangnya peristaltik esofagus distal", "Penyempitan berbentuk rat tail pada esofagus distal", "Kegagalan lesi untuk relaksasi dengan pemberian obat tertentu", "Gambaran apple core pada lumen esofagus dengan kontras", "Biasanya terjadi pada usia 30–50 tahun"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "d", "topic": "GI", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Akalasia adalah gangguan motilitas: peristaltik korpus esofagus hilang dan LES gagal relaksasi. Gambaran esofagografinya adalah dilatasi esofagus dengan penyempitan distal yang halus dan meruncing (bird beak / rat tail), biasanya pada usia 30–50 tahun (slide). Apple core, yaitu penyempitan anuler ireguler dengan shoulder, adalah tanda keganasan dan tidak menyokong akalasia, sehingga menjadi jawaban soal \"yang tidak menyokong\".", "w": {"a": "Hilangnya peristaltik adalah ciri akalasia.", "b": "Rat tail atau bird beak adalah ciri akalasia.", "c": "Kegagalan relaksasi LES adalah inti patofisiologi akalasia (catatan: frasa \"dengan pemberian obat tertentu\" di soal kemungkinan maksudnya tidak relaksasi saat menelan).", "e": "Usia 30–50 tahun sesuai slide."}, "hy": "Penyempitan distal halus dan simetris mengarah ke akalasia. Penyempitan ireguler dengan shoulder mengarah ke karsinoma esofagus (pseudoakalasia).", "ev": [{"deck": "GI", "page": 32, "quote": "ACHALASIA -usually at age 30 to 50 years -Absence of peristalsis of body of esophagus -Failure of the LES to relax with swallowing"}], "refs": []}, {"id": "R024", "sec": "radio", "stem": "\"Double duct sign\" adalah:", "vig": null, "opts": ["Dilatasi duktus hepatikus kanan dan kiri", "Dilatasi duktus sistikus dan duktus hepatikus komunis", "Dilatasi duktus koledokus dan duktus pankreatikus", "Dilatasi duktus koledokus dan C-loop duodenum", "Dilatasi kandung empedu dan duktus sistikus"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "c", "topic": "IRA", "st": "luar", "deb": null, "note": null, "gl": null, "r": "Double duct sign adalah dilatasi simultan duktus koledokus (common bile duct) dan duktus pankreatikus utama (Wirsung). Kedua duktus bertemu di ampula Vater, sehingga obstruksi di kaput pankreas atau papila membendung keduanya. Tanda ini paling sering disebabkan karsinoma kaput pankreas atau tumor periampula (Ahualli, Radiology 2007). Topik ini tidak ada di PPT; slide dr. Ira hanya menyebut duktus pankreas normal tidak melebar.", "w": {"a": "Dilatasi duktus hepatikus kanan dan kiri adalah dilatasi bilier intrahepatik.", "b": "Duktus sistikus jarang dinilai berdilatasi.", "d": "C-loop duodenum bukan duktus.", "e": "Dilatasi kandung empedu dengan duktus sistikus bukan double duct sign."}, "hy": "Courvoisier: kandung empedu membesar dan tidak nyeri pada pasien ikterus mengarah ke obstruksi ganas distal, bukan batu.", "ev": [], "refs": ["ahualli2007"]}, {"id": "R025", "sec": "radio", "stem": "Berikut adalah hasil USG kandung empedu (gallbladder) seorang pasien dengan nyeri perut kanan atas. Selain batu, tanda panah menunjukkan adanya", "vig": null, "opts": ["Sludge", "Lesi ekogenik", "Garam empedu (bile salt)", "Posterior shadow", "Penebalan dinding kandung empedu"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": "oc_p15_x47", "pool": "all", "key": "e", "topic": "IRA", "st": "peng", "deb": "Interpretasi panah bergantung kualitas gambar recall; sebagian kating mungkin menjawab sludge (a). Posisi panah di dinding anterior lebih cocok dengan penebalan dinding.", "note": null, "gl": null, "r": "Gambar USG memperlihatkan batu hiperekoik dengan posterior acoustic shadow di kandung empedu. Panah menunjuk dinding anterior kandung empedu yang tampak tebal dan hiperekoik/berlapis, yaitu penebalan dinding (>3 mm menurut slide). Batu ditambah penebalan dinding adalah tanda kolesistitis akut. Sludge akan tampak sebagai material ekogenik tanpa shadow di bagian dependen (posterior) yang bergeser dengan posisi, bukan di dinding anterior.", "w": {"a": "Sludge berada di bagian dependen (bawah), non-shadowing, dan bergeser dengan posisi (slide).", "b": "\"Lesi echogenic\" terlalu umum. Batunya sendiri ekogenik, tetapi pertanyaan meminta temuan \"selain batu\".", "c": "Garam empedu tidak terlihat pada USG.", "d": "Posterior shadow ada di belakang batu, bukan di lokasi yang ditunjuk panah."}, "hy": "USG kolesistitis akut: batu, dinding >3 mm, cairan perikolesistik, Murphy sign sonografik, dan GB distensi (hidrops: transversal >4 cm, panjang >8 cm).", "ev": [{"deck": "IRA", "page": 43, "quote": "GB wall thickening > 3 mm"}, {"deck": "IRA", "page": 42, "quote": "Viscous echogenic bile • Non shadowing"}], "refs": []}, {"id": "R026", "sec": "radio", "stem": "Pada pemeriksaan USG, pasien diminta mempersiapkan diri dengan puasa, khususnya untuk pemeriksaan organ", "vig": null, "opts": ["Kandung empedu (gallbladder)", "Lien", "Ginjal", "Hepar", "Buli-buli"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "IRA", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Kandung empedu paling baik dievaluasi dalam keadaan terisi penuh atau distensi. Setelah makan, kandung empedu berkontraksi (efek CCK) sehingga dindingnya tampak menebal palsu dan batu kecil sulit dinilai. Karena itu pasien diminta puasa 4–6 jam sebelum USG kandung empedu (slide dr. Ira). Puasa juga mengurangi gas usus yang mengganggu.", "w": {"b": "Lien tidak memerlukan persiapan puasa khusus.", "c": "Ginjal tidak memerlukan puasa.", "d": "Hepar bisa dinilai tanpa puasa, walaupun puasa membantu mengurangi gas.", "e": "Buli justru perlu diisi penuh (minum air), bukan puasa."}, "hy": "Persiapan USG: puasa 4–6 jam untuk kandung empedu dan saluran bilier; buli penuh untuk pelvis atau prostat transabdominal (slide Uro: \"only full bladder\").", "ev": [{"deck": "IRA", "page": 36, "quote": "GB : best evaluated when distended • Thus the patient should fast before scanning ( 4-6 hours )"}], "refs": []}, {"id": "R027", "sec": "radio", "stem": "Gambaran udara bebas intraperitoneal paling mudah dilihat pada foto polos abdomen posisi", "vig": null, "opts": ["Duduk", "RLD", "LLD", "Tegak lateral", "Supine"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "c", "topic": "ABD", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Udara bebas naik ke bagian tubuh tertinggi. Pada posisi LLD (left lateral decubitus, pasien berbaring miring kiri dengan sinar horizontal), udara berkumpul di antara tepi lateral hepar dan dinding abdomen kanan. Kontras udara dengan hepar yang padat membuat udara bebas dalam jumlah sedikit pun mudah terlihat, dan tidak tertutup gelembung udara gaster di kiri. Slide Kegawatdaruratan GI menyebut imaging awal perforasi adalah foto toraks erect dan proyeksi LLD.", "w": {"a": "Posisi duduk tidak lazim untuk tujuan ini.", "b": "Pada RLD, udara terkumpul di kiri dan bercampur dengan udara lambung atau usus.", "d": "Posisi tegak lateral tidak lazim.", "e": "Pada posisi supine, udara bebas sulit terlihat (perlu Rigler sign atau football sign)."}, "hy": "Proyeksi BOF (slide GI): AP supine, LLD, dan AP erect. Pada pneumoperitoneum: crescent sign di bawah diafragma, Rigler sign, dan lusen di sekitar hepar.", "ev": [{"deck": "ABD", "page": 50, "quote": "LEFT LATERAL DECUBITUS PROJECTION"}], "refs": []}, {"id": "R028", "sec": "radio", "stem": "Pasien wanita 25 tahun datang dengan keluhan nyeri akut abdomen kanan bawah, leukosit 17.000/µL, dicurigai apendisitis akut. Modalitas imaging pilihan pertama pada pasien ini adalah", "vig": null, "opts": ["USG abdomen", "Foto BOF", "MRI", "Upper GI study dengan minum barium", "Barium enema/colon in loop"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "ABD", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Perempuan muda 25 tahun dengan nyeri akut kanan bawah dan leukositosis dicurigai apendisitis akut. Modalitas pilihan pertama adalah USG abdomen karena tanpa radiasi (penting pada perempuan usia reproduktif) dan sekaligus dapat menyingkirkan penyebab ginekologis seperti kista ovarium terpuntir atau KET. Temuannya berupa apendiks tidak kompresibel berdiameter >6 mm dan target sign (slide GI hlm. 55). CT dipakai bila USG tidak konklusif. Tabel di slide Kegawatdaruratan GI menempatkan USG sebagai investigasi pilihan untuk apendisitis dan kolesistitis akut.", "w": {"b": "BOF tidak sensitif; paling hanya menemukan apendikolit.", "c": "MRI dipakai pada kehamilan bila USG tidak konklusif.", "d": "Upper GI study tidak relevan.", "e": "Barium enema berbahaya bila terjadi perforasi dan tidak sensitif."}, "hy": "Apendiks normal terlihat pada USG pada sekitar 30% kasus; apendiks meradang pada sekitar 80–90% kasus (slide Kegawatdaruratan GI).", "ev": [{"deck": "ABD", "page": 33, "quote": "Acute appendicitis Acute cholecystitis Ultrasound"}], "refs": []}, {"id": "R029", "sec": "radio", "stem": "Gambaran yang TIDAK ditemukan pada foto polos abdomen dengan ileus letak tinggi atau obstruksi usus halus adalah", "vig": null, "opts": ["Dilatasi usus halus, air-fluid level, coiled spring", "Gas di luar usus", "Step ladder patologis", "Gas di dalam kolon minimal", "Herring bone appearance"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "b", "topic": "GI", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Gambaran obstruksi usus halus (ileus letak tinggi) pada foto polos abdomen meliputi dilatasi usus halus, air-fluid level bertingkat (step ladder), herring bone appearance (valvulae conniventes pada usus yang terdistensi), coiled spring, dan gas di kolon minimal atau tidak ada (slide GI). Gas di luar usus (ekstraluminal) bukan gambaran ileus; itu tanda perforasi (pneumoperitoneum) atau pneumatosis.", "w": {"a": "Dilatasi, air-fluid level, dan coiled spring adalah gambaran ileus.", "c": "Step ladder adalah gambaran khas ileus.", "d": "Gas kolon minimal menunjukkan obstruksi proksimal.", "e": "Herring bone adalah gambaran usus halus yang terdistensi."}, "hy": "Ileus obstruktif letak tinggi: gas kolon sedikit atau tidak ada. Ileus paralitik: dilatasi usus halus dan kolon secara difus.", "ev": [{"deck": "GI", "page": 40, "quote": "small bowel dilatation thickening of bowel wall herring bone appearance Step ladder patologis colon gas (-)"}], "refs": []}, {"id": "R030", "sec": "radio", "stem": "Gambaran udara bebas intraperitoneal paling sering disebabkan oleh", "vig": null, "opts": ["Pankreatitis", "Trauma genital", "Trauma ginjal", "Kolelitiasis", "Perforasi organ berongga"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "e", "topic": "ABD", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Udara bebas intraperitoneal (pneumoperitoneum) paling sering disebabkan perforasi organ berongga (viskus), terutama ulkus peptikum (gaster atau duodenum) yang perforasi, diikuti divertikulitis, keganasan, dan trauma tembus. Penyebab non-bedah seperti pascalaparotomi atau laparoskopi juga ada, tetapi bukan pilihan di soal. Slide menyebut perforasi peritonitis sebagai ruptur organ berongga yang mencemari rongga peritoneum.", "w": {"a": "Pankreatitis menyebabkan cairan, bukan udara bebas.", "b": "Trauma genital bukan penyebab umum.", "c": "Ginjal berada di retroperitoneal, sehingga traumanya tidak menyebabkan udara intraperitoneal.", "d": "Kolelitiasis tidak menyebabkan udara bebas."}, "hy": "Rigler sign (kedua sisi dinding usus terlihat) menandakan pneumoperitoneum dalam jumlah besar pada foto supine.", "ev": [{"deck": "ABD", "page": 49, "quote": "RUPTURE OF A HOLLOW ABDOMINAL ORGAN"}], "refs": []}, {"id": "R031", "sec": "radio", "stem": "Foto polos abdomen dalam kasus-kasus akut abdomen sangat penting karena", "vig": null, "opts": ["Berguna untuk menentukan pemeriksaan atau tindakan lanjutan", "Semua organ abdomen terlihat dengan jelas", "Tidak perlu memakai bahan kontras", "Dosis radiasinya kecil", "Biayanya relatif murah"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "ABD", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Pada akut abdomen, foto polos abdomen (BOF) adalah pemeriksaan skrining awal yang cepat. Gunanya untuk mendeteksi udara bebas, pola obstruksi, batu radioopak, dan kelainan gas, sehingga dokter bisa menentukan pemeriksaan atau tindakan lanjutan: CT, USG, atau langsung operasi. Alasan lain di opsi memang benar secara umum, tetapi tidak menjelaskan mengapa BOF penting secara klinis.", "w": {"b": "Banyak organ tidak terlihat jelas pada BOF; ada superimposisi.", "c": "Tanpa kontras memang benar, tetapi itu bukan alasan utama BOF penting.", "d": "Dosis radiasi relatif kecil memang benar, tetapi bukan alasan utama.", "e": "Biaya murah memang benar, tetapi bukan alasan utama."}, "hy": "Gold standard perforasi adalah CT abdomen dengan kontras; BOF untuk skrining awal (slide).", "ev": [{"deck": "ABD", "page": 50, "quote": "INITIAL SCREENING IMAGING : PLAIN ABDOMINAL RADIOGRAPH"}], "refs": []}, {"id": "R032", "sec": "radio", "stem": "Pemeriksaan radiologi yang dipilih untuk pasien dengan kecurigaan perforasi organ berongga adalah:", "vig": null, "opts": ["MRI abdomen", "USG abdomen", "BOF dan foto toraks tegak (erect)", "Pemeriksaan dengan kontras barium", "BOF/foto polos saja"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "c", "topic": "ABD", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Pada kecurigaan perforasi organ berongga, skrining awal yang dianjurkan slide adalah foto polos abdomen dengan foto toraks tegak (erect). Udara bebas paling mudah terlihat sebagai bulan sabit di bawah diafragma pada foto toraks erect, dan dapat dilengkapi proyeksi LLD bila pasien tidak bisa berdiri. Bila hasil tidak konklusif, gold standard-nya CT abdomen dengan kontras.", "w": {"a": "MRI tidak dipakai untuk kegawatan ini.", "b": "USG bukan pemeriksaan awal untuk udara bebas.", "d": "Barium dikontraindikasikan pada curiga perforasi karena menimbulkan peritonitis barium (slide Pengantar Radiologi hlm. 50).", "e": "BOF saja (supine) kurang sensitif dibanding kombinasi dengan foto toraks erect."}, "hy": "Kontras pada curiga perforasi: gunakan kontras larut air (water-soluble iodinated), jangan barium.", "ev": [{"deck": "ABD", "page": 50, "quote": "ERECT CHEST X RAY AND LEFT LATERAL DECUBITUS PROJECTION"}], "refs": []}, {"id": "R033", "sec": "radio", "stem": "Pasien mendadak sesak. Pada foto toraks AP berbaring, jantung dan trakea terdorong ke kiri oleh hemitoraks kanan yang radiolusen dan kehilangan corakan paru normal. Tampak gambaran seperti massa di hilus kanan. Paru kiri normal. Apa diagnosis Anda?", "vig": null, "opts": ["Atelektasis kanan", "Emfisema satu paru", "Pneumonia kiri yang menarik paru ke kiri", "Giant bleb di sisi kanan", "Pneumotoraks kanan"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "e", "topic": "ANITA", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Hemitoraks kanan radiolusen tanpa corakan paru dengan bayangan seperti massa di hilus kanan (paru yang kolaps) menunjukkan pneumotoraks kanan. Jantung dan trakea terdorong ke kiri (pergeseran mediastinum kontralateral), sehingga ini adalah tension pneumothorax. Slide dr. Anita (Kegawatdaruratan Foto Toraks) memperlihatkan contoh pneumotoraks dengan garis pleura viseral dan paru kolaps.", "w": {"a": "Atelektasis menarik mediastinum ke sisi yang sama (ipsilateral) dan tampak opak, bukan lusen.", "b": "Emfisema satu paru tidak menghilangkan corakan paru sepenuhnya, dan \"massa\" di hilus tidak dijelaskan.", "c": "Pneumonia kiri tidak menarik mediastinum, dan paru kiri normal.", "d": "Giant bleb masih menyisakan corakan atau dinding tipis, dan paru tidak kolaps ke hilus."}, "hy": "Mediastinum menjauhi lesi: tension pneumotoraks atau efusi masif. Mediastinum mendekati lesi: atelektasis atau pneumonektomi.", "ev": [{"deck": "ANITA", "page": 32, "quote": null}], "refs": []}, {"id": "R034", "sec": "radio", "stem": "Anak usia 2 tahun datang dengan keluhan demam, batuk, dan sesak. Pada radiografi toraks didapatkan opasitas homogen seperti di bawah ini. Temuan radiologi ini mengarah pada", "vig": null, "opts": ["Atelektasis", "TB paru", "Pneumonia lobaris", "Efusi pleura", "Edema paru"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": "oc_p17_x52", "pool": "all", "key": "c", "topic": "LUNG", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Anak 2 tahun dengan demam, batuk, dan sesak memiliki opasitas homogen yang terbatas pada satu lobus, berbatas tegas pada fisura, tanpa kehilangan volume. Gambaran ini adalah konsolidasi lobar, yaitu pneumonia lobaris. Pada konsolidasi, alveoli terisi eksudat sementara arsitektur tetap utuh, sehingga opasitas mengikuti segmen atau lobus, sering dengan air bronchogram, dan tidak ada penurunan volume (slide Lung).", "w": {"a": "Atelektasis disertai tanda kehilangan volume (fisura tertarik, mediastinum ipsilateral).", "b": "TB paru pada anak lebih sering tampak sebagai limfadenopati hilus atau milier.", "d": "Efusi pleura tampak sebagai meniscus dengan sudut kostofrenikus tumpul.", "e": "Edema paru tampak perihiler bilateral."}, "hy": "Silhouette sign: hilangnya batas jantung atau diafragma menunjukkan lokasi konsolidasi (misalnya lobus tengah kanan menghapus batas jantung kanan).", "ev": [{"deck": "LUNG", "page": 11, "quote": "A segment or lobe opacity ✓ Airbronchogram ✓ No significant loss of lung volume"}], "refs": []}, {"id": "R035", "sec": "radio", "stem": "Perbedaan paling mendasar antara konsolidasi dan kolaps paru adalah:", "vig": null, "opts": ["Ukuran dan bentuk opasitas pada foto", "Usia pasien", "Konsolidasi mendorong organ di sekitarnya", "Adanya tanda loss of volume", "Lokasi kelainan radiologisnya"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "d", "topic": "LUNG", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Perbedaan paling mendasar antara konsolidasi d
