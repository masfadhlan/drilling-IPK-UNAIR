dicator of the presence or absence of cardiac arrest is unreliable"}], "refs": ["panchal2020"]}, {"id": "A242", "sec": "anes", "stem": "Resusitasi jantung paru otak (RJPO) dewasa yang dilakukan oleh DUA penolong adalah:", "vig": null, "opts": ["30 kali pijat jantung, 2 kali napas buatan", "5 kali pijat jantung, 1 kali napas buatan", "15 kali pijat jantung, 2 kali napas buatan", "1 kali pijat jantung, 5 kali napas buatan", "2 kali pijat jantung, 15 kali napas buatan"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "CPR", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Rasio kompresi:ventilasi untuk dewasa adalah 30:2, baik satu maupun dua penolong, selama jalan napas lanjut belum terpasang (slide CPR). Rasio 15:2 dipakai untuk anak dan bayi bila ada dua penolong tenaga kesehatan. Rasio 5:1 adalah pedoman lama yang sudah tidak dipakai. Setelah intubasi atau LMA, kompresi kontinu 100–120x/menit dan napas 10x/menit tanpa sinkronisasi.", "w": {"b": "5:1 adalah rasio lama yang sudah ditinggalkan.", "c": "15:2 untuk anak atau bayi dengan dua penolong, bukan dewasa.", "d": "Rasio ini tidak pernah dipakai.", "e": "Rasio ini tidak pernah dipakai."}, "hy": "Dewasa 30:2 (1 atau 2 penolong). Anak/bayi dengan 2 penolong 15:2. Airway lanjut: kompresi kontinu + 10 napas/menit.", "ev": [{"deck": "CPR", "page": 13, "quote": "Pijat jantung 30 x disela dg tiupan nafas 2 x BLS"}], "refs": ["panchal2020"]}, {"id": "A243", "sec": "anes", "stem": "Obat-obatan yang dipakai untuk RJPO, kecuali:", "vig": null, "opts": ["Natrium bikarbonat", "Magnesium sulfat", "Atropin", "Propofol", "Adrenalin"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "d", "topic": "CPR", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Obat dalam resusitasi: adrenalin (semua ritme), amiodaron atau lidokain (VF/VT refrakter), magnesium sulfat (torsades de pointes), natrium bikarbonat (kasus tertentu seperti hiperkalemia atau overdosis trisiklik), kalsium (hiperkalemia, hipokalsemia), dan atropin (bradikardia simptomatik; dulu juga untuk asystole). Propofol adalah agen induksi anestesi yang menekan miokard dan menyebabkan hipotensi, jadi tidak dipakai untuk resusitasi; dosis kecil kadang dipakai untuk sedasi setelah ROSC.", "w": {"a": "Bikarbonat dipakai pada indikasi khusus (hiperkalemia, overdosis trisiklik).", "b": "Magnesium sulfat untuk torsades de pointes.", "c": "Atropin untuk bradikardia; dahulu juga dipakai pada asystole/PEA.", "e": "Adrenalin adalah obat utama RJP."}, "hy": "Obat RJP: adrenalin, amiodaron/lidokain, Mg (torsades), kalsium, bikarbonat (kasus khusus).", "ev": [{"deck": "CPR", "page": 34, "quote": "Adrenaline: 1 mg, iv, repeated every 3-5 minutes"}, {"deck": "CPR", "page": 5, "quote": "Advanced Life Support =ALS = Drug (+fluid) + E K G + Defibrilasi"}], "refs": ["panchal2020"]}, {"id": "A244", "sec": "anes", "stem": "Penyebab cardiac arrest yang \"membandel\", KECUALI:", "vig": null, "opts": ["Asidosis", "Hipokalemia", "Hipovolemia", "Hipoksia", "Hipotermia"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "CPR", "st": "ppt", "deb": "Secara pedoman, semua opsi termasuk penyebab reversibel. Kunci mengikuti daftar di slide CPR yang hanya menyebut hiperkalemia.", "note": null, "gl": "Pedoman AHA menulis \"hypo-/hyperkalemia\", jadi hipokalemia juga termasuk penyebab reversibel. Slide Syok di PPT ini juga memasukkan hypokalemia dalam daftar 7H dan 5T.", "r": "Slide CPR 40 mendaftar penyebab henti jantung yang membandel: 4H (hipoksia, hipovolemia, hiperkalemia, hipotermia), 4T (tamponade jantung, tension pneumothorax, tromboemboli paru, toxic overdose), MA (massive MI), dan asidosis. Hipokalemia tidak tercantum di slide tersebut, sehingga menurut PPT jawabannya hipokalemia.", "w": {"a": "Asidosis tercantum di slide.", "c": "Hipovolemia termasuk 4H.", "d": "Hipoksia termasuk 4H.", "e": "Hipotermia termasuk 4H."}, "hy": "4H (+ hipo/hiperkalemia di AHA) dan 4T. Slide CPR: hiperkalemia, massive MI, dan asidosis.", "ev": [{"deck": "CPR", "page": 40, "quote": "cardiac arrest membandel ??? 4H 4T MA Hipoksia Hipovolemia Hiperkalemia Hipotermia"}], "refs": ["panchal2020"]}, {"id": "A245", "sec": "anes", "stem": "Cardiac arrest yang tetap membandel pada RJPO didapatkan pada penderita:", "vig": null, "opts": ["Infark miokard masif", "Tromboemboli paru", "Semua benar", "Tension pneumotoraks", "Tamponade jantung"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "CPR", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Semua kondisi di opsi tercantum di slide CPR 40 sebagai penyebab henti jantung yang membandel: infark miokard masif (MA), tromboemboli paru, tension pneumothorax, dan tamponade jantung (4T). Henti jantung karena penyebab ini tidak akan pulih dengan CPR dan obat saja sampai penyebabnya dikoreksi (dekompresi jarum, perikardiosentesis, trombolisis, revaskularisasi).", "w": {"a": "Benar, tetapi opsi lain juga benar.", "b": "Benar, tetapi opsi lain juga benar.", "d": "Benar, tetapi opsi lain juga benar.", "e": "Benar, tetapi opsi lain juga benar."}, "hy": "Henti jantung membandel: cari dan koreksi 4H 4T.", "ev": [{"deck": "CPR", "page": 40, "quote": "Tamponade jantung Tension pneumothorax Thromboemboli paru Toxic overdose"}], "refs": []}, {"id": "A246", "sec": "anes", "stem": "Tugas utama code blue team adalah:", "vig": null, "opts": ["Mengidentifikasi pasien yang mengalami perburukan awal di ruangan", "Melakukan pertolongan pada pasien henti jantung", "Melakukan diagnostik tambahan pada pasien gawat darurat", "Melakukan maintenance troli emergensi", "Melakukan perawatan rutin pada pasien gawat di UGD"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "CPR", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Code blue adalah sistem respons darurat rumah sakit untuk pasien henti jantung atau henti napas: tim resusitasi datang membawa defibrilator dan obat untuk melakukan ALS. Mengidentifikasi pasien yang memburuk lebih awal adalah tugas sistem peringatan dini (EWS) dan rapid response team, yang tujuannya justru mencegah terjadinya code blue.", "w": {"a": "Ini fungsi early warning score dan rapid response team (atau ICU outreach).", "c": "Diagnostik tambahan bukan tugas utama code blue.", "d": "Perawatan troli adalah tugas rutin unit, bukan tugas utama tim saat dipanggil.", "e": "Perawatan rutin di UGD dilakukan staf UGD."}, "hy": "Code blue = henti jantung/napas. RRT/EWS = deteksi perburukan dini sebelum henti jantung.", "ev": [{"deck": "CPR", "page": 11, "quote": "Berteriak Code Blue minta bantuan"}, {"deck": "INTRO", "page": 18, "quote": "IMMEDIATE ACTIVATION OF CODE BLUE"}], "refs": []}, {"id": "A247", "sec": "anes", "stem": "Analgesik endogen yang mampu menekan nyeri di kornu dorsalis medula spinalis adalah:", "vig": null, "opts": ["Histamin", "Endorfin", "Prostaglandin", "Substansi P", "Asetilkolin"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "PATFIS", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Pada tahap modulasi, sistem analgesik endogen (jalur desendens dari otak) menekan transmisi nyeri di kornu dorsalis. Mediatornya endorfin (opioid endogen), serotonin, dan noradrenalin (slide Patofisiologi Nyeri). Opioid eksogen seperti morfin bekerja pada reseptor yang sama dengan endorfin.", "w": {"a": "Histamin adalah mediator inflamasi yang mensensitisasi nosiseptor.", "c": "Prostaglandin mensensitisasi nosiseptor perifer dan sentral.", "d": "Substansi P adalah neurotransmiter eksitatorik nyeri di kornu dorsalis.", "e": "Asetilkolin adalah mediator nyeri perifer (tercantum di slide transduksi), bukan analgesik endogen."}, "hy": "Modulasi desendens: endorfin, serotonin, noradrenalin. Inilah dasar kerja opioid, tramadol, dan antidepresan pada nyeri.", "ev": [{"deck": "PATFIS", "page": 33, "quote": "These endogenous analgesics include endorphins, serotonin, and noradrenaline which have the ability to suppress pain intake in the dorsal horn of the spinal cord"}], "refs": []}, {"id": "A248", "sec": "anes", "stem": "Nyeri yang menetap setelah nyeri akut atau tidak hilang dalam 1–6 bulan (umumnya lebih dari 3 bulan) disebut:", "vig": null, "opts": ["Nyeri kronik", "Nyeri nosiseptif", "Nyeri neuropatik", "Nyeri kanker", "Nyeri pascaoperasi"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "PATFIS", "st": "ppt", "deb": null, "note": "Stem asli: \"does not relief within 1–6 months\". Slide memakai batas lebih dari 3 bulan.", "gl": null, "r": "Nyeri kronik adalah nyeri yang menetap melewati waktu penyembuhan normal, umumnya lebih dari 3 bulan. Penyebabnya sering tidak teridentifikasi atau berhubungan dengan penyakit kronik atau tumor (slide Patofisiologi Nyeri). Batas waktu lama di beberapa buku adalah 1–6 bulan.", "w": {"b": "Nosiseptif adalah klasifikasi berdasarkan mekanisme, bukan waktu.", "c": "Neuropatik adalah klasifikasi berdasarkan mekanisme.", "d": "Nyeri kanker adalah klasifikasi berdasarkan etiologi.", "e": "Nyeri pascaoperasi adalah nyeri akut berdasarkan etiologi."}, "hy": "Klasifikasi nyeri: waktu (akut atau kronik), mekanisme (nosiseptif, neuropatik, nosiplastik), etiologi (pascaoperasi, kanker, luka bakar).", "ev": [{"deck": "PATFIS", "page": 13, "quote": "Pain lasting for more than 3 months"}, {"deck": "PATFIS", "page": 13, "quote": "Pain persisting beyond healing of injury"}], "refs": []}, {"id": "A249", "sec": "anes", "stem": "Modulasi untuk menghambat nyeri TIDAK dapat dipicu oleh:", "vig": null, "opts": ["Pengobatan NSAID", "Pendampingan anggota keluarga", "Lingkungan IGD yang bersahabat", "Menunjukkan empati kepada pasien", "Dukungan psikologis"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "PATFIS", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Modulasi adalah pengendalian internal oleh sistem saraf (jalur desendens) yang dipengaruhi faktor psikologis dan sosial: perhatian orang lain, budaya, pendidikan, dan makna rangsangan (slide Patofisiologi Nyeri). Karena itu pendampingan keluarga, lingkungan yang bersahabat, empati, dan dukungan psikologis dapat mengaktifkan inhibisi nyeri. NSAID bekerja terutama di tahap transduksi (menghambat sintesis prostaglandin di perifer), bukan memicu modulasi (slide Manajemen Nyeri).", "w": {"b": "Pendampingan keluarga memengaruhi modulasi (perhatian orang lain).", "c": "Lingkungan yang menenangkan mengurangi kecemasan dan memperkuat inhibisi.", "d": "Empati memengaruhi persepsi dan modulasi nyeri.", "e": "Dukungan psikologis adalah intervensi modulasi."}, "hy": "NSAID: transduksi. Anestetik lokal: transmisi. Opioid: modulasi dan persepsi. Faktor psikososial: modulasi.", "ev": [{"deck": "PATFIS", "page": 34, "quote": "It is strongly influenced by the culture, education level, attention from others, as well as the meaning of the stimulus"}, {"deck": "PAINM", "page": 14, "quote": "NSAIDs COXIBs Local Anesthetic Transduction"}], "refs": []}, {"id": "A250", "sec": "anes", "stem": "Yang bukan bagian dari proses nosisepsi adalah:", "vig": null, "opts": ["Transkripsi", "Modulasi", "Persepsi", "Transduksi", "Transmisi"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "PATFIS", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Nosisepsi terdiri dari empat proses elektrofisiologis: transduksi (rangsang noksius diubah menjadi impuls listrik di ujung saraf), transmisi (impuls dihantarkan ke medula spinalis dan otak), modulasi (pengendalian di kornu dorsalis oleh sistem analgesik endogen), dan persepsi (pengalaman nyeri di korteks). Transkripsi adalah proses sintesis RNA dari DNA, tidak berhubungan.", "w": {"b": "Modulasi termasuk 4 proses nosisepsi.", "c": "Persepsi termasuk 4 proses nosisepsi.", "d": "Transduksi termasuk 4 proses nosisepsi.", "e": "Transmisi termasuk 4 proses nosisepsi."}, "hy": "Nosisepsi: transduksi, transmisi, modulasi, persepsi.", "ev": [{"deck": "PATFIS", "page": 27, "quote": "There are 4 electrophysiological process from tissue injury ➢ Transduction ➢ Transmition ➢ Modulation ➢ Perception"}], "refs": []}, {"id": "A251", "sec": "anes", "stem": "Pengukuran skala nyeri yang bersifat subjektif (self-report) adalah:", "vig": null, "opts": ["VAS (Visual Analog Scale)", "Comfort Scale", "FAS (Functional Activity Score)", "Semua benar", "Semua salah"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "PATFIS", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "VAS dan NRS adalah skala self-report: pasien sendiri menilai intensitas nyerinya (VAS pada garis 10 cm, NRS 0–10), sehingga bersifat subjektif. Comfort Scale dan skala perilaku lain (FLACC, NIPS, BPS, CPOT) adalah skala observasional oleh pemeriksa untuk pasien yang tidak bisa melapor, seperti bayi, anak kecil, atau pasien terintubasi. FAS menilai kemampuan fungsional (misalnya batuk, mobilisasi) akibat nyeri, juga oleh pemeriksa. Slide Patofisiologi Nyeri memakai NRS untuk usia ≥7 tahun yang mampu memahami skala.", "w": {"b": "Comfort Scale adalah skala observasi perilaku oleh pemeriksa.", "c": "FAS menilai fungsi, dinilai pemeriksa.", "d": "Hanya VAS yang self-report.", "e": "Opsi a benar."}, "hy": "Self-report: VAS, NRS, Wong-Baker. Observasi: FLACC, NIPS, Comfort, CPOT, BPS.", "ev": [{"deck": "PATFIS", "page": 52, "quote": "NRS For ≥ 7 years old Must be able to understand the"}], "refs": []}, {"id": "A252", "sec": "anes", "stem": "Proses nosisepsi berlangsung melalui 4 tahap elektrofisiologik. Salah satu tahap adalah proses pengendalian internal oleh sistem saraf, di mana terjadi interaksi antara sistem analgesik endogen (endorfin, serotonin, noradrenalin) dengan rangsang nyeri yang masuk ke kornu posterior. Proses tersebut merupakan tahap:", "vig": null, "opts": ["Modulasi", "Transmisi", "Transduksi", "Persepsi", "Repolarisasi"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "PATFIS", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Stem soal ini adalah definisi modulasi di slide: proses pengendalian internal oleh sistem saraf yang dapat menambah atau mengurangi penerusan impuls nyeri, melalui interaksi sistem analgesik endogen (endorfin, serotonin, noradrenalin) dengan input nyeri di kornu posterior.", "w": {"b": "Transmisi adalah penghantaran impuls sepanjang saraf ke medula spinalis dan otak.", "c": "Transduksi adalah konversi rangsang noksius menjadi impuls listrik di nosiseptor.", "d": "Persepsi adalah pengalaman nyeri secara sadar di korteks.", "e": "Repolarisasi bukan tahap nosisepsi."}, "hy": "Modulasi terjadi di kornu dorsalis (gate control, sistem desendens).", "ev": [{"deck": "PATFIS", "page": 32, "quote": "It is an internal control process by the nervous system, can increase or decrease the forwarding of pain impulses"}, {"deck": "PATFIS", "page": 33, "quote": "Interaction process between the endogenous analgesic system and the intake of pain that enters the posterior cord"}], "refs": []}, {"id": "A253", "sec": "anes", "stem": "Seorang wanita 40 tahun datang dengan keluhan nyeri seluruh tubuh. Pada pemeriksaan didapatkan kanker payudara stadium lanjut. Pemeriksaan fisik lain dalam batas normal. Skor nyeri VAS/NRS rata-rata sehari 5–6. Berapa derajat nyeri pasien tersebut?", "vig": null, "opts": ["Nyeri sedang", "Nyeri sedang–berat", "Nyeri ringan", "Nyeri ringan–sedang", "Nyeri berat"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "PATFIS", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Pada skala 0–10, umumnya skor 1–3 adalah nyeri ringan, 4–6 nyeri sedang, dan 7–10 nyeri berat. Skor 5–6 termasuk nyeri sedang. Untuk nyeri kanker, ini setara tangga kedua WHO (opioid lemah ± nonopioid ± adjuvan) atau opioid kuat dosis rendah sesuai pedoman terbaru. Slide Patofisiologi Nyeri memakai skala numerik 0–10 dengan label \"moderate\" di bagian tengah.", "w": {"b": "Sedang–berat bukan kategori baku; skor 7–10 adalah berat.", "c": "Ringan untuk skor 1–3.", "d": "Ringan–sedang bukan kategori baku.", "e": "Berat untuk skor 7–10."}, "hy": "NRS: 1–3 ringan, 4–6 sedang, 7–10 berat.", "ev": [{"deck": "PATFIS", "page": 48, "quote": "PAIN SCORE 0-10 NUMERICAL RATING"}], "refs": []}, {"id": "A254", "sec": "anes", "stem": "Seorang laki-laki 54 tahun baru saja menjalani laparotomi untuk obstruksi usus. Saat visite, pasien mengeluh kesakitan sambil memegang area perutnya. Jenis nyeri yang dirasakan pasien adalah:", "vig": null, "opts": ["Acute on chronic pain", "Nyeri kronik", "Nyeri neuropatik", "Nyeri kanker", "Nyeri akut"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "e", "topic": "PATFIS", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Nyeri pascaoperasi adalah contoh klasik nyeri akut: onset baru, durasi terbatas, penyebab dan lokasinya jelas (kerusakan jaringan akibat insisi), dan akan hilang saat luka sembuh (slide Patofisiologi Nyeri).", "w": {"a": "Acute on chronic memerlukan riwayat nyeri kronik sebelumnya, yang tidak disebut di sini.", "b": "Nyeri kronik berlangsung lebih dari 3 bulan.", "c": "Nyeri neuropatik disebabkan lesi saraf, dengan sifat terbakar atau seperti tersetrum.", "d": "Tidak ada data keganasan."}, "hy": "Nyeri pascaoperasi = akut, nosiseptif (somatik dan viseral).", "ev": [{"deck": "PATFIS", "page": 12, "quote": "Example: post operative pain, trauma, burn"}], "refs": []}, {"id": "A255", "sec": "anes", "stem": "Seorang laki-laki 49 tahun dengan diabetes melitus menjalani amputasi kaki kanan karena gangren. Saat kontrol 3 bulan setelah operasi, pasien mengeluh nyeri di kaki kanan. Luka bekas operasi baik, tanpa tanda infeksi maupun inflamasi. Jenis nyeri yang dirasakan pasien adalah:", "vig": null, "opts": ["Nosiseptif", "Nyeri pascaoperasi", "Akut", "Neuropatik", "Kanker"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "d", "topic": "PATFIS", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Nyeri yang dirasakan di bagian tubuh yang sudah diamputasi adalah phantom limb pain, salah satu contoh nyeri neuropatik di slide (bersama neuralgia pascaherpes dan CRPS). Nyeri ini disebabkan lesi saraf dan reorganisasi sentral, bukan rangsangan pada nosiseptor; lukanya sendiri sudah sembuh tanpa inflamasi. Diabetes juga dapat menyertai neuropati perifer.", "w": {"a": "Tidak ada kerusakan jaringan aktif (luka baik, tanpa inflamasi).", "b": "Tiga bulan setelah operasi dengan luka sudah sembuh, nyeri ini bukan lagi nyeri pascaoperasi akut.", "c": "Nyeri yang menetap hingga 3 bulan tidak lagi akut.", "e": "Tidak ada keganasan."}, "hy": "Phantom pain = neuropatik; terapinya gabapentinoid, amitriptilin.", "ev": [{"deck": "PATFIS", "page": 22, "quote": "Caused by a lesion or disease of the sensory nervous system (peripheral or central)"}, {"deck": "PATFIS", "page": 22, "quote": "phantom pain"}], "refs": []}, {"id": "A256", "sec": "anes", "stem": "Terapi multimodal dalam penanganan nyeri adalah:", "vig": null, "opts": ["Memakai beberapa golongan NSAID bersama-sama", "Memberikan obat antinyeri dengan cara drip kontinu", "Menggabungkan obat antinyeri dengan obat anti-infeksi", "Memakai pendekatan farmakologis dan nonfarmakologis", "Memakai golongan NSAID yang bekerja perifer dan sentral"], "src": ["Tabulasi IPK"], "n": 2, "inc": false, "img": null, "pool": "drill", "key": "d", "topic": "PAINM", "st": "ppt", "deb": "Definisi baku analgesia multimodal adalah kombinasi analgesik dengan mekanisme berbeda (lihat A027 dan A129). Opsi d dipilih karena hanya opsi ini yang menggambarkan kombinasi modalitas.", "note": "Soal muncul dua kali di Tabulasi (versi bahasa Inggris no. 2 dan bahasa Indonesia no. 6 bagian Manajemen Nyeri).", "gl": null, "r": "Pendekatan multimodal menggabungkan berbagai modalitas dengan mekanisme berbeda: kombinasi analgesik (nonopioid, opioid, adjuvan, anestesi regional) dan modalitas nonfarmakologis (fisik, psikologis, rehabilitasi). Slide Manajemen Nyeri menampilkan pendekatan multimodal untuk nyeri kronik yang mencakup farmakoterapi, terapi intervensi, terapi fisik dan rehabilitasi, serta terapi psikologi, dan menyimpulkan bahwa terapi farmakologis dan nonfarmakologis sama-sama penting. Di antara opsi, hanya d yang menggambarkan kombinasi modalitas.", "w": {"a": "Menggabungkan dua NSAID tidak menambah efek tetapi menambah efek samping, dan dikontraindikasikan.", "b": "Drip kontinu adalah cara pemberian, bukan multimodal.", "c": "Antibiotik bukan analgesik.", "e": "Satu golongan obat saja bukan multimodal."}, "hy": "Multimodal: kombinasi analgesik dengan titik kerja berbeda + intervensi nonfarmakologis.", "ev": [{"deck": "PAINM", "page": 34, "quote": "Multimodal approach for chronic pain"}, {"deck": "PAINM", "page": 48, "quote": "Non-pharmacologic and pharmacologic have both important role in pain management"}], "refs": []}, {"id": "A257", "sec": "anes", "stem": "Berdasarkan tangga analgesik 3 langkah WHO, pilihan terapi untuk nyeri berat adalah:", "vig": null, "opts": ["Opioid kuat", "Opioid kuat dikombinasikan dengan parasetamol (nonopioid)", "Opioid lemah dapat dikombinasikan dengan NSAID dan analgesik adjuvan", "Analgesik nonopioid drip/kontinu", "Analgesik nonopioid"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "PAINM", "st": "ppt", "deb": "Opsi a juga tidak salah; kunci memilih b karena langkah 3 WHO adalah opioid kuat ditambah nonopioid ± adjuvan.", "note": null, "gl": null, "r": "Tangga WHO: langkah 1 (nyeri ringan) nonopioid ± adjuvan; langkah 2 (nyeri sedang) opioid lemah (kodein, tramadol) ± nonopioid ± adjuvan; langkah 3 (nyeri sedang sampai berat) opioid kuat (morfin, fentanil, oksikodon) + nonopioid ± adjuvan. Slide Manajemen Nyeri memuat tangga WHO ini (langkah 3: potent opioids, dengan nonopioid dan adjuvan). Opsi b paling lengkap karena opioid kuat tetap dikombinasikan dengan nonopioid seperti parasetamol.", "w": {"a": "Opioid kuat adalah inti langkah 3, tetapi WHO menganjurkan kombinasi dengan nonopioid ± adjuvan.", "c": "Ini langkah 2 (nyeri sedang).", "d": "Nonopioid saja tidak cukup untuk nyeri berat.", "e": "Nonopioid adalah langkah 1."}, "hy": "WHO: 1 nonopioid, 2 opioid lemah, 3 opioid kuat; nonopioid dan adjuvan bisa di setiap langkah. Nyeri akut pascaoperasi memakai tangga terbalik (mulai dari potent).", "ev": [{"deck": "PAINM", "page": 26, "quote": "Cancer Pain Management (WHO Analgesic Ladder)"}, {"deck": "PAINM", "page": 18, "quote": "Step 3 (potent opioids)"}], "refs": []}, {"id": "A258", "sec": "anes", "stem": "Titik tangkap kerja obat antinyeri golongan NSAID adalah:", "vig": null, "opts": ["Meningkatkan toleransi nyeri", "Menghambat fase transduksi", "Menghambat proses modulasi", "Menghambat persepsi", "Menghambat transmisi impuls"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "PAINM", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "NSAID menghambat COX sehingga sintesis prostaglandin di jaringan yang cedera berkurang, dan nosiseptor tidak tersensitisasi. Jadi NSAID bekerja pada tahap transduksi (slide \"Target Point of Analgesic Drugs\": NSAID, COXIB, kortikosteroid, dan anestetik lokal pada transduksi). Anestetik lokal juga menghambat transmisi; opioid, ketamin, dan klonidin bekerja di modulasi; parasetamol dan opioid di persepsi.", "w": {"a": "Meningkatkan toleransi nyeri bukan mekanisme NSAID.", "c": "Modulasi adalah titik kerja opioid, ketamin, klonidin, dan gabapentinoid.", "d": "Persepsi adalah titik kerja parasetamol dan opioid.", "e": "Transmisi adalah titik kerja anestetik lokal."}, "hy": "Transduksi: NSAID, COXIB, steroid, anestetik lokal. Transmisi: anestetik lokal. Modulasi: opioid, ketamin. Persepsi: parasetamol, opioid.", "ev": [{"deck": "PAINM", "page": 14, "quote": "Target Point of Analgesic Drugs"}], "refs": []}, {"id": "A259", "sec": "anes", "stem": "Berat-ringannya nyeri pascabedah dipengaruhi oleh faktor-faktor berikut:", "vig": null, "opts": ["Kerusakan jaringan", "Psikologi pasien prabedah", "Daerah pembedahan", "Rasa nyeri prabedah", "Semua pernyataan di atas benar"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "e", "topic": "PATFIS", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Intensitas nyeri pascabedah ditentukan oleh luas kerusakan jaringan, lokasi operasi (torakotomi dan abdomen atas paling nyeri), kondisi psikologis (kecemasan, katastrofisasi), dan nyeri yang sudah ada sebelum operasi (sensitisasi sentral, penggunaan opioid kronik). Slide menekankan persepsi nyeri bersifat sangat personal dan subjektif.", "w": {"a": "Benar, tetapi tidak sendirian.", "b": "Benar, tetapi tidak sendirian.", "c": "Benar, tetapi tidak sendirian.", "d": "Benar, tetapi tidak sendirian."}, "hy": "Prediktor nyeri pascaoperasi berat: jenis operasi, nyeri praoperasi, kecemasan, usia muda, penggunaan opioid kronik.", "ev": [{"deck": "PATFIS", "page": 34, "quote": "This process that causes the perception of pain to become very personal and subjective in everyone"}], "refs": []}, {"id": "A260", "sec": "anes", "stem": "Manakah yang bukan termasuk parameter NEWS (National Early Warning Score)?", "vig": null, "opts": ["Central venous pressure", "Kesadaran", "Tekanan sistolik", "Suhu tubuh", "Saturasi oksigen"], "src": ["Tabulasi IPK"], "n": 2, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "ICU2", "st": "luar", "deb": null, "note": "Versi bahasa Inggris di Tabulasi (no. 2 bagian ICU) memakai opsi \"diastolic blood pressure\" sebagai jawaban; tekanan diastolik juga tidak termasuk NEWS.", "gl": null, "r": "NEWS (Royal College of Physicians) memakai parameter klinis yang mudah diperiksa di bangsal: laju napas, saturasi oksigen, penggunaan oksigen tambahan, suhu, tekanan darah sistolik, denyut nadi, dan tingkat kesadaran (AVPU, di NEWS2 ditambah new confusion). CVP adalah pengukuran invasif yang tidak termasuk NEWS. Tekanan diastolik juga tidak termasuk. Topik NEWS tidak dibahas di PPT.", "w": {"b": "Kesadaran (AVPU) termasuk NEWS.", "c": "Tekanan sistolik termasuk NEWS.", "d": "Suhu termasuk NEWS.", "e": "SpO₂ termasuk NEWS."}, "hy": "NEWS: RR, SpO₂, O₂ tambahan, suhu, TD sistolik, nadi, kesadaran.", "ev": [], "refs": ["smith2013"]}, {"id": "A261", "sec": "anes", "stem": "Pasien-pasien berikut seharusnya dirawat di ICU, kecuali:", "vig": null, "opts": ["Pasien yang mengalami gangguan kesadaran berat", "Pasien dengan kondisi fase terminal", "Pasien yang mengalami instabilitas hemodinamik dan memerlukan terapi suportif", "Pasien kritis yang diprediksi membaik setelah menjalani perawatan intensif", "Pasien gawat napas"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "ICU2", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "ICU diperuntukkan bagi pasien kritis yang berpotensi pulih dan mendapat keuntungan dari bantuan organ dan pemantauan intensif (slide ICU 5: gangguan napas berat, gangguan hemodinamik berat, gangguan kesadaran berat GCS <9, gangguan elektrolit berat). Pasien fase terminal yang ireversibel termasuk prioritas 4 (\"usually not appropriate\") menurut model prioritas SCCM di slide, karena tidak mendapat manfaat. Perawatan paliatif lebih tepat untuk mereka.", "w": {"a": "Gangguan kesadaran berat (GCS <9) adalah indikasi ICU level 1 di slide.", "c": "Instabilitas hemodinamik yang butuh obat atau alat adalah indikasi ICU.", "d": "Pasien yang diprediksi membaik dengan perawatan intensif adalah sasaran utama ICU.", "e": "Gagal napas atau distres berat adalah indikasi ICU."}, "hy": "ICU untuk pasien yang bisa mendapat manfaat. Terlalu sehat atau terminal ireversibel = prioritas 4.", "ev": [{"deck": "ICU2", "page": 7, "quote": "Too well to benefit, or irreversibly, terminally ill"}, {"deck": "ICU1", "page": 5, "quote": "nantinya akan mendapat keuntungan maksimal untuk survivalnya"}], "refs": ["nates2016"]}, {"id": "A262", "sec": "anes", "stem": "Kegunaan National Early Warning Score (NEWS) adalah:", "vig": null, "opts": ["Mengantisipasi kegagalan sistem gas medis di rumah sakit", "Menemukan kemungkinan perburukan kondisi pasien sejak dini", "Mempersiapkan sistem transportasi pada kondisi bencana", "Mempersiapkan UGD untuk menghadapi kecelakaan massal", "Melakukan resusitasi pasien ICU yang mengalami henti jantung"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "ICU2", "st": "peng", "deb": null, "note": null, "gl": null, "r": "NEWS adalah sistem skor dari tanda vital rutin untuk mengenali perburukan pasien di bangsal sejak dini, sehingga respons klinis (observasi lebih ketat, panggil dokter, rapid response team) bisa dilakukan sebelum pasien jatuh ke henti jantung atau memerlukan ICU mendadak. NEWS terbukti dapat membedakan pasien yang berisiko henti jantung, masuk ICU tidak terencana, atau meninggal dalam 24 jam (Smith 2013). Slide ICU menyebut pasien bangsal yang berisiko memburuk dipantau dengan dukungan tim outreach.", "w": {"a": "NEWS tidak berhubungan dengan gas medis.", "c": "NEWS bukan sistem bencana.", "d": "NEWS bukan untuk kecelakaan massal (itu triase).", "e": "Resusitasi adalah tugas tim code blue."}, "hy": "EWS/NEWS untuk deteksi dini perburukan, sehingga respons berjenjang bisa mencegah henti jantung.", "ev": [{"deck": "ICU2", "page": 5, "quote": "Ward with outreach support: at risk of deterioration, or stepping down from higher care"}], "refs": ["smith2013"]}, {"id": "A263", "sec": "anes", "stem": "Bila skor NEWS meningkat, yang harus dilakukan adalah:", "vig": null, "opts": ["Menunggu perbaikan kondisi sampai keesokan hari", "Memanggil keluarga untuk mendampingi pasien pada kondisi kritis", "Melakukan observasi pada pasien dengan lebih ketat", "Meminta tim code blue bersiap-siap bila pasien henti napas", "Menunggu sampai pasien jatuh dalam kondisi henti jantung"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "ICU2", "st": "luar", "deb": "Pada skor yang sangat tinggi (≥7) respons yang diharapkan lebih dari sekadar observasi ketat, yaitu memanggil tim respons cepat. Kunci memilih c sebagai respons umum terhadap kenaikan skor.", "note": null, "gl": null, "r": "NEWS memakai respons berjenjang: skor naik berarti frekuensi observasi dinaikkan dan perawat memberi tahu dokter; skor sedang (5–6 atau ada satu parameter bernilai 3) memerlukan penilaian segera oleh dokter yang kompeten; skor tinggi (≥7) memerlukan respons darurat oleh tim dengan kemampuan perawatan kritis (rapid response atau outreach), dan pertimbangan pindah ke ICU. Di antara opsi, observasi yang lebih ketat adalah respons awal yang tepat terhadap peningkatan skor.", "w": {"a": "Menunggu sampai besok bertentangan dengan tujuan peringatan dini.", "b": "Memanggil keluarga bukan respons klinis terhadap perburukan.", "d": "Code blue untuk henti jantung atau napas. Pada skor tinggi yang dipanggil adalah rapid response team, bukan sekadar menunggu henti napas.", "e": "Menunggu henti jantung adalah kegagalan sistem."}, "hy": "NEWS naik: observasi lebih sering, lalu panggil dokter, lalu tim respons cepat atau ICU sesuai skor.", "ev": [], "refs": ["smith2013"]}, {"id": "A264", "sec": "anes", "stem": "Dalam anestesi dan terapi intensif, pasien adalah orang yang dibantu untuk menyelesaikan masalah kesehatannya. Oleh karena itu pasien mempunyai hak:", "vig": null, "opts": ["Didengarkan keluhannya dan mendapat informasi tentang anestesi yang akan dilakukan saat kunjungan praoperasi", "Diberikan informasi yang dilebih-lebihkan dan yang berat-berat agar pasien dan keluarga mengetahui risiko terburuk sehingga dokter lebih aman", "Untuk operasi poliklinis atau rawat jalan tidak perlu diperiksa karena anestesinya cepat dan segera pulih sadar", "Pasien BPJS karena jumlahnya banyak cukup diperiksa sekilas dengan cepat saja", "Bukan salah satu di atas"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "PREP", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Pasien berhak didengar, diperiksa dengan layak, dan mendapat informasi yang jujur, lengkap, dan proporsional tentang anestesi yang akan dilakukan (risiko, manfaat, alternatif) untuk memberi persetujuan. Slide Persiapan Perioperatif: berikan semua informasi yang diperlukan dengan bahasa awam, diskusikan pilihan, beri waktu berpikir; persetujuan tindakan memiliki aspek etik, profesional, dan hukum.", "w": {"b": "Informasi harus jujur dan proporsional, bukan dilebih-lebihkan untuk melindungi dokter.", "c": "Pasien rawat jalan tetap wajib dievaluasi praoperasi.", "d": "Semua pasien berhak atas pemeriksaan yang sama, tanpa membedakan cara pembayaran.", "e": "Opsi a benar."}, "hy": "Informed consent: informasi lengkap, jujur, bahasa awam, ada pilihan, ada waktu berpikir.", "ev": [{"deck": "PREP", "page": 23, "quote": "Berikan semua informasi yang diperlukan bagi pasien untuk membuat keputusan yang tepat"}, {"deck": "PREP", "page": 22, "quote": "PENTINGNYA PERSETUJUAN TINDAKAN Aspek Etik Aspek professional Aspek legal/hukum"}], "refs": []}, {"id": "A265", "sec": "anes", "stem": "Psikotrauma yang dialami anak yang menjalani pembedahan:", "vig": null, "opts": ["Dapat mengganggu perkembangan psikologis", "Perlu dicegah dengan tindakan pencegahan", "Dapat dilakukan pendekatan farmakologis", "Sering terjadi pada balita", "Semua benar"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "e", "topic": "PREP", "st": "luar", "deb": null, "note": null, "gl": null, "r": "Anak, terutama usia 1–5 tahun, sangat rentan cemas saat perpisahan dengan orang tua dan induksi anestesi. Kecemasan praoperasi berhubungan dengan delirium saat bangun (emergence delirium), nyeri pascaoperasi yang lebih berat, dan perubahan perilaku pascaoperasi (mimpi buruk, enuresis, kecemasan perpisahan) yang dapat bertahan berminggu-minggu. Pencegahannya meliputi persiapan psikologis, kehadiran orang tua saat induksi, distraksi, dan premedikasi (misalnya midazolam oral). Topik ini tidak dibahas di PPT.", "w": {"a": "Benar, tetapi tidak sendirian.", "b": "Benar, tetapi tidak sendirian.", "c": "Benar (premedikasi), tetapi tidak sendirian.", "d": "Benar, tetapi tidak sendirian."}, "hy": "Cemas praoperasi pada anak: persiapan, orang tua mendampingi, distraksi, midazolam oral.", "ev": [], "refs": ["tb_morgan"]}, {"id": "A266", "sec": "anes", "stem": "Perubahan fisiologis pada wanita hamil aterm yang berpengaruh pada tindakan anestesi umum adalah:", "vig": null, "opts": ["Ventilasi alveolar meningkat", "Jumlah sel darah merah menurun", "Laju napas yang relatif tetap", "Kekuatan sfingter kardioesofageal meningkat", "Volume darah relatif tetap"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "PREP", "st": "luar", "deb": null, "note": null, "gl": null, "r": "Pada kehamilan aterm, ventilasi semenit dan ventilasi alveolar meningkat sekitar 45–50% (terutama karena volume tidal naik, akibat progesteron), sehingga PaCO₂ turun menjadi sekitar 30–32 mmHg. Dampaknya pada anestesi umum: induksi inhalasi lebih cepat, dan bersama FRC yang turun serta konsumsi O₂ yang naik, desaturasi saat apnea terjadi lebih cepat. Perubahan lain: volume plasma dan volume darah naik (sekitar 40–50%), massa sel darah merah naik tetapi lebih sedikit (anemia dilusional), dan tonus sfingter esofagus bawah turun (risiko aspirasi). Topik ini tidak dibahas di PPT.", "w": {"b": "Massa sel darah merah justru naik (sekitar 20–30%); Hb turun karena dilusi.", "c": "Laju napas memang hampir tetap atau sedikit naik, tetapi itu bukan perubahan yang bermakna untuk anestesi; yang berubah besar adalah volume tidal dan ventilasi.", "d": "Tonus sfingter esofagus bawah justru menurun sehingga risiko aspirasi naik.", "e": "Volume darah naik sekitar 40–50%."}, "hy": "Hamil aterm: ventilasi naik, FRC turun, desaturasi cepat; volume darah naik; LES melemah (aspirasi); MAC turun; kompresi aortokaval.", "ev": [], "refs": ["tb_morgan"]}, {"id": "A267", "sec": "anes", "stem": "Pada waktu proses melahirkan, seorang ibu usia 35 tahun (75 kg) mengalami sesak napas setelah sebelumnya muntah-muntah. Ibu tersebut dicurigai menderita:", "vig": null, "opts": ["Emboli cairan ketuban", "Dekompensasi kordis", "Semua tersebut di atas salah", "Supine hypotensive syndrome", "Sindrom Mendelson"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "e", "topic": "PREP", "st": "luar", "deb": null, "note": null, "gl": null, "r": "Sindrom Mendelson adalah pneumonitis kimiawi akibat aspirasi isi lambung yang asam (pH <2,5, volume >25 mL), pertama dideskripsikan pada ibu bersalin dengan anestesi umum (1946). Ibu hamil aterm berisiko tinggi karena tonus sfingter esofagus bawah turun, tekanan intragastrik naik, dan pengosongan lambung melambat saat persalinan. Muntah diikuti sesak (bronkospasme, hipoksemia, infiltrat) sangat mengarah ke aspirasi. Topik ini tidak dibahas di PPT.", "w": {"a": "Emboli cairan ketuban timbul mendadak dengan kolaps kardiovaskular, hipoksia, dan DIC, tanpa didahului muntah.", "b": "Dekompensasi kordis tidak berhubungan dengan muntah.", "c": "Opsi e benar.", "d": "Supine hypotensive syndrome menimbulkan hipotensi dan pusing saat telentang, bukan sesak setelah muntah."}, "hy": "Mendelson = aspirasi asam lambung. Pencegahan: puasa, antasida nonpartikulat, H₂-blocker, RSI dengan tekanan krikoid.", "ev": [], "refs": ["tb_morgan"]}, {"id": "A268", "sec": "anes", "stem": "Waktu pulih sadar setelah pemberian obat anestesi inhalasi dipengaruhi oleh:", "vig": null, "opts": ["Aliran darah ke paru", "Besarnya ventilasi", "Daya kelarutan dalam jaringan dan darah", "Aliran O₂ yang diberikan", "Semua benar"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "e", "topic": "FARM", "st": "luar", "deb": "Bila soal dimaksudkan \"faktor utama\", jawabannya c (kelarutan). Dengan adanya opsi \"semua benar\", kunci memilih e karena semua faktor memang memengaruhi kecepatan eliminasi.", "note": null, "gl": null, "r": "Eliminasi anestetik inhalasi terjadi terutama lewat paru, sehingga kecepatan pulih dipengaruhi oleh: ventilasi alveolar (makin besar makin cepat agen dibuang), aliran gas segar (aliran O₂ tinggi mencegah rebreathing agen), curah jantung atau aliran darah paru, serta koefisien kelarutan darah/gas dan jaringan/darah (agen yang sukar larut seperti desfluran dan sevofluran cepat dieliminasi), ditambah durasi anestesi. Semua faktor berpengaruh. Topik ini tidak dibahas detail di PPT.", "w": {"a": "Benar, tetapi tidak sendirian.", "b": "Benar, tetapi tidak sendirian.", "c": "Benar (faktor terpenting), tetapi tidak sendirian.", "d": "Benar, tetapi tidak sendirian."}, "hy": "Pulih cepat: ventilasi tinggi, aliran gas segar tinggi, agen sukar larut (desfluran < sevofluran < isofluran < halotan).", "ev": [], "refs": ["tb_morgan"]}, {"id": "A269", "sec": "anes", "stem": "Pengaturan suhu tubuh bayi belum sempurna dan bersifat poikilotermik. Hal ini disebabkan:", "vig": null, "opts": ["Luas permukaan tubuh bayi yang relatif lebih luas dari orang dewasa", "Jaringan lemak subkutis yang lebih tipis", "Bayi tidak dapat menggigil untuk memproduksi panas", "Pengaruh obat anestesi yang sebagian besar bersifat vasodilator", "Semua pernyataan di atas benar"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "e", "topic": "FLUID", "st": "luar", "deb": null, "note": null, "gl": null, "r": "Bayi mudah hipotermia karena luas permukaan tubuh relatif besar terhadap berat badan, lapisan lemak subkutan tipis (insulasi buruk), dan tidak mampu menggigil; produksi panas bergantung pada termogenesis nonshivering dari lemak coklat, yang ditekan oleh anestetik. Anestetik juga menyebabkan vasodilatasi dan redistribusi panas, serta menurunkan ambang respons termoregulasi. Semua pernyataan benar. Topik ini tidak dibahas di PPT.", "w": {"a": "Benar, tetapi tidak sendirian.", "b": "Benar, tetapi tidak sendirian.", "c": "Benar, tetapi tidak sendirian.", "d": "Benar, tetapi tidak sendirian."}, "hy": "Cegah hipotermia bayi: ruang hangat, warmer, cairan hangat, tutup kepala.", "ev": [], "refs": ["tb_morgan"]}, {"id": "A270", "sec": "anes", "stem": "Seorang wanita 24 tahun dengan kehamilan 24 minggu datang ke IGD dengan sesak yang bertambah berat dalam satu minggu. Pasien tampak sianosis dan ada jari tabuh (clubbing finger). Tidak ada ronki. Laju napas 20–22x/menit, SpO₂ 82%, nadi 104x/menit reguler, terdengar murmur. Riwayat pernah didiagnosis \"jantung bocor\" saat usia 2 tahun tetapi tidak pernah diperiksa lanjut. Diagnosis pasien ini adalah:", "vig": null, "opts": ["Sindrom Eisenmenger", "Kardiomiopati peripartum", "Gagal jantung kongestif", "Gagal napas akut tipe 1", "PPOK dengan hipoksemia kronis"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "AB", "st": "luar", "deb": null, "note": null, "gl": null, "r": "Riwayat defek jantung kongenital (left-to-right shunt seperti VSD, ASD, atau PDA) yang tidak dikoreksi menyebabkan aliran berlebih ke paru, lalu hipertensi pulmonal ireversibel, hingga arah shunt berbalik menjadi kanan ke kiri. Itulah sindrom Eisenmenger: sianosis sentral, jari tabuh (tanda hipoksemia kronik), dan desaturasi yang tidak membaik dengan oksigen, tanpa ronki. Kehamilan memperburuk keadaan karena SVR turun sehingga shunt kanan-ke-kiri bertambah; kehamilan pada Eisenmenger berisiko kematian ibu sangat tinggi. Topik ini tidak dibahas di PPT.", "w": {"b": "Kardiomiopati peripartum muncul di akhir kehamilan sampai beberapa bulan pascapersalinan, dengan gagal jantung dan kongesti, tanpa jari tabuh.", "c": "Gagal jantung kongestif biasanya disertai ronki, edema, dan JVP naik; jari tabuh dan riwayat jantung bocor sejak kecil lebih mengarah ke Eisenmenger.", "d": "Desaturasi di sini bersifat kronik dan berasal dari shunt intrakardiak, bukan gagal napas akut akibat penyakit paru.", "e": "Tidak ada riwayat merokok atau penyakit paru; usianya juga tidak sesuai PPOK."}, "hy": "Eisenmenger: shunt kiri-ke-kanan lama, hipertensi pulmonal, lalu shunt berbalik kanan-ke-kiri (sianosis + jari tabuh). Kehamilan berisiko sangat tinggi.", "ev": [], "refs": ["tb_morgan"]}, {"id": "R051", "sec": "radio", "stem": "Perhatikan foto toraks ini, terutama daerah hilus sentralnya. Pasien laki-laki mengalami sesak napas akut. Apa diagnosis Anda?", "vig": null, "opts": ["Atelektasis bilateral", "Pola retikular bilateral pada pneumonia interstisial", "Bat-wing appearance pada edema paru akut"], "src": ["Tabulasi IPK"], "n": 1, "inc": true, "img": "tb_batwing", "pool": "drill", "key": "c", "topic": "THORAX", "st": "peng", "deb": null, "note": "Di Tabulasi soal ini hanya mencatat tiga opsi. Gambar diambil dari file Tabulasi.", "gl": null, "r": "Foto memperlihatkan opasitas alveolar bilateral yang terpusat di perihiler dan menipis ke arah perifer, sehingga membentuk gambaran sayap kelelawar atau kupu-kupu (bat-wing atau butterfly appearance). Pada pasien dengan sesak akut, gambaran ini khas untuk edema paru akut, terutama kardiogenik. Slide Radiologi Toraks-Kardiovaskuler membahas edema paru sebagai bagian dari dekompensasi kordis, dengan gambar contoh.", "w": {"a": "Atelektasis menunjukkan tanda kehilangan volume (pergeseran fisura, mediastinum, atau diafragma), bukan opasitas perihiler simetris.", "b": "Pola retikular adalah garis-garis halus interstisial yang difus, bukan konsolidasi perihiler yang padat."}, "hy": "Bat-wing/butterfly: edema alveolar perihiler bilateral, khas edema paru akut kardiogenik.", "ev": [{"deck": "THORAX", "page": 63, "quote": "Pulmonary edema"}], "refs": ["hansell2008"]}, {"id": "R052", "sec": "radio", "stem": "Seorang pasien laki-laki datang ke IGD dengan nyeri abdomen kanan atas setelah kecelakaan lalu lintas; abdomen tampak membesar dan distensi. Foto polos abdomen tampak normal. Dilakukan CT scan abdomen seperti di bawah ini. Diagnosisnya adalah:", "vig": null, "opts": ["Laserasi/ruptur ginjal kiri", "Udara bebas intraperitoneal", "Laserasi hepar", "Perforasi usus", "Gastritis"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": "tb_ct_ginjal", "pool": "drill", "key": "a", "topic": "URO", "st": "peng", "deb": null, "note": "Gambar diambil dari file Tabulasi. Lokasi keluhan di stem (kanan atas) tidak sesuai dengan temuan (ginjal kiri); jawaban mengikuti gambar.", "gl": null, "r": "Pada CT abdomen dengan kontras ini, hepar tampak homogen tanpa garis hipodens laserasi. Ginjal kiri menunjukkan celah hipodens linear yang memutus parenkim yang menyangat kontras, yaitu gambaran laserasi ginjal. Ginjal kanan tampak utuh. Tidak tampak udara bebas di depan hepar. CT dengan kontras adalah modalitas pilihan untuk trauma ginjal pada pasien yang stabil, karena dapat menilai derajat laserasi, hematoma perirenal, dan ekstravasasi urine. Slide Imaging Urogenitalia membahas pencitraan trauma ginjal.", "w": {"b": "Udara bebas tampak sebagai area hitam (densitas udara) di depan hepar atau di bawah dinding abdomen; tidak terlihat di sini.", "c": "Hepar tampak homogen tanpa garis atau area hipodens laserasi. Bandingkan dengan R005, yang menunjukkan laserasi hepar.", "d": "Perforasi usus ditandai udara bebas, cairan, atau dinding usus yang terputus.", "e": "Gastritis tidak didiagnosis dengan CT pada konteks trauma."}, "hy": "Trauma abdomen stabil: CT dengan kontras. Laserasi ginjal tampak sebagai celah hipodens di parenkim.", "ev": [{"deck": "URO", "page": 37, "quote": "USG Renal Trauma"}], "refs": []}, {"id": "R053", "sec": "radio", "stem": "Seorang wanita 59 tahun, gemuk, datang ke puskesmas dengan nyeri punggung bawah kronis selama 3 bulan. Nyeri menjalar sesuai dermatom saraf L4 ke arah kanan. Foto polos lumbal AP/lateral normal. Pemeriksaan selanjutnya adalah:", "vig": null, "opts": ["Ultrasonografi muskuloskeletal", "Foto polos fleksi dan ekstensi", "MRI lumbal tanpa kontras untuk mendeteksi kelainan degeneratif", "CT scan lumbal dengan kontras untuk mendeteksi infeksi", "PET-CT untuk menyingkirkan keganasan"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "RADI", "st": "peng", "deb": null, "note": null, "gl": null, "r": "Nyeri punggung bawah kronis dengan radikulopati (menjalar sesuai dermatom L4) yang menetap lebih dari 6 minggu dan foto polos normal paling baik dievaluasi dengan MRI lumbal tanpa kontras. MRI menilai diskus (herniasi), kanalis spinalis, foramen, dan akar saraf tanpa radiasi. Kontras hanya diperlukan bila curiga infeksi, tumor, atau pascaoperasi. Slide Pengantar Radiologi menekankan pemilihan pemeriksaan sesuai skenario klinis (imaging pathway).", "w": {"a": "USG tidak dapat menilai diskus dan akar saraf lumbal.", "b": "Foto fleksi-ekstensi menilai instabilitas (spondilolistesis), bukan kompresi akar saraf.", "d": "Tidak ada tanda infeksi (demam, riwayat imunokompromais); CT juga kurang baik menilai jaringan lunak saraf.", "e": "Tidak ada red flag keganasan (penurunan berat badan, riwayat kanker); PET-CT bukan pemeriksaan lini berikutnya."}, "hy": "LBP dengan radikulopati lebih dari 6 minggu atau ada defisit neurologis: MRI lumbal tanpa kontras.", "ev": [{"deck": "RADI", "page": 63, "quote": "Clinical scenarios: first-line examination"}], "refs": []}], "decks": {"INTRO": {"t": "Pengantar Anestesiologi (Guardians of Physiology)", "by": "Dept. Anestesiologi & Reanimasi FK Unair", "sec": "anes"}, "PREP": {"t": "Persiapan Pasien Perioperatif", "by": "dr. Mariza Fitriati, Sp.An-TI, Subsp.TI(K), Subsp.An.O(K)", "sec": "anes"} . Gusti Ayu Indirawati", "sec": "radio"}, "GI": {"t": "Radiologi Gastrointestinal", "by": "dr. M. Hidayat Surya Atmaja, Sp.Rad(K)", "sec": "radio"}, "ABD": {"t": "Kegawatdaruratan Gastrointestinal", "by": "dr. Adi Wasis Prakosa", "sec": "radio"}, "URO": {"t": "Imaging Urogenitalia Pria", "by": "Dept. Radiologi FK Unair", "sec": "radio"}, "LIES": {"t": "Skrining Keganasan Payudara & Organ Reproduksi", "by": "dr. Lies", "sec": "radio"}, "ARTH": {"t": "Radiologi Artritis", "by": "Prof. Dr. Rosy Setiawati, dr., Sp.Rad(K), CCD", "sec": "radio"}, "OSTEO": {"t": "Osteomielitis", "by": "Prof. Dr. Rosy Setiawati, dr., Sp.Rad(K), CCD", "sec": "radio"}, "FRAKT": {"t": "Fraktur, Dislokasi & Tumor Tulang", "by": "Paulus Rahardjo, dr., Sp.Rad(K)MSK, CCD", "sec": "radio"}}, "refs": {"neal2018": {"c": "Neal JM, Barrington MJ, Fettiplace MR, et al. The Third ASRA Practice Advisory on Local Anesthetic Systemic Toxicity: Executive Summary 2017. Reg Anesth Pain Med. 2018;43(2):113-123.", "doi": "10.1097/AAP.0000000000000720", "pmid": "29356773"}, "eger1987": {"c": "Eger EI 2nd. Partition coefficients of I-653 (desflurane) in human blood, saline, and olive oil. Anesth Analg. 1987;66(10):971-973.", "doi": null, "pmid": "3631593"}, "ahualli2007": {"c": "Ahualli J. The double duct sign. Radiology. 2007;244(1):314-315.", "doi": "10.1148/radiol.2441041978", "pmid": "17581912"}, "dasilva1997": {"c": "da Silva JM, Mapleson WW, Vickers MD. Quantitative study of Lowe's square-root-of-time method of closed-system anaesthesia. Br J Anaesth. 1997;79(1):103-112.", "doi": "10.1093/bja/79.1.103", "pmid": "9301397"}, "roussos2003": {"c": "Roussos C, Koutsoukou A. Respiratory failure. Eur Respir J Suppl. 2003;47:3s-14s.", "doi": "10.1183/09031936.03.00038503", "pmid": "14621112"}, "detroyer2011": {"c": "De Troyer A, Boriek AM. Mechanics of the respiratory muscles. Compr Physiol. 2011;1(3):1273-1300.", "doi": "10.1002/cphy.c100009", "pmid": "23733642"}, "wong2012": {"c": "Wong J, Lam DP, Abrishami A, et sthesiology. 7th ed. New York: McGraw-Hill; 2022. (textbook)", "doi": null, "pmid": null}, "asa2017": {"c": "American Society of Anesthesiologists Task Force. Practice Guidelines for Preoperative Fasting and the Use of Pharmacologic Agents to Reduce the Risk of Pulmonary Aspiration. Anesthesiology. 2017;126(3):376-393.", "doi": "10.1097/ALN.0000000000001452", "pmid": "28045707"}, "kehlet1993": {"c": "Kehlet H, Dahl JB. The value of \"multimodal\" or \"balanced analgesia\" in postoperative pain treatment. Anesth Analg. 1993;77(5):1048-1056.", "doi": "10.1213/00000539-199311000-00030", "pmid": "8105724"}, "neal2020": {"c": "Neal JM, Neal EJ, Weinberg GL. American Society of Regional Anesthesia and Pain Medicine Local Anesthetic Systemic Toxicity checklist: 2020 version. Reg Anesth Pain Med. 2021;46(1):81-82.", "doi": "10.1136/rapm-2020-101986", "pmid": "33148630"}, "tb_lowe": {"c": "Lowe HJ, Ernst EA. The Quantitative Practice of Anesthesia: Use of Closed Circuit. Baltimore: Williams & Wilkins; 1981. (textbook)", "doi": null, "pmid": null}, "tb_atls": {"c": "American College of Surgeons Committee on Trauma. Advanced Trauma Life Support (ATLS) Student Course Manual. 10th ed. Chicago: ACS; 2018. (textbook)", "doi": null, "pmid": null}, "mapleson1996": {"c": "Mapleson WW. Effect of age on MAC in humans: a meta-analysis. Br J Anaesth. 1996;76(2):179-185.", "doi": "10.1093/bja/76.2.179", "pmid": "8777094"}, "evans2021": {"c": "Evans L, Rhodes A, Alhazzani W, et al. Surviving Sepsis Campaign: International Guidelines for Management of Sepsis and Septic Shock 2021. Crit Care Med. 2021;49(11):e1063-e1143.", "doi": "10.1097/CCM.0000000000005337", "pmid": "34605781"}}}</script>
<script>
(function(){
'use strict';
const DATA=JSON.parse(document.getElementById('bank').textContent);
const ITEMS=DATA.items, DECKS=DATA.decks, REFS=DATA.refs;
const BYID=Object.fromEntries(ITEMS.map(i=>[i.id,i]));
const L='abcde';
const TRY_MIN=100, N_ANES=50, N_RADIO=50;
const K={cur:'ipk.tryout.current.v1',hist:'ipk.tryout.history.v1',wrong:'ipk.wrong.v1',drill:'ipk.drill.prefs.v1',topic:'ipk.drill.topic.v1'};
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function del(k){try{localStorage.removeItem(k)}catch(e){}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
const SEC={anes:'Anestesi',radio:'Radiologi'};
const ST={ppt:['Dari PPT','ok'],peng:['PPT + Pengayaan','navy'],luar:['Tidak ada di PPT','warn']};
function fmtDate(t){const d=new Date(t);return d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}
function fmtDur(ms){const s=Math.max(0,Math.round(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0')}

/* ---------- wrong list ---------- */
function recordAnswer(id,correct){
  const w=get(K.wrong,{});
  if(!correct){w[id]={streak:0,t:Date.now()}}
  else if(w[id]){w[id].streak=(w[id].streak||0)+1; if(w[id].streak>=2) delete w[id]}
  set(K.wrong,w);
}

/* ---------- shared renderers ---------- */
function badges(it,opts={}){
  const b=[];
  b.push(`<span class="chip">${SEC[it.sec]}</span>`);
  b.push(`<span class="chip navy">${esc(DECKS[it.topic].t)}</span>`);
  if(it.n>1) b.push(`<span class="chip gold">Keluar ${it.n}×</span>`);
  if(it.inc) b.push(`<span class="chip warn">Soal recall tidak lengkap</span>`);
  if(opts.reveal){ const s=ST[it.st]; b.push(`<span class="chip ${s[1]}">${s[0]}</span>`); if(it.deb) b.push(`<span class="chip bad">Kunci diperdebatkan</span>`); }
  return b.join('');
}
function stemHTML(it){
  let h='';
  if(it.vig) h+=`<div class="vig"><b>Kasus:</b> ${esc(it.vig)}</div>`;
  h+=`<p class="stem">${esc(it.stem||'(Stem tidak tercatat)')}</p>`;
  if(it.img) h+=`<img class="qimg" src="qimg/${it.img}.jpg" alt="Gambar soal" loading="lazy" data-zoom>`;
  return h;
}
function srcLine(it){return `<div class="src">Sumber: ${it.src.map(esc).join(' · ')}${it.n>1?` (muncul ${it.n}× di file sumber)`:''}</div>`}
function explHTML(it,chosen,revealed){
  const ok=chosen===it.key;
  let v;
  if(revealed) v=`<div class="verdict na">Dilihat tanpa menjawab. Kunci: ${it.key.toUpperCase()}. ${esc(it.opts[L.indexOf(it.key)])}</div>`;
  else if(chosen==null) v=`<div class="verdict na">Tidak dijawab. Kunci: ${it.key.toUpperCase()}. ${esc(it.opts[L.indexOf(it.key)])}</div>`;
  else v=`<div class="verdict ${ok?'ok':'bad'}">${ok?'Benar.':'Belum tepat.'} Kunci: ${it.key.toUpperCase()}. ${esc(it.opts[L.indexOf(it.key)])}</div>`;
  let h=`<div class="expl">${v}`;
  if(it.deb) h+=`<div class="block deb"><h4>Kunci diperdebatkan</h4><p>${esc(it.deb)}</p></div>`;
  if(it.note) h+=`<div class="block nolabel"><h4>Catatan soal</h4><p>${esc(it.note)}</p></div>`;
  h+=`<div class="block"><h4>Pembahasan</h4><p>${esc(it.r)}</p></div>`;
  const ws=Object.keys(it.w).sort();
  if(ws.length) h+=`<div class="block"><h4>Kenapa opsi lain salah</h4><ul class="wrongs">${ws.map(k=>`<li><span class="L">${k.toUpperCase()}</span><span>${esc(it.w[k])}</span></li>`).join('')}</ul></div>`;
  if(it.ev.length){
    h+=`<div class="block"><h4>Bukti dari PPT</h4><div class="ev">`;
    const seen=new Set();
    for(const e of it.ev){
      const key=e.deck+'_'+e.page; const d=DECKS[e.deck];
      const quotes=it.ev.filter(x=>x.deck===e.deck&&x.page===e.page&&x.quote).map(x=>x.quote);
      if(seen.has(key)) continue; seen.add(key);
      h+=`<figure><img src="slides/${key}.jpg" alt="Slide ${esc(d.t)} halaman ${e.page}" loading="lazy" data-zoom>
        <figcaption><span class="deck">${esc(d.t)}</span><span class="muted">${esc(d.by)} · hlm. ${e.page}</span>
        ${quotes.map(q=>`<blockquote>“${esc(q)}”</blockquote>`).join('')}
        ${quotes.length?'':'<span class="muted">Bukti berupa gambar pada slide.</span>'}</figcaption></figure>`;
    }
    h+=`</div></div>`;
  } else {
    h+=`<div class="block nolabel"><h4>Bukti dari PPT</h4><p>Topik soal ini tidak dibahas di PPT kuliah. Pembahasan disusun dari rujukan di bawah.</p></div>`;
  }
  if(it.gl) h+=`<div class="block deb"><h4>Perbedaan PPT dan guideline</h4><p>${esc(it.gl)}</p></div>`;
  if(it.hy) h+=`<div class="block hy"><h4>Poin high-yield</h4><p>${esc(it.hy)}</p></div>`;
  if(it.refs.length) h+=`<div class="block"><h4>Rujukan di luar PPT</h4><ol class="refs">${it.refs.map(r=>{const x=REFS[r];const links=[];if(x.doi)links.push(`<a href="https://doi.org/${esc(x.doi)}" target="_blank" rel="noopener">DOI</a>`);if(x.pmid)links.push(`<a href="https://pubmed.ncbi.nlm.nih.gov/${esc(x.pmid)}/" target="_blank" rel="noopener">PubMed ${esc(x.pmid)}</a>`);return `<li>${esc(x.c)} ${links.join(' · ')}</li>`}).join('')}</ol></div>`;
  return h+`</div>`;
}

function getTP(){const t=get(K.topic,null);return (t&&t.ans&&t.seen&&t.last)?t:{ans:{},seen:{},last:{}}}
function topicIds(k){return ITEMS.filter(i=>i.topic===k).map(i=>i.id)}
function topicProg(k,tp){const ids=topicIds(k);let done=0,answered=0,correct=0;ids.forEach(id=>{const a=tp.ans[id];if(a!=null){answered++;done++;if(a===BYID[id].key)correct++}else if(tp.seen[id])done++});return {total:ids.length,done,answered,correct}}
function startTopic(k){
  const ids=topicIds(k), tp=getTP();
  let pos=tp.last[k];
  if(!(pos>=0&&pos<ids.length)){ pos=ids.findIndex(id=>tp.ans[id]==null&&!tp.seen[id]); if(pos<0) pos=0 }
  const ans={},seen={}; ids.forEach(id=>{if(tp.ans[id]!=null)ans[id]=tp.ans[id]; if(tp.seen[id])seen[id]=true});
  drill={ids,pos,ans,seen,wrongMode:false,read:false,topic:k};
  const h='#drilling-topik-'+k; if(location.hash!==h) location.hash=h; else renderDrill();
}
function saveTopic(){
  if(!drill||!drill.topic) return;
  const tp=getTP();
  drill.ids.forEach(id=>{ if(drill.ans[id]!=null) tp.ans[id]=drill.ans[id]; else delete tp.ans[id]; if(drill.seen[id]) tp.seen[id]=true; else delete tp.seen[id]; });
  tp.last[drill.topic]=drill.pos; set(K.topic,tp);
}
function startDrill(ids,wrongMode,readMode){
  if(wrongMode){ ids=shuffle(Object.keys(get(K.wrong,{})).filter(id=>BYID[id])); if(!ids.length){toast('Belum ada soal yang salah');location.hash='#drilling';return} }
  drill={ids,pos:0,ans:{},seen:{},wrongMode,read:!!readMode,topic:null};
  if(location.hash!=='#drilling-jalan') location.hash='#drilling-jalan'; else renderDrill();
}
function renderDrill(){
  if(!drill){location.hash='#drilling';return}
  const id=drill.ids[drill.pos], it=BYID[id];

        ${drill.topic?`<div class="dcells" role="navigation" aria-label="Nomor soal topik ini">${drill.ids.map((q,k)=>{const a=drill.ans[q];const c=a!=null?(a===BYID[q].key?'ok':'bad'):drill.seen[q]?'seen':'';return `<button class="dcell ${c} ${k===drill.pos?'cur':''}" data-k="${k}" aria-label="Soal ${k+1}">${k+1}</button>`}).join('')}</div>

        <button class="btn ghost" id="clrTopic" style="margin-top:12px;width:100%" ${done+nseen?'':'disabled'}>Kosongkan jawaban topik ini</button>`:''}

  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{

  app.querySelector('#prev').onclick=()=>{drill.pos--;renderDrill();window.scrollTo(0,0)};
  app.querySelectorAll('.dcell').forEach(c=>c.onclick=()=>{drill.pos=+c.dataset.k;renderDrill();window.scrollTo(0,0)});
  const ct=app.querySelector('#clrTopic'); let armed=null;
  if(ct) ct.onclick=()=>{ if(!armed){ct.textContent='Yakin? Klik sekali lagi';armed=setTimeout(()=>{ct.textContent='Kosongkan jawaban topik ini';armed=null},3000);return}
    clearTimeout(armed); drill.ans={}; drill.seen={}; drill.pos=0; toast('Jawaban topik ini dikosongkan'); renderDrill(); window.scrollTo(0,0) };
  saveTopic();
  app.querySelector('#next').onclick=()=>{

      else toast(`Sesi selesai: ${c}/${n} benar`);
      drill=null; location.hash='#drilling'; }
  };
}

/* ----- TRY-OUT ----- */
function newAttempt(){
  const anes=shuffle(ITEMS.filter(i=>i.sec==='anes'&&!i.inc).map(i=>i.id)).slice(0,N_ANES);
  const radio=shuffle(ITEMS.filter(i=>i.sec==='radio'&&!i.inc).map(i=>i.id)).slice(0,N_RADIO);
  return {id:'T'+Date.now(),start:Date.now(),qids:anes.concat(radio),ans:{},flags:{},pos:0,done:false};
}
function remaining(a){return a.start+TRY_MIN*60000-Date.now()}
function scoreOf(a){
  let an=0,ra=0;
  a.qids.forEach((id,k)=>{const it=BYID[id];if(a.ans[id]===it.key){if(it.sec==='anes')an++;else ra++}});
  return {anes:an,radio:ra,total:an+ra};
}
function submitAttempt(a,auto){
  a.done=true; a.end=Math.min(Date.now(),a.start+TRY_MIN*60000); a.auto=!!auto; a.score=scoreOf(a);
  a.qids.forEach(id=>{if(a.ans[id]!=null) recordAnswer(id,a.ans[id]===BYID[id].key)});
  const h=get(K.hist,[]); h.unshift({id:a.id,start:a.start,end:a.end,auto:a.auto,score:a.score,qids:a.qids,ans:a.ans}); set(K.hist,h.slice(0,50));
  del(K.cur);
  location.hash='#hasil-'+a.id;
}
let confirmOpen=false;
views.tryout=function(){
  let a=get(K.cur,null);
  if(a&&!a.done&&remaining(a)<=0){ submitAttempt(a,true); return }
  if(!a||a.done){
    app.innerHTML=`<h1>Try-out</h1><p class="lede">100 soal: 50 anestesi diacak dari ${ITEMS.filter(i=>i.sec==='anes'&&!i.inc).length} soal lengkap dan 50 radiologi diacak dari ${ITEMS.filter(i=>i.sec==='radio'&&!i.inc).length} soal lengkap. Sumbernya Rekap UAB 2024, UAB 1 2025 (Oculus), Quiz Anestesi, dan Tabulasi IPK. Soal recall yang tidak lengkap tidak dimasukkan. Waktu 100 menit mulai berjalan begitu kamu menekan tombol di bawah dan tidak bisa dijeda.</p>
    <div class="panel" style="margin-top:18px;max-width:640px;display:flex;flex-direction:column;gap:12px">
      <ul style="margin:0;padding-left:18px"><li>Grid nomor ada di kanan. Nomor berubah hijau setelah dijawab, dan bendera merah menandai soal yang di-flag.</li><li>Kalau halaman di-refresh, attempt dilanjutkan dan timer tetap dihitung dari waktu mulai.</li><li>Saat waktu habis, jawaban disubmit otomatis.</li><li>Setelah submit, kamu mendapat skor Anestesi, Radiologi, dan Total, lengkap dengan pembahasan.</li></ul>
      <div><button class="btn primary" id="start">Mulai try-out (100 menit)</button></div>
    </div>`;
    app.querySelector('#start').onclick=()=>{const n=newAttempt(); if(!set(K.cur,n)) toast('Penyimpanan browser tidak tersedia. Progres tidak akan bertahan bila halaman di-refresh.'); window.__memAttempt=n; views.tryout()};
    return;
  }
  confirmOpen=false; renderTry(a);
  timerHandle=setInterval(()=>{const t=document.getElementById('timer');if(!t)return;const r=remaining(a);t.textContent=fmtDur(r);t.classList.toggle('low',r<5*60000);if(r<=0){clearInterval(timerHandle);const cur=get(K.cur,a);submitAttempt(cur,true)}},1000);
};
function saveA(a){ if(!set(K.cur,a)) window.__memAttempt=a }
function renderTry(a){
  const pos=a.pos, id=a.qids[pos], it=BYID[id], chosen=a.ans[id];
  const answered=Object.keys(a.ans).length;
  const cell=(qid,k)=>`<button class="cell ${a.ans[qid]!=null?'ans':''} ${a.flags[qid]?'flag':''} ${k===pos?'cur':''}" data-k="${k}" aria-label="Soal ${k+1}${a.ans[qid]!=null?', sudah dijawab':''}${a.flags[qid]?', ditandai':''}">${k+1}</button>`;
  const r=remaining(a);
  app.innerHTML=`
  ${confirmOpen?`<div class="confirm" id="conf"><h2>Selesaikan try-out?</h2><p>Kamu sudah menjawab <b class="mono">${answered}</b> dari 100 soal. ${100-answered?`<b>${100-answered}</b> soal belum dijawab dan akan dihitung salah.`:''} ${Object.values(a.flags).filter(Boolean).length?`Ada ${Object.values(a.flags).filter(Boolean).length} soal yang di-flag.`:''} Sisa waktu <span class="mono">${fmtDur(r)}</span>.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="doSubmit">Submit dan lihat hasil</button><button class="btn" id="cancel">Kembali ke soal</button></div></div>`:''}
  <div class="to-bar"><div class="eyebrow" style="margin-right:auto">Try-out UAB IPK · ${SEC[it.sec]}</div><span class="muted" style="font-size:.88rem">Sisa waktu</span><span class="timer ${r<300000?'low':''}" id="timer" role="timer">${fmtDur(r)}</span></div>
  <div class="to-grid">
    <div class="to-main">
      <div class="to-q">
        <div class="qinfo">
          <div class="qn">Soal <b>${pos+1}</b></div>
          <div>${chosen!=null?'Sudah dijawab':'Belum dijawab'}</div>
          <div class="muted">Nilai maks. 1,00</div>
          <button class="flagbtn" id="flag" aria-pressed="${!!a.flags[id]}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1v14M3 2h9l-2 3 2 3H3" fill="${a.flags[id]?'currentColor':'none'}" stroke="currentColor" stroke-width="1.5"/></svg>${a.flags[id]?'Hapus tanda':'Tandai soal'}</button>
        </div>
        <div class="qbox">
          <div class="muted" style="font-size:.85rem;margin-bottom:6px">Pilih satu jawaban:</div>
          ${stemHTML(it)}
          <ul class="opts" role="radiogroup" aria-label="Pilihan jawaban">${it.opts.map((o,k)=>{const l=L[k];return `<li><label class="opt ${chosen===l?'sel':''}"><input type="radio" name="o" value="${l}" ${chosen===l?'checked':''}><span class="L">${l}.</span><span>${esc(o)}</span></label></li>`}).join('')}</ul>
          ${chosen!=null?'<button class="btn ghost" id="clear" style="margin-top:10px">Hapus pilihan</button>':''}
        </div>
      </div>
      <div class="nav-row"><button class="btn" id="prev" ${pos?'':'disabled'}>Soal sebelumnya</button><button class="btn primary" id="next">${pos<99?'Soal berikutnya':'Selesaikan try-out'}</button></div>
    </div>
    <aside class="to-side">
      <div class="navbox ${window.innerWidth<=900&&!window.__navOpen?'collapsed':''}" id="navbox">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3 style="margin:0">Navigasi soal</h3><button class="btn ghost navtoggle" id="navt">${window.innerWidth<=900&&!window.__navOpen?'Tampilkan':'Sembunyikan'}</button></div>
        <div class="navbody">
          <div class="grp">Anestesi · 1–50</div><div class="cells">${a.qids.slice(0,50).map((q,k)=>cell(q,k)).join('')}</div>
          <div class="grp">Radiologi · 51–100</div><div class="cells">${a.qids.slice(50).map((q,k)=>cell(q,k+50)).join('')}</div>
          <div class="legend"><span><i class="sw a"></i>Sudah dijawab</span><span><i class="sw"></i>Belum</span><span><i class="sw f"></i>Ditandai</span></div>
          <div class="finish"><div class="muted" style="font-size:.86rem"><span class="mono">${answered}</span>/100 terjawab</div><button class="btn gold" id="finish">Selesaikan try-out…</button></div>
        </div>
      </div>
    </aside>
  </div>`;
  const go=k=>{a.pos=k;saveA(a);renderTry(a);window.scrollTo(0,0)};
  app.querySelectorAll('input[name=o]').forEach(x=>x.onchange=()=>{a.ans[id]=x.value;saveA(a);renderTry(a)});
  const cl=app.querySelector('#clear'); if(cl) cl.onclick=()=>{delete a.ans[id];saveA(a);renderTry(a)};
  app.querySelector('#flag').onclick=()=>{a.flags[id]=!a.flags[id];saveA(a);renderTry(a)};
  app.querySelectorAll('.cell').forEach(c=>c.onclick=()=>go(+c.dataset.k));
  app.querySelector('#prev').onclick=()=>go(pos-1);
  app.querySelector('#next').onclick=()=>{if(pos<99)go(pos+1);else{confirmOpen=true;renderTry(a);window.scrollTo(0,0)}};
  app.querySelector('#finish').onclick=()=>{confirmOpen=true;renderTry(a);window.scrollTo(0,0)};
  app.querySelector('#navt').onclick=()=>{window.__navOpen=!window.__navOpen;renderTry(a)};
  if(confirmOpen){app.querySelector('#doSubmit').onclick=()=>{clearInterval(timerHandle);submitAttempt(a,false)};app.querySelector('#cancel').onclick=()=>{confirmOpen=false;renderTry(a)}}
}

/* ----- RESULTS ----- */
let resFilter='semua';
views.hasil=function(){
  const hid=location.hash.split('-')[1]; const h=get(K.hist,[]); const a=h.find(x=>x.id===hid);
  if(!a){app.innerHTML=`<div class="empty">Hasil tidak ditemukan di browser ini. <a href="#riwayat">Lihat riwayat</a></div>`;return}
  const pct=(n,d)=>Math.round(n/d*100)+'%';
  const rows=a.qids.map((id,k)=>{const it=BYID[id];const c=a.ans[id];const s=c==null?'na':(c===it.key?'ok':'bad');return {k,id,it,c,s}});
  const cnt={semua:rows.length,salah:rows.filter(r=>r.s==='bad').length,kosong:rows.filter(r=>r.s==='na').length,benar:rows.filter(r=>r.s==='ok').length};
  const show=rows.filter(r=>resFilter==='semua'||(resFilter==='salah'&&r.s==='bad')||(resFilter==='kosong'&&r.s==='na')||(resFilter==='benar'&&r.s==='ok'));
  app.innerHTML=`
  <div class="eyebrow">Hasil try-out · ${fmtDate(a.start)}</div>
  <h1>Skor ${a.score.total}/100</h1>
  <p class="lede">Durasi <span class="mono">${fmtDur(a.end-a.start)}</span>${a.auto?' (waktu habis, disubmit otomatis)':''}. Soal yang dijawab salah masuk ke daftar "Ulangi yang salah".</p>
  <div class="scorecard">
    <div class="score"><div class="muted">Anestesi</div><div class="big">${a.score.anes}<span class="muted" style="font-size:1rem">/50</span></div><div class="pct">${pct(a.score.anes,50)}</div></div>
    <div class="score"><div class="muted">Radiologi</div><div class="big">${a.score.radio}<span class="muted" style="font-size:1rem">/50</span></div><div class="pct">${pct(a.score.radio,50)}</div></div>
    <div class="score total"><div>Total</div><div class="big">${a.score.total}<span style="font-size:1rem;opacity:.8">/100</span></div><div class="pct">${pct(a.score.total,100)}</div></div>
    <div class="score"><div class="muted">Tidak dijawab</div><div class="big">${cnt.kosong}</div><div class="pct">dihitung salah</div></div>
  </div>
  <div class="filters" role="group" aria-label="Saring ringkasan">${[['semua','Semua'],['salah','Salah'],['kosong','Tidak dijawab'],['benar','Benar']].map(([k,t])=>`<button aria-pressed="${resFilter===k}" data-f="${k}">${t} <span class="mono">${cnt[k]}</span></button>`).join('')}</div>
  <div class="rev">${show.map(r=>`<details class="ritem"><summary><span class="rnum ${r.s}">${r.k+1}</span><span class="rsum">${esc(r.it.stem||r.it.vig||'')}</span><span class="rans">Jawabanmu ${r.c?r.c.toUpperCase():'–'} · Kunci ${r.it.key.toUpperCase()}</span></summary><div class="inner" data-id="${r.id}" data-c="${r.c||''}"></div></details>`).join('')||'<div class="empty">Tidak ada soal di kategori ini.</div>'}</div>
  <div style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap"><a class="btn primary" href="#tryout">Try-out baru</a><a class="btn" href="#riwayat">Riwayat</a></div>`;
  app.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{resFilter=b.dataset.f;views.hasil()});
  app.querySelectorAll('details.ritem').forEach(d=>d.addEventListener('toggle',()=>{const inner=d.querySelector('.inner');if(d.open&&!inner.dataset.done){const it=BYID[inner.dataset.id];const c=inner.dataset.c||null;inner.innerHTML=`<div class="qhead">${badges(it,{reveal:true})}</div><div class="qbox">${stemHTML(it)}<ul class="opts">${it.opts.map((o,k)=>{const l=L[k];let cl='';if(l===it.key)cl='correct';else if(l===c)cl='wrong';return `<li><div class="opt ${cl}" aria-disabled="true"><span class="L">${l.toUpperCase()}.</span><span>${esc(o)}</span></div></li>`}).join('')}</ul>${srcLine(it)}</div>${explHTML(it,c)}`;inner.dataset.done=1}}));
};

/* ----- HISTORY ----- */
views.riwayat=function(){
  const h=get(K.hist,[]); const cur=get(K.cur,null);
  app.innerHTML=`<h1>Riwayat try-out</h1><p class="lede">Tersimpan di browser ini (maksimal 50 attempt terakhir). Klik tanggal untuk membuka lagi ringkasan dan pembahasan.</p>
  ${cur&&!cur.done?`<div class="confirm" style="margin-top:16px"><b>Ada try-out yang sedang berjalan.</b> Sisa waktu <span class="mono">${fmtDur(remaining(cur))}</span>. <a href="#tryout">Lanjutkan</a></div>`:''}
  <div class="tablewrap" style="margin-top:16px">${h.length?`<table class="hist"><thead><tr><th>Tanggal</th><th class="r">Anestesi</th><th class="r">Radiologi</th><th class="r">Total</th><th class="r">Durasi</th></tr></thead><tbody>${h.map(x=>`<tr><td><a href="#hasil-${x.id}">${fmtDate(x.start)}</a>${x.auto?' <span class="chip warn">waktu habis</span>':''}</td><td class="mono">${x.score.anes}/50</td><td class="mono">${x.score.radio}/50</td><td class="mono"><b>${x.score.total}</b>/100</td><td class="mono">${fmtDur(x.end-x.start)}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">Belum ada try-out yang selesai. <a href="#tryout">Mulai try-out</a></div>`}</div>`;
};

/* lightbox */
const lb=document.getElementById('lb');
document.addEventListener('click',e=>{const t=e.target.closest('[data-zoom]');if(t){lb.querySelector('img').src=t.src;lb.hidden=false}});
lb.addEventListener('click',()=>{lb.hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')lb.hidden=true});
/* in-memory fallback when storage is blocked */
const _get=get; get=function(k,d){const v=_get(k,undefined);if(v===undefined&&k===K.cur&&window.__memAttempt)return window.__memAttempt;return v===undefined?d:v};
route();
})();
</script>
