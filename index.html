i rekap)"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": true, "img": null, "pool": "all", "key": "a", "topic": "AB", "st": "peng", "deb": null, "note": "Opsi e tidak tercatat. Opsi c di rekap tertulis \"PACO2\"; dibaca sebagai PaCO₂ (arteri).", "gl": null, "r": "Gagal napas tipe I (hipoksemik) didefinisikan sebagai PaO₂ <60 mmHg dengan PaCO₂ normal atau rendah. Penyebabnya gangguan pertukaran gas di paru (V/Q mismatch, shunt), misalnya pneumonia, edema paru, atau ARDS. PaCO₂ >50 mmHg adalah ciri tipe II (hiperkapnik).", "w": {"b": "\"PAO₂ >100\" adalah tekanan alveolar, bukan kriteria gagal napas.", "c": "PaCO₂ >50 adalah kriteria tipe II.", "d": "pH <7,15 bukan kriteria tipe I.", "e": "Opsi tidak tercatat."}, "hy": "SpO₂ 90% setara PaO₂ sekitar 60 mmHg, titik \"bahu\" kurva disosiasi oksihemoglobin.", "ev": [{"deck": "GD", "page": 40, "quote": "PaO2 mm Hg"}], "refs": ["roussos2003"]}, {"id": "A092", "sec": "anes", "stem": "Transfusi darah yang benar untuk pasien ini adalah", "vig": "Laki-laki 20 tahun, BB 70 kg, korban kecelakaan lalu lintas. Perfusi basah dan dingin, nadi 120x/menit, TD 90/50 mmHg. Pasien sadar.", "opts": ["Transfusi sampai Hb 12 g/dL", "Diberikan jika Hb 5 g/dL dengan hemodinamik stabil", "Diberikan jika Hb 8 g/dL dengan hemodinamik tidak stabil", "Diberikan jika sudah mendapat kristaloid 4.000 mL tetapi hemodinamik belum stabil", "Tidak diberikan bila hemodinamik tidak stabil tetapi Hb 8 g/dL"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "d", "topic": "FLUID", "st": "ppt", "deb": "ATLS 10th menganjurkan darah lebih awal (setelah sekitar 1 L kristaloid) pada perdarahan kelas III. Opsi c juga bisa dibela. Kunci d mengikuti alur 2–4× EBL di slide.", "note": null, "gl": "Ambang Hb 7 g/dL (slide dan AABB 2023) berlaku untuk pasien stabil. Pada perdarahan aktif, ATLS 10th menganjurkan darah lebih awal tanpa menunggu kristaloid dalam jumlah besar.", "r": "Alur perdarahan di slide Terapi Cairan dimulai dengan bolus kristaloid. Bila perfusi tetap buruk, RL ditambah sampai 2–4× EBL. Bila hemodinamik masih tidak stabil setelah itu (transient atau no response), artinya perdarahan berlanjut atau kehilangan besar, sehingga darah harus diberikan dan sumber perdarahan dicari. Pada pasien ini EBL sekitar 1.500 mL, sehingga 2–4× EBL setara 3.000–6.000 mL. Kristaloid 4.000 mL tanpa stabilisasi hemodinamik adalah indikasi transfusi menurut logika slide. Ambang Hb 7 g/dL dari slide dan AABB 2023 berlaku untuk pasien stabil yang tidak hipovolemik, bukan untuk syok hemoragik aktif.", "w": {"a": "Target Hb 12 adalah strategi liberal yang tidak diindikasikan.", "b": "Pada pasien stabil dengan Hb 5, transfusi memang diberikan (di bawah 7), tetapi pasien ini tidak stabil. Opsi ini tidak menjawab kasus.", "c": "Masuk akal secara klinis, tetapi kriteria Hb tidak dipakai sebagai pemicu tunggal pada perdarahan akut karena Hb awal bisa masih normal. Slide mengaitkan keputusan dengan respons terhadap kristaloid.", "e": "Hemodinamik tidak stabil justru alasan untuk transfusi."}, "hy": "Pada perdarahan akut, Hb awal tidak menggambarkan beratnya kehilangan darah karena belum terjadi hemodilusi. Respons hemodinamik lebih menentukan.", "ev": [{"deck": "FLUID", "page": 21, "quote": "tambah RL 1000 lagi sd 2-4x EBL"}, {"deck": "FLUID", "page": 23, "quote": "Pasien kritis masih dapat mentolerir hemoglobin sampai 7 g/dl selama tidak hipovolemik"}], "refs": ["carson2023", "tb_atls"]}, {"id": "A093", "sec": "anes", "stem": "Keunggulan ekokardiografi, kecuali:", "vig": null, "opts": ["Biaya tinggi (high cost)", "Tersedia di mana-mana", "Pemeriksaannya cepat", "(opsi tidak tercatat di rekap)", "(opsi tidak tercatat di rekap)"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": true, "img": null, "pool": "all", "key": "a", "topic": "ICU1", "st": "peng", "deb": null, "note": "Opsi d–e tidak tercatat.", "gl": null, "r": "Ekokardiografi, terutama focused cardiac ultrasound (FoCUS) di samping tempat tidur, unggul karena non-invasif, tanpa radiasi, portabel, cepat, dapat diulang, dan relatif murah dibanding modalitas lain. FoCUS membantu membedakan tipe syok seperti tamponade, disfungsi ventrikel, hipovolemia, dan dilatasi ventrikel kanan (Via dkk., 2014). Biaya tinggi bukan keunggulan, sehingga itulah jawaban \"kecuali\". Slide ICU memasukkan ekokardiografi dalam monitoring hemodinamik khusus, dan slide ICU lain menyebut \"bedside echocardiography helps tell the types [of shock] apart\".", "w": {"b": "Ketersediaan luas dan portabilitas adalah keunggulan.", "c": "Pemeriksaan cepat adalah keunggulan.", "d": "Opsi tidak tercatat.", "e": "Opsi tidak tercatat."}, "hy": "Kekurangan echo: sangat bergantung operator, jendela akustik terbatas (obesitas, PPOK, ventilasi), dan menilai kondisi sesaat.", "ev": [{"deck": "ICU1", "page": 9, "quote": "EchoCardiography. ( USG jantung)"}], "refs": ["via2014"]}, {"id": "A094", "sec": "anes", "stem": "Berikut ini adalah tujuan evaluasi praoperasi, kecuali?", "vig": null, "opts": ["Optimalisasi kondisi pasien", "Dokumentasi informasi yang relevan", "Asesmen kesehatan", "Penentuan risiko perioperatif", "Tidak ada yang benar"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "e", "topic": "PREP", "st": "ppt", "deb": "Bentuk soal \"kecuali … e. tidak ada yang benar\" ambigu; kunci e berarti semua a–d adalah tujuan.", "note": null, "gl": null, "r": "Slide Persiapan mendaftar tujuan evaluasi pra-anestesi: mendapatkan informasi relevan dan mendokumentasikannya, merumuskan penilaian risiko perioperatif, melakukan atau mengusulkan pemeriksaan yang sesuai, memverifikasi penyakit, mengurangi lama rawat, memberi dukungan psikologis, merumuskan rencana anestesi dan nyeri, serta mengoptimalkan kondisi klinis. Asesmen kesehatan pasien adalah inti dari evaluasi itu sendiri. Jadi semua opsi a–d termasuk tujuan, dan jawaban \"kecuali\" adalah e, artinya tidak ada opsi a–d yang salah.", "w": {"a": "Optimalisasi kondisi termasuk tujuan (slide hlm. 6 dan 8).", "b": "Dokumentasi termasuk tahapan dan tujuan (slide hlm. 8).", "c": "Asesmen kesehatan adalah inti evaluasi.", "d": "Penentuan risiko perioperatif termasuk tujuan."}, "hy": "Tahapan evaluasi (slide): anamnesis → pemeriksaan fisik → tes diagnostik → terapi praoperasi → dokumentasi → komunikasi dan persetujuan.", "ev": [{"deck": "PREP", "page": 3, "quote": "Mendapatkan informasi yang relevan"}, {"deck": "PREP", "page": 3, "quote": "Merumuskan penilaian risiko perioperative"}], "refs": []}, {"id": "A095", "sec": "anes", "stem": "Pernyataan yang benar tentang obat anestesi lokal adalah", "vig": null, "opts": ["Efeknya ireversibel, kanal Na⁺ tertutup terus", "Memblok kanal Na⁺ sehingga nyeri eksternal tidak dapat ditransmisikan", "Diinjeksikan ke pembuluh darah di sekitarnya", "Efek samping selalu muncul berapa pun dosisnya", "(opsi tidak tercatat di rekap)"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": true, "img": null, "pool": "all", "key": "b", "topic": "LA", "st": "ppt", "deb": null, "note": "Opsi e tidak tercatat.", "gl": null, "r": "Anestesi lokal bekerja dengan memblok kanal Na⁺ bergerbang voltase dari sisi dalam membran, sehingga influks Na⁺ yang dibutuhkan untuk potensial aksi tidak terjadi. Akibatnya impuls nyeri dari perifer tidak dihantarkan ke SSP. Efeknya reversibel: setelah obat terdisosiasi dan dieliminasi, konduksi pulih. Obat tidak disuntikkan ke pembuluh darah, karena injeksi intravaskular justru penyebab utama LAST. Efek samping bergantung dosis dan tidak selalu muncul.", "w": {"a": "Efeknya reversibel, bukan ireversibel.", "c": "Injeksi intravaskular dihindari; lakukan aspirasi sebelum injeksi.", "d": "Toksisitas bergantung dosis dan kadar plasma.", "e": "Opsi tidak tercatat."}, "hy": "Kanal Na⁺ punya tiga keadaan (slide Intro): resting (tertutup), active (terbuka), dan inactive (terblok, tempat anestesi lokal terikat).", "ev": [{"deck": "INTRO", "page": 9, "quote": "Local anesthetics reversibly inhibit nerve conduction at non-toxic concentrations by blocking sodium channels"}], "refs": []}, {"id": "A096", "sec": "anes", "stem": "Pernyataan yang benar tentang obat anestesi lokal adalah", "vig": null, "opts": ["Efeknya reversibel", "Memblok kanal Na⁺ sehingga nyeri tidak dapat ditransmisikan", "Membuat pasien tidak nyeri tanpa harus kehilangan kesadaran", "(opsi tidak tercatat di rekap)", "Benar semua"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": true, "img": null, "pool": "all", "key": "e", "topic": "LA", "st": "ppt", "deb": null, "note": "Opsi d tidak tercatat.", "gl": null, "r": "Ketiga pernyataan benar. Efek anestesi lokal reversibel; obat memblok kanal Na⁺ sehingga impuls nyeri tidak ditransmisikan; dan pasien bebas nyeri di area yang diblok tanpa kehilangan kesadaran, yang merupakan pembeda utama dari anestesi umum. Slide Intro menulis bahwa anestesi lokal secara reversibel menghambat konduksi saraf dengan memblok kanal Na⁺. Contoh klinisnya lidokain di dekat saraf untuk menjahit laserasi sementara pasien tetap sadar.", "w": {"a": "Benar, tetapi bukan satu-satunya.", "b": "Benar, tetapi bukan satu-satunya.", "c": "Benar, tetapi bukan satu-satunya.", "d": "Opsi tidak tercatat."}, "hy": "Urutan blokade serabut: autonom (B) → nyeri dan suhu (C, Aδ) → raba dan tekan (Aβ) → motorik (Aα).", "ev": [{"deck": "INTRO", "page": 9, "quote": "Local anesthetics reversibly inhibit nerve conduction at non-toxic concentrations by blocking sodium channels"}], "refs": []}, {"id": "A097", "sec": "anes", "stem": "Perhitungan kebutuhan cairan rumatan yang tepat adalah", "vig": null, "opts": ["Anak 12 kg: 1.100 mL/24 jam", "Dewasa 40 kg: 2.000 mL/24 jam", "(opsi lain tidak tercatat; menurut perekam soal, semuanya jelas salah)"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": true, "img": null, "pool": "all", "key": "a", "topic": "FLUID", "st": "ppt", "deb": "Hanya dua opsi yang tercatat, dan b juga bisa dianggap benar (batas atas 50 mL/kg).", "note": null, "gl": null, "r": "Anak 12 kg menurut Holliday-Segar (slide): 10 kg pertama × 100 mL = 1.000 mL, ditambah 2 kg × 50 mL = 100 mL, total 1.100 mL/24 jam, persis sesuai opsi a. Dewasa 40 kg dengan 40–50 mL/kg/hari membutuhkan 1.600–2.000 mL, sehingga 2.000 mL masih masuk batas atas rentang. Opsi a adalah hitungan yang tepat persis, sedangkan b hanya benar bila memakai 50 mL/kg.", "w": {"b": "Masih dalam rentang bila memakai 50 mL/kg, tetapi contoh slide memakai 40 mL/kg (40 kg × 40 = 1.600 mL).", "c": "Opsi lain tidak tercatat."}, "hy": "Holliday-Segar 4-2-1 per jam (4 mL/kg/jam untuk 10 kg pertama, 2 untuk 10 kg kedua, 1 untuk sisanya) setara 100-50-20 mL/kg/hari.", "ev": [{"deck": "FLUID", "page": 7, "quote": "10 kg pertama : 100 ml/kg 10 - 20 kg : 50 ml/kg"}, {"deck": "FLUID", "page": 7, "quote": "dewasa : 40 - 50 ml/kg/hari"}], "refs": []}, {"id": "A098", "sec": "anes", "stem": "Berikut ini yang benar tentang persiapan praoperasi emergensi adalah", "vig": null, "opts": ["Pasien dehidrasi", "Puasa cukup", "Persiapan praoperasi terbatas", "Jawaban a dan c benar", "Tidak ada darah"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "d", "topic": "PREP", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Pada operasi darurat, waktu persiapan terbatas, sehingga evaluasi dan optimalisasi praoperasi harus dilakukan singkat dan bersamaan dengan resusitasi. Pasien juga sering datang dalam kondisi dehidrasi atau hipovolemia akibat muntah, perdarahan, rongga ketiga, atau puasa yang tidak terkontrol. Slide Persiapan menyatakan operasi darurat mungkin harus dilakukan pada keadaan pasien yang kurang ideal. Pasien darurat justru sering tidak cukup puasa (lambung penuh), sehingga perlu rapid sequence induction.", "w": {"a": "Benar, tetapi bukan jawaban lengkap.", "b": "Pasien darurat umumnya tidak cukup puasa dan dianggap lambung penuh.", "c": "Benar, tetapi bukan jawaban lengkap.", "e": "\"Tidak ada darah\" tidak relevan; justru darah perlu disiapkan."}, "hy": "Kategori urgensi: elektif → expedited (hari) → urgent (jam) → emergensi/immediate (menit, resusitasi simultan).", "ev": [{"deck": "PREP", "page": 2, "quote": "Operasi darurat mungkin harus dilakukan dalam keadaan pasien yang kurang ideal"}], "refs": []}, {"id": "R047", "sec": "radio", "stem": "Seorang anak 10 tahun mengeluh nyeri di bawah lutut setelah bermain sepak bola di sekolah. Pasien dibawa ke UGD terdekat dan dilakukan foto. Dokter jaga UGD menemukan garis lusen (hitam) melintang di tibia proksimal dari satu sisi korteks ke korteks sisi lainnya, di antara epifisis dan metafisis, dan mencurigai fraktur. Setelah dikonsultasikan, dokter ortopedi menyatakan temuan itu normal. Garis lusen pada tibia proksimal anak ini adalah", "vig": null, "opts": ["Fraktur greenstick", "Epifisis tibia", "Celah sendi", "Garis lempeng pertumbuhan (growth plate)", "Fraktur inkomplet"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "d", "topic": "FRAKT", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Pada anak 10 tahun, garis lusen melintang di antara epifisis dan metafisis tibia proksimal yang memanjang dari korteks ke korteks adalah lempeng pertumbuhan (physis atau epiphyseal plate) yang normal. Lempeng ini berupa kartilago, sehingga radiolusen pada foto. Kesalahan klasik adalah mengira physis sebagai fraktur. Bila ragu, bandingkan dengan sisi kontralateral. Slide Fraktur membahas lempeng pertumbuhan dalam konteks fraktur Salter-Harris (fraktur yang melibatkan lempeng pertumbuhan).", "w": {"a": "Fraktur greenstick adalah fraktur inkomplet di diafisis tulang anak (satu korteks patah dan korteks lain melengkung), bukan garis lusen simetris di lokasi physis.", "b": "Epifisis adalah ujung tulang di atas lempeng, bukan garis lusen.", "c": "Celah sendi berada di antara tibia dan femur.", "e": "Fraktur inkomplet tidak berbentuk garis lusen simetris dari korteks ke korteks di lokasi anatomis physis."}, "hy": "Salter-Harris I–V (SALTR): Straight across, Above, Lower, Through, Rammed/crush.", "ev": [{"deck": "FRAKT", "page": 24, "quote": "Fraktur yang terjadi pada anak-anak yang melibatkan lempeng pertumbuhan"}], "refs": []}, {"id": "R048", "sec": "radio", "stem": "Seorang perempuan 25 tahun datang ke RS dengan keluhan lengan bawah membengkak sejak 1 bulan disertai nyeri. Pada pemeriksaan fisik tampak edema di regio antebrakii 1/3 proksimal, kemerahan, dan nyeri tekan. Hasil foto seperti di bawah ini. Lesi sklerotik yang ditunjuk tanda panah kuning adalah", "vig": null, "opts": ["Involukrum", "Kloaka", "Sinus tract", "Sekuester", "Fistulasi"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": "oc_p11_x35", "pool": "all", "key": "a", "topic": "OSTEO", "st": "ppt", "deb": null, "note": "Versi Oculus soal ini hanya berisi opsi tanpa stem; stem diambil dari versi Rekap 2024.", "gl": null, "r": "Pada osteomielitis, reaksi periosteal membentuk selubung tulang baru yang tebal dan sklerotik mengelilingi tulang mati (sekuester). Selubung ini disebut involukrum. Lesi sklerotik yang ditunjuk panah kuning, yang membungkus korteks, menggambarkan involukrum.", "w": {"b": "Kloaka adalah lubang atau defek di korteks, tampak lusen, bukan sklerotik.", "c": "Sinus tract adalah saluran pus ke kulit.", "d": "Sekuester adalah fragmen tulang mati yang dense dan terisolasi di dalam rongga, bukan selubung luar.", "e": "Fistulasi bukan istilah radiologis untuk lesi tulang ini."}, "hy": "Sekuester harus diidentifikasi radiolog karena harus diangkat dengan pembedahan (slide hlm. 26).", "ev": [{"deck": "OSTEO", "page": 27, "quote": "Involucrum A shell of bone that surrounds a sequestrum"}], "refs": []}, {"id": "R049", "sec": "radio", "stem": "Apeks jantung paling kiri pada foto toraks AP/PA dibentuk oleh", "vig": null, "opts": ["Atrium kiri", "Gabungan ventrikel kiri dan kanan", "Atrium kanan", "Ventrikel kiri", "Ventrikel kanan"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "d", "topic": "THORAX", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Pada foto toraks PA/AP, batas kiri jantung dari atas ke bawah dibentuk oleh arkus aorta (aortic knob), konus pulmonalis/arteri pulmonalis, aurikel atrium kiri (normalnya rata), dan ventrikel kiri. Apeks jantung (titik paling kiri-bawah) dibentuk oleh ventrikel kiri. Pembesaran ventrikel kiri menggeser apeks ke lateral bawah, sedangkan pembesaran ventrikel kanan mengangkat apeks (boot-shaped).", "w": {"a": "Atrium kiri berada di posterior; pembesarannya memberi double contour dan sudut karina melebar.", "b": "Apeks dibentuk ventrikel kiri saja.", "c": "Atrium kanan membentuk batas kanan.", "e": "Ventrikel kanan berada di anterior (terlihat pada lateral), bukan pembentuk apeks normal."}, "hy": "CTR <0,5 pada PA (slide). Foto AP memperbesar bayangan jantung, sehingga CTR tidak valid.", "ev": [{"deck": "THORAX", "page": 20, "quote": "Batas kiri jantung dibentuk oleh ventrikel kiri , conus pulmonalis, arcus aorta"}], "refs": []}, {"id": "R050", "sec": "radio", "stem": "Pada pasien dengan diagnosis klinis Ca kolon transversum, modalitas radiologi yang paling baik adalah", "vig": null, "opts": ["USG", "Foto polos abdomen", "Kedokteran nuklir", "CT scan abdomen dengan kontras", "Barium enema"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "d", "topic": "GI", "st": "peng", "deb": "Barium enema (e) dapat dianggap benar oleh sebagian penyusun soal karena apple core sign ada di slide.", "note": null, "gl": null, "r": "Logikanya sama dengan soal Ca rektosigmoid. Pada pasien yang diagnosis klinisnya sudah karsinoma kolon transversum, modalitas radiologi terbaik adalah CT abdomen dengan kontras. CT menilai tumor, invasi ke struktur sekitar, kelenjar getah bening, dan metastasis (hepar, peritoneum) sekaligus. Barium enema hanya menunjukkan lumen (apple core) dan tidak dapat melakukan staging.", "w": {"a": "USG terhalang gas kolon.", "b": "Foto polos tidak menilai tumor.", "c": "Kedokteran nuklir bukan pemeriksaan utama.", "e": "Barium enema memberi apple core, tetapi tidak dapat staging."}, "hy": "CT colonography (virtual colonoscopy) adalah alternatif bila kolonoskopi tidak lengkap.", "ev": [{"deck": "GI", "page": 26, "quote": "WITHOUT CONTRAST WITH CONTRAST"}, {"deck": "GI", "page": 47, "quote": "Carcinoma LARGE BOWEL -Apple core -Shoulder sign"}], "refs": []}, {"id": "A099", "sec": "anes", "stem": "Seorang pasien akan menjalani operasi elektif. Tujuan utama evaluasi preanestesi adalah...", "vig": null, "opts": ["Menentukan jenis operasi yang dilakukan", "Menilai dan mengoptimalkan kondisi pasien sebelum anestesi", "Menentukan lama rawat inap setelah operasi", "Memastikan semua pasien mendapat anestesi umum"], "src": ["Quiz Anestesi Blok IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "PREP", "st": "ppt", "deb": null, "note": "File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "Evaluasi preanestesi bertujuan menilai status kesehatan pasien (anamnesis, pemeriksaan fisik, pemeriksaan penunjang), menentukan risiko perioperatif, lalu mengoptimalkan kondisi pasien sebelum anestesi. Contohnya mengontrol tekanan darah dan gula darah, menghentikan rokok, atau mengoptimalkan asma. Slide Persiapan Perioperatif mencantumkan tahapan \"Optimalkan kondisi pasien\" dan menyebut tiga kemungkinan hasil evaluasi: operasi sesuai rencana, ditunda, atau dibatalkan. Artinya, evaluasi ini menentukan apakah dan bagaimana pasien dianestesi, bukan sekadar formalitas.", "w": {"a": "Jenis operasi ditentukan oleh operator (dokter bedah) berdasarkan indikasi bedah. Evaluasi preanestesi memakai informasi itu, tetapi tidak menentukannya.", "c": "Lama rawat inap adalah luaran pascaoperasi. Evaluasi preanestesi memang ikut merencanakan tingkat perawatan pascaoperasi, tetapi itu bukan tujuan utamanya.", "d": "Teknik anestesi dipilih sesuai kondisi pasien dan jenis operasi; bisa regional, lokal, atau umum. Tidak semua pasien harus anestesi umum."}, "hy": "Hasil evaluasi praoperasi menurut slide hanya tiga: operasi sesuai rencana, ditunda, atau dibatalkan.", "ev": [{"deck": "PREP", "page": 8, "quote": "Optimalkan kondisi pasien"}, {"deck": "PREP", "page": 4, "quote": "EVALUASI PRA OPERASI 1. Operasi sesuai rencana 2. Operasi ditunda waktunya 3. Membatalkan operasi"}], "refs": ["tb_morgan"]}, {"id": "A100", "sec": "anes", "stem": "Pada pemeriksaan jalan napas preoperatif, manakah yang termasuk komponen yang perlu dinilai?", "vig": null, "opts": ["Capillary refill time", "Thyromental distance", "Produksi urine", "Lingkar abdomen"], "src": ["Quiz Anestesi Blok IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "PREP", "st": "ppt", "deb": null, "note": "File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "Jarak tiromental (dari tonjolan kartilago tiroid ke ujung mentum, dengan kepala ekstensi) menilai ruang submandibula tempat lidah akan didorong saat laringoskopi. Jarak pendek (kurang dari sekitar 6 cm atau 3 jari) memprediksi laringoskopi sulit. Slide Persiapan Perioperatif mencantumkan \"Jarak thyromental\" dalam daftar komponen pemeriksaan jalan napas, bersama jarak interinsisivus, visibilitas uvula (Mallampati), panjang dan lingkar leher, serta rentang gerak kepala-leher. Soal ini adalah kebalikan dari soal A012 (\"yang BUKAN komponen\", jawabannya otoskopi).", "w": {"a": "Capillary refill time menilai perfusi perifer (sirkulasi), bukan jalan napas.", "c": "Produksi urine adalah parameter perfusi ginjal dan status volume.", "d": "Lingkar abdomen tidak masuk penilaian airway. Yang dinilai adalah lingkar leher, karena leher yang tebal memprediksi ventilasi dan intubasi sulit."}, "hy": "Komponen airway di slide: gigi, jarak interinsisivus, uvula (Mallampati), ruang mandibula, jarak tiromental, panjang dan lingkar leher, gerak kepala-leher.", "ev": [{"deck": "PREP", "page": 12, "quote": "KOMPONEN PEMERIKSAAN JALAN NAPAS"}, {"deck": "PREP", "page": 12, "quote": "Jarak thyromental"}], "refs": []}, {"id": "A101", "sec": "anes", "stem": "Pasien tidak sadar terdengar suara \"gurgling\". Penyebab gangguan jalan napas yang PALING mungkin adalah...", "vig": null, "opts": ["Lidah jatuh ke posterior", "Cairan atau sekret di jalan napas", "Bronkospasme", "Edema paru"], "src": ["Quiz Anestesi Blok IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "GD", "st": "ppt", "deb": null, "note": "File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "Suara napas tambahan membantu menebak lokasi dan jenis sumbatan. Gurgling (suara berkumur) berasal dari cairan di jalan napas atas, misalnya muntahan, darah, atau sekret. Slide Gawat Darurat merangkumnya: snoring berarti lidah, gurgling berarti cairan, dan stridor/crowing berarti penyempitan (laring/trakea). Tindakannya adalah suction.", "w": {"a": "Lidah yang jatuh ke posterior menimbulkan snoring (mendengkur), bukan gurgling.", "c": "Bronkospasme menimbulkan wheezing ekspiratoir dari saluran napas bawah, bukan suara di jalan napas atas.", "d": "Edema paru memberi ronki basah pada auskultasi paru dan sesak, bukan gurgling di jalan napas atas."}, "hy": "Snoring = lidah (head tilt-chin lift atau jaw thrust); gurgling = cairan (suction); stridor = penyempitan.", "ev": [{"deck": "GD", "page": 14, "quote": "Snoring → Lidah Gurgling → Cairan Stridor / crowing → Penyempitan"}], "refs": []}, {"id": "A102", "sec": "anes", "stem": "Seorang pasien mengalami diare berat. TD 80/50 mmHg, nadi 130x/menit, kulit dingin dan pucat. Jenis syok yang paling mungkin adalah...", "vig": null, "opts": ["Kardiogenik", "Obstruktif", "Hipovolemik", "Distributif"], "src": ["Quiz Anestesi Blok IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "SHOCK", "st": "ppt", "deb": null, "note": "File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "Diare berat menyebabkan kehilangan cairan ekstraseluler sehingga volume intravaskular dan preload turun, curah jantung turun, dan tekanan darah turun. Tubuh mengompensasi dengan takikardia dan vasokonstriksi, yang tampak sebagai kulit dingin dan pucat. Ini syok hipovolemik non-hemoragik. Slide Syok dan slide Gawat Darurat sama-sama memasukkan diare ke dalam penyebab syok hipovolemik.", "w": {"a": "Syok kardiogenik disebabkan kegagalan pompa (infark, aritmia, kelainan katup). Pasien ini tidak punya riwayat jantung, dan penyebab yang jelas adalah kehilangan cairan.", "b": "Syok obstruktif disebabkan sumbatan aliran (tamponade, emboli paru, tension pneumothorax).", "d": "Syok distributif (sepsis, anafilaksis, cedera spinal) ditandai vasodilatasi. Pada fase awal kulitnya sering hangat, bukan dingin."}, "hy": "Kulit dingin dan pucat menandakan vasokonstriksi kompensasi, yang khas untuk syok hipovolemik, kardiogenik, dan obstruktif. Kulit hangat lebih mengarah ke syok distributif fase awal.", "ev": [{"deck": "SHOCK", "page": 21, "quote": "Hemorrhage, diarrhea, polyuria, dehydration, 3rd space loss"}, {"deck": "GD", "page": 50, "quote": "Hypovolemic : - Haemorrhage - Diarrhoea - Burn"}], "refs": []}, {"id": "A103", "sec": "anes", "stem": "Mengapa tekanan darah normal BELUM tentu menyingkirkan syok pada fase awal?", "vig": null, "opts": ["Hipotensi dapat muncul terlambat", "Semua pasien syok selalu hipertensi", "Tekanan darah tidak berhubungan dengan sirkulasi", "Syok hanya dapat dinilai dari produksi urine"], "src": ["Quiz Anestesi Blok IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "SHOCK", "st": "ppt", "deb": null, "note": "File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "Syok didefinisikan sebagai hipoperfusi jaringan, bukan sebagai hipotensi. Pada fase awal, mekanisme kompensasi (takikardia, vasokonstriksi, peningkatan resistensi vaskular sistemik) mampu mempertahankan tekanan darah walaupun curah jantung dan perfusi organ sudah turun. Karena itu, tanda awalnya adalah takikardia, akral dingin, CRT memanjang, urine berkurang, gelisah, dan laktat naik. Hipotensi baru muncul ketika kompensasi gagal; pada perdarahan, misalnya, umumnya setelah kehilangan sekitar 30% volume darah (kelas III ATLS). Slide Syok menulis secara eksplisit \"Hypotension timbul terlambat\".", "w": {"b": "Syok tidak menyebabkan hipertensi. Tekanan darah bisa normal karena kompensasi, lalu turun ketika kompensasi gagal.", "c": "Tekanan darah berhubungan dengan sirkulasi (MAP = CO × SVR). Hanya saja tekanan darah bukan penanda dini, karena SVR bisa naik untuk menutupi CO yang turun.", "d": "Produksi urine adalah salah satu penanda perfusi, tetapi bukan satu-satunya. Penilaiannya menggabungkan nadi, CRT, akral, kesadaran, urine, dan laktat."}, "hy": "\"Hypotension timbul terlambat\" (slide Syok). Takikardia dan tanda hipoperfusi muncul lebih dulu.", "ev": [{"deck": "SHOCK", "page": 24, "quote": "Hypotension timbul terlambat"}, {"deck": "GD", "page": 49, "quote": "Remember : Compensatory mechanisms"}], "refs": ["tb_atls"]}, {"id": "A104", "sec": "anes", "stem": "Cardiac output ditentukan oleh...", "vig": null, "opts": ["Heart rate × stroke volume", "Stroke volume × SaO₂", "MAP × heart rate", "Hemoglobin × PaO₂"], "src": ["Quiz Anestesi Blok IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "SHOCK", "st": "ppt", "deb": null, "note": "File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "Curah jantung (CO) adalah volume darah yang dipompa per menit, yaitu laju jantung dikali isi sekuncup (CO = HR × SV). SV sendiri ditentukan oleh preload, afterload, dan kontraktilitas. Slide Syok menuliskan rumus ini dan menempatkannya di dalam rumus oxygen delivery: DO₂ = CO × kandungan oksigen arteri.", "w": {"b": "SaO₂ adalah bagian dari kandungan oksigen arteri. SV × SaO₂ bukan rumus fisiologis apa pun.", "c": "MAP berhubungan dengan CO lewat MAP − CVP = CO × SVR, bukan dikali heart rate.", "d": "Hemoglobin dan saturasi (bukan PaO₂ secara langsung) menentukan kandungan oksigen, bukan curah jantung."}, "hy": "CO = HR × SV; DO₂ = CO × CaO₂; MAP − CVP = CO × SVR.", "ev": [{"deck": "SHOCK", "page": 10, "quote": "Cardiac Out put = Heart Rate X Stroke Volume"}, {"deck": "SHOCK", "page": 13, "quote": "CO = HR x SV"}], "refs": []}, {"id": "A105", "sec": "anes", "stem": "Pasien pneumonia mengalami hipoksemia akibat sebagian alveoli tetap mendapat perfusi tetapi tidak terventilasi dengan baik. Mekanisme yang paling sesuai adalah...", "vig": null, "opts": ["Dead space", "Shunt", "Hiperventilasi", "Peningkatan difusi"], "src": ["Quiz Anestesi Blok IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "AB", "st": "luar", "deb": null, "note": "File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "Shunt adalah darah yang melewati alveoli yang mendapat perfusi tetapi tidak terventilasi (V/Q = 0). Darah itu kembali ke sirkulasi sistemik tanpa teroksigenasi sehingga PaO₂ turun. Pada pneumonia, alveoli terisi eksudat sehingga terjadi shunt intrapulmonal. Kebalikannya adalah dead space: alveoli terventilasi tetapi tidak mendapat perfusi (V/Q = ∞), seperti pada emboli paru. Ciri penting shunt adalah responsnya buruk terhadap oksigen tambahan, karena oksigen tidak bisa mencapai alveoli yang terisi cairan. Definisi shunt dan dead space tidak dibahas khusus di PPT, jadi pembahasan ini memakai referensi fisiologi. Lihat juga A003 untuk penerapannya pada pneumonia.", "w": {"a": "Dead space adalah kebalikannya: terventilasi tetapi tidak mendapat perfusi. Akibat utamanya ventilasi terbuang dan PaCO₂ cenderung naik.", "c": "Hiperventilasi menurunkan PaCO₂ dan justru sedikit menaikkan PaO₂, sehingga tidak menyebabkan hipoksemia.", "d": "Peningkatan difusi memperbaiki oksigenasi. Yang menyebabkan hipoksemia adalah gangguan difusi."}, "hy": "Shunt: perfusi ada, ventilasi tidak (V/Q = 0), refrakter terhadap O₂. Dead space: ventilasi ada, perfusi tidak (V/Q = ∞).", "ev": [], "refs": ["petersson2014"]}, {"id": "A106", "sec": "anes", "stem": "Pada pasien henti jantung ditemukan ventricular fibrillation. Tindakan yang membedakan VF dari asystole adalah...", "vig": null, "opts": ["VF merupakan ritme shockable", "VF tidak memerlukan CPR", "Asystole harus segera didefibrilasi", "VF hanya diterapi dengan adrenalin"], "src": ["Quiz Anestesi Blok IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "CPR", "st": "ppt", "deb": null, "note": "File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "Algoritme henti jantung bercabang pada pertanyaan \"ritme shockable?\". VF dan VT tanpa nadi adalah ritme shockable: aktivitas listrik yang kacau bisa dihentikan dengan defibrilasi sehingga nodus SA dapat mengambil alih. Asystole dan PEA tidak shockable, sehingga tata laksananya CPR, adrenalin sesegera mungkin, dan mencari penyebab reversibel. Kedua cabang tetap memerlukan CPR berkualitas. Slide CPR menulis bahwa VF/VT pulseless adalah \"shockable rhythm, harus segera DC-shock\", sedangkan asystole dan PEA \"UN-shockable\".", "w": {"b": "Semua henti jantung memerlukan CPR, termasuk VF. CPR dilakukan sambil menyiapkan defibrilator dan dilanjutkan segera setelah syok.", "c": "Asystole tidak didefibrilasi karena tidak ada aktivitas listrik yang bisa \"di-reset\".", "d": "Terapi utama VF adalah defibrilasi. Adrenalin diberikan setelah syok kedua; amiodaron atau lidokain untuk VF refrakter."}, "hy": "Shockable: VF dan pVT. Non-shockable: asystole dan PEA.", "ev": [{"deck": "CPR", "page": 31, "quote": "VF / VT pulseless = ada gelombang khas – shockable rhythm, harus segera DC-shock"}, {"deck": "CPR", "page": 31, "quote": "Asystole = ECG flat, tak ada gelombang (UN-shockable)"}], "refs": ["panchal2020"]}, {"id": "A107", "sec": "anes", "stem": "Prinsip penting dalam pemberian cairan intravena adalah bahwa cairan sebaiknya diperlakukan sebagai...", "vig": null, "opts": ["Suplemen rutin untuk semua pasien", "Obat yang memiliki indikasi dan efek samping", "Pengganti nutrisi sementara", "Terapi tanpa risiko"], "src": ["Quiz Anestesi Blok IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "FLUID", "st": "ppt", "deb": null, "note": "File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "Slide Terapi Cairan dibuka dengan prinsip \"Cairan infus adalah OBAT dan harus diberikan jika ada indikasi\". Indikasinya: mengoreksi hipovolemia, menjaga hidrasi, dan meningkatkan oksigenasi dengan meningkatkan curah jantung. Seperti obat, cairan punya jenis, dosis, kecepatan, dan efek samping, misalnya kelebihan volume yang menyebabkan edema paru, pergeseran cairan (edema otak, ginjal, usus), gangguan elektrolit dan asam-basa, serta gangguan koagulasi. Karena itu pemberiannya harus dievaluasi ulang secara berkala.", "w": {"a": "Cairan IV bukan suplemen rutin. Pemberian tanpa indikasi justru menimbulkan komplikasi kelebihan cairan.", "c": "Cairan kristaloid hampir tidak mengandung kalori. Nutrisi diberikan lewat enteral atau parenteral khusus.", "d": "Terapi cairan punya risiko nyata. Slide menekankan \"HINDARI efek samping\"."}, "hy": "\"From too much to just enough\": beri cairan sesuai indikasi, lalu evaluasi respons.", "ev": [{"deck": "FLUID", "page": 2, "quote": "Cairan infus adalah OBAT dan harus diberikan jika ada indikasi"}, {"deck": "FLUID", "page": 2, "quote": "HINDARI efek samping !!!"}], "refs": []}, {"id": "A108", "sec": "anes", "stem": "Pasien hipovolemia mendapat terapi cairan. Salah satu tujuan utama pemberian cairan adalah meningkatkan oxygen delivery dengan cara...", "vig": null, "opts": ["Menurunkan heart rate menjadi nol", "Meningkatkan cardiac output", "Menurunkan hemoglobin", "Menurunkan saturasi oksigen"], "src": ["Quiz Anestesi Blok IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "FLUID", "st": "ppt", "deb": null, "note": "File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "Oxygen delivery (DO₂) = curah jantung × kandungan oksigen arteri (CaO₂). Pada hipovolemia, preload turun sehingga isi sekuncup dan curah jantung turun, dan DO₂ ikut turun. Cairan mengembalikan preload; menurut kurva Frank-Starling isi sekuncup naik, sehingga CO dan DO₂ naik. Slide Terapi Cairan menyebut salah satu indikasi cairan adalah \"untuk meningkatkan oksigenasi dengan meningkatkan curah jantung\", dan slide Syok memuat rumus DO₂.", "w": {"a": "Heart rate nol berarti henti jantung, dan CO menjadi nol.", "c": "Hemoglobin adalah komponen utama kandungan oksigen. Menurunkannya (misalnya hemodilusi berlebihan) justru menurunkan DO₂.", "d": "Saturasi oksigen juga komponen CaO₂. Menurunkannya menurunkan DO₂."}, "hy": "DO₂ = CO × (1,34 × Hb × SaO₂ + 0,003 × PaO₂). Cairan menaikkan DO₂ lewat CO, bukan lewat Hb.", "ev": [{"deck": "FLUID", "page": 2, "quote": "untuk meningkatkan oksigenasi dengan meningkatkan curah jantung"}, {"deck": "SHOCK", "page": 10, "quote": "Oxygen Delivery (DO2) = Cardiac Out put X Oxygen Content"}], "refs": []}, {"id": "A109", "sec": "anes", "stem": "Pasien bernapas sangat lambat setelah mendapat obat sedatif. PaCO₂ kemudian meningkat. Mekanisme yang paling mungkin adalah...", "vig": null, "opts": ["Hiperventilasi alveolar", "Hipoventilasi alveolar", "Peningkatan difusi oksigen", "Penurunan dead space"], "src": ["Quiz Anestesi Blok IPK"], "n": 2, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "AB", "st": "ppt", "deb": null, "note": "Soal serupa muncul lagi sebagai no. 25 di quiz: \"Pasien bernapas 6 kali/menit setelah mendapat sedatif. BGA menunjukkan PaCO₂ meningkat.\" Jawabannya \"Eliminasi CO₂ menurun\" (opsi lain: ventilasi alveolar meningkat, produksi CO₂ berhenti, difusi oksigen meningkat). Logikanya sama: hipoventilasi berarti eliminasi CO₂ berkurang. File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "PaCO₂ berbanding terbalik dengan ventilasi alveolar: PaCO₂ ≈ produksi CO₂ ÷ ventilasi alveolar. Sedatif dan opioid menekan pusat napas sehingga laju dan volume napas turun, ventilasi semenit berkurang, dan CO₂ tidak terbuang. Akibatnya PaCO₂ naik (hiperkapnia, asidosis respiratorik). Slide Gawat Darurat mendefinisikan hipoventilasi sebagai minute volume berkurang dengan PaCO₂ naik, dan slide Asam-Basa mencantumkan \"Sedative or neuromuscular blocking agents\" sebagai penyebab gagal napas hiperkapnik.", "w": {"a": "Hiperventilasi menurunkan PaCO₂.", "c": "Peningkatan difusi oksigen tidak menaikkan PaCO₂; difusi juga bukan masalah pada depresi napas akibat obat.", "d": "Penurunan dead space membuat ventilasi lebih efisien dan cenderung menurunkan PaCO₂."}, "hy": "Hipoventilasi berarti minute volume turun dan PaCO₂ naik. Hiperventilasi berarti PaCO₂ turun (slide Gawat Darurat).", "ev": [{"deck": "GD", "page": 39, "quote": "Hipoventilation Minute volume berkurang"}, {"deck": "AB", "page": 40, "quote": "Sedative or neuromuscular blocking agents"}], "refs": ["roussos2003"]}, {"id": "A110", "sec": "anes", "stem": "Pasien sesak tampak menggunakan otot bantu napas dan kemudian menjadi semakin mengantuk. Perubahan kesadaran pada pasien ini harus dianggap sebagai...", "vig": null, "opts": ["Tanda perbaikan", "Tanda kelelahan dan perburukan respirasi", "Reaksi normal terhadap hipoksemia", "Indikasi menghentikan oksigen"], "src": ["Quiz Anestesi Blok IPK"], "n": 2, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "GD", "st": "ppt", "deb": null, "note": "Soal serupa muncul lagi sebagai no. 44 di quiz: \"Pasien sesak berat RR 36x/menit, menggunakan otot bantu napas, lalu menjadi mengantuk. Apa makna perubahan ini?\" Jawabannya \"Kemungkinan terjadi perburukan dan kelelahan respirasi\". File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "Pasien yang awalnya gelisah dan memakai otot bantu napas sedang berkompensasi. Bila ia lalu menjadi mengantuk, itu bukan tanda tenang. Itu tanda otot napas mulai lelah sehingga ventilasi turun, CO₂ menumpuk (narkosis CO₂), dan kesadaran turun. Pasien seperti ini berada di ambang henti napas dan perlu bantuan ventilasi segera (NIV, atau intubasi dan ventilasi mekanik). Slide Gawat Darurat membedakan perubahan status mental: agitasi atau gelisah mengarah ke hipoksemia, sedangkan obtundasi atau teler mengarah ke hiperkarbia. Slide Asam-Basa memasukkan kelelahan otot (muscle fatigue) sebagai penyebab gagal napas hiperkapnik.", "w": {"a": "Mengantuk di tengah distres napas bukan perbaikan. Perbaikan ditandai RR turun, otot bantu tidak lagi dipakai, dan SpO₂ naik, dengan pasien tetap sadar.", "c": "Hipoksemia lebih sering menimbulkan gelisah atau agitasi. Mengantuk mengarah ke hiperkarbia akibat kelelahan, yaitu tanda gagal, bukan reaksi normal.", "d": "Oksigen tidak dihentikan. Yang dibutuhkan justru dukungan ventilasi tambahan. Pada PPOK, target SpO₂ 88–92%, tetapi oksigen tetap diberikan."}, "hy": "Gelisah berarti hipoksemia; mengantuk atau teler berarti hiperkarbia (slide Gawat Darurat). Distres napas ditambah penurunan kesadaran berarti siapkan bantuan ventilasi.", "ev": [{"deck": "GD", "page": 12, "quote": "Agitasi / gelisah → Hipoksemia Obtundasi / teler → Hiperkarbia"}, {"deck": "AB", "page": 40, "quote": "Muscle Fatigue"}], "refs": []}, {"id": "A111", "sec": "anes", "stem": "Manakah kombinasi yang paling tepat menggambarkan tujuan utama anestesi umum?", "vig": null, "opts": ["Hipnosis, amnesia, dan imobilitas", "Hipertensi, takikardia, dan analgesia", "Sedasi, hiperventilasi, dan hipertensi", "Paralisis, hipotensi, dan bradikardia"], "src": ["Quiz Anestesi Blok IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "INTRO", "st": "ppt", "deb": null, "note": "File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "Slide Pengantar Anestesiologi menggambarkan tujuan anestesi umum sebagai \"Anesthesia Pentad\": hipnosis (tidak sadar), amnesia (tidak membentuk memori), analgesia (tidak berespons terhadap nyeri), imobilitas (hilangnya refleks motorik), dan paralisis (relaksasi otot skelet). Satu-satunya opsi yang seluruh komponennya termasuk tujuan anestesi adalah hipnosis, amnesia, dan imobilitas. Opsi lain mencampur tujuan dengan efek samping hemodinamik. Bandingkan dengan soal A044, yang memakai bentuk trias klasik: sedasi/hipnosis, analgesia, dan relaksasi.", "w": {"b": "Hipertensi dan takikardia adalah respons stres yang justru ingin ditekan, bukan tujuan anestesi.", "c": "Hiperventilasi dan hipertensi bukan tujuan anestesi.", "d": "Paralisis memang termasuk pentad, tetapi hipotensi dan bradikardia adalah efek samping yang harus dicegah."}, "hy": "Pentad anestesi: hipnosis, amnesia, analgesia, imobilitas, paralisis. Tidak ada satu obat yang aman memberi semuanya, sehingga dipakai balanced anesthesia.", "ev": [{"deck": "INTRO", "page": 7, "quote": "Hypnosis: Unconsciousness and loss of awareness"}, {"deck": "INTRO", "page": 7, "quote": "Amnesia: Loss of memory formation"}, {"deck": "INTRO", "page": 7, "quote": "Immobility: Loss of motor reflexes"}], "refs": []}, {"id": "A112", "sec": "anes", "stem": "Seorang pasien hipotensi memerlukan induksi anestesi. Obat yang memiliki efek stimulasi simpatis serta juga memberikan efek analgesik adalah...", "vig": null, "opts": ["Propofol", "Ketamine", "Thiopental", "Midazolam"], "src": ["Quiz Anestesi Blok IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "FARM", "st": "ppt", "deb": null, "note": "File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "Ketamin adalah antagonis reseptor NMDA yang menghasilkan anestesi disosiatif. Berbeda dari hampir semua agen induksi lain, ketamin merangsang sistem simpatis (melepas katekolamin) sehingga tekanan darah dan nadi naik. Karena itu ketamin menjadi pilihan induksi pada pasien hipotensi atau syok. Ketamin juga satu-satunya agen induksi intravena yang analgesik kuat. Slide Farmakologi menyebut anestesia menekan aktivitas simpatis \"kecuali ketamine dan ether\", serta mencatat ketamin memberi \"analgesia kuat untuk kulit, otot, tulang\" dengan efek samping tekanan darah dan nadi naik.", "w": {"a": "Propofol menurunkan tekanan darah (vasodilatasi dan depresi miokard) dan tidak analgesik, sehingga berisiko pada pasien hipotensi.", "c": "Tiopental menekan miokard dan menyebabkan venodilatasi sehingga hipotensi. Tiopental juga tidak analgesik (bahkan antianalgesik pada dosis kecil).", "d": "Midazolam adalah benzodiazepin: sedatif-amnestik tanpa efek analgesik, dan bisa menurunkan tekanan darah bila digabung opioid."}, "hy": "Ketamin: simpatomimetik (TD dan nadi naik), analgesik kuat, bronkodilator, refleks jalan napas relatif terjaga. Hindari pada hipertensi dan peningkatan TIK (slide).", "ev": [{"deck": "FARM", "page": 43, "quote": "Menekan aktifitas simpatis (kecuali ketamine dan ether)"}, {"deck": "FARM", "page": 51, "quote": "Analgesia kuat untuk kulit, otot, tulang"}, {"deck": "FARM", "page": 51, "quote": "tekanan darah naik (kontra indikasi hipertensi) • nadi naik"}], "refs": []}, {"id": "A113", "sec": "anes", "stem": "Saat resusitasi ditemukan ritme pulseless electrical activity (PEA). Manakah tindakan yang TIDAK diindikasikan sebagai terapi utama ritmenya?", "vig": null, "opts": ["CPR berkualitas tinggi", "Mencari penyebab reversibel", "Defibrilasi segera", "Tata laksana ALS sesuai algoritme"], "src": ["Quiz Anestesi Blok IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "CPR", "st": "ppt", "deb": null, "note": "File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "PEA adalah keadaan dengan aktivitas listrik terorganisasi di monitor tetapi tanpa nadi teraba. Masalahnya ada pada pompa atau pengisian jantung, bukan kekacauan listrik, sehingga defibrilasi tidak berguna. PEA termasuk ritme non-shockable. Tata laksananya adalah CPR berkualitas, adrenalin 1 mg sesegera mungkin dan diulang tiap 3–5 menit, airway lanjut, dan yang paling menentukan, mencari serta mengoreksi penyebab reversibel (4H 4T). Slide CPR menulis \"PEA / EMD = ada gelombang mirip ECG normal (UN-shockable)\".", "w": {"a": "CPR berkualitas tinggi adalah dasar semua algoritme henti jantung, termasuk PEA.", "b": "Mencari penyebab reversibel adalah kunci keberhasilan pada PEA, karena PEA sering disebabkan hipovolemia, hipoksia, tension pneumothorax, tamponade, dan sebagainya.", "d": "Tata laksana ALS (CPR, adrenalin, airway lanjut, 4H 4T) memang diindikasikan."}, "hy": "PEA dan asystole: CPR + adrenalin secepatnya + cari 4H 4T. Tidak ada defibrilasi.", "ev": [{"deck": "CPR", "page": 31, "quote": "PEA / EMD = ada gelombang mirip ECG normal (UN-shockable)"}, {"deck": "CPR", "page": 40, "quote": "4H 4T"}], "refs": ["panchal2020"]}, {"id": "A114", "sec": "anes", "stem": "Pasien trauma datang tidak sadar. Terdengar suara \"snoring\" saat bernapas. Penyebab paling mungkin adalah...", "vig": null, "opts": ["Darah dalam jalan napas", "Lidah jatuh ke posterior", "Bronkospasme", "Edema paru"], "src": ["Quiz Anestesi Blok IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "GD", "st": "ppt", "deb": null, "note": "File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "Pada pasien tidak sadar, tonus otot genioglosus hilang sehingga pangkal lidah jatuh ke dinding faring posterior dan menyumbat sebagian jalan napas. Udara yang melewati celah sempit itu menimbulkan snoring (dengkuran). Slide Gawat Darurat merangkum \"Snoring → Lidah\". Penanganannya adalah manuver manual. Karena ini pasien trauma, yang dipakai adalah jaw thrust dengan imobilisasi servikal in-line, bukan head tilt (lihat A065), lalu bisa dibantu orofaringeal atau nasofaringeal airway.", "w": {"a": "Darah atau cairan di jalan napas menimbulkan gurgling, bukan snoring.", "c": "Bronkospasme menimbulkan wheezing dari saluran napas bawah.", "d": "Edema paru menimbulkan ronki basah di paru, bukan suara obstruksi jalan napas atas."}, "hy": "Pada trauma, lidah yang jatuh ditangani dengan jaw thrust dan in-line immobilization atau collar (slide Gawat Darurat).", "ev": [{"deck": "GD", "page": 14, "quote": "Snoring → Lidah"}, {"deck": "GD", "page": 15, "quote": "PEMBEBASAN JALAN NAFAS PENYEBAB LIDAH"}], "refs": []}, {"id": "A115", "sec": "anes", "stem": "Pasien muntah banyak dan terdengar suara \"gurgling\". Tindakan yang paling tepat adalah...", "vig": null, "opts": ["Segera memberi obat bronkodilator", "Melakukan suction jalan napas", "Memberikan diuretik", "Memasang infus saja"], "src": ["Quiz Anestesi Blok IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "GD", "st": "ppt", "deb": null, "note": "File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "Gurgling berarti ada cairan (di sini muntahan) di jalan napas atas. Bila dibiarkan, cairan ini menyumbat dan dapat teraspirasi ke paru. Tindakan pertama adalah membersihkan jalan napas dengan suction, idealnya rigid (Yankauer), sambil memposisikan pasien miring bila tidak ada kecurigaan cedera servikal. Slide Gawat Darurat menyebut suction ditujukan untuk benda cair, antara lain muntahan, lendir, dan darah.", "w": {"a": "Bronkodilator untuk bronkospasme (wheezing), bukan untuk cairan di jalan napas atas.", "c": "Diuretik dipakai pada edema paru atau kelebihan cairan dan tidak membersihkan jalan napas.", "d": "Akses IV penting untuk sirkulasi (C), tetapi airway (A) didahulukan. Infus tidak menyelesaikan sumbatan."}, "hy": "Cairan di jalan napas: suction. Benda padat: finger sweep (bila terlihat) atau manuver sumbatan benda asing.", "ev": [{"deck": "GD", "page": 14, "quote": "Gurgling → Cairan"}, {"deck": "GD", "page": 23, "quote": "Suctioning, menghisap dengan alat penghisap ditujukan untuk benda – benda cair, antara lain muntahan, lendir, darah"}], "refs": []}, {"id": "A116", "sec": "anes", "stem": "Pada pasien perdarahan, hal penting yang harus dilakukan selain resusitasi cairan adalah...", "vig": null, "opts": ["Membiarkan perdarahan sampai tekanan darah normal", "Menghentikan sumber perdarahan", "Memberikan diuretik", "Membatasi seluruh akses intravena"], "src": ["Quiz Anestesi Blok IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "FLUID", "st": "ppt", "deb": null, "note": "File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "Cairan hanya mengganti volume yang hilang. Bila sumber perdarahan tidak dihentikan, darah terus keluar, cairan yang masuk ikut terbuang, dan terjadi hemodilusi, koagulopati, dan hipotermia. Karena itu tata laksana syok hemoragik selalu memasangkan resusitasi dengan kontrol perdarahan: bebat tekan, torniket, bidai pelvis, atau tindakan bedah dan intervensi. Slide Terapi Cairan menulis \"Prioritas hentikan perdarahan\", dan slide Syok menempatkan \"Hentikan sumber pendarahan\" di awal alur tata laksana pasien berdarah.", "w": {"a": "Membiarkan perdarahan berarti volume terus hilang. Tekanan darah tidak akan stabil tanpa kontrol sumber.", "c": "Diuretik memperberat hipovolemia dan dikontraindikasikan pada syok perdarahan.", "d": "Akses IV justru dibutuhkan (dua jalur, jarum besar) untuk resusitasi dan transfusi."}, "hy": "Syok hemoragik: airway dan breathing, oksigen, posisi syok, IV jarum besar, cairan, dan hentikan perdarahan (slide Terapi Cairan).", "ev": [{"deck": "FLUID", "page": 19, "quote": "Prioritas hentikan perdarahan"}, {"deck": "SHOCK", "page": 31, "quote": "Hentikan Sumber pendarahan"}], "refs": ["tb_atls"]}, {"id": "A117", "sec": "anes", "stem": "Faktor berikut yang dapat memengaruhi absorpsi anestesi lokal adalah...", "vig": null, "opts": ["Tempat suntikan", "Warna obat", "Golongan darah pasien", "Dominansi tangan pasien"], "src": ["Quiz Anestesi Blok IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "LA", "st": "ppt", "deb": null, "note": "File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "Absorpsi sistemik anestesi lokal, dan karena itu kadar puncak dalam darah serta risiko toksisitas, dipengaruhi empat hal menurut slide Toksisitas Anestesi Lokal: tempat suntikan, dosis, penambahan vasokonstriktor, dan sifat obat. Tempat suntikan paling berpengaruh karena vaskularisasinya berbeda-beda. Urutan absorpsi dari yang tertinggi kira-kira: intravena, interkostal, kaudal, epidural, pleksus brakialis, femoral-skiatik, lalu subkutan. Penambahan adrenalin menyebabkan vasokonstriksi sehingga absorpsi melambat, kadar puncak turun, dan durasi kerja memanjang.", "w": {"b": "Warna obat tidak berhubungan dengan farmakokinetik.", "c": "Golongan darah tidak memengaruhi absorpsi obat.", "d": "Dominansi tangan tidak memengaruhi absorpsi."}, "hy": "Faktor absorpsi anestesi lokal: tempat suntik, dosis, vasokonstriktor, sifat obat. Absorpsi tertinggi pada blok interkostal.", "ev": [{"deck": "LA", "page": 18, "quote": "YANG MEMPENGARUHI ABSORBSI"}, {"deck": "LA", "page": 18, "quote": "TEMPAT SUNTIK DOSIS PENAMBAHAN VASOKONSTRIKTOR SIFAT OBAT"}], "refs": ["neal2018"]}, {"id": "A118", "sec": "anes", "stem": "Pasien henti jantung memiliki ritme ventricular fibrillation. Setelah dilakukan defibrilasi, tindakan berikutnya adalah...", "vig": null, "opts": ["Menunggu irama kembali normal tanpa tindakan", "Segera melanjutkan CPR", "Memberikan cairan oral", "Memeriksa tekanan darah selama 2 menit"], "src": ["Quiz Anestesi Blok IPK"], "n": 2, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "CPR", "st": "ppt", "deb": null, "note": "Soal serupa muncul lagi sebagai no. 47 di quiz (\"Pasien henti jantung memiliki ritme VF. Setelah defibrilasi, tindakan selanjutnya adalah...\"), dengan opsi: segera melanjutkan CPR, menunggu monitor berubah, memeriksa tekanan darah selama 2 menit, memberikan minum. Jawabannya sama: segera melanjutkan CPR. File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "Sesaat setelah defibrilasi yang berhasil sekalipun, jantung biasanya belum memompa efektif (stunning). Irama yang muncul sering berupa PEA atau asystole sementara. Karena itu CPR dilanjutkan segera setelah syok selama 2 menit tanpa mengecek irama atau nadi, baru kemudian irama dievaluasi. Jeda kompresi yang panjang menurunkan tekanan perfusi koroner dan peluang ROSC. Slide CPR: \"Setelah a single shock, segera CPR lagi 2 menit tanpa check ECG sudah ROSC atau belum\". Lihat juga A042.", "w": {"a": "Menunggu tanpa tindakan berarti tidak ada perfusi koroner dan serebral.", "c": "Pasien henti jantung tidak sadar. Cairan oral berbahaya (aspirasi) dan tidak relevan.", "d": "Mengecek tekanan darah atau nadi langsung setelah syok membuang waktu kompresi. Pengecekan dilakukan setelah 2 menit CPR."}, "hy": "Syok, lalu langsung CPR 2 menit, baru cek irama. Jangan mengecek nadi segera setelah syok.", "ev": [{"deck": "CPR", "page": 39, "quote": "Setelah a single shock, segera CPR lagi 2 menit tanpa check ECG sudah ROSC atau belum"}], "refs": ["panchal2020"]}, {"id": "A119", "sec": "anes", "stem": "Mengapa cairan intravena tidak boleh diberikan sebanyak-banyaknya pada semua pasien?", "vig": null, "opts": ["Cairan tidak memiliki efek fisiologis", "Kelebihan cairan dapat menimbulkan komplikasi seperti edema paru", "Cairan hanya boleh diberikan pada pasien anak", "Semua cairan menyebabkan anemia"], "src": ["Quiz Anestesi Blok IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "FLUID", "st": "ppt", "deb": null, "note": "File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "Setelah preload optimal (bagian datar kurva Frank-Starling), tambahan cairan tidak lagi menaikkan curah jantung dan hanya menaikkan tekanan hidrostatik. Cairan lalu bocor ke interstisial: edema paru (oksigenasi memburuk), edema otak, edema dinding usus, dan kongesti ginjal. Kelebihan kristaloid juga dapat menyebabkan asidosis hiperkloremik dan dilusi faktor koagulasi. Slide Terapi Cairan mendaftar komplikasi terapi cairan yang tidak rasional: kelebihan volume yang menyebabkan edema paru, pergeseran cairan yang merugikan, gangguan elektrolit dan asam-basa, serta gangguan koagulasi.", "w": {"a": "Cairan jelas punya efek fisiologis, baik yang diinginkan (memperbaiki preload) maupun yang merugikan (overload).", "c": "Cairan diberikan pada semua usia sesuai indikasi.", "d": "Kristaloid berlebihan memang menyebabkan hemodilusi, tetapi itu bukan alasan utama, dan tidak semua cairan (misalnya darah) menyebabkan anemia."}, "hy": "Komplikasi cairan berlebih: edema paru, edema organ, gangguan elektrolit dan asam-basa, koagulopati.", "ev": [{"deck": "FLUID", "page": 2, "quote": "kelebihan volume ==> edema paru"}, {"deck": "FLUID", "page": 2, "quote": "pergeseran cairan merugikan (edema otak, ginjal,usus)"}], "refs": []}, {"id": "A120", "sec": "anes", "stem": "Manakah pasien yang paling membutuhkan penanganan segera?", "vig": null, "opts": ["Pasien sadar, nyeri luka operasi skala 4/10", "Pasien sesak, RR 34x/menit, menggunakan otot bantu napas", "Pasien mual setelah operasi", "Pasien mengeluh haus"], "src": ["Quiz Anestesi Blok IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "GD", "st": "ppt", "deb": null, "note": "File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "Prioritas penanganan mengikuti urutan ancaman nyawa ABCDE. Pasien dengan RR 34x/menit dan memakai otot bantu napas mengalami distres napas (masalah B) yang dapat berlanjut ke kelelahan dan gagal napas dalam hitungan menit. Pasien ini perlu dinilai dan ditangani paling dulu: posisi, oksigen, cari penyebab, dan siapkan bantuan ventilasi. Nyeri ringan-sedang, mual, dan haus tetap perlu ditangani, tetapi tidak mengancam nyawa saat itu.", "w": {"a": "Nyeri 4/10 pada pasien sadar adalah nyeri ringan-sedang yang perlu analgesia, tetapi tidak mengancam nyawa.", "c": "Mual pascaoperasi (PONV) perlu antiemetik dan bukan kondisi gawat, kecuali disertai penurunan kesadaran dan risiko aspirasi.", "d": "Haus adalah keluhan ringan. Nilai status cairan, tetapi bukan prioritas pertama."}, "hy": "Urutan prioritas A, B, C, D, E. Takipnea dengan otot bantu napas adalah tanda bahaya B.", "ev": [{"deck": "GD", "page": 10, "quote": "A : Airway Support B : Breathing Support C : Circulation Support D : Disability / Brain Support"}, {"deck": "ICU2", "page": 24, "quote": "Assess: RR, SpO₂, work of breathing, chest sounds"}], "refs": []}, {"id": "A121", "sec": "anes", "stem": "Saat melakukan kompresi dada pada pasien dewasa, frekuensi yang dianjurkan adalah...", "vig": null, "opts": ["40–60 kali/menit", "60–80 kali/menit", "100–120 kali/menit", "140–160 kali/menit"], "src": ["Quiz Anestesi Blok IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "CPR", "st": "ppt", "deb": null, "note": "File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "Kompresi dada dewasa dilakukan dengan kecepatan 100–120x/menit, kedalaman 5–6 cm, recoil penuh, dan interupsi minimal. Kecepatan di bawah 100 menghasilkan aliran darah tidak adekuat. Kecepatan di atas 120 membuat kedalaman cenderung berkurang dan waktu pengisian jantung (recoil) terlalu pendek. Slide CPR dan slide Intro sama-sama menulis 100–120x/menit.", "w": {"a": "40–60x/menit terlalu lambat untuk menghasilkan curah jantung yang memadai.", "b": "60–80x/menit masih di bawah batas minimal 100x/menit.", "d": "140–160x/menit terlalu cepat: kedalaman dan recoil tidak tercapai sehingga pengisian jantung berkurang."}, "hy": "CPR berkualitas: 100–120x/menit, kedalaman 5–6 cm, recoil penuh, rasio 30:2, interupsi kurang dari 10 detik, ganti kompresor tiap 2 menit.", "ev": [{"deck": "CPR", "page": 12, "quote": "Kecepatan pijatan 100-120 x/ menit"}, {"deck": "INTRO", "page": 19, "quote": "100-120 compressions/minute"}], "refs": ["panchal2020"]}, {"id": "A122", "sec": "anes", "stem": "Pasien BB 60 kg mengalami syok hipovolemik. Bila digunakan kristaloid 20 mL/kg sebagai initial fluid loading sesuai materi, berapa volume yang diberikan?", "vig": null, "opts": ["600 mL", "900 mL", "1.200 mL", "2.000 mL"], "src": ["Quiz Anestesi Blok IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "FLUID", "st": "ppt", "deb": null, "note": "File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "Volume loading = 20 mL/kg × 60 kg = 1.200 mL kristaloid, diberikan cepat (sekitar 30 menit), lalu respons hemodinamik dievaluasi (good, transient, atau no response). Slide Terapi Cairan memakai dosis awal \"Infus Kristaloid 20 mL/kgBB\" pada alur pasien berdarah. Contoh kasus di slide juga menghitung 50 kg × 20 mL/kg = 1.000 mL.", "w": {"a": "600 mL adalah 10 mL/kg untuk 60 kg, atau 20 mL/kg untuk pasien 30 kg (angka ini muncul di contoh kasus lain di slide).", "b": "900 mL adalah 15 mL/kg untuk 60 kg.", "d": "2.000 mL sekitar 33 mL/kg, melebihi dosis loading awal yang ditanyakan."}, "hy": "Loading kristaloid 20 mL/kgBB (dewasa 60 kg = 1.200 mL), lalu evaluasi respons.", "ev": [{"deck": "FLUID", "page": 21, "quote": "Infus Kristaloid 20 mL / kgBB"}, {"deck": "FLUID", "page": 32, "quote": "Loading cairan kristaloid 1000 ml (20 ml/kg) dalam 30 menit"}], "refs": []}, {"id": "A123", "sec": "anes", "stem": "Seorang pasien setelah resusitasi cairan memiliki nadi yang makin cepat, tekanan darah tetap rendah, dan perfusi tetap buruk. Respons ini paling sesuai dengan...", "vig": null, "opts": ["Good response", "No response", "Normal response", "Complete response"], "src": ["Quiz Anestesi Blok IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "FLUID", "st": "ppt", "deb": null, "note": "File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "Respons terhadap loading cairan dibagi tiga di slide Terapi Cairan. Good response: sirkulasi membaik lalu stabil. Transient response: membaik lalu merosot lagi. No response: sirkulasi tidak membaik. Pasien ini tidak membaik sama sekali (nadi makin cepat, tekanan dan perfusi tetap buruk), jadi termasuk no response. Pada perdarahan, ini menandakan perdarahan masif yang berlangsung dan perlu transfusi serta kontrol sumber segera (bedah). Bila tidak ada perdarahan, pikirkan penyebab syok non-hipovolemik: kardiogenik, obstruktif seperti tension pneumothorax atau tamponade, atau distributif.", "w": {"a": "Good response berarti sirkulasi membaik dan stabil.", "c": "\"Normal response\" bukan istilah dalam klasifikasi respons cairan.", "d": "\"Complete response\" juga bukan istilah dalam klasifikasi ini."}, "hy": "Good: stabil. Transient: naik lalu turun. No response: tidak membaik. Transient dan no response berarti cari sumber perdarahan.", "ev": [{"deck": "FLUID", "page": 21, "quote": "Sirkulasi tidak membaik no response, masih tetap hipovolemia"}, {"deck": "FLUID", "page": 21, "quote": "Bila transient respon / no respon ==> Waspada cari sumber perdarahan yang masih berlangsung"}], "refs": ["tb_atls"]}, {"id": "A124", "sec": "anes", "stem": "Manakah temuan berikut yang paling mengarah pada hiperkapnia akibat hipoventilasi?", "vig": null, "opts": ["PaCO₂ meningkat", "PaCO₂ menurun", "Saturasi selalu 100%", "Hemoglobin meningkat"], "src": ["Quiz Anestesi Blok IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "AB", "st": "ppt", "deb": null, "note": "File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "Hiperkapnia berarti PaCO₂ di atas normal (lebih dari 45 mmHg). PaCO₂ adalah parameter ventilasi: hipoventilasi alveolar membuat CO₂ tertahan sehingga PaCO₂ naik dan terjadi asidosis respiratorik. Slide Gawat Darurat menyebut PaCO₂ sebagai parameter ventilasi dengan nilai normal 35–45 mmHg (hipoventilasi menaikkan PaCO₂), dan slide Asam-Basa menulis PaCO₂ > 40 sebagai komponen asidosis respiratorik.", "w": {"b": "PaCO₂ menurun berarti hipokapnia akibat hiperventilasi.", "c": "Saturasi justru bisa turun pada hipoventilasi, terutama saat bernapas udara ruangan. Dengan oksigen tambahan saturasi bisa tampak normal walaupun PaCO₂ tinggi, sehingga SpO₂ tidak menilai ventilasi.", "d": "Hemoglobin tidak berubah akut karena hipoventilasi. Polisitemia sekunder hanya terjadi pada hipoksemia kronik."}, "hy": "Nilai ventilasi dari PaCO₂ (atau EtCO₂), bukan dari SpO₂.", "ev": [{"deck": "GD", "page": 39, "quote": "Parameter ventilasi PaCO2 → N= 35 – 45 mmHg"}, {"deck": "AB", "page": 20, "quote": "PaCO2 > 40 : respiratory acidosis"}], "refs": []}, {"id": "A125", "sec": "anes", "stem": "Pasien henti jantung memiliki irama asystole. Manakah yang benar?", "vig": null, "opts": ["Harus segera didefibrilasi", "Termasuk shockable rhythm", "Termasuk non-shockable rhythm", "Tidak memerlukan CPR"], "src": ["Quiz Anestesi Blok IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "CPR", "st": "ppt", "deb": null, "note": "File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "Asystole adalah tidak adanya aktivitas listrik jantung (garis datar). Tidak ada aktivitas listrik yang bisa di-reset oleh defibrilasi, sehingga asystole termasuk ritme non-shockable. Tata laksananya: CPR berkualitas, adrenalin 1 mg IV/IO sesegera mungkin dan diulang tiap 3–5 menit, cari penyebab reversibel (4H 4T), dan konfirmasi bahwa garis datar bukan akibat lead lepas atau gain terlalu kecil. Slide CPR menulis \"Asystole = ECG flat, tak ada gelombang (UN-shockable)\".", "w": {"a": "Defibrilasi tidak berguna pada asystole dan hanya menunda CPR.", "b": "Ritme shockable hanya VF dan VT tanpa nadi.", "d": "Semua henti jantung, termasuk asystole, memerlukan CPR."}, "hy": "Asystole: CPR + adrenalin secepatnya + 4H 4T. Pastikan lead terpasang dan gain cukup.", "ev": [{"deck": "CPR", "page": 31, "quote": "Asystole = ECG flat, tak ada gelombang (UN-shockable)"}], "refs": ["panchal2020"]}, {"id": "A126", "sec": "anes", "stem": "Pasien perdarahan aktif datang dengan akral dingin, nadi cepat, dan tekanan darah menurun. Prioritas tata laksana sirkulasi adalah...", "vig": null, "opts": ["Menunggu hasil laboratorium lengkap", "Memasang akses IV besar, memberikan cairan, dan mengontrol perdarahan", "Memberikan diuretik", "Membatasi semua cairan"], "src": ["Quiz Anestesi Blok IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "FLUID", "st": "ppt", "deb": null, "note": "File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "Akral dingin, takikardia, dan tekanan darah turun pada perdarahan aktif menandakan syok hemoragik yang sudah dekompensasi. Tata laksana sirkulasi dikerjakan bersamaan: pasang dua jalur IV jarum besar (14–16 G), ambil sampel darah untuk crossmatch, beri kristaloid hangat 20 mL/kgBB lalu darah sesuai respons, dan hentikan sumber perdarahan. Slide Terapi Cairan merangkum tata laksana syok perdarahan: airway dan breathing, oksigen, posisi syok, IV nomor besar, terapi cairan, dan hentikan perdarahan.", "w": {"a": "Hasil laboratorium tidak boleh menunda resusitasi. Sampel diambil saat memasang IV, tetapi tindakan berjalan terus.", "c": "Diuretik memperberat hipovolemia.", "d": "Membatasi semua cairan pada syok hemoragik dekompensasi berbahaya. Konsep permissive hypotension hanya membatasi target tekanan, bukan meniadakan resusitasi."}, "hy": "Syok hemoragik: dua jalur IV besar, ambil darah, cairan atau darah, dan kontrol perdarahan, dikerjakan bersamaan.", "ev": [{"deck": "FLUID", "page": 19, "quote": "Pasang iv line nomer besar • Terapi cairan • Hentikan perdarahan"}, {"deck": "SHOCK", "page": 31, "quote": "pasang infus jarum besar"}], "refs": ["tb_atls"]}, {"id": "A127", "sec": "anes", "stem": "Setelah induksi anestesi, pasien tidak bernapas spontan. SpO₂ mulai turun. Masalah yang harus ditangani terlebih dahulu adalah...", "vig": null, "opts": ["Hipertensi", "Ventilasi dan oksigenasi", "Nyeri pascaoperasi", "Produksi urine"], "src": ["Quiz Anestesi Blok IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "FARM", "st": "ppt", "deb": null, "note": "File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "Hampir semua agen induksi menekan napas, dan apnea pascainduksi adalah hal yang diharapkan. Ventilasi harus segera diambil alih: buka jalan napas, ventilasi dengan sungkup dan bag (oksigen 100%), lalu pasang airway definitif sesuai rencana. Desaturasi berarti cadangan oksigen sudah menipis, sehingga ventilasi dan oksigenasi adalah prioritas pertama (A dan B). Slide Farmakologi menyebut anestesia menekan fungsi vital napas: sumbatan jalan napas, hipoventilasi, sampai henti napas.", "w": {"a": "Hipertensi bukan masalah yang mengancam saat itu. Setelah induksi, tekanan darah lebih sering justru turun.", "c": "Nyeri pascaoperasi tidak relevan di fase induksi.", "d": "Produksi urine adalah parameter sirkulasi yang dinilai belakangan, bukan prioritas saat desaturasi."}, "hy": "Apnea dan desaturasi pascainduksi: ventilasi BVM dengan O₂ 100%. Preoksigenasi sebelum induksi memperpanjang waktu aman apnea.", "ev": [{"deck": "FARM", "page": 38, "quote": "ANESTESIA MENYEBABKAN DEPRESI FUNGSI VITAL • Nafas: • sumbatan jalan nafas, • mengurangi nafas (hipoventilasi) • henti nafas"}, {"deck": "GD", "page": 41, "quote": "Bag-valve-mask"}], "refs": []}, {"id": "A128", "sec": "anes", "stem": "Pasien henti jantung memiliki PEA. Selain CPR, dokter harus secara aktif mencari...", "vig": null, "opts": ["Penyebab reversibel", "Golongan darah", "Riwayat vaksinasi", "Skala nyeri"], "src": ["Quiz Anestesi Blok IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "CPR", "st": "ppt", "deb": null, "note": "File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "PEA hampir selalu punya penyebab yang membuat jantung tidak bisa memompa walaupun listriknya ada. Selama penyebab itu tidak dikoreksi, CPR dan adrenalin jarang berhasil. Penyebab reversibel diingat sebagai 4H 4T. Empat H: hipoksia, hipovolemia, hipo- atau hiperkalemia dan gangguan metabolik termasuk asidosis, serta hipotermia. Empat T: tension pneumothorax, tamponade jantung, toksin, dan trombosis (paru atau koroner). Slide CPR mencantumkan daftar 4H 4T untuk \"cardiac arrest membandel\".", "w": {"b": "Golongan darah baru relevan bila transfusi diperlukan, dan itu bukan langkah diagnostik utama pada PEA.", "c": "Riwayat vaksinasi tidak relevan pada henti jantung.", "d": "Pasien henti jantung tidak sadar sehingga skala nyeri tidak relevan."}, "hy": "4H: hipoksia, hipovolemia, hipo/hiperkalemia, hipotermia. 4T: tension pneumothorax, tamponade, toksin, trombosis.", "ev": [{"deck": "CPR", "page": 40, "quote": "Hipoksia Hipovolemia Hiperkalemia Hipotermia Tamponade jantung Tension pneumothorax Thromboemboli paru Toxic overdose"}, {"deck": "CPR", "page": 39, "quote": "Reversible Causes"}], "refs": ["panchal2020"]}, {"id": "A129", "sec": "anes", "stem": "Seorang pasien pascaoperasi mendapat parasetamol, NSAID, dan regional block. Tujuan kombinasi ini adalah...", "vig": null, "opts": ["Menggunakan obat sebanyak mungkin", "Bekerja pada beberapa mekanisme nyeri dan mengurangi kebutuhan masing-masing obat", "Menghindari seluruh analgesik non-opioid", "Menyebabkan sedasi maksimal"], "src": ["Quiz Anestesi Blok IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "PAINM", "st": "ppt", "deb": null, "note": "File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "Ini analgesia multimodal: obat dengan titik kerja berbeda digabung. Anestesi lokal atau blok regional bekerja di transduksi dan transmisi, NSAID menekan sintesis prostaglandin di perifer, dan parasetamol bekerja sentral. Efeknya aditif atau sinergis, sehingga analgesia lebih baik dengan dosis tiap obat lebih kecil dan efek samping lebih sedikit. Tujuan utamanya menghemat opioid. Slide Manajemen Nyeri menulis manfaatnya: dosis tiap analgesik berkurang, efikasi meningkat karena efek sinergis atau aditif, dan efek samping tiap obat berkurang. Bedanya dengan A027: soal itu menanyakan nama pendekatannya, sedangkan soal ini menanyakan tujuannya.", "w": {"a": "Tujuannya justru dosis tiap obat lebih kecil, bukan obat sebanyak mungkin.", "c": "Kombinasi ini justru bertumpu pada analgesik non-opioid (parasetamol, NSAID) untuk menghemat opioid.", "d": "Sedasi adalah efek samping yang ingin dihindari, terutama sedasi akibat opioid."}, "hy": "Multimodal: titik kerja berbeda, efek sinergis, dosis tiap obat lebih kecil, efek samping lebih sedikit, opioid-sparing (Kehlet 1993).", "ev": [{"deck": "PAINM", "page": 8, "quote": "REDUCED DOSES of each analgesic"}, {"deck": "PAINM", "page": 8, "quote": "IMPROVED EFFECACY due to synergistic or additive effects"}, {"deck": "PAINM", "page": 8, "quote": "REDUCE SIDE EFFECTS of each drug"}], "refs": ["kehlet1993"]}, {"id": "A130", "sec": "anes", "stem": "Manakah urutan berpikir yang PALING sesuai saat menghadapi pasien gawat darurat?", "vig": null, "opts": ["Diagnosis lengkap → laboratorium → ABCD", "ABCD → resusitasi/stabilisasi → evaluasi lanjutan", "CT scan → anamnesis lengkap → terapi", "Pemeriksaan laboratorium → konsultasi → airway"], "src": ["Quiz Anestesi Blok IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "GD", "st": "ppt", "deb": null, "note": "File quiz tidak memuat kunci jawaban; kunci di sini ditentukan berdasarkan PPT kuliah.", "gl": null, "r": "Pada pasien gawat darurat, yang membunuh lebih dulu adalah gangguan airway, lalu breathing, lalu circulation, lalu disability. Karena itu penilaian dan resusitasi dilakukan berurutan (primary survey ABCDE) dan setiap masalah ditangani saat ditemukan, sebelum mencari diagnosis definitif. Setelah pasien stabil barulah dilakukan secondary survey: anamnesis lengkap, pemeriksaan menyeluruh, laboratorium, dan imaging. Slide Gawat Darurat menyusun life support sebagai A, B, C, D, dan slide ICU menekankan \"Treat as you find — and reassess after every intervention\".", "w": {"a": "Menunda ABCD sampai diagnosis lengkap dan laboratorium keluar bisa fatal. Gangguan airway membunuh dalam hitungan menit.", "c": "CT scan hanya untuk pasien yang sudah stabil. Membawa pasien tidak stabil ke CT berbahaya.", "d": "Airway diletakkan paling akhir, padahal airway adalah prioritas pertama."}, "hy": "Primary survey (ABCDE dan resusitasi), lalu secondary survey (anamnesis, pemeriksaan, penunjang). Nilai ulang setelah setiap intervensi.", "ev": [{"deck": "GD", "page": 10, "quote": "A : Airway Support B : Breathing Support C : Circulation Support D : Disability / Brain Support"}, {"deck": "ICU2", "page": 24, "quote": "Treat as you find — and reassess after every intervention."}], "refs": ["tb_atls"]}, {"id": "A131", "sec": "anes", "stem": "Dalam penggunaannya di dunia kedokteran, eter mempunyai rentang keamanan yang cukup lebar serta mempunyai sifat analgetik dan anestesi. Tahapan dan tanda kedalaman anestesi eter disusun dengan baik oleh:", "vig": null, "opts": ["Valerius Cordus", "William T.G. Morton", "Crawford Long", "Horace Wells", "Arthur Ernest Guedel"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "e", "topic": "INTRO", "st": "luar", "deb": null, "note": null, "gl": null, "r": "Arthur Ernest Guedel (1920, dipublikasikan lengkap 1937) menyusun klasifikasi kedalaman anestesi eter menjadi empat stadium: I analgesia, II eksitasi/delirium, III anestesi bedah (empat plana), dan IV paralisis medula/overdosis. Klasifikasi ini disusun dari pengamatan pola napas, ukuran pupil, gerak bola mata, dan refleks pada pasien yang bernapas spontan dengan eter. Slide Pengantar membahas sejarah eter (Long, Wells, Morton) tetapi tidak menyebut Guedel, jadi jawaban ini dari textbook. Lihat juga A023 tentang tanda stadium II.", "w": {"a": "Valerius Cordus (abad ke-16) adalah yang pertama mensintesis eter (\"sweet oil of vitriol\"), bukan penyusun stadium anestesi.", "b": "Morton mendemonstrasikan anestesi eter di depan publik pada 16 Oktober 1846.", "c": "Crawford Long memakai eter untuk operasi pada 1842 tetapi tidak segera mempublikasikannya.", "d": "Horace Wells memelopori nitrous oxide untuk cabut gigi; demonstrasinya di Boston gagal."}, "hy": "Guedel: 4 stadium (analgesia, eksitasi, bedah, overdosis). Morton: demonstrasi eter 1846. Long: eter 1842. Wells: N₂O.", "ev": [], "refs": ["tb_guedel", "tb_morgan"]}, {"id": "A132", "sec": "anes", "stem": "Dalam sejarah anestesi, salah satu tonggak sejarah berkembangnya anestesi adalah ditemukannya eter. Siapakah yang mensintesis eter pertama kali?", "vig": null, "opts": ["William T.G. Morton", "Crawford Long", "Arthur Ernest Guedel", "Horace Wells", "Valerius Cordus"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "e", "topic": "INTRO", "st": "peng", "deb": null, "note": null, "gl": null, "r": "Eter (dietil eter) pertama kali disintesis oleh ahli botani dan farmasi Jerman Valerius Cordus pada abad ke-16 (sekitar 1540) dengan memanaskan alkohol dan asam sulfat; ia menyebutnya \"oleum vitrioli dulce\" (sweet oil of vitriol). Tiga abad kemudian eter baru dipakai sebagai anestetik: Crawford Long (1842) dan William T.G. Morton, yang mendemonstrasikannya secara publik pada 16 Oktober 1846 (slide Pengantar). Slide hanya membahas penggunaan klinis eter; siapa yang mensintesisnya berasal dari literatur sejarah anestesi.", "w": {"a": "Morton mendemonstrasikan penggunaan klinis eter (1846), bukan mensintesisnya.", "b": "Long adalah pengguna eter pertama untuk pembedahan (1842).", "c": "Guedel menyusun stadium kedalaman anestesi eter (abad ke-20).", "d": "Wells memakai nitrous oxide, bukan eter."}, "hy": "Sintesis eter: Cordus. Penggunaan bedah pertama: Long (1842). Demonstrasi publik: Morton (1846).", "ev": [{"deck": "INTRO", "page": 4, "quote": "W.T.G. Morton successfully demonstrates the first clinical use of ether as a surgical anesthetic"}], "refs": ["tb_morgan"]}, {"id": "A133", "sec": "anes", "stem": "Adanya batuk saat anestesi umum disebabkan karena:", "vig": null, "opts": ["Anestesi terlalu dangkal", "Anestesi terlalu dalam", "Penggunaan pelumpuh otot", "Efek samping opioid", "Infus diguyur"], "src": ["Tabulasi IPK"], "n": 2, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "INTRO", "st": "luar", "deb": null, "note": "Soal muncul dua kali di Tabulasi (no. 1 dan 2 bagian Dasar Anestesi Umum) dengan urutan opsi berbeda.", "gl": null, "r": "Batuk adalah refleks jalan napas yang ditekan oleh anestesi yang cukup dalam. Bila anestesi terlalu dangkal (misalnya saat induksi inhalasi, stadium II, atau ketika konsentrasi agen turun), rangsangan seperti pipa endotrakeal, sekret, atau manipulasi bedah memicu batuk, laringospasme, atau gerakan. Penanganannya adalah memperdalam anestesi (dan memberi pelumpuh otot bila perlu). Topik ini tidak dibahas di PPT.", "w": {"b": "Anestesi yang dalam justru menekan refleks batuk.", "c": "Pelumpuh otot melumpuhkan otot napas sehingga pasien tidak bisa batuk.", "d": "Opioid menekan refleks batuk (efek antitusif). Batuk akibat fentanil memang bisa terjadi saat injeksi cepat, tetapi itu bukan penyebab umum batuk selama anestesi.", "e": "Kecepatan infus tidak berhubungan dengan refleks batuk."}, "hy": "Batuk, gerakan, takikardia, atau laringospasme saat operasi: pikirkan anestesi terlalu dangkal.", "ev": [], "refs": ["tb_morgan"]}, {"id": "A134", "sec": "anes", "stem": "Sesuai klasifikasi anestesi regional, yang termasuk kelompok anestesi regional adalah:", "vig": null, "opts": ["Anestesi pada operasi ortopedi", "Blok saraf perifer pleksus brakialis", "Anestesi pada labiopalatoskizis", "Anestesi pada ibu melahirkan", "Semua jawaban di atas benar"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "PAINM", "st": "peng", "deb": null, "note": null, "gl": null, "r": "Anestesi regional diklasifikasikan menurut tempat obat diberikan: blok neuraksial (spinal, epidural, kaudal), blok saraf perifer (misalnya blok pleksus brakialis, femoral, skiatik), dan regional intravena (Bier block). Blok pleksus brakialis adalah contoh klasik blok saraf perifer. Opsi lain menyebut jenis operasi atau pasien, bukan teknik anestesi: operasi ortopedi, persalinan, atau labiopalatoskizis bisa dikerjakan dengan anestesi umum maupun regional.", "w": {"a": "Operasi ortopedi bisa dengan anestesi umum atau regional; itu jenis operasi, bukan klasifikasi teknik.", "c": "Operasi labiopalatoskizis pada bayi umumnya memakai anestesi umum dengan intubasi.", "d": "Persalinan bisa memakai analgesia epidural (regional) atau anestesi umum; ini juga bukan klasifikasi teknik.", "e": "Tidak semua opsi adalah teknik anestesi regional."}, "hy": "Anestesi regional: neuraksial (spinal/epidural/kaudal), blok saraf perifer, Bier block. Pilihan teknik ditentukan pasien dan operasi.", "ev": [{"deck": "PAINM", "page": 37, "quote": "Brachial Plexus Block"}, {"deck": "FARM", "page": 36, "quote": "Regional anesthesia"}], "refs": []}, {"id": "A135", "sec": "anes", "stem": "Anestesiologi adalah ilmu ked
