an kolaps (atelektasis) adalah volume. Konsolidasi memiliki volume normal atau bertambah, tanpa pergeseran, dengan air bronchogram yang jelas. Kolaps menunjukkan kehilangan volume: struktur sekitar tertarik ke arah lesi (fisura, hilus, mediastinum, diafragma), bentuknya linier atau baji dengan apeks di hilus, dan air bronchogram umumnya tidak ada (slide Lung hlm. 14).", "w": {"a": "Ukuran dan bentuk membantu, tetapi bukan pembeda mendasar.", "b": "Usia tidak relevan.", "c": "Konsolidasi tidak mendorong struktur sekitar.", "e": "Lokasi tidak membedakan keduanya."}, "hy": "Kolaps lobus atas kanan: fisura minor terangkat dan trakea tertarik ke kanan. Golden S sign mengarah ke massa hilus.", "ev": [{"deck": "LUNG", "page": 14, "quote": "Consolidation vs Collapse CONSOLIDATION COLLAPSE Normal or increased volume Volume loss"}], "refs": []}, {"id": "R036", "sec": "radio", "stem": "Kelainan di lapangan atas dan tengah paru kanan pada foto di bawah ini adalah", "vig": null, "opts": ["Giant bleb – tidak tampak jaringan paru normal", "Emfisema fokal", "Efusi pleura yang terkumpul di fisura oblik", "Pneumonia yang ditandai dengan konsolidasi", "Pneumotoraks kanan"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": "oc_p17_x53", "pool": "all", "key": "a", "topic": "LUNG", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Di lapangan atas dan tengah paru kanan tampak area lusen besar tanpa corakan paru, dibatasi dinding tipis yang melengkung dan cembung ke arah parenkim paru di sekitarnya. Inilah giant bulla (bleb besar). Bedanya dengan pneumotoraks: pada pneumotoraks, garis pleura viseral sejajar dinding dada dan paru kolaps ke arah hilus. Pada bula, jaringan paru masih ada di sekitar lesi dan dindingnya cekung terhadap dinding dada. Membedakan keduanya penting karena dekompresi jarum pada bula yang dikira pneumotoraks justru menyebabkan pneumotoraks.", "w": {"b": "Emfisema fokal tidak membentuk ruang besar berdinding seperti ini.", "c": "Efusi di fisura oblik tampak opak, bukan lusen.", "d": "Konsolidasi tampak opak.", "e": "Pneumotoraks memberi garis pleura viseral sejajar dinding dada, dan paru kolaps ke hilus."}, "hy": "Lesi lusen berdinding tipis meliputi bula, pneumatokel, kista, dan bronkiektasis kistik. Lesi berdinding tebal meliputi abses dan neoplasma (slide hlm. 23).", "ev": [{"deck": "LUNG", "page": 24, "quote": "Giant Bulla"}], "refs": []}, {"id": "R037", "sec": "radio", "stem": "Pada foto toraks PA wanita 45 tahun dengan batuk selama 2 minggu terakhir, didapati gambaran granular kecil-kecil seperti butir beras, berukuran hampir seragam sekitar 2 mm di kedua paru. Diagnosisnya mengarah ke", "vig": null, "opts": ["Tumor paru yang menyebar (disseminated)", "Penyakit jamur", "Alergi", "TB milier", "Bronkopneumonia"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "d", "topic": "LUNG", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Nodul kecil-kecil (sekitar 2 mm) seperti butir beras atau millet, berukuran seragam, dan tersebar difus di kedua paru adalah pola milier. Pada pasien dengan batuk dua minggu, pola ini paling sesuai dengan TB milier, yaitu penyebaran hematogen M. tuberculosis. Slide Lung menyebut nodul multipel 2–4 mm sebagai pola milier.", "w": {"a": "Metastasis biasanya nodul dengan ukuran bervariasi (cannon ball), walaupun beberapa tumor (tiroid, melanoma) bisa milier.", "b": "Infeksi jamur bisa memberi pola milier, tetapi lebih jarang.", "c": "Alergi tidak memberi pola milier.", "e": "Bronkopneumonia memberi bercak konsolidasi dengan ukuran tidak seragam."}, "hy": "Diferensial pola milier: TB, histoplasmosis, sarkoidosis, pneumokoniosis, dan metastasis (tiroid, melanoma).", "ev": [{"deck": "LUNG", "page": 38, "quote": "Multiple small nodules, 2-4 mm → miliary"}], "refs": []}, {"id": "R038", "sec": "radio", "stem": "Seorang wanita 59 tahun, gemuk, datang ke puskesmas dengan keluhan nyeri lutut kanan dan kiri. Pada pemeriksaan fisik didapatkan krepitasi lutut. Pada foto lutut didapatkan osteofit dengan penyempitan celah sendi. Apa diagnosisnya?", "vig": null, "opts": ["Ankylosing spondylitis", "Artritis septik", "Osteoartritis", "Artritis reumatoid", "Artritis gout"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "c", "topic": "ARTH", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Perempuan 59 tahun yang gemuk dengan nyeri lutut bilateral dan krepitasi memiliki foto berupa osteofit dan penyempitan celah sendi. Ini tanda proses degeneratif, yaitu osteoarthritis. Slide Artritis: proses degeneratif ditandai penyempitan celah sendi disertai osteofit, sklerosis subkondral, kista subkondral (geode), penyempitan asimetris, dan tidak adanya erosi inflamatorik. Obesitas adalah faktor risiko utama OA lutut.", "w": {"a": "Ankylosing spondylitis menyerang sendi sakroiliaka dan vertebra (bamboo spine).", "b": "Artritis septik akut biasanya monoartikular dengan demam dan destruksi cepat.", "d": "Artritis reumatoid memberi penyempitan simetris, erosi marginal, dan osteopenia periartikular, tanpa osteofit.", "e": "Artritis gout memberi erosi punched-out dengan overhanging edge dan tofus."}, "hy": "OA: penyempitan asimetris, osteofit, sklerosis, kista. RA: penyempitan simetris, erosi, osteopenia.", "ev": [{"deck": "ARTH", "page": 13, "quote": "A degenerative process is characterized by: . JOINT SPACE NARROWING + ◦osteophytes; ◦bone sclerosis"}], "refs": []}, {"id": "R039", "sec": "radio", "stem": "Seorang wanita 45 tahun, TB 160 cm, BB 60 kg, datang ke rumah sakit dengan keluhan nyeri lutut sejak 3 bulan. Pada pemeriksaan fisik didapatkan krepitasi pada sendi. Foto lutut menunjukkan celah sendi menyempit dan gambaran spur formation/osteofit. Apa diagnosisnya?", "vig": null, "opts": ["Artritis septik", "Osteoartritis", "Artritis reumatoid", "Osteoporosis", "Artritis gout"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "b", "topic": "ARTH", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Perempuan 45 tahun dengan nyeri lutut tiga bulan dan krepitasi memiliki foto berupa celah sendi menyempit dan spur formation atau osteofit. Osteofit adalah tanda proliferasi tulang khas proses degeneratif, sehingga diagnosisnya osteoarthritis. Tidak ada tanda inflamasi atau erosi.", "w": {"a": "Artritis septik akut biasanya disertai demam dan destruksi.", "c": "Artritis reumatoid tidak membentuk osteofit, melainkan erosi.", "d": "Osteoporosis adalah penurunan densitas tulang, bukan penyakit sendi.", "e": "Artritis gout memberi erosi punched-out dan tofus."}, "hy": "Pada OA tangan, slide Artritis hlm. 54 menunjukkan Heberden node (sendi DIP) dan square thumb.", "ev": [{"deck": "ARTH", "page": 13, "quote": "A degenerative process is characterized by: . JOINT SPACE NARROWING + ◦osteophytes; ◦bone sclerosis"}], "refs": []}, {"id": "R040", "sec": "radio", "stem": "Seorang pesepeda jatuh karena kecelakaan tunggal. Bahu kanannya nyeri dan tampak deformitas. Pemeriksaan selanjutnya untuk diagnosis adalah", "vig": null, "opts": ["USG bahu bila tersedia alat dan ahlinya", "Foto sinar-X untuk memeriksa kemungkinan fraktur atau dislokasi", "MRI bahu bila pasien bisa menoleransinya", "Foto sinar-X untuk skrining robekan ligamen", "Fraktur biasanya tidak ditemukan bersama-sama dengan dislokasi"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 3, "inc": false, "img": null, "pool": "all", "key": "b", "topic": "FRAKT", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Pesepeda yang jatuh dengan nyeri dan deformitas bahu sangat mungkin mengalami fraktur (klavikula atau humerus proksimal) dan/atau dislokasi glenohumeral. Pemeriksaan awal yang tepat adalah foto sinar-X minimal dua proyeksi untuk menilai fraktur maupun dislokasi beserta alignment. Fraktur dan dislokasi sering terjadi bersamaan (fraktur-dislokasi), dan keduanya harus disingkirkan sebelum reposisi.", "w": {"a": "USG bahu untuk jaringan lunak (rotator cuff), bukan evaluasi awal trauma tulang.", "c": "MRI bahu untuk ligamen, labrum, dan cuff, bukan pemeriksaan awal.", "d": "Sinar-X tidak dapat menilai robekan ligamen.", "e": "Fraktur sering menyertai dislokasi (misalnya lesi Hill-Sachs atau Bankart tulang)."}, "hy": "Rule of two: dua proyeksi, dua sendi, dua sisi bila perlu, dua waktu (pada fraktur skafoid yang tidak tampak di awal).", "ev": [{"deck": "FRAKT", "page": 3, "quote": "INTERPRET dislocations & alignment"}], "refs": []}, {"id": "R041", "sec": "radio", "stem": "Perempuan 23 tahun jatuh dari tangga dan mengalami fraktur. Sebelum melakukan reposisi, dokter spesialis ortopedi perlu mengetahui kondisi fraktur pada foto sinar-X. Selain garis fraktur, informasi apa lagi yang harus diketahui sebelum reposisi atau open/closed reduction?", "vig": null, "opts": ["Ada tidaknya fraktur di tempat lain", "Mekanisme terjadinya fraktur", "Kondisi jaringan lunak di dekat fraktur", "Usia pasien", "Adanya displacement/angulasi dan shortening dari fraktur"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "e", "topic": "FRAKT", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Sebelum reposisi, ortopedi perlu tahu deskripsi displacement fragmen fraktur dari foto: angulasi (varus/valgus), translasi (aposisi atau bayonet), rotasi, dan perubahan panjang (shortening atau distraksi). Parameter inilah yang dikoreksi saat reduksi. Slide Fraktur menekankan klasifikasi displacement (angulasi, rotasi, translasi) dan perubahan panjang tulang.", "w": {"a": "Fraktur di tempat lain penting dalam evaluasi trauma secara umum, tetapi bukan informasi spesifik untuk reposisi fraktur ini.", "b": "Mekanisme cedera berasal dari anamnesis, bukan foto.", "c": "Kondisi jaringan lunak dinilai klinis (fraktur terbuka atau tertutup).", "d": "Usia pasien diketahui dari anamnesis."}, "hy": "Deskripsi fraktur: lokasi, tipe garis, terbuka/tertutup, displacement (angulasi, translasi, rotasi, panjang), dan keterlibatan sendi.", "ev": [{"deck": "FRAKT", "page": 12, "quote": "Angulasi artinya axis masing-masing fragmen fraktur membentuk sudut"}], "refs": []}, {"id": "R042", "sec": "radio", "stem": "Laki-laki 24 tahun mengalami kecelakaan lalu lintas saat mengendarai sepeda motor. Segera setelah kejadian pasien tidak bisa berdiri dan nyeri di femur kanan. Di UGD dilakukan foto, dan tampak fraktur dengan 4 fragmen. Fraktur ini digolongkan sebagai", "vig": null, "opts": ["Fraktur oblik", "Fraktur transversal", "Fraktur linear", "Fraktur avulsi", "Fraktur kominutif (comminuted)"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "e", "topic": "FRAKT", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Fraktur yang menghasilkan lebih dari dua fragmen tulang disebut fraktur komunitif (comminuted). Pada kasus ini terdapat empat fragmen akibat trauma energi tinggi (KLL sepeda motor). Fraktur komunitif umumnya tidak stabil dan sering membutuhkan fiksasi operatif.", "w": {"a": "Fraktur oblik memiliki garis miring dan dua fragmen.", "b": "Fraktur transversal memiliki garis tegak lurus sumbu dan dua fragmen.", "c": "Fraktur linear umumnya istilah untuk fraktur tengkorak.", "d": "Fraktur avulsi adalah fragmen kecil yang tertarik tendon atau ligamen."}, "hy": "Tipe garis fraktur: transversal, oblik, spiral (torsi), longitudinal, komunitif, segmental, impaksi.", "ev": [{"deck": "FRAKT", "page": 8, "quote": "Fraktur yang menyebabkan >2 fragmen tulang"}], "refs": []}, {"id": "R043", "sec": "radio", "stem": "Peran radiologi dalam menemukan diagnosis tumor tulang adalah melalui", "vig": null, "opts": ["Kalsifikasi dapat menentukan ganas atau jinak", "Jenis destruksi (permeative/geographic/moth-eaten) membedakan tumor agresif dengan non-agresif", "Reaksi periosteal dapat membedakan tumor pada anak atau dewasa", "Ketepatan diagnosis tergantung pada pemeriksaan MRI", "Lokasi tumor spesifik untuk menentukan jinak atau ganas"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "b", "topic": "FRAKT", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Pendekatan radiologi tumor tulang menilai usia, lokasi, dan profil lesi: agresivitas, reaksi periosteal, kalsifikasi matriks, dan ukuran. Pola destruksi atau zona transisi paling menentukan agresivitas. Pola geografik dengan tepi sklerotik menunjukkan lesi tidak agresif (cenderung jinak), sedangkan moth-eaten dan permeatif menunjukkan lesi agresif (cenderung ganas, misalnya Ewing atau limfoma). Slide Fraktur & Tumor menampilkan geografik dengan sclerotic border sebagai benign dan moth-eaten/permeatif sebagai aggressive/malignant.", "w": {"a": "Kalsifikasi menunjukkan jenis matriks (kondroid atau osteoid), bukan jinak atau ganas.", "c": "Reaksi periosteal menunjukkan agresivitas, bukan usia pasien.", "d": "Diagnosis tidak bergantung pada MRI; foto polos adalah dasar karakterisasi.", "e": "Lokasi membantu diagnosis banding tetapi tidak spesifik untuk menentukan jinak atau ganas."}, "hy": "Reaksi periosteal agresif: sunburst, Codman triangle, onion skin (lamellated). Reaksi tidak agresif: solid dan tebal.", "ev": [{"deck": "FRAKT", "page": 57, "quote": "Aggressiveness • Periosteal reaction • Matrix calcification"}], "refs": []}, {"id": "R044", "sec": "radio", "stem": "Keunggulan MRI dibandingkan CT scan adalah", "vig": null, "opts": ["Kontras jaringan lunak lebih baik", "Biaya lebih murah", "Cocok untuk pasien dengan klaustrofobia", "Waktu pemeriksaannya cepat", "Tidak memiliki kontraindikasi karena tidak menggunakan sinar-X"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "RADI", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Keunggulan utama MRI dibanding CT adalah kontras jaringan lunak yang jauh lebih baik, karena perbedaan relaksasi T1 dan T2 antarjaringan. Karena itu MRI menjadi pilihan pertama untuk otak, medula spinalis, sendi, dan pelvis. MRI juga tanpa radiasi pengion, tetapi lebih lama, mahal, bising, menimbulkan klaustrofobia, dan memiliki kontraindikasi seperti pacu jantung dan implan logam tertentu (slide Pengantar Radiologi).", "w": {"b": "MRI lebih mahal.", "c": "Klaustrofobia adalah keterbatasan MRI.", "d": "Waktu pemeriksaan MRI lebih lama.", "e": "MRI punya kontraindikasi (pacu jantung, implan logam, benda asing logam di mata)."}, "hy": "CT unggul untuk tulang, paru, kalsifikasi, perdarahan akut, dan situasi darurat atau trauma (slide hlm. 39).", "ev": [{"deck": "RADI", "page": 46, "quote": "Superior soft-tissue contrast"}], "refs": []}, {"id": "R045", "sec": "radio", "stem": "Foto polos abdomen rutin dikerjakan dengan proyeksi", "vig": null, "opts": ["True lateral", "Left lateral decubitus (LLD)", "Anteroposterior (AP) supine", "Right lateral decubitus (RLD)", "Anteroposterior (AP) tegak"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "c", "topic": "GI", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Foto polos abdomen rutin dibuat dalam proyeksi AP supine, yang menilai distribusi gas usus, batu radioopak, kalsifikasi, dan bayangan organ. Proyeksi tambahan seperti LLD dan AP erect dibuat sesuai indikasi, misalnya untuk mencari udara bebas atau air-fluid level. Slide GI mendaftar proyeksi foto polos abdomen: I. AP supine, II. LLD, III. AP erect.", "w": {"a": "True lateral bukan proyeksi rutin abdomen.", "b": "LLD adalah proyeksi tambahan untuk udara bebas.", "d": "RLD jarang dipakai.", "e": "AP tegak (erect) adalah proyeksi tambahan untuk air-fluid level dan udara subdiafragma."}, "hy": "Akut abdomen 3 posisi: AP supine, AP erect (atau foto toraks erect), dan LLD.", "ev": [{"deck": "GI", "page": 5, "quote": "PLAIN ABDOMINAL RADIOGRAPH : PROJECTION I. AP SUPINE"}], "refs": []}, {"id": "R046", "sec": "radio", "stem": "Karakteristik pemeriksaan USG adalah", "vig": null, "opts": ["Operator dependent", "Dipakai untuk skrining kelainan tulang", "Radiasinya minimal karena menggunakan gelombang ultrasonik", "Pemeriksaannya lama", "Dapat menggantikan radiografi untuk pemeriksaan abdomen"], "src": ["UAB 1 IPK 2025 (Oculus)", "Rekap UAB IPK 2024"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "RADI", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Karakteristik khas USG adalah sangat bergantung operator: kualitas dan interpretasinya bergantung pada keterampilan dan pengalaman pemeriksa (slide). USG tidak memakai radiasi pengion, bukan \"radiasi minimal\", karena memakai gelombang suara. USG tidak dipakai untuk skrining kelainan tulang karena gelombang suara terhalang tulang dan udara. Pemeriksaannya cepat, real-time, dan tidak menggantikan radiografi untuk semua kasus abdomen.", "w": {"b": "Gelombang suara diblokir tulang, sehingga USG tidak dapat menilai interior tulang.", "c": "USG sama sekali tidak memakai radiasi pengion. Menyebutnya \"radiasi minimal\" keliru secara konsep.", "d": "USG relatif cepat dan real-time.", "e": "USG tidak menggantikan foto polos untuk udara bebas, ileus, atau batu radioopak."}, "hy": "Keterbatasan USG: operator dependent, terhalang udara dan tulang, penetrasi terbatas pada obesitas, lapang pandang kecil (slide hlm. 32).", "ev": [{"deck": "RADI", "page": 32, "quote": "Highly operator dependent"}, {"deck": "RADI", "page": 73, "quote": "Ultrasound: no radiation, real-time; operator dependent"}], "refs": []}, {"id": "A051", "sec": "anes", "stem": "Yang dimaksud dengan PEEP adalah", "vig": null, "opts": ["Positive end inspiratory pressure", "Positive end expiratory pressure", "Peak end inspiratory pressure", "Peak end expiratory pressure", "Pressure and ejection phase"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "b", "topic": "ICU2", "st": "peng", "deb": null, "note": null, "gl": null, "r": "PEEP adalah singkatan Positive End-Expiratory Pressure, yaitu tekanan positif yang dipertahankan di jalan napas pada akhir ekspirasi. Tekanan ini mencegah alveoli kolaps di akhir ekspirasi, meningkatkan kapasitas residu fungsional (FRC), merekrut alveoli, dan memperbaiki oksigenasi. Slide ICU memakai PEEP dalam rumus driving pressure (Pplat − PEEP) dan compliance, tetapi tidak menulis kepanjangannya.", "w": {"a": "\"End inspiratory pressure\" berkaitan dengan tekanan plateau/peak, bukan PEEP.", "c": "Peak inspiratory pressure adalah tekanan puncak inspirasi (PIP).", "d": "Tekanan akhir ekspirasi tidak disebut \"peak\".", "e": "\"Pressure and ejection phase\" bukan istilah ventilasi."}, "hy": "Ventilasi protektif paru: Vt 6 mL/kg BB prediksi, Pplat ≤30, driving pressure ≤15 cmH₂O (slide ICU).", "ev": [{"deck": "ICU2", "page": 17, "quote": "Pplat − PEEP; strongly linked to survival in ARDS"}], "refs": []}, {"id": "A052", "sec": "anes", "stem": "Nilai 1 MAC isofluran adalah", "vig": null, "opts": ["1,15%", "0,76%", "2,00%", "4,00%", "6,00%"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "FARM", "st": "peng", "deb": null, "note": null, "gl": null, "r": "MAC adalah konsentrasi alveolar agen inhalasi (pada 1 atm) yang mencegah gerakan terhadap insisi bedah pada 50% pasien. MAC menjadi ukuran potensi: makin kecil MAC, makin poten agennya. Nilai MAC isofluran yang lazim dikutip adalah ±1,15–1,2%. Meta-analisis Mapleson (1996) memberi 1,17% pada usia 40 tahun, dengan penurunan sekitar 6% per dekade usia. Dari pilihan yang ada, 1,15 adalah satu-satunya yang sesuai. Slide Farmakologi menjelaskan konsep MAC (1 MAC berarti 50% masih bergerak, ±1,5 MAC agar tidak ada yang bergerak) tanpa menyebut angka per agen.", "w": {"b": "0,76 mendekati MAC halotan (0,75%).", "c": "2,00 mendekati MAC sevofluran (±1,8–2,0%).", "d": "4,00 tidak cocok untuk agen modern mana pun.", "e": "6,00 mendekati MAC desfluran (±6–6,6%)."}, "hy": "MAC usia 40 (Mapleson): halotan 0,75%; isofluran 1,17%; sevofluran 1,80%; desfluran 6,6%; N₂O 104%. MAC turun pada usia tua, kehamilan, hipotermia, dan dengan opioid/benzodiazepin.", "ev": [{"deck": "FARM", "page": 37, "quote": "Minimum Alveolar Concentration (MAC)"}], "refs": ["mapleson1996"]}, {"id": "A053", "sec": "anes", "stem": "Risiko potensial dari pemasangan ventilasi mekanik adalah", "vig": null, "opts": ["Pneumotoraks", "Hipertermia", "Hiperglikemia", "Hipertensi", "Bradikardia"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "ICU2", "st": "luar", "deb": null, "note": null, "gl": null, "r": "Ventilasi tekanan positif membuat alveoli menerima tekanan dan volume yang tidak fisiologis. Akibatnya bisa terjadi barotrauma (pecahnya alveoli sehingga udara bocor menjadi pneumotoraks, pneumomediastinum, atau emfisema subkutan) dan volutrauma. Keduanya termasuk ventilator-induced lung injury (Slutsky & Ranieri, 2013). Pneumotoraks pada pasien berventilator dapat cepat berubah menjadi tension karena tekanan positif terus mendorong udara ke rongga pleura. Risiko lain ventilasi mekanik adalah VAP dan hipotensi akibat penurunan venous return.", "w": {"b": "Hipertermia bukan komplikasi langsung ventilasi mekanik. Demam pada pasien berventilator lebih sering akibat infeksi seperti VAP.", "c": "Hiperglikemia bukan efek langsung ventilator.", "d": "Tekanan positif intratoraks cenderung menurunkan venous return dan menyebabkan hipotensi, bukan hipertensi.", "e": "Bradikardia bukan komplikasi khas."}, "hy": "Bundle ventilator untuk mencegah VAP (slide Konsep ICU): head-up 30–45°, daily sedation interruption, dan langkah lain.", "ev": [], "refs": ["slutsky2013"]}, {"id": "A054", "sec": "anes", "stem": "Penyebab paling umum gagal napas tipe II adalah", "vig": null, "opts": ["Pneumonia", "Asma", "Emboli paru", "CHF", "Kelainan neuromuskular"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "e", "topic": "AB", "st": "peng", "deb": "Bila yang dimaksud \"tersering secara epidemiologis\", jawabannya PPOK, yang tidak ada di opsi.", "note": null, "gl": null, "r": "Gagal napas tipe II adalah kegagalan pompa ventilasi, yaitu kegagalan memindahkan udara sehingga CO₂ menumpuk. Di antara pilihan, kelainan neuromuskular (misalnya Guillain-Barré, miastenia gravis, cedera medula spinalis servikal, distrofi otot) adalah contoh klasik kegagalan pompa. Penyebab lain tipe II adalah depresi pusat napas (opioid, sedatif) dan PPOK. Pneumonia, emboli paru, dan CHF/edema paru umumnya menyebabkan gagal napas tipe I (hipoksemik). Slide Asam-Basa menyebut \"neuromuscular diseases\" dan \"muscle fatigue\" sebagai etiologi asidosis respiratorik.", "w": {"a": "Pneumonia khas menyebabkan tipe I (shunt).", "b": "Asma berat bisa menyebabkan hiperkapnia saat pasien kelelahan, tetapi asma tipikal menyebabkan hipoksemia dengan hipokapnia.", "c": "Emboli paru menyebabkan hipoksemia dengan hipokapnia (V/Q mismatch).", "d": "CHF atau edema paru umumnya menyebabkan tipe I."}, "hy": "Di dunia nyata, penyebab tipe II tersering adalah eksaserbasi PPOK. PPOK tidak ada di pilihan, sehingga jawabannya neuromuskular sebagai contoh kegagalan pompa.", "ev": [{"deck": "AB", "page": 40, "quote": "Neuromuscular diseases"}], "refs": ["roussos2003"]}, {"id": "A055", "sec": "anes", "stem": "Efek hemodinamik halotan terutama berkaitan dengan?", "vig": null, "opts": ["Kontraktilitas jantung", "Frekuensi jantung", "Kapasitans vena (venous capacitance)", "Volume vena", "Tekanan arteri"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "FARM", "st": "ppt", "deb": null, "note": "Stem asli hanya berbunyi \"Halothane berkaitan dengan?\". Pembahasan menafsirkannya sebagai efek hemodinamik utama halotan.", "gl": null, "r": "Grafik di slide Farmakologi (Figure 2.5 dan 2.6) memperlihatkan pola halotan. Curah jantung turun paling dalam seiring kenaikan MAC, sampai sekitar 50% pada 2,5 MAC, sementara SVR hampir tidak berubah. Artinya hipotensi akibat halotan terutama disebabkan depresi kontraktilitas miokard (efek inotropik negatif langsung), bukan vasodilatasi. Pola ini berbeda dari isofluran, desfluran, dan sevofluran, yang menurunkan tekanan terutama lewat penurunan SVR. Halotan juga membuat miokard peka terhadap katekolamin sehingga mudah timbul aritmia.", "w": {"b": "Halotan tidak terutama dikaitkan dengan frekuensi jantung; nadi relatif stabil atau sedikit turun.", "c": "Kapasitans vena bukan efek dominan halotan.", "d": "Volume vena tidak relevan.", "e": "Tekanan arteri memang turun, tetapi itu akibat penurunan kontraktilitas. Determinan utamanya kontraktilitas."}, "hy": "Halotan: depresi miokard paling kuat, sensitisasi aritmia terhadap katekolamin, risiko hepatitis halotan. Isofluran: penurunan SVR paling besar.", "ev": [{"deck": "FARM", "page": 43, "quote": "Halothan) membuat miokard lebih peka aritmia"}, {"deck": "FARM", "page": 43, "quote": "kontraktilitas miokard berkurang"}], "refs": []}, {"id": "A056", "sec": "anes", "stem": "Untuk menghitung cardiac index, data apa yang perlu dikumpulkan?", "vig": null, "opts": ["BMI", "BSA", "BGA", "GDA", "BSSD"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "b", "topic": "FARM", "st": "peng", "deb": null, "note": null, "gl": null, "r": "Cardiac index (CI) adalah curah jantung yang dinormalisasi terhadap luas permukaan tubuh: CI = CO ÷ BSA (L/menit/m²). Karena itu, data yang harus dikumpulkan selain CO adalah BSA, yang dihitung dari tinggi dan berat badan, misalnya dengan rumus Mosteller √(TB × BB / 3600). Nilai normal CI sekitar 2,5–4 L/menit/m². Normalisasi ini membuat perbandingan antarpasien yang ukuran tubuhnya berbeda menjadi bermakna. Slide Farmakologi menampilkan grafik CI terhadap MAC tanpa menjelaskan rumusnya.", "w": {"a": "BMI (BB/TB²) menilai status gizi, bukan dasar normalisasi hemodinamik.", "c": "BGA menilai oksigenasi dan asam-basa.", "d": "GDA (gula darah acak) tidak relevan.", "e": "BSSD bukan istilah yang dikenal."}, "hy": "CI <2,2 L/menit/m² dengan tanda hipoperfusi adalah salah satu kriteria hemodinamik syok kardiogenik.", "ev": [{"deck": "FARM", "page": 48, "quote": "Cardiac Index"}], "refs": ["tb_morgan"]}, {"id": "A057", "sec": "anes", "stem": "Faktor yang menentukan kebutuhan isofluran per menit, kecuali?", "vig": null, "opts": ["Kebutuhan oksigen (oxygen demand)", "Durasi pemberian", "Koefisien partisi darah/gas (blood/gas partition coefficient)", "MAC isofluran", "Curah jantung (cardiac output)"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "FARM", "st": "luar", "deb": null, "note": null, "gl": null, "r": "Model Lowe & Ernst (square-root-of-time) untuk anestesi sirkuit tertutup menghitung uptake agen per menit sebagai f × MAC × λ(darah/gas) × Q (curah jantung) × t^−½. Variabel yang dipakai adalah potensi agen (MAC), kelarutan dalam darah (koefisien partisi darah/gas), curah jantung, dan waktu atau durasi pemberian. Kebutuhan oksigen tidak termasuk dalam rumus uptake agen inhalasi. Kebutuhan O₂ dipakai untuk menghitung aliran O₂ basal pada sirkuit tertutup, bukan uptake agen. da Silva dkk. (1997, BJA) menguji metode Lowe ini secara kuantitatif dan menemukan uptake turun lebih lambat dari prediksi model.", "w": {"b": "Durasi atau waktu adalah komponen t^−½ dalam model.", "c": "Koefisien partisi darah/gas termasuk dalam rumus; makin larut, makin besar uptake.", "d": "MAC termasuk dalam rumus, sebagai target konsentrasi.", "e": "Curah jantung termasuk dalam rumus; makin besar CO, makin besar uptake."}, "hy": "Faktor uptake agen inhalasi: kelarutan (darah/gas), curah jantung, dan gradien tekanan parsial alveolar–vena.", "ev": [], "refs": ["tb_lowe", "dasilva1997"]}, {"id": "A058", "sec": "anes", "stem": "Tujuan utama terapi oksigen pada pasien gagal napas akut (ARF) adalah", "vig": null, "opts": ["Mengurangi PaCO₂", "Meningkatkan PaO₂", "Mengurangi nyeri", "Mengurangi laju pernapasan", "Meningkatkan denyut jantung"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "b", "topic": "ICU2", "st": "peng", "deb": null, "note": null, "gl": null, "r": "Terapi oksigen bertujuan mengoreksi hipoksemia dengan menaikkan PaO₂ (dan SaO₂), sehingga penghantaran oksigen ke jaringan (DO₂ = CO × CaO₂) terjaga. Oksigen tidak menurunkan PaCO₂. Pada pasien PPOK dengan retensi CO₂, oksigen berlebih justru bisa menaikkan PaCO₂. Masalah ventilasi atau CO₂ diatasi dengan bantuan ventilasi. Slide ICU memberi target SpO₂ 92–96%, atau 88–92% bila berisiko hiperkapnia.", "w": {"a": "Menurunkan PaCO₂ adalah tujuan ventilasi, bukan oksigenasi.", "c": "Oksigen bukan analgesik.", "d": "RR bisa turun bila hipoksemia membaik, tetapi itu efek sekunder, bukan tujuan utama.", "e": "Menaikkan denyut jantung bukan tujuan."}, "hy": "DO₂ = CO × (1,34 × Hb × SaO₂ + 0,003 × PaO₂). Komponen O₂ terlarut kecil, sehingga Hb dan SaO₂ paling menentukan (slide Syok).", "ev": [{"deck": "ICU2", "page": 16, "quote": "Usual SpO₂ target 92–96% (88–92% if at risk of hypercapnia)"}], "refs": []}, {"id": "A059", "sec": "anes", "stem": "Gejala toksisitas anestesi lokal yang muncul paling awal adalah", "vig": null, "opts": ["Kesemutan lidah dan bibir", "Depresi napas", "Kematian", "Gagal jantung", "Tidak sadar"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "LA", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Gejala paling awal LAST muncul di SSP. Rasa baal atau kesemutan di lidah dan sekitar bibir (circumoral numbness), rasa logam, tinitus, pusing, dan gelisah muncul pada kadar plasma rendah. Bila kadar terus naik, muncul twitching, kejang, lalu depresi SSP dan napas, dan akhirnya kolaps kardiovaskular. Slide Toksisitas menyatakan gejala SSP lebih dulu daripada gejala kardiovaskular. Depresi napas, kehilangan kesadaran, gagal jantung, dan kematian adalah tahap lanjut.", "w": {"b": "Depresi napas adalah tahap lanjut setelah kejang.", "c": "Kematian adalah tahap terminal.", "d": "Gagal jantung adalah toksisitas kardiovaskular, yang muncul belakangan.", "e": "Tidak sadar adalah tahap depresi SSP."}, "hy": "Rasio dosis kardiovaskular terhadap SSP (CC/CNS) bupivakain lebih rendah dari lidokain. Pada bupivakain, kolaps jantung bisa terjadi hampir bersamaan dengan kejang.", "ev": [{"deck": "LA", "page": 24, "quote": "GEJALA SSP LEBIH DULU TIMBUL DARIPADA GEJALA KARDIOVASKULER"}], "refs": ["neal2018"]}, {"id": "A060", "sec": "anes", "stem": "Efek samping propofol adalah", "vig": null, "opts": ["Nyeri injeksi", "Hipotensi", "Depresi napas sementara", "Semua benar", "Semua salah"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "d", "topic": "INTRO", "st": "luar", "deb": null, "note": null, "gl": null, "r": "Ketiga efek samping di opsi a–c adalah efek samping propofol yang klasik. Nyeri saat injeksi terjadi pada sekitar 60% pasien bila disuntikkan ke vena tangan tanpa pencegahan (meta-analisis Jalota dkk., BMJ 2011). Hipotensi terjadi karena vasodilatasi arteri dan vena serta depresi simpatis, terutama pada lansia dan pasien hipovolemik. Depresi napas sampai apnea sementara muncul setelah dosis induksi. Sahinovic dkk. (2018) menyebut gangguan fisiologi kardiopulmoner sebagai efek samping utama propofol. Slide Intro hanya menyebut peran propofol sebagai agen induksi cepat.", "w": {"a": "Benar, tetapi bukan satu-satunya.", "b": "Benar, tetapi bukan satu-satunya.", "c": "Benar, tetapi bukan satu-satunya.", "e": "Semua opsi a–c benar."}, "hy": "Pencegahan nyeri injeksi propofol: pakai vena antekubiti, atau lidokain dengan oklusi vena (Jalota 2011).", "ev": [{"deck": "INTRO", "page": 8, "quote": "Primary Role: Rapid induction of anesthesia"}], "refs": ["jalota2011", "sahinovic2018"]}, {"id": "A061", "sec": "anes", "stem": "Penilaian klinis untuk memperkirakan kemungkinan kesulitan intubasi adalah", "vig": null, "opts": ["Steward test", "Goldman test", "APACHE test", "APGAR test", "Mallampati test"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "e", "topic": "PREP", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Tes Mallampati (modifikasi Samsoon & Young) adalah penilaian klinis di samping tempat tidur untuk memperkirakan kesulitan intubasi. Pasien duduk tegak, membuka mulut maksimal, dan menjulurkan lidah tanpa fonasi, lalu struktur orofaring dinilai dalam kelas I–IV. Makin tinggi kelasnya, makin tinggi risiko laringoskopi sulit.", "w": {"a": "Steward score menilai pemulihan pascaanestesi.", "b": "Goldman (Cardiac Risk Index) menilai risiko jantung perioperatif.", "c": "APACHE menilai keparahan pasien ICU.", "d": "APGAR menilai bayi baru lahir."}, "hy": "Prediktor lain: 3-3-2 (pembukaan mulut, mentum–hyoid, tiromental), gerak leher, dan obstruksi (LEMON).", "ev": [{"deck": "PREP", "page": 14, "quote": "Difficulty of intubation based on modified Mallampati classification"}], "refs": []}, {"id": "A062", "sec": "anes", "stem": "Manakah di antara obat berikut yang efek utamanya meningkatkan SVR (systemic vascular resistance) melalui reseptor alfa-1 dan sering disebut obat vasopresor?", "vig": null, "opts": ["Dopamin", "Amiodaron", "Sulfas atropin", "Noradrenalin", "Dobutamin"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "d", "topic": "FARM", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Noradrenalin bekerja dominan pada reseptor α1, sehingga terjadi vasokonstriksi dan SVR naik. Efek β1-nya moderat dan membantu kontraktilitas dengan stimulasi denyut yang relatif kecil dibanding dopamin. Karena itu noradrenalin adalah vasopresor utama dan lini pertama syok septik, dengan target MAP sekitar 65 mmHg (slide Farmakologi).", "w": {"a": "Dopamin efeknya campuran sesuai dosis (D1, β1, α1) dan lebih aritmogenik; bukan vasopresor α1 murni.", "b": "Amiodaron adalah antiaritmia kelas III.", "c": "Sulfas atropin adalah antimuskarinik untuk bradikardia.", "e": "Dobutamin dominan β1 (inotropik) dan dapat menurunkan SVR lewat β2."}, "hy": "Prinsip slide Farmakologi hlm. 7: \"Noradrenalin terutama menopang tekanan; dobutamin terutama membantu pompa.\"", "ev": [{"deck": "FARM", "page": 4, "quote": "Efek alfa-1 dominan menaikkan resistensi vaskular"}], "refs": []}, {"id": "A063", "sec": "anes", "stem": "Obat yang sering dipergunakan ketika terjadi bradikardia durante operasi akibat refleks vagal adalah", "vig": null, "opts": ["Dobutamin", "Noradrenalin", "Sulfas atropin", "Dopamin", "Amiodaron"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "c", "topic": "FARM", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Bradikardia intraoperatif akibat refleks vagal muncul misalnya saat traksi peritoneum atau mesenterium, manipulasi mata (refleks okulokardiak), laringoskopi, atau insuflasi pada laparoskopi. Penanganannya: hentikan rangsangan dulu, lalu bila disertai hipoperfusi, beri sulfas atropin. Atropin adalah antimuskarinik yang memblok efek asetilkolin vagal di nodus SA dan AV. Dosis dewasa untuk bradikardia simptomatik menurut slide (AHA 2025) adalah 1 mg IV, diulang tiap 3–5 menit sampai maksimal 3 mg.", "w": {"a": "Dobutamin adalah inotropik, bukan terapi refleks vagal.", "b": "Noradrenalin adalah vasopresor.", "d": "Dopamin adalah lini kedua untuk bradikardia yang refrakter atropin.", "e": "Amiodaron adalah antiaritmia untuk takiaritmia."}, "hy": "Atropin kurang efektif pada blok infranodal (Mobitz II, blok AV total dengan QRS lebar). Siapkan pacing (slide).", "ev": [{"deck": "FARM", "page": 11, "quote": "Setelah manipulasi yang menimbulkan refleks vagal"}, {"deck": "FARM", "page": 10, "quote": "Menghambat efek vagal pada nodus SA dan AV"}], "refs": []}, {"id": "A064", "sec": "anes", "stem": "Saat terjadi korban massal, perlu dilakukan triase. Korban yang sadar namun napas cepat dan tampak pucat termasuk kategori?", "vig": null, "opts": ["Hamil", "Harus segera ditangani", "Mendesak tapi tidak darurat", "Menunda pertolongan", "Cedera ringan"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "b", "topic": "GD", "st": "luar", "deb": null, "note": null, "gl": null, "r": "Pada triase massal model START, korban dinilai dalam waktu sekitar 30–60 detik dengan urutan: kemampuan berjalan, napas (RR >30 → merah/immediate), perfusi (CRT >2 detik atau nadi radial tidak teraba → merah), dan status mental (tidak dapat mengikuti perintah → merah). Korban yang sadar tetapi bernapas cepat dan pucat (tanda hipoperfusi) memenuhi kriteria merah, yaitu harus segera ditangani. Benson dkk. (1996) menjelaskan START versi modifikasi yang mengganti CRT dengan nadi radial. Materi triase massal tidak ada di PPT.", "w": {"a": "\"Hamil\" bukan kategori triase.", "c": "\"Mendesak tapi tidak darurat\" (kuning/delayed) untuk korban yang tidak bisa berjalan tetapi fungsi vitalnya stabil.", "d": "\"Menunda pertolongan\" tidak tepat bagi korban dengan tanda gangguan napas dan perfusi.", "e": "Cedera ringan (hijau) untuk korban yang bisa berjalan."}, "hy": "START: hijau (bisa berjalan), kuning (tertunda), merah (segera: RR >30, perfusi buruk, tidak ikut perintah), hitam (tidak bernapas setelah airway dibuka).", "ev": [], "refs": ["benson1996"]}, {"id": "A065", "sec": "anes", "stem": "Cara membebaskan jalan napas pada pasien dengan kecurigaan cedera tulang belakang adalah", "vig": null, "opts": ["Jaw thrust", "Intubasi", "Head tilt-chin lift", "(opsi tidak tercatat di rekap)", "(opsi tidak tercatat di rekap)"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": true, "img": null, "pool": "all", "key": "a", "topic": "GD", "st": "ppt", "deb": null, "note": "Opsi d–e tidak tercatat (\"lupa\").", "gl": null, "r": "Pada curiga cedera tulang belakang servikal, ekstensi kepala (head tilt) harus dihindari karena dapat menggeser fragmen dan mencederai medula spinalis. Jaw thrust memajukan mandibula sehingga lidah terangkat tanpa menggerakkan leher, dan dikerjakan bersama imobilisasi manual in-line atau collar servikal. Slide Gawat Darurat secara eksplisit menyatakan \"Pada pasien trauma: head tilt, chin lift, neck lift — don’t do; jaw thrust dianjurkan\".", "w": {"b": "Intubasi adalah airway definitif bila diperlukan, dikerjakan dengan stabilisasi in-line; bukan cara pertama membebaskan jalan napas.", "c": "Head tilt–chin lift dikontraindikasikan pada curiga cedera servikal.", "d": "Opsi ini tidak tercatat lengkap di rekap/recall, sehingga tidak bisa dinilai.", "e": "Opsi ini tidak tercatat lengkap di rekap/recall, sehingga tidak bisa dinilai."}, "hy": "Airway pada trauma: jaw thrust dengan imobilisasi in-line, lalu OPA/NPA (NPA hindari bila curiga fraktur basis kranii).", "ev": [{"deck": "GD", "page": 15, "quote": "Trauma : Jaw thrust Dengan in-line manual immobilization"}, {"deck": "GD", "page": 17, "quote": "JAW THRUST dianjurkan"}], "refs": []}, {"id": "A066", "sec": "anes", "stem": "Manajemen cairan rumatan pasien dewasa dengan berat 50 kg dapat menggunakan", "vig": null, "opts": ["Cairan 1.000 mL/24 jam", "Cairan 1.500 mL/24 jam", "Natrium 50 mEq/24 jam", "Kalium 50 mEq/24 jam", "Kalium 25 mEq/24 jam"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "d", "topic": "FLUID", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Contoh di slide Terapi Cairan memakai pasien dewasa 50 kg. Volume rumatan 50 × 40 = 2.000 mL/24 jam (rentang 40–50 mL/kg/hari). Natrium 50 × 2–4 = 100–200 mmol/24 jam, dan kalium 50 × 1–2 = 50–100 mmol/24 jam. Di antara pilihan, hanya kalium 50 mEq/24 jam yang masuk rentang kebutuhan. Volume 1.000 atau 1.500 mL terlalu sedikit, natrium 50 mEq terlalu sedikit, dan kalium 25 mEq di bawah kebutuhan minimal.", "w": {"a": "1.000 mL/24 jam hanya setengah kebutuhan rumatan.", "b": "1.500 mL di bawah 40 mL/kg (2.000 mL).", "c": "Natrium 50 mEq di bawah kebutuhan 100–200 mEq.", "e": "Kalium 25 mEq di bawah kebutuhan minimal 50 mEq."}, "hy": "Rumatan dewasa: air 40–50 mL/kg/hari, Na 2–4 mEq/kg, K 1–2 mEq/kg. Anak (Holliday-Segar): 100/50/20 mL/kg.", "ev": [{"deck": "FLUID", "page": 9, "quote": "Kalium : 50 x 1-2 mmol = 50 - 100 mmol / 24 jam"}, {"deck": "FLUID", "page": 9, "quote": "Volume cairan : 50 kg x 40 ml = 2000 ml / 24 jam"}], "refs": []}, {"id": "A067", "sec": "anes", "stem": "Tindakan yang tepat adalah", "vig": "Laki-laki 20 tahun, BB 70 kg, korban kecelakaan lalu lintas. Perfusi basah dan dingin, nadi 120x/menit, TD 90/50 mmHg. Pasien sadar.", "opts": ["Dekstrosa 5% 1.000 mL selama 15–30 menit", "NaCl 7,5% 1.000 mL selama 15–30 menit", "NaCl 0,9% 1.000 mL selama 15–30 menit", "Ringer dekstrosa 2.000 mL selama 15–30 menit", "Ringer laktat 2.000 mL selama 15–30 menit"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "c", "topic": "FLUID", "st": "ppt", "deb": "RL dan NaCl 0,9% setara sebagai kristaloid isotonik. Kunci ditentukan oleh volumenya.", "note": null, "gl": "Slide memakai bolus kristaloid 10–20 mL/kg lalu menambah RL sampai 2–4× EBL. ATLS 10th membatasi kristaloid awal sekitar 1 L dan menganjurkan transfusi lebih awal pada perdarahan kelas III–IV.", "r": "Pasien KLL dengan perfusi basah dingin, nadi 120, dan TD 90/50 berada dalam syok hemoragik. Langkah awal menurut slide adalah posisi syok, pasang infus jarum besar (idealnya dua jalur), ambil sampel darah untuk mencari donor dan cek Hb, lalu bolus kristaloid isotonik 10–20 mL/kg secara cepat. Untuk 70 kg, volumenya sekitar 700–1.400 mL. ATLS 10th juga merekomendasikan bolus awal 1 L kristaloid hangat untuk dewasa. Di antara pilihan, NaCl 0,9% 1.000 mL dalam 15–30 menit paling sesuai. Setelah bolus, respons dievaluasi: good, transient, atau no response.", "w": {"a": "Dekstrosa 5% adalah air bebas. Cairan ini cepat masuk ke intrasel dan tidak efektif mengisi intravaskular.", "b": "NaCl 7,5% 1.000 mL adalah dosis hipertonik yang berbahaya (hipernatremia berat). Dosis hipertonik hanya 1/3–1/5 EBL dan diberikan dalam volume kecil.", "d": "Ringer dekstrosa 2.000 mL bukan cairan resusitasi pilihan.", "e": "RL 2.000 mL dalam 15–30 menit melebihi bolus awal 10–20 mL/kg. ATLS 10th juga membatasi kristaloid dan menganjurkan darah lebih awal."}, "hy": "ATLS 10th: bolus awal 1 L kristaloid hangat untuk dewasa. Hindari resusitasi kristaloid berlebihan; lakukan transfusi dan kontrol perdarahan lebih awal.", "ev": [{"deck": "FLUID", "page": 21, "quote": "Infus Kristaloid 20 mL / kgBB"}, {"deck": "SHOCK", "page": 31, "quote": "Infus RL 10-20 ml/kg BB , cepat"}], "refs": ["tb_atls"]}, {"id": "A068", "sec": "anes", "stem": "Perkiraan kehilangan darah pada pasien ini (mL)?", "vig": "Laki-laki 20 tahun, BB 70 kg, korban kecelakaan lalu lintas. Perfusi basah dan dingin, nadi 120x/menit, TD 90/50 mmHg. Pasien sadar.", "opts": ["1.500", "1.000", "750", "500", "250"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "SHOCK", "st": "ppt", "deb": null, "note": "Baris paling bawah tabel slide memberi label \"hipotensi\" untuk kolom 750–1.500 mL, padahal baris tekanan sistolik di kolom yang sama menulis \"normal\". Kunci memakai baris tanda klinis.", "gl": null, "r": "Tabel di slide Syok membagi perdarahan dewasa menjadi tiga. Perdarahan <750 mL: semua tanda normal. Perdarahan 750–1.500 mL: CRT memanjang, nadi >100, TD sistolik normal, pasien gelisah. Perdarahan >1.500 mL: nadi >120, TD sistolik menurun (hipotensi), RR >30, gelisah sampai koma. Pasien ini memiliki perfusi dingin, nadi 120, TD 90/50 (sudah hipotensi), dan masih sadar. Kombinasi takikardia dengan hipotensi menempatkannya di batas ≥1.500 mL, setara ATLS kelas III (30–40% EBV, sekitar 1.500–2.000 mL pada 70 kg). Dari opsi yang ada, 1.500 mL paling tepat.", "w": {"b": "1.000 mL (sekitar 750–1.500) belum disertai hipotensi.", "c": "750 mL masih kelas I–II awal, dengan TD normal.", "d": "500 mL tidak menimbulkan gangguan hemodinamik.", "e": "250 mL tidak menimbulkan gangguan hemodinamik."}, "hy": "Hipotensi pada perdarahan berarti kehilangan ≥30% EBV (ATLS kelas III). Tubuh sudah kehabisan kompensasi.", "ev": [{"deck": "SHOCK", "page": 32, "quote": "Perdarahan & tanda-tandanya (korban dewasa)"}], "refs": []}, {"id": "A069", "sec": "anes", "stem": "Perbedaan OHCA (out-of-hospital cardiac arrest) dan IHCA (in-hospital cardiac arrest) adalah", "vig": null, "opts": ["OHCA memiliki luaran yang buruk", "IHCA biasanya lebih mudah untuk diterapi", "IHCA biasanya disebabkan oleh kegagalan satu organ", "Bagian dari rantai kelangsungan hidup IHCA adalah pengenalan dan pencegahan dini", "IHCA … (opsi tidak tercatat di rekap)"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": true, "img": null, "pool": "all", "key": "d", "topic": "INTRO", "st": "ppt", "deb": "Opsi e tidak tercatat. Opsi a juga benar secara epidemiologis, tetapi d adalah ciri pembeda konseptual.", "note": null, "gl": null, "r": "Rantai keselamatan AHA untuk henti jantung di rumah sakit (IHCA) dimulai dengan pengenalan dini dan pencegahan (early recognition and prevention). Banyak IHCA didahului perburukan fisiologis selama berjam-jam, sehingga sistem seperti early warning score dan tim reaksi cepat bisa mencegah henti jantung. Rantai di luar rumah sakit (OHCA) dimulai dengan aktivasi layanan gawat darurat. Slide Intro menampilkan kedua rantai tersebut.", "w": {"a": "OHCA memang luarannya lebih buruk secara umum, tetapi soal menanyakan perbedaan yang paling tepat secara konsep rantai keselamatan.", "b": "IHCA tidak selalu lebih mudah diterapi; etiologinya sering multiorgan.", "c": "IHCA justru sering disebabkan perburukan multiorgan (gagal napas, syok), bukan kegagalan satu organ.", "e": "Opsi tidak tercatat lengkap."}, "hy": "IHCA: pengenalan dan pencegahan dini → aktivasi → CPR berkualitas → defibrilasi → perawatan pasca-henti jantung → pemulihan.", "ev": [{"deck": "INTRO", "page": 19, "quote": "Adult In-Hospital Chain of Survival"}], "refs": ["panchal2020"]}, {"id": "A070", "sec": "anes", "stem": "Kedalaman kompresi dada pada CPR adalah", "vig": null, "opts": ["Berbeda tergantung ukuran tiap orang", "Minimal 2 inci (5 cm)", "1–2 inci (3–5 cm)", "3–4 inci (5–7 cm)", "4–5 inci (10–12,5 cm)"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "b", "topic": "CPR", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Kompresi dada dewasa harus sedalam minimal 5 cm (2 inci) dan tidak lebih dari 6 cm (2,4 inci), dengan kecepatan 100–120x/menit dan recoil penuh. Slide CPR menulis \"sedalam 5–6 cm\". Di antara pilihan, \"minimal 2 inci (5 cm)\" paling sesuai. Kedalaman kurang dari 5 cm menurunkan aliran darah koroner dan serebral, sedangkan lebih dari 6 cm meningkatkan cedera tanpa manfaat tambahan.", "w": {"a": "Target kedalaman untuk dewasa sudah baku, tidak disesuaikan ukuran tubuh.", "c": "3–5 cm terlalu dangkal.", "d": "Rentang 5–7 cm melewati batas atas 6 cm.", "e": "10–12,5 cm sangat berlebihan dan berbahaya."}, "hy": "CPR berkualitas: push hard (5–6 cm), push fast (100–120x/menit), recoil penuh, interupsi minimal (<10 detik), hindari hiperventilasi.", "ev": [{"deck": "CPR", "page": 13, "quote": "Pijat Jantung, sedalam 5-6 cm"}], "refs": ["panchal2020", "kleinman2025"]}, {"id": "A071", "sec": "anes", "stem": "Mediator nyeri di lokasi timbulnya nyeri (perifer) adalah", "vig": null, "opts": ["Glutamat", "Histamin", "Prostaglandin", "GABA", "Substansi P"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "c", "topic": "PATFIS", "st": "ppt", "deb": "Slide mendaftar beberapa mediator perifer (prostaglandin, substansi P, histamin), sehingga lebih dari satu opsi muncul di slide. Kunci c dipilih sebagai mediator sensitisasi perifer yang paling klasik.", "note": null, "gl": null, "r": "Di lokasi cedera, sel yang rusak, sel mast, dan sel inflamasi melepaskan \"sup inflamasi\" (prostaglandin, bradikinin, histamin, serotonin, H⁺, K⁺, substansi P). Mediator ini mengaktifkan atau mensensitisasi nosiseptor dalam proses transduksi. Prostaglandin (terutama PGE₂, hasil COX) adalah mediator sensitisasi perifer paling klasik dan merupakan target utama NSAID/COXIB di tingkat transduksi (slide Manajemen Nyeri). Glutamat dan GABA bekerja di sinaps sentral (kornu dorsalis).", "w": {"a": "Glutamat adalah neurotransmiter eksitatorik di kornu dorsalis (sentral).", "b": "Histamin juga dilepas di perifer dan tercantum di slide, tetapi prostaglandin adalah mediator sensitisasi utama dan target analgesik klasik.", "d": "GABA adalah neurotransmiter inhibitorik sentral.", "e": "Substansi P juga tercantum di slide, tetapi peran utamanya sebagai neurotransmiter di kornu dorsalis (transmisi)."}, "hy": "NSAID bekerja di transduksi dengan menghambat COX sehingga prostaglandin berkurang. Anestesi lokal bekerja di transduksi dan transmisi. Opioid bekerja di modulasi dan persepsi.", "ev": [{"deck": "PATFIS", "page": 29, "quote": "Tissue damage triggers the release of pain and inflammatory mediators around the injury area (e.g. prostaglandins"}], "refs": []}, {"id": "A072", "sec": "anes", "stem": "Nyeri terlokalisasi setelah laserasi minor. Jenis nyeri yang paling mungkin adalah", "vig": null, "opts": ["Somatik", "Neuropatik", "Neuroplastik (nosiplastik)", "Viseral", "Psikogenik"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "PATFIS", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Laserasi minor mengenai kulit dan subkutan, yang kaya nosiseptor dan memiliki representasi kortikal yang tepat. Nyerinya bersifat nosiseptif somatik: tajam dan terlokalisir dengan baik. Nyeri viseral (organ) justru tumpul, sulit dilokalisir, dan sering dialihkan (referred). Nyeri neuropatik berasal dari lesi saraf: terbakar, menembak, dan tidak terlokalisir.", "w": {"b": "Nyeri neuropatik disebabkan lesi atau penyakit saraf, bukan luka kulit akut.", "c": "Nyeri nosiplastik (yang dimaksud \"neuroplastic\") adalah perubahan pemrosesan nyeri tanpa kerusakan jaringan yang jelas.", "d": "Nyeri viseral sulit dilokalisir.", "e": "Nyeri psikogenik tidak sesuai dengan luka yang jelas."}, "hy": "Nyeri somatik terlokalisir tajam; viseral difus dan referred; neuropatik terbakar, kesetrum, dan disertai allodynia.", "ev": [{"deck": "PATFIS", "page": 21, "quote": "Location → somatic pain (skin, subcutaneous tissue, mucous membrane)"}], "refs": []}, {"id": "A073", "sec": "anes", "stem": "Intervensi psikologis sebagai upaya penanganan nyeri adalah", "vig": null, "opts": ["TENS therapy", "Cognitive behaviour therapy (CBT)", "PRICE therapy", "Persepsi modulasi", "(opsi tidak tercatat di rekap)"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": true, "img": null, "pool": "all", "key": "b", "topic": "PAINM", "st": "ppt", "deb": null, "note": "Opsi e tidak tercatat (\"lupa\").", "gl": null, "r": "Cognitive behaviour therapy (CBT) adalah intervensi psikologis berbasis bukti untuk nyeri, terutama nyeri kronik. CBT mengubah pikiran maladaptif (catastrophizing), mengajarkan strategi coping, dan mengurangi perilaku menghindar sehingga fungsi dan kualitas hidup membaik. Slide Manajemen Nyeri mencantumkan intervensi psikologis (penjelasan, reassurance, konseling) serta strategi kognitif dan perilaku.", "w": {"a": "TENS adalah terapi fisik/elektrik, bukan psikologis.", "c": "PRICE (protection, rest, ice, compression, elevation) adalah terapi fisik.", "d": "\"Persepsi modulasi\" bukan nama intervensi.", "e": "Opsi tidak tercatat."}, "hy": "Nonfarmakologis (slide): fisik (PRICE, TENS, akupunktur, fisioterapi) dan psikologis (edukasi, reassurance, konseling, CBT, distraksi, relaksasi/hipnosis).", "ev": [{"deck": "PAINM", "page": 11, "quote": "Cognitive interventions."}, {"deck": "PAINM", "page": 9, "quote": "Psikologis Psychological"}], "refs": []}, {"id": "A074", "sec": "anes", "stem": "Pasien ICU pascaoperasi tampak gelisah, hipoksia, dan kelelahan bernapas. Perawat melaporkan dahak berbusa. Komplikasi yang mungkin terjadi pada pasien adalah", "vig": null, "opts": ["Edema paru akut", "Delirium pascaoperasi", "Emboli paru", "Kontusio paru", "TRALI"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "FLUID", "st": "peng", "deb": null, "note": null, "gl": null, "r": "Pasien ICU pascaoperasi dengan gelisah, hipoksia, tampak lelah bernapas, dan dahak berbusa (frothy, sering merah muda) memiliki gambaran klasik edema paru akut. Cairan memenuhi alveoli sehingga terjadi shunt dan hipoksemia, dan kerja napas meningkat. Pada pasien pascaoperasi, penyebab tersering adalah kelebihan cairan perioperatif atau disfungsi jantung. Slide Terapi Cairan mengutip bahwa regimen cairan liberal berkaitan dengan risiko edema paru dan pneumonia yang lebih tinggi.", "w": {"b": "Delirium pascaoperasi menyebabkan gelisah tetapi tidak menimbulkan dahak berbusa.", "c": "Emboli paru menyebabkan sesak mendadak dan hipoksemia, umumnya tanpa sputum berbusa.", "d": "Kontusio paru terjadi setelah trauma tumpul toraks.", "e": "TRALI juga edema non-kardiogenik, tetapi mensyaratkan transfusi dalam 6 jam terakhir, yang tidak disebut di soal."}, "hy": "\"Cairan infus adalah obat\" (slide). Berikan sesuai indikasi dan pantau tanda kelebihan cairan.", "ev": [{"deck": "FLUID", "page": 12, "quote": "pulmonary edema"}], "refs": []}, {"id": "A075", "sec": "anes", "stem": "Pasien dengan mual-muntah sejak beberapa hari, sekarang hipotensi dan tampak mengantuk (kesadaran menurun). Apa yang harus segera dilakukan di IGD?", "vig": null, "opts": ["Intubasi", "Ventilasi mekanik", "Posisi Trendelenburg", "Beri antiemetik", "Semua benar"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "c", "topic": "FLUID", "st": "ppt", "deb": "Slide mengajarkan elevasi tungkai, bukan Trendelenburg (kepala lebih rendah). Trendelenburg sendiri tidak terbukti efektif dan mengganggu ventilasi.", "note": null, "gl": "Slide mengajarkan posisi syok berupa elevasi tungkai. Opsi soal memakai istilah Trendelenburg (seluruh tubuh dimiringkan kepala di bawah), yang tidak dianjurkan sebagai terapi syok.", "r": "Mual-muntah berhari-hari menyebabkan kehilangan cairan ekstraseluler, disertai hipotensi dan penurunan kesadaran: syok hipovolemik akibat dehidrasi. Alur di slide Terapi Cairan untuk pasien dehidrasi adalah posisi syok, pasang infus jarum besar, lalu bolus kristaloid 20 mL/kg. Posisi syok yang dimaksud adalah mengangkat kedua tungkai untuk autotransfusi 300–500 mL. Di antara pilihan, posisi Trendelenburg paling mendekati, walaupun istilah yang tepat adalah elevasi tungkai atau passive leg raise. Intubasi dan ventilasi mekanik tidak menjadi prioritas bila jalan napas dan napas masih adekuat.", "w": {"a": "Intubasi dipertimbangkan bila GCS ≤8 atau jalan napas terancam; \"mengantuk\" belum menjadi indikasi.", "b": "Ventilasi mekanik tidak diindikasikan tanpa gagal napas.", "d": "Antiemetik tidak mengatasi syok.", "e": "Tidak semua opsi benar."}, "hy": "Prioritas syok hipovolemik: posisi syok, IV jarum besar, kristaloid 20 mL/kg, evaluasi respons, lalu hitung defisit dan rumatan.", "ev": [{"deck": "FLUID", "page": 15, "quote": "Angkat kedua kaki 300 - 500 cc darah dari kaki pindah ke sirkulasi sentral"}, {"deck": "FLUID", "page": 18, "quote": "Pasien dehidrasi | posisi shock pasang infus jarum besar"}], "refs": []}, {"id": "A076", "sec": "anes", "stem": "Wanita hamil dengan perdarahan pervaginam: RR 24x/menit, HR 120x/menit, TD 90/70 mmHg. Direncanakan seksio sesarea darurat. Tidak ada riwayat penyakit apa pun. Termasuk status fisik ASA (PS ASA) berapa?", "vig": null, "opts": ["PS 1D", "PS 2D", "PS 1", "PS 2", "PS 3"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "b", "topic": "PREP", "st": "peng", "deb": "Tanda vital (HR 120, TD 90/70) menunjukkan syok hemoragik. Slide memberi contoh ASA V untuk \"shock perdarahan\", tetapi opsi maksimal hanya PS 3. Kunci PS 2D mengikuti contoh ASA bahwa kehamilan termasuk ASA II.", "note": "Rekap menulis \"PSA\", maksudnya PS ASA (ASA Physical Status). Sufiks \"D\" pada opsi berarti darurat (setara \"E\").", "gl": null, "r": "Contoh resmi ASA Physical Status (disetujui 2014 dan dipakai Hurwitz dkk., 2017) memasukkan kehamilan normal ke ASA II karena perubahan fisiologis kehamilan memengaruhi anestesi. Perubahan tersebut antara lain risiko aspirasi, jalan napas sulit, dan perubahan hemodinamik. Operasinya darurat (seksio karena perdarahan), sehingga ditambah sufiks E, yang dalam notasi soal Indonesia ditulis \"D\" (darurat). Jadi status fisiknya PS 2D. Slide Persiapan memberi contoh ASA II berupa umur ekstrem tanpa penyakit sistemik dan obesitas, tetapi tidak menyebut kehamilan.", "w": {"a": "PS 1 untuk pasien sehat normal. Kehamilan bukan \"sehat normal\" dalam klasifikasi ASA.", "c": "Tanpa sufiks darurat, padahal operasinya darurat.", "d": "Tanpa sufiks darurat.", "e": "PS 3 untuk penyakit sistemik berat dengan keterbatasan fungsi."}, "hy": "Sufiks E (darurat) ditambahkan bila penundaan operasi meningkatkan ancaman terhadap nyawa atau bagian tubuh.", "ev": [{"deck": "PREP", "page": 19, "quote": "Pasien dengan umur ekstrim (neonates dan geriatric) tanpa penyakit systemic"}], "refs": ["hurwitz2017"]}, {"id": "A077", "sec": "anes", "stem": "Pernyataan yang benar tentang anestesi intravena adalah", "vig": null, "opts": ["Sebagian besar meningkatkan metabolisme otak dan tekanan intrakranial", "Hanya sebagian kecil yang menyebabkan depresi napas", "Hanya sebagian kecil yang menyebabkan depresi sirkulasi", "Pemberian yang cepat dapat menyebabkan apnea", "Bukan salah satu di atas"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "d", "topic": "INTRO", "st": "luar", "deb": null, "note": null, "gl": null, "r": "Anestetik intravena seperti propofol dan tiopental mencapai otak sangat cepat. Bila disuntikkan cepat, puncak konsentrasi di pusat napas batang otak menyebabkan depresi napas sampai apnea sementara, sehingga ventilasi harus siap sebelum induksi. Pernyataan lain keliru. Hampir semua anestetik IV, kecuali ketamin, justru menurunkan metabolisme otak (CMRO₂) dan tekanan intrakranial. Sebagian besar menyebabkan depresi napas dan sirkulasi (vasodilatasi, hipotensi), bukan hanya sebagian kecil. Sahinovic dkk. (2018) menyebut gangguan kardiopulmoner sebagai efek samping utama propofol.", "w": {"a": "Kebanyakan anestetik IV menurunkan metabolisme otak dan TIK. Ketamin adalah pengecualian (slide: ketamin menaikkan TIK).", "b": "Justru sebagian besar menyebabkan depresi napas.", "c": "Justru sebagian besar menyebabkan depresi sirkulasi.", "e": "Pernyataan d benar."}, "hy": "Ketamin adalah pengecualian: TD, nadi, dan TIK naik, serta terjadi hipersalivasi (slide Farmakologi hlm. 51).", "ev": [{"deck": "INTRO", "page": 8, "quote": "Rapid induction of anesthesia"}], "refs": ["sahinovic2018"]}, {"id": "A078", "sec": "anes", "stem": "Saat melakukan CPR, korban mulai bernapas terengah-engah (gasping). Apa yang harus dilakukan?", "vig": null, "opts": ["Berikan bantuan napas dan pantau pasien", "Cek nadi, lanjutkan kompresi hanya jika nadi tidak ada", "Hentikan CPR dan tunggu napas kembali normal", "Lanjutkan CPR", "Fokus pada masalah pernapasan saja"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "d", "topic": "CPR", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Napas terengah-engah (gasping atau agonal breathing) adalah refleks batang otak yang sering muncul selama henti jantung dan bukan napas normal. Gasping bukan tanda kembalinya sirkulasi spontan (ROSC). Bila korban hanya gasping tanpa tanda kehidupan lain seperti bergerak, membuka mata, atau batuk, CPR harus dilanjutkan. Menghentikan kompresi untuk \"menunggu napas\" akan menghentikan perfusi koroner dan otak.", "w": {"a": "Hanya memberi napas bantuan sambil memantau berarti kompresi berhenti.", "b": "Pemeriksaan nadi dilakukan tiap 2 menit sesuai siklus, bukan setiap kali korban gasping.", "c": "Menghentikan CPR saat gasping adalah kesalahan fatal.", "e": "Fokus hanya pada napas mengabaikan sirkulasi."}, "hy": "Pengenalan henti jantung: tidak responsif ditambah napas tidak normal atau gasping sudah cukup untuk memulai CPR.", "ev": [{"deck": "CPR", "page": 10, "quote": "Agonal gasps are common during cardiac arrest and should not be considered normal breathing"}], "refs": ["panchal2020"]}, {"id": "A079", "sec": "anes", "stem": "Rasio bantuan napas yang efektif pada CPR adalah", "vig": null, "opts": ["1 napas tiap 10 kompresi", "2 napas tiap 15 kompresi", "2 napas tiap 30 kompresi", "2 napas tiap 3 kompresi", "Napas terus tanpa kompresi"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "c", "topic": "CPR", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Pada CPR dewasa tanpa airway lanjut, rasio kompresi:ventilasi adalah 30:2, baik untuk satu maupun dua penolong. Setiap napas diberikan sekitar 1 detik sampai dada terlihat mengembang. Setelah airway lanjut terpasang (ETT/LMA), kompresi dilakukan terus-menerus 100–120x/menit dengan ventilasi 8–10x/menit (1 napas tiap 6–8 detik) tanpa sinkronisasi (slide CPR).", "w": {"a": "Rasio 10:1 tidak dipakai.", "b": "Rasio 15:2 dipakai untuk CPR anak atau bayi dengan dua penolong.", "d": "Rasio 3:1 dipakai pada resusitasi neonatus.", "e": "Napas terus tanpa pijatan hanya untuk henti napas yang nadinya masih teraba."}, "hy": "Rasio 30:2 untuk dewasa (satu atau dua penolong); 15:2 untuk anak atau bayi dengan dua penolong; 3:1 untuk neonatus.", "ev": [{"deck": "CPR", "page": 11, "quote": "Pijat jantung 30 X disusul dengan 2 x tiupan nafas"}], "refs": []}, {"id": "A080", "sec": "anes", "stem": "The Intensive Care Unit (ICU) has several advantages. Which of the following is one of them?", "vig": null, "opts": ["Has full diagnostic equipment, including MRI", "Close monitoring of any sudden change in vital signs and advanced haemodynamics", "Quiet environment, so the patient feels comfortable", "Sterile condition, so patients are protected from pathogenic germs", "Many specialties that can give any branded drugs as they wish"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "b", "topic": "ICU2", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Ciri dan keunggulan ICU adalah pemantauan ketat dan berlapis (klinis, non-invasif, invasif, lanjutan) sehingga perubahan tanda vital terdeteksi dini, disertai kemampuan menopang organ yang gagal (ventilasi, vasopresor, dialisis) oleh tim khusus selama 24 jam. Slide ICU mendefinisikan ICU sebagai sistem dengan \"enhanced monitoring, organ support, dedicated team\", termasuk pemantauan hemodinamik lanjut seperti arterial line, CVC, curah jantung, dan ekokardiografi.", "w": {"a": "MRI bukan fasilitas khas ICU; banyak ICU tidak memilikinya.", "c": "Lingkungan ICU justru ramai oleh alarm dan aktivitas, salah satu pemicu delirium.", "d": "ICU bukan ruang steril, dan infeksi nosokomial (VAP, CLABSI) justru merupakan risiko.", "e": "Pemberian obat mengikuti indikasi dan stewardship, bukan selera."}, "hy": "Lapisan monitoring (slide): pemeriksaan klinis → non-invasif (EKG, NIBP, SpO₂, EtCO₂) → invasif (arteri, CVC, BGA) → lanjutan (CO, echo, ICP, EEG).", "ev": [{"deck": "ICU2", "page": 3, "quote": "Enhanced monitoring Organ support Dedicated team"}, {"deck": "ICU2", "page": 10, "quote": "Layers of m onito ring"}], "refs": []}, {"id": "A081", "sec": "anes", "stem": "These are examples of patients who benefit from being treated in the ICU, EXCEPT:", "vig": null, "opts": ["60-year-old male, sepsis due to pneumonia with respiratory distress", "25-year-old male with multiple metastatic brain lesions from stage 4 lung cancer", "6-year-old female with third-degree burns, 90% body surface area", "75-year-old female, diabetic ketoacidosis with decreased mental status", "90-year-old female with intracerebral haemorrhage"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "b", "topic": "ICU2", "st": "ppt", "deb": "Luka bakar 90% TBSA (c) dan lansia 90 tahun dengan ICH (e) juga bisa dianggap kurang mendapat manfaat. Kunci b dipilih karena paling jelas \"terminal dan ireversibel\".", "note": null, "gl": null, "r": "Model prioritas SCCM yang ditampilkan di slide ICU membagi pasien menjadi empat prioritas. Prioritas 4 (biasanya tidak tepat masuk ICU) adalah pasien yang terlalu sehat untuk mendapat manfaat, atau yang sakit terminal dan ireversibel. Pasien 25 tahun dengan metastasis otak multipel akibat kanker paru stadium IV masuk kelompok terminal, sehingga perawatan ICU tidak mengubah prognosis. Pilihan lain adalah kondisi akut yang berpotensi reversibel: sepsis dengan distres napas, KAD dengan penurunan kesadaran, ICH, dan luka bakar berat.", "w": {"a": "Sepsis pneumonia dengan distres napas termasuk prioritas 1 (butuh ventilasi atau vasoaktif).", "c": "Luka bakar 90% sangat berat dan prognosisnya buruk, tetapi merupakan cedera akut yang membutuhkan perawatan kritis. Pada anak, keputusan diambil individual.", "d": "KAD dengan penurunan kesadaran termasuk prioritas 1–2.", "e": "ICH pada lansia diputuskan individual, tetapi merupakan kondisi akut yang bisa mendapat manfaat dari monitoring."}, "hy": "Prioritas 1: tidak stabil, butuh terapi ICU. Prioritas 2: butuh monitoring intensif. Prioritas 3: tidak stabil dengan cadangan terbatas. Prioritas 4: biasanya tidak tepat.", "ev": [{"deck": "ICU2", "page": 7, "quote": "Too well to benefit, or irreversibly, terminally ill"}], "refs": ["nates2016"]}, {"id": "A082", "sec": "anes", "stem": "Pernyataan tentang pertukaran gas di alveolus:", "vig": null, "opts": ["Oksigen berdifusi dari alveoli ke darah", "Karbon dioksida berdifusi dari darah ke alveoli", "Karbon dioksida berdifusi dari alveoli ke darah", "Oksigen berdifusi dari darah ke alveoli", "(opsi tidak tercatat di rekap)"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": true, "img": null, "pool": "all", "key": "a", "topic": "SHOCK", "st": "peng", "deb": "Opsi a dan b sama-sama benar. Opsi e tidak tercatat dan kemungkinan \"a dan b benar\".", "note": null, "gl": null, "r": "Di membran alveolus-kapiler, gas berdifusi pasif mengikuti gradien tekanan parsial. O₂ berpindah dari alveoli (PAO₂ ±100 mmHg) ke darah kapiler paru (PvO₂ ±40 mmHg). CO₂ berpindah dari darah (PvCO₂ ±46 mmHg) ke alveoli (PACO₂ ±40 mmHg). Jadi opsi a dan b sama-sama benar, sedangkan c dan d terbalik arahnya. Slide Syok menempatkan difusi sebagai mata rantai setelah ventilasi, sebelum sirkulasi dan perfusi.", "w": {"b": "Pernyataan ini juga benar. Opsi e yang tidak tercatat kemungkinan berbunyi \"a dan b benar\".", "c": "Arahnya terbalik; CO₂ berpindah dari darah ke alveoli.", "d": "Arahnya terbalik; O₂ berpindah dari alveoli ke darah.", "e": "Opsi ini tidak tercatat lengkap di rekap/recall, sehingga tidak bisa dinilai."}, "hy": "CO₂ sekitar 20 kali lebih mudah berdifusi daripada O₂. Itu sebabnya gangguan difusi lebih dulu menimbulkan hipoksemia daripada hiperkapnia.", "ev": [{"deck": "SHOCK", "page": 7, "quote": "VENTILASI DIFUSI SIRKULASI PERFUSI"}], "refs": ["petersson2014"]}, {"id": "A083", "sec": "anes", "stem": "Langkah pertama dalam menginterpretasi BGA adalah", "vig": "Hasil analisis gas darah dan elektrolit: pH 7,12; HCO₃⁻ 10,1 mEq/L; PaCO₂ 30 mmHg; Na⁺ 129 mEq/L; Cl⁻ 80 mEq/L. (Catatan perekam soal: nilai Cl⁻ tidak yakin; anion gap disebut meningkat, >11.)", "opts": ["Menentukan konsistensi internal", "Mengidentifikasi penyakit primer", "Menilai status asam-basa (pH)", "Menentukan terapi", "Menentukan adekuasi kompensasi"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "AB", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Langkah pertama interpretasi BGA di slide Asam-Basa adalah menilai konsistensi internal dengan rumus Henderson: [H⁺] = 24 × PaCO₂ / HCO₃⁻, lalu mencocokkannya dengan pH. Bila tidak konsisten, sampel atau hasil mungkin salah dan interpretasi selanjutnya tidak valid. Pada kasus ini, [H⁺] = 24 × 30 / 10,1 ≈ 71 nmol/L, yang sesuai dengan pH sekitar 7,15 (tabel slide: pH 7,1 ≈ 80; pH 7,2 ≈ 60). Hasil dengan pH 7,12 berarti konsisten. Setelah itu baru dinilai pH, PaCO₂, HCO₃⁻, anion gap, dan kompensasi.", "w": {"b": "Mengidentifikasi penyakit primer adalah langkah lanjut (konteks klinis).", "c": "\"Mengecek asam-basa\" atau pH adalah langkah 1 setelah konsistensi dipastikan.", "d": "Terapi ditentukan setelah interpretasi selesai.", "e": "Adekuasi kompensasi dinilai di langkah 6."}, "hy": "Langkah BGA (slide): konsistensi → pH → PaCO₂ → HCO₃⁻ → anion gap (bila asidosis metabolik) → akut/kronik → kompensasi.", "ev": [{"deck": "AB", "page": 18, "quote": "Assess internal consistency"}, {"deck": "AB", "page": 18, "quote": "If pH and H+ are found to be inconsistent, then the BGA may be invalid"}], "refs": []}, {"id": "A084", "sec": "anes", "stem": "Manakah pernyataan yang BENAR terkait pasien ini?", "vig": "Hasil analisis gas darah dan elektrolit: pH 7,12; HCO₃⁻ 10,1 mEq/L; PaCO₂ 30 mmHg; Na⁺ 129 mEq/L; Cl⁻ 80 mEq/L. (Catatan perekam soal: nilai Cl⁻ tidak yakin; anion gap disebut meningkat, >11.)", "opts": ["Pasien memiliki anion gap yang meningkat", "Asidosis metabolik non-anion gap", "Hipoalbuminemia tidak memiliki efek apa pun", "Rasio delta tidak perlu dihitung", "Semua pernyataan di atas benar"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "AB", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Anion gap dihitung sebagai Na⁺ − (Cl⁻ + HCO₃⁻) = 129 − (80 + 10,1) = 38,9 mEq/L, jauh di atas normal 3–11 mEq/L (slide). Ini asidosis metabolik dengan anion gap tinggi. Hipoalbuminemia justru menurunkan AG secara palsu, sehingga AG harus dikoreksi. Delta ratio perlu dihitung pada asidosis AG tinggi untuk mencari gangguan campuran. Penyebab AG tinggi bisa diingat dengan mnemonik GOLD MARK di slide.", "w": {"b": "AG 38,9 berarti asidosis AG tinggi, bukan non-AG.", "c": "Hipoalbuminemia menurunkan AG dan perlu dikoreksi (slide hlm. 23).", "d": "Delta ratio justru dihitung pada asidosis AG tinggi (slide hlm. 24).", "e": "Tidak semua pernyataan benar."}, "hy": "AG terkoreksi = AG + 2,5 × (4 − albumin g/dL). GOLD MARK: Glycols, Oxoproline, L-lactate, D-lactate, Methanol, Aspirin, Renal failure, Ketoacidosis.", "ev": [{"deck": "AB", "page": 22, "quote": "Normal Range: 3-11 mEq/L"}], "refs": []}, {"id": "A085", "sec": "anes", "stem": "Dari hasil tersebut, gangguan primernya adalah", "vig": "Hasil analisis gas darah dan elektrolit: pH 7,12; HCO₃⁻ 10,1 mEq/L; PaCO₂ 30 mmHg; Na⁺ 129 mEq/L; Cl⁻ 80 mEq/L. (Catatan perekam soal: nilai Cl⁻ tidak yakin; anion gap disebut meningkat, >11.)", "opts": ["Asidosis metabolik", "Asidosis respiratorik", "Alkalosis metabolik", "Alkalosis respiratorik", "Bukan salah satu di atas"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "AB", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "pH 7,12 berarti asidemia berat. HCO₃⁻ 10,1, jauh di bawah 24, menunjukkan gangguan primer metabolik. PaCO₂ 30 (di bawah 40) bergerak searah HCO₃⁻, yang menandakan kompensasi, bukan penyebab. Jadi gangguan utamanya asidosis metabolik dengan anion gap tinggi (AG ±39).", "w": {"b": "Asidosis respiratorik disertai PaCO₂ tinggi.", "c": "Alkalosis metabolik disertai pH tinggi dan HCO₃⁻ tinggi.", "d": "Alkalosis respiratorik disertai pH tinggi dan PaCO₂ rendah.", "e": "Diagnosisnya jelas asidosis metabolik."}, "hy": "Bila PaCO₂ dan HCO₃⁻ bergerak searah, salah satunya adalah kompensasi. Lihat mana yang sesuai dengan arah pH untuk menentukan gangguan primer.", "ev": [{"deck": "AB", "page": 21, "quote": "HCO3- < 24: metabolic acidosis"}], "refs": []}, {"id": "A086", "sec": "anes", "stem": "Bagaimana kompensasi pada hasil tersebut?", "vig": "Hasil analisis gas darah dan elektrolit: pH 7,12; HCO₃⁻ 10,1 mEq/L; PaCO₂ 30 mmHg; Na⁺ 129 mEq/L; Cl⁻ 80 mEq/L. (Catatan perekam soal: nilai Cl⁻ tidak yakin; anion gap disebut meningkat, >11.)", "opts": ["Kompensasi metabolik tidak adekuat", "Kompensasi metabolik adekuat", "Kompensasi respiratorik tidak adekuat", "Kompensasi respiratorik adekuat", "Bukan salah satu di atas"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "c", "topic": "AB", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Pada asidosis metabolik, PaCO₂ yang diharapkan dapat dihitung dengan dua rumus. Rumus Winter (slide ICU): 1,5 × 10,1 + 8 ± 2 = 21,2–25,2 mmHg. Rumus slide Asam-Basa: 40 − 1,2 × (24 − 10,1) ≈ 23,3 mmHg. PaCO₂ terukur 30 mmHg lebih tinggi dari yang diharapkan, artinya paru tidak membuang CO₂ secukupnya. Kompensasi respiratoriknya tidak adekuat, atau secara konsep terdapat asidosis respiratorik yang menyertai. Hal ini penting karena pH 7,12 yang berbahaya sebagian disebabkan ventilasi yang tidak memadai.", "w": {"a": "Kompensasi untuk gangguan metabolik bersifat respiratorik, bukan metabolik.", "b": "Kompensasi untuk gangguan metabolik bersifat respiratorik.", "d": "PaCO₂ 30 lebih tinggi dari harapan (±23), jadi kompensasinya tidak adekuat.", "e": "Ada jawaban yang tepat, yaitu c."}, "hy": "Rumus Winter: PaCO₂ harapan = 1,5 × HCO₃⁻ + 8 ± 2. Bila terukur lebih tinggi, ada asidosis respiratorik penyerta; bila lebih rendah, ada alkalosis respiratorik penyerta.", "ev": [{"deck": "AB", "page": 28, "quote": "1.2 mmHg decrease in PaCO2 for every 1 mEq/L fall in HCO3-"}, {"deck": "ICU2", "page": 18, "quote": "expected PaCO₂ = 1.5 × HCO₃⁻ + 8 ± 2"}], "refs": []}, {"id": "A087", "sec": "anes", "stem": "Hal yang harus dilakukan adalah", "vig": "Hasil analisis gas darah dan elektrolit: pH 7,12; HCO₃⁻ 10,1 mEq/L; PaCO₂ 30 mmHg; Na⁺ 129 mEq/L; Cl⁻ 80 mEq/L. (Catatan perekam soal: nilai Cl⁻ tidak yakin; anion gap disebut meningkat, >11.)", "opts": ["Bantu ventilasi", "Beri natrium bikarbonat (bicnat) IV", "Beri tahu keluarga bahwa kondisinya terminal", "(opsi tidak tercatat di rekap)", "Semua benar"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": true, "img": null, "pool": "all", "key": "e", "topic": "AB", "st": "peng", "deb": "Opsi d tidak tercatat, dan stem tidak menjelaskan konteks penyakit. Kunci e paling mungkin, tetapi soal ini sebaiknya dipakai untuk latihan konsep saja.", "note": null, "gl": null, "r": "Pasien dengan asidosis metabolik AG tinggi yang berat (pH 7,12) dan kompensasi respiratorik tidak adekuat membutuhkan beberapa langkah sekaligus. Pertama, bantu ventilasi karena PaCO₂ terlalu tinggi untuk kompensasi dan ancaman kelelahan napas. Kedua, pertimbangkan bikarbonat (natrium bikarbonat IV) pada asidemia berat, dengan target awal pH 7,1–7,2 untuk menurunkan risiko aritmia dan memperbaiki respons terhadap katekolamin (slide). Ketiga, terapkan komunikasi prognosis yang jujur kepada keluarga, yang merupakan bagian perawatan kritis. Bila opsi d yang tidak tercatat bukan jawaban yang lebih spesifik, maka \"semua benar\" adalah kunci paling masuk akal.", "w": {"a": "Benar sebagian; ventilasi dibantu karena kompensasi tidak adekuat.", "b": "Benar sebagian; bikarbonat dipertimbangkan pada asidemia berat.", "c": "Benar sebagian; komunikasi dengan keluarga tetap dilakukan.", "d": "Opsi ini tidak tercatat lengkap di rekap/recall, sehingga tidak bisa dinilai."}, "hy": "Inti terapi asidosis metabolik AG tinggi adalah mengatasi penyebabnya (laktat/sepsis, KAD, toksin, gagal ginjal). Bikarbonat hanya jembatan pada asidemia berat.", "ev": [{"deck": "AB", "page": 58, "quote": "In severe acidemia: initial goal should be to increase the pH to 7.1-7.2"}], "refs": []}, {"id": "A088", "sec": "anes", "stem": "Yang termasuk golongan ester adalah", "vig": null, "opts": ["Prokain", "Lidokain", "Etidokain", "Ropivakain", "Bupivakain"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "LA", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Prokain adalah anestetik lokal golongan ester, seperti tetrakain, kloroprokain, dan kokain. Namanya hanya punya satu huruf \"i\". Lidokain, etidokain, ropivakain, dan bupivakain adalah golongan amida, dengan dua huruf \"i\" pada nama generiknya. Slide Toksisitas memuat tabel dua golongan: ester (kokain, prokain, kloroprokain, tetrakain) dan amida (dibukain, lidokain, mepivakain, prilokain, bupivakain, etidokain, ropivakain).", "w": {"b": "Lidokain adalah amida.", "c": "Etidokain adalah amida.", "d": "Ropivakain adalah amida.", "e": "Bupivakain adalah amida."}, "hy": "Ester dimetabolisme pseudokolinesterase plasma dan menghasilkan PABA (alergi). Amida dimetabolisme di hati.", "ev": [{"deck": "INTRO", "page": 10, "quote": "Procaine, Tetracaine"}, {"deck": "LA", "page": 16, "quote": "DUA GOLONGAN ESTER AMIDE"}], "refs": []}, {"id": "A089", "sec": "anes", "stem": "Otot utama inspirasi adalah", "vig": null, "opts": ["Trapezius", "Interkostal", "Diafragma", "Otot abdomen", "Sternokleidomastoid (SCM)"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "c", "topic": "GD", "st": "peng", "deb": null, "note": null, "gl": null, "r": "Diafragma adalah otot inspirasi utama. Saat kontraksi, kubahnya turun sehingga dimensi vertikal toraks bertambah dan tekanan pleura turun. Pada napas tenang, diafragma menyumbang sebagian besar volume tidal. Interkostal eksterna, parasternal, dan skalenus membantu mengangkat iga, sedangkan SCM dan trapezius adalah otot bantu napas yang direkrut saat distres. Otot abdomen terutama berperan pada ekspirasi aktif (De Troyer & Boriek, 2011). Slide Toraks dr. Hartono menunjukkan diafragma turun saat inspirasi pada foto toraks.", "w": {"a": "Trapezius bukan otot napas utama.", "b": "Interkostal (eksterna) membantu inspirasi, tetapi bukan yang utama.", "d": "Otot abdomen adalah otot ekspirasi aktif.", "e": "SCM adalah otot bantu inspirasi yang direkrut saat distres."}, "hy": "Paralisis diafragma bilateral menyebabkan gerak paradoks abdomen (abdomen tertarik masuk saat inspirasi) dan ortopnea.", "ev": [{"deck": "THORAX", "page": 15, "quote": "Diafragma turun"}], "refs": ["detroyer2011"]}, {"id": "A090", "sec": "anes", "stem": "Penilaian yang digunakan untuk memprediksi kesulitan ventilasi dengan BVM (bag-valve-mask) adalah", "vig": null, "opts": ["MOANS", "LEMONS", "OANS", "SHORT", "RODS"], "src": ["Rekap UAB IPK 2024"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "PREP", "st": "luar", "deb": null, "note": null, "gl": null, "r": "MOANS adalah mnemonik prediktor sulit ventilasi bag-valve-mask (BVM): Mask seal (jenggot, trauma wajah), Obesity/Obstruction, Age >55, No teeth (ompong), dan Stiff lungs (sebagian versi memakai Snoring/Sleep apnea). Kheterpal dkk. (2006) membuktikan secara prospektif bahwa BMI ≥30, jenggot, Mallampati III–IV, usia ≥57, protrusi rahang terbatas, dan mendengkur merupakan prediktor independen sulit ventilasi sungkup. Slide Persiapan hanya menyebut kemampuan BMV dalam komponen \"Look externally\" dari LEMON.", "w": {"b": "LEMON(S) memprediksi intubasi (laringoskopi) sulit.", "c": "\"OANS\" bukan mnemonik baku.", "d": "SHORT memprediksi krikotirotomi sulit.", "e": "RODS memprediksi pemasangan alat supraglotik (LMA) sulit."}, "hy": "Empat dimensi airway sulit: BVM (MOANS), laringoskopi (LEMON), supraglotik (RODS), krikotirotomi (SHORT).", "ev": [{"deck": "PREP", "page": 13, "quote": "ability to BMV"}], "refs": ["kheterpal2006"]}, {"id": "A091", "sec": "anes", "stem": "Karakteristik gagal napas tipe 1 adalah", "vig": null, "opts": ["PaO₂ < 60 mmHg", "PAO₂ > 100 mmHg", "PaCO₂ > 50 mmHg", "pH < 7,15", "(opsi tidak tercatat d
