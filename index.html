<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--HEAD-START-->
<title>Bank Soal UAB IPK</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: ruang ujian ala Moodle — kolom kerja di kiri, grid navigasi di kanan; beranda = papan latihan */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#eaf0f8; --ink:#16233a; --muted:#5b6b82; --line:#d5dde8;
  --navy:#1e3a6b; --gold:#b9862a; --gold-soft:#f6ecd7; --q-box:#e8f1fb; --q-line:#b9d2ee;
  --ok:#2e7d4f; --ok-soft:#e3f3ea; --bad:#b4352e; --bad-soft:#f8e4e2; --warn:#9a6a12; --warn-soft:#fbf0d9;
  --answered:#3a8f5c; --answered-ink:#ffffff;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1622; --surface:#172131; --surface-2:#1d2a3d; --ink:#e6ecf5; --muted:#9aa9bf; --line:#2c3b52;
  --navy:#8fb3ec; --gold:#e0b45c; --gold-soft:#3a2f1a; --q-box:#1b2c44; --q-line:#31507a;
  --ok:#6cc792; --ok-soft:#173527; --bad:#f0857d; --bad-soft:#3d1f1d; --warn:#e9bf6b; --warn-soft:#3a2e15;
  --answered:#3f9e66; --answered-ink:#ffffff; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0f1622; --surface:#172131; --surface-2:#1d2a3d; --ink:#e6ecf5; --muted:#9aa9bf; --line:#2c3b52;
  --navy:#8fb3ec; --gold:#e0b45c; --gold-soft:#3a2f1a; --q-box:#1b2c44; --q-line:#31507a;
  --ok:#6cc792; --ok-soft:#173527; --bad:#f0857d; --bad-soft:#3d1f1d; --warn:#e9bf6b; --warn-soft:#3a2e15;
  --answered:#3f9e66; --answered-ink:#ffffff; color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--navy)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand b{font-family:var(--f-display);font-size:1.25rem;letter-spacing:.2px}
.brand span{font-size:.8rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.92rem}
nav.tabs a[aria-current="page"]{background:var(--surface-2);color:var(--ink)}
main{padding-block:24px 64px}
h1,h2,h3{text-wrap:balance;line-height:1.2}
h1{font-family:var(--f-display);font-size:clamp(1.7rem,3.6vw,2.4rem);margin:0 0 8px}
h2{font-family:var(--f-display);font-size:1.35rem;margin:0 0 10px}
h3{font-size:1rem;margin:0 0 6px}
.lede{color:var(--muted);max-width:68ch;margin:0}
.eyebrow{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);font-weight:700}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:var(--r);cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--surface)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1407}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.gold{background:var(--gold-soft);border-color:transparent;color:var(--warn)}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.navy{background:var(--q-box);border-color:transparent;color:var(--navy)}

/* HOME */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:end;margin-bottom:28px}
.stat-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .n{font-family:var(--f-mono);font-size:1.6rem;font-weight:600}
.stat .l{font-size:.8rem;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:28px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px}
.mode .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.mode ul{margin:0;padding-left:18px;color:var(--muted);font-size:.93rem}
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.note{border-top:2px solid var(--line);padding-top:10px;font-size:.92rem;color:var(--muted)}
.note b{color:var(--ink)}

/* DRILL setup */
.setup{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.topic-group{margin-bottom:16px}
.topic-group h3{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.topics{display:flex;flex-wrap:wrap;gap:8px}
.topic{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.92rem}
.topic input{accent-color:var(--navy);margin:0}
.topic .c{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.topic:has(input:checked){background:var(--q-box);border-color:var(--q-line)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-head h2{margin:0}
.sec-head p{margin:4px 0 0;color:var(--muted);font-size:.93rem;max-width:60ch}
.tchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.95rem;font-weight:700;color:var(--ink);text-decoration:none}
.tchip:hover{border-color:var(--navy)}
.tchip .c{font-family:var(--f-mono);font-size:.78rem;font-weight:500;color:var(--muted)}
.tchip.started{background:var(--q-box);border-color:var(--q-line)}
.tchip.done{background:var(--ok-soft);border-color:var(--ok)}
.tchip.done .c{color:var(--ok)}
.tchip.wrong{border-style:dashed}
.tchip.wrong .c{color:var(--bad)}
.tchip[aria-disabled="true"]{opacity:.5;pointer-events:none}
.dcells{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px;margin-top:10px}
.dcell{height:32px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-family:var(--f-mono);font-size:.8rem;cursor:pointer;color:var(--ink);padding:0}
.dcell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.dcell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.dcell.seen{background:var(--surface-2);color:var(--muted)}
.dcell.cur{outline:2px solid var(--navy);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;border:1px solid var(--line);margin-right:4px;vertical-align:-1px}
.side-sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:12px}
.opt-row{display:flex;align-items:center;gap:8px;font-size:.93rem}
.opt-row input{accent-color:var(--navy)}

/* QUESTION (shared) */
.qhead{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.qbox{background:var(--q-box);border:1px solid var(--q-line);border-radius:var(--r);padding:16px 18px}
.vig{background:var(--surface);border:1px dashed var(--q-line);border-radius:6px;padding:10px 12px;margin-bottom:10px;font-size:.94rem}
.stem{margin:0 0 12px;white-space:pre-line}
.qimg{display:block;max-width:min(100%,520px);border-radius:6px;border:1px solid var(--q-line);margin:4px 0 14px;background:#000}
.opts{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:6px;border:1px solid transparent;cursor:pointer;background:transparent;text-align:left;width:100%}
.opt:hover{background:var(--surface)}
.opt .L{font-family:var(--f-mono);font-weight:600;min-width:1.4em}
.opt input{margin-top:5px;accent-color:var(--navy)}
.opt.sel{background:var(--surface);border-color:var(--q-line)}
.opt.correct{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt[aria-disabled="true"]{cursor:default}
.src{font-size:.82rem;color:var(--muted);margin-top:12px}

/* EXPLANATION */
.expl{margin-top:16px;display:flex;flex-direction:column;gap:14px}
.verdict{display:flex;align-items:center;gap:10px;font-weight:700;padding:10px 14px;border-radius:var(--r)}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict.na{background:var(--surface-2);color:var(--muted)}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.block h4{margin:0 0 8px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.block p{margin:0;max-width:75ch}
.wrongs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.wrongs li{display:flex;gap:10px}
.wrongs .L{font-family:var(--f-mono);font-weight:600;color:var(--bad);min-width:1.4em}
.ev{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.ev figure{margin:0;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.ev img{width:100%;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;background:var(--surface-2)}
.ev figcaption{font-size:.88rem;display:flex;flex-direction:column;gap:6px;min-width:0}
.ev .deck{font-weight:700}
.ev blockquote{margin:0;padding:8px 12px;border-left:3px solid var(--gold);background:var(--gold-soft);border-radius:0 6px 6px 0;font-size:.92rem;color:var(--ink)}
.hy{background:var(--gold-soft);border-color:transparent}
.deb{background:var(--warn-soft);border-color:transparent}
.refs{margin:0;padding-left:18px;font-size:.86rem;color:var(--muted)}
.refs li{margin-bottom:4px}
.nolabel{background:var(--surface-2)}

/* DRILL runner */
.runner{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:start}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--navy)}
.nav-row{display:flex;gap:8px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}

/* TRYOUT (Moodle-like) */
.to-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.timer{font-family:var(--f-mono);font-size:1.15rem;font-weight:600;padding:6px 12px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.to-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.to-q{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:start}
.qinfo{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:.86rem;display:flex;flex-direction:column;gap:4px}
.qinfo .qn{font-size:1rem}
.qinfo .qn b{font-size:1.25rem;font-family:var(--f-mono)}
.flagbtn{display:inline-flex;align-items:center;gap:6px;margin-top:6px;background:none;border:none;padding:0;cursor:pointer;color:var(--navy);font-size:.86rem;text-align:left}
.flagbtn svg{width:14px;height:14px}
.navbox{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px}
.navbox h3{font-size:.95rem;margin-bottom:8px}
.navbox .grp{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
.cells{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.cell{position:relative;height:32px;border:1px solid var(--line);border-radius:4px;background:var(--surface);font-family:var(--f-mono);font-size:.74rem;cursor:pointer;padding:0;display:flex;align-items:flex-start;justify-content:center;padding-top:2px;overflow:hidden}
.cell::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background:var(--surface-2);border-top:1px solid var(--line)}
.cell.ans{background:var(--answered);color:var(--answered-ink);border-color:var(--answered)}
.cell.ans::after{background:color-mix(in srgb,var(--answered) 70%,#000);border-top-color:transparent}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.cell.flag::before{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 11px 11px 0;border-color:transparent var(--bad) transparent transparent;z-index:1}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.78rem;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid var(--line);display:inline-block;position:relative}
.sw.a{background:var(--answered);border-color:var(--answered)}
.sw.f::before{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 7px 7px 0;border-color:transparent var(--bad) transparent transparent}
.finish{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.navtoggle{display:none}
.confirm{background:var(--surface);border:2px solid var(--gold);border-radius:12px;padding:18px;margin-bottom:16px}

/* RESULTS */
.scorecard{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0 22px}
.score{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.score .big{font-family:var(--f-mono);font-size:1.9rem;font-weight:600}
.score .pct{font-family:var(--f-mono);color:var(--muted)}
.score.total{background:var(--navy);color:var(--surface);border-color:var(--navy)}
.score.total .pct{color:inherit;opacity:.8}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:700;font-size:.88rem}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.rev{display:flex;flex-direction:column;gap:10px}
details.ritem{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.ritem>summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center}
details.ritem>summary::-webkit-details-marker{display:none}
.rnum{font-family:var(--f-mono);font-weight:600;text-align:center;border-radius:6px;padding:4px 0}
.rnum.ok{background:var(--ok-soft);color:var(--ok)} .rnum.bad{background:var(--bad-soft);color:var(--bad)} .rnum.na{background:var(--surface-2);color:var(--muted)}
.rsum{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rans{font-size:.82rem;color:var(--muted);white-space:nowrap;font-family:var(--f-mono)}
.ritem .inner{padding:0 14px 14px}
table.hist{width:100%;border-collapse:collapse;font-size:.92rem}
table.hist th,table.hist td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.hist th{font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
table.hist td.mono{text-align:right} table.hist th.r{text-align:right}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.lightbox{position:fixed;inset:0;background:rgba(5,10,20,.88);z-index:50;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px;background:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;z-index:60;font-weight:700}

@media (max-width:900px){
  .cells{grid-template-columns:repeat(auto-fill,minmax(36px,1fr))}
  .cell{height:38px;font-size:.82rem}
  .hero,.setup,.runner{grid-template-columns:minmax(0,1fr)}
  .side-sticky{position:static}
  .notes{grid-template-columns:minmax(0,1fr)}
  .to-grid{grid-template-columns:minmax(0,1fr)}
  .to-side{order:-1}
  .navtoggle{display:inline-flex}
  .navbox.collapsed .navbody{display:none}
  .scorecard{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ev figure{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .modes,.stat-row{grid-template-columns:minmax(0,1fr)}
  .to-q{grid-template-columns:minmax(0,1fr)}
  .qinfo{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 14px}
  details.ritem>summary{grid-template-columns:40px minmax(0,1fr)}
  .rans{grid-column:2}
}
@media (prefers-reduced-motion:no-preference){ .opt,.btn,.cell{transition:background-color .15s,border-color .15s} }
</style>
<!--HEAD-END-->
</head>
<body>
<!--BODY-START-->
<header class="top"><div class="wrap">
  <a class="brand" href="#beranda"><b>Bank Soal UAB IPK</b><span>Anestesi · Radiologi</span></a>
  <nav class="tabs" aria-label="Navigasi utama">
    <a href="#beranda" data-v="beranda">Beranda</a>
    <a href="#drilling" data-v="drilling">Drilling</a>
    <a href="#tryout" data-v="tryout">Try-out</a>
    <a href="#riwayat" data-v="riwayat">Riwayat</a>
  </nav>
</div></header>

<script id="bank" type="application/json">{"items": [{"id": "A001", "sec": "anes", "stem": "Pasien laki-laki 50 tahun, obesitas, napas berbunyi mendengkur (snoring), tampak retraksi dada, dan saturasi turun. Apa tindakan airway awal yang paling tepat?", "vig": null, "opts": ["Intubasi segera", "Heimlich maneuver", "Jaw thrust", "Head tilt-chin lift", "Tidak melakukan apa-apa"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "d", "topic": "GD", "st": "ppt", "deb": "Sebagian penyusun soal mungkin menerima jaw thrust. Slide membedakan non-trauma (head tilt/chin lift/jaw thrust) dan trauma (jaw thrust saja); karena tidak ada trauma, head tilt–chin lift paling tepat.", "note": null, "gl": null, "r": "Snoring (ngorok) adalah tanda sumbatan jalan napas parsial di level faring yang hampir selalu disebabkan lidah jatuh ke belakang, terutama pada pasien obesitas. Retraksi dan desaturasi menunjukkan sumbatan itu sudah mengganggu ventilasi. Tidak ada riwayat trauma, jadi manuver manual pertama yang sesuai slide untuk pasien non-trauma adalah head tilt–chin lift, yang mengangkat dasar lidah dari dinding posterior faring. Jaw thrust disimpan untuk curiga cedera servikal atau bila head tilt–chin lift gagal. Kalau manuver manual belum cukup, lanjutkan dengan alat bantu (OPA/NPA) sebelum airway definitif.", "w": {"a": "Intubasi bukan langkah awal; buka jalan napas secara manual dulu, oksigenasi, lalu nilai respons.", "b": "Heimlich (abdominal thrust) untuk choking oleh benda asing pada pasien sadar, bukan untuk snoring akibat lidah.", "c": "Jaw thrust dianjurkan pada trauma (curiga cedera servikal). Di kasus non-trauma tetap boleh, tapi bukan pilihan awal menurut slide.", "e": "Desaturasi dengan retraksi adalah kegawatan airway; diam berarti membiarkan hipoksia memburuk."}, "hy": "Suara tambahan → lokasi sumbatan: snoring = lidah; gurgling = cairan (suction); stridor/crowing = penyempitan laring/trakea.", "ev": [{"deck": "GD", "page": 14, "quote": "Snoring → Lidah"}, {"deck": "GD", "page": 15, "quote": "Non trauma : Head tilt Neck lift Chin lift Jaw thrust"}], "refs": []}, {"id": "A002", "sec": "anes", "stem": "Seorang pasien mengalami penurunan saturasi setelah induksi. Tindakan pertama yang paling tepat?", "vig": null, "opts": ["Ganti mesin anestesi", "Tambah agen inhalasi", "Mengecek koneksi sirkuit dan memastikan oksigen mengalir", "Memberikan opioid tambahan", "Memberikan vasopresor"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "c", "topic": "INTRO", "st": "peng", "deb": null, "note": null, "gl": null, "r": "Desaturasi tepat setelah induksi paling cepat diperbaiki dengan memastikan oksigen benar-benar sampai ke pasien. Hal pertama yang dicek adalah sumber oksigen, flowmeter, koneksi sirkuit, posisi ETT/sungkup, dan gerak dada. Banyak penyebab desaturasi pascainduksi bersifat mekanis: sirkuit lepas, kebocoran, ETT masuk esofagus atau bronkus, atau aliran O₂ tertutup. Penyebab mekanis bisa dikoreksi dalam hitungan detik tanpa menambah obat. Slide intro menegaskan bahwa mesin, breathing system, dan scavenging adalah satu rantai yang menjaga fisiologi pasien, sehingga kegagalan di satu titik langsung memengaruhi oksigenasi.", "w": {"a": "Mengganti mesin bukan langkah pertama; cek dulu koneksi dan aliran, dan beri ventilasi manual dengan BVM bila perlu.", "b": "Menambah agen inhalasi memperdalam anestesi dan bisa menambah depresi kardiorespirasi. Itu tidak menjawab masalah oksigenasi.", "d": "Opioid menambah depresi napas.", "e": "Vasopresor untuk hipotensi, bukan hipoksemia. Masalah oksigenasi harus diselesaikan lebih dulu."}, "hy": "Pendekatan desaturasi intraoperatif: 100% O₂ → cek pasien–ETT–sirkuit–mesin (bergerak dari pasien ke mesin) → ventilasi manual → cari penyebab (bronkospasme, pneumotoraks, aspirasi, dll.).", "ev": [{"deck": "INTRO", "page": 16, "quote": "Anesthesia Machine (Vaporizer/Flowmeter)"}], "refs": ["tb_morgan"]}, {"id": "A003", "sec": "anes", "stem": "Pasien pneumonia berat, saturasi 88% dengan oksigen nasal kanul 6 L/menit. Berdasarkan patofisiologi, penyebab hipoksemia tersering adalah:", "vig": null, "opts": ["Tekanan atmosfer rendah", "Shunt intrapulmonal", "Dead space murni", "Tingginya FiO₂", "Hipoventilasi murni"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "b", "topic": "AB", "st": "luar", "deb": null, "note": null, "gl": null, "r": "Pada pneumonia berat, alveoli terisi eksudat sehingga tidak terventilasi, padahal darah tetap mengalir melewatinya. Inilah shunt intrapulmonal (V/Q = 0) atau area V/Q sangat rendah. Darah dari unit tersebut kembali ke sirkulasi sistemik tanpa teroksigenasi dan menurunkan PaO₂. Ciri khas shunt adalah respons yang buruk terhadap tambahan oksigen: SpO₂ tetap 88% walaupun O₂ nasal sudah 6 L/menit. Petersson & Glenny (2014) menyebut shunt dan area V/Q rendah sebagai penyebab hipoksemia tersering, dan hipoksemia akibat shunt sulit dikoreksi dengan O₂.", "w": {"a": "Tekanan atmosfer rendah hanya relevan di dataran tinggi.", "c": "Dead space (V/Q tinggi) terutama mengganggu pembuangan CO₂ dan meningkatkan kerja napas, bukan penyebab utama hipoksemia.", "d": "FiO₂ tinggi justru menaikkan PaO₂.", "e": "Hipoventilasi murni disertai PaCO₂ tinggi dan mudah dikoreksi dengan O₂; bukan mekanisme utama pada pneumonia."}, "hy": "Lima mekanisme hipoksemia: FiO₂ rendah, hipoventilasi, gangguan difusi, V/Q mismatch, shunt. Hanya shunt yang \"kebal\" O₂. Gradien A-a normal pada FiO₂ rendah dan hipoventilasi.", "ev": [], "refs": ["petersson2014"]}, {"id": "A004", "sec": "anes", "stem": "Definisi syok adalah:", "vig": null, "opts": ["Penurunan tekanan darah < 90 mmHg", "Penurunan curah jantung akut", "Ketidakmampuan sistem sirkulasi mempertahankan perfusi jaringan yang adekuat", "Penurunan saturasi oksigen < 80%", "Peningkatan nadi > 120x/menit"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "c", "topic": "SHOCK", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Syok didefinisikan dari kegagalan sirkulasi memenuhi kebutuhan jaringan, bukan dari angka tekanan darah. Sirkulasi tidak mampu mempertahankan perfusi dan oksigenasi jaringan yang adekuat, sehingga terjadi hipoksia seluler. Slide Syok menulis \"a state of cellular and tissue hypoxia\", dan slide Gawat Darurat menulis \"inadequate organ perfusion and tissue oxygenation\". Pasien bisa sudah syok dengan tekanan darah masih normal karena mekanisme kompensasi. Slide Intro menegaskan bahwa hipotensi adalah tanda lambat.", "w": {"a": "TD <90 mmHg sering menyertai syok tetapi merupakan tanda lambat, bukan definisi.", "b": "Curah jantung bisa normal atau tinggi, misalnya pada syok distributif/septik.", "d": "SpO₂ <80% adalah hipoksemia (masalah oksigenasi paru), bukan syok.", "e": "Takikardia adalah tanda kompensasi, bukan definisi."}, "hy": "Tanda hipoperfusi universal (slide Intro): takikardia, laktat ↑, perubahan status mental, kulit mottled, oliguria. Hipotensi = tanda lambat.", "ev": [{"deck": "SHOCK", "page": 9, "quote": "Shock is defined as a state of cellular and tissue hypoxia"}, {"deck": "GD", "page": 48, "quote": "inadequate organ perfusion and tissue oxygenation"}], "refs": []}, {"id": "A005", "sec": "anes", "stem": "Perbedaan utama metabolisme anestesi lokal golongan ester dibanding amida adalah:", "vig": null, "opts": ["Ester dimetabolisme oleh pseudokolinesterase plasma", "Ester lebih stabil dalam larutan dibanding amida", "Ester dimetabolisme di hati", "Ester tidak pernah menyebabkan toksisitas", "Ester memiliki onset lebih cepat daripada amida"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "LA", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Ester dihidrolisis cepat di plasma oleh pseudokolinesterase (butirilkolinesterase), sedangkan amida harus dibawa ke hati dan dimetabolisme oleh enzim mikrosomal hepar. Perbedaan ini punya dua konsekuensi klinis. Pertama, ester bekerja singkat, kecuali pada pasien dengan defisiensi pseudokolinesterase. Kedua, hasil hidrolisis ester adalah PABA, yang menjelaskan potensi alerginya yang tinggi. Pada amida, penyakit hati berat memperlambat eliminasi sehingga dosis harus dikurangi.", "w": {"b": "Justru amida yang lebih stabil dalam larutan. Ester relatif tidak stabil karena mudah terhidrolisis.", "c": "Yang dimetabolisme di hati adalah amida.", "d": "Ester tetap bisa menimbulkan toksisitas sistemik (LAST), dan kokain bahkan toksik secara kardiovaskular.", "e": "Onset ditentukan terutama oleh pKa, bukan golongan ester/amida."}, "hy": "Trik nama: amida punya dua huruf \"i\" (lIdocaIne, bupIvacaIne); ester hanya satu (procaine, tetracaine, chloroprocaine, cocaine).", "ev": [{"deck": "LA", "page": 14, "quote": "Di metabolisme di plasma oleh enzim choline esterase / pseudocholine esterase"}, {"deck": "INTRO", "page": 10, "quote": "Hydrolyzed by plasma pseudocholinesterase"}], "refs": []}, {"id": "A006", "sec": "anes", "stem": "Pasien 25 tahun akan diinduksi anestesi umum. Saat dilakukan laringoskopi, struktur sangat sulit terlihat; hanya dasar uvula yang terlihat (Mallampati III). Apa interpretasinya?", "vig": null, "opts": ["Tidak boleh diberi anestesi umum", "Risiko intubasi sulit meningkat", "Mallampati I", "Airway normal", "Harus dilakukan trakeostomi segera"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "b", "topic": "PREP", "st": "ppt", "deb": null, "note": "Stem menyebut \"saat laringoskopi\", padahal Mallampati dinilai sebelum laringoskopi (pasien duduk, membuka mulut, menjulurkan lidah). Kemungkinan ini kekeliruan perekam soal; kunci tetap b.", "gl": null, "r": "Sebelum menjawab, perhatikan satu kekeliruan di stem: Mallampati dinilai saat pasien duduk, membuka mulut, dan menjulurkan lidah, bukan saat laringoskopi (yang dinilai saat laringoskopi adalah Cormack–Lehane). Terlepas dari itu, Mallampati III, yaitu hanya palatum mole dan basis uvula yang terlihat, berarti ruang orofaring relatif sempit terhadap ukuran lidah. Akibatnya laring lebih sulit diekspos dan risiko intubasi sulit meningkat. Slide Persiapan menampilkan modifikasi Mallampati (Samsoon & Young) sebagai prediktor kesulitan intubasi. Interpretasinya adalah persiapan rencana jalan napas sulit, bukan kontraindikasi anestesi umum.", "w": {"a": "Mallampati III bukan kontraindikasi anestesi umum; yang diperlukan adalah persiapan difficult airway.", "c": "Mallampati I berarti palatum mole, fauces, uvula, dan pilar tonsil semuanya terlihat.", "d": "Kelas III adalah prediktor jalan napas sulit, bukan airway normal.", "e": "Trakeostomi bukan respons terhadap skor Mallampati."}, "hy": "Mallampati (duduk, lidah dijulurkan) berkorelasi dengan Cormack–Lehane (saat laringoskopi). Satu tes saja kurang prediktif, jadi gunakan LEMON(S).", "ev": [{"deck": "PREP", "page": 14, "quote": "Difficulty of intubation based on modified Mallampati classification"}], "refs": []}, {"id": "A007", "sec": "anes", "stem": "Pasien asma dengan wheezing datang untuk operasi elektif. Langkah preoperatif yang tepat adalah?", "vig": null, "opts": ["Operasi dilanjutkan, wheezing adalah hal normal", "Batasi cairan intraoperatif", "Berikan bronkodilator dan optimasi dulu", "Tidak perlu evaluasi tambahan", "Ganti anestesi inhalasi dengan anestesi lokal"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "c", "topic": "PREP", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Wheezing berarti bronkospasme aktif, yaitu asma yang tidak terkontrol. Instrumentasi jalan napas (intubasi) pada saluran napas yang hiperreaktif dapat memicu bronkospasme berat, hipoksemia, dan barotrauma. Operasi elektif harus dikerjakan dalam kondisi optimal. Langkah yang benar adalah mengoptimalkan dulu dengan bronkodilator dan, bila perlu, kortikosteroid, lalu menunda operasi sampai bebas wheezing. Ini sesuai keluaran \"operasi ditunda\" di slide Persiapan.", "w": {"a": "Wheezing bukan hal normal; itu tanda obstruksi aktif yang menaikkan risiko komplikasi paru.", "b": "Restriksi cairan tidak mengatasi bronkospasme.", "d": "Pasien wheezing justru wajib dievaluasi dan dioptimalkan.", "e": "Mengganti teknik anestesi tanpa mengoptimalkan paru bukan jawaban utama, dan anestesi lokal tidak selalu cukup untuk laparotomi atau operasi besar."}, "hy": "Tiga keluaran evaluasi pra-anestesi: sesuai rencana, ditunda (untuk optimalisasi), batal.", "ev": [{"deck": "PREP", "page": 6, "quote": "Membuat kondisi pasien lebih optimal terhadap penyakit penyerta"}, {"deck": "PREP", "page": 2, "quote": "Operasi elektif harus dilakukan dalam kondisi optimal"}], "refs": []}, {"id": "A008", "sec": "anes", "stem": "Pasien 30 tahun, BB 60 kg, EBV 70 mL/kg. Perkiraan kehilangan darah (EBL) 40%. Jumlah darah yang hilang adalah", "vig": null, "opts": ["1.400 mL", "1.700 mL", "1.200 mL", "1.000 mL", "1.800 mL"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "b", "topic": "FLUID", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "EBV = 70 mL/kg × 60 kg = 4.200 mL. EBL 40% = 0,40 × 4.200 = 1.680 mL, dibulatkan ±1.700 mL. Kehilangan 40% volume darah setara perdarahan kelas III–IV (ATLS) dengan hipotensi yang jelas, sehingga darah perlu diganti, bukan hanya kristaloid. Slide Terapi Cairan memakai EBV 70 mL/kg untuk laki-laki dan 65 mL/kg untuk perempuan.", "w": {"a": "1.400 mL ≈ 33% EBV.", "c": "1.200 mL ≈ 29% EBV.", "d": "1.000 mL ≈ 24% EBV.", "e": "1.800 mL ≈ 43% EBV, terlalu besar untuk 40%."}, "hy": "EBV: laki-laki 70, perempuan 65, anak ±80 mL/kg (slide). Penggantian: kristaloid 2–4× EBL, koloid 1–2×, whole blood 1×.", "ev": [{"deck": "FLUID", "page": 20, "quote": "Laki laki : 70 ml / kgBB"}], "refs": []}, {"id": "A009", "sec": "anes", "stem": "Intervensi awal yang paling tepat adalah", "vig": "Pria 58 tahun datang dengan sesak berat setelah batuk hebat. A: bicara 1 kata, tampak panik. B: RR 40x/menit, SpO₂ 78% dengan nasal kanul; hemitoraks kanan ekspansi minimal, hipersonor, trakea deviasi ke kiri. C: TD 80/45 mmHg, nadi 135x/menit, CRT 5 detik. D: GCS 14. E: suhu 37,8 °C. Diagnosis klinis mengarah ke tension pneumothorax.", "opts": ["Foto toraks dulu", "Needle decompression segera", "Intubasi dulu", "NRBM", "Berikan diuretik"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "b", "topic": "GD", "st": "peng", "deb": null, "note": null, "gl": null, "r": "Tension pneumotoraks adalah diagnosis klinis. Tandanya distres berat, hemitoraks hipersonor dengan ekspansi minimal, trakea terdorong ke kontralateral, dan hipotensi/takikardia. Kondisi ini adalah syok obstruktif yang dapat membunuh dalam hitungan menit. Tindakan awal adalah dekompresi jarum segera, tanpa menunggu foto toraks. ATLS 10th merekomendasikan lokasi ICS 4–5 linea midaksilaris anterior pada dewasa, sedangkan ICS 2 midklavikula adalah lokasi klasik. Slide Gawat Darurat dan ICU memasukkan tension pneumotoraks ke dalam syok obstruktif.", "w": {"a": "Menunggu foto toraks menunda tindakan penyelamatan nyawa; diagnosisnya klinis.", "c": "Ventilasi tekanan positif setelah intubasi justru memperbesar tension, sehingga dekompresi harus didahulukan.", "d": "O₂ tetap diberikan, tetapi tidak menyelesaikan masalah obstruksinya.", "e": "Diuretik tidak berperan."}, "hy": "Trias klasik: distres + hipersonor/suara napas hilang unilateral + deviasi trakea kontralateral (+ distensi vena leher, hipotensi). Dekompresi jarum lalu chest tube.", "ev": [{"deck": "GD", "page": 51, "quote": "Obstructive - Tension pneumothorax - Cardiac tamponade"}], "refs": ["tb_atls", "roberts2015"]}, {"id": "A010", "sec": "anes", "stem": "Pada sirkuit anestesi tertutup (closed circuit), komponen yang berfungsi menghilangkan (menyerap) CO₂ adalah", "vig": null, "opts": ["APL valve", "Soda lime", "Vaporizer", "Flowmeter", "Kantong reservoir (reservoir bag)"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "b", "topic": "INTRO", "st": "luar", "deb": null, "note": null, "gl": null, "r": "Pada sirkuit tertutup (circle system), gas ekspirasi dialirkan kembali ke pasien. CO₂-nya harus dibuang secara kimiawi oleh absorber, biasanya soda lime (Ca(OH)₂ + NaOH/KOH). Reaksinya menghasilkan CaCO₃, air, dan panas, dan indikator warna berubah ketika absorbennya jenuh. Parthasarathy (2013) menjelaskan bahwa absorberlah yang memungkinkan aliran gas segar sangat rendah (250–500 mL) dan sirkuit benar-benar tertutup.", "w": {"a": "Katup APL (adjustable pressure limiting) membuang kelebihan gas/tekanan, bukan mengikat CO₂ secara kimia.", "c": "Vaporizer menguapkan agen inhalasi.", "d": "Flowmeter mengatur aliran gas segar.", "e": "Kantong reservoir menampung gas untuk ventilasi manual/spontan."}, "hy": "Absorben jenuh → CO₂ terinspirasi (rebreathing) → hiperkapnia. Tandanya kapnogram tidak kembali ke nol dan indikator berubah warna.", "ev": [], "refs": ["parthasarathy2013", "tb_morgan"]}, {"id": "A011", "sec": "anes", "stem": "Pada kasus di atas, mengapa pasien mengalami hipotensi?", "vig": "Pria 58 tahun datang dengan sesak berat setelah batuk hebat. A: bicara 1 kata, tampak panik. B: RR 40x/menit, SpO₂ 78% dengan nasal kanul; hemitoraks kanan ekspansi minimal, hipersonor, trakea deviasi ke kiri. C: TD 80/45 mmHg, nadi 135x/menit, CRT 5 detik. D: GCS 14. E: suhu 37,8 °C. Diagnosis klinis mengarah ke tension pneumothorax.", "opts": ["Obstruksi vena kava akibat tekanan pleura yang meningkat", "Kehilangan cairan", "Vasodilatasi akibat sepsis", "Bradikardia", "Efek samping oksigen"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "ICU2", "st": "peng", "deb": null, "note": "Soal asli hanya menulis \"soal sama seperti atasnya\". Kasus yang dimaksud adalah kasus tension pneumothorax pada soal sebelumnya, dan kini ditampilkan lengkap di atas.", "gl": null, "r": "Pada tension pneumotoraks, udara masuk ke rongga pleura tanpa bisa keluar (mekanisme katup satu arah), sehingga tekanan intratoraks naik terus. Tekanan positif ini menekan vena kava dan atrium kanan serta mendorong mediastinum. Aliran balik vena (preload) turun drastis, curah jantung ikut turun, dan terjadilah hipotensi. Inilah definisi syok obstruktif. Tabel slide ICU menunjukkan bahwa syok obstruktif ditandai curah jantung rendah dengan resistensi vaskular dan tekanan pengisian tinggi.", "w": {"b": "Tidak ada data kehilangan cairan/perdarahan di kasus ini.", "c": "Subfebris (37,8 °C) tidak cukup untuk syok septik, dan mekanismenya jelas mekanis.", "d": "Pasien takikardia (135x/menit), bukan bradikardia.", "e": "Oksigen tidak menyebabkan hipotensi."}, "hy": "Syok obstruktif: tension pneumotoraks, tamponade jantung, emboli paru masif. Terapinya menghilangkan obstruksi; cairan atau vasopresor hanya sementara.", "ev": [{"deck": "ICU2", "page": 25, "quote": "Obstructive PE, tamponade, tension pneumothorax"}], "refs": ["roberts2015"]}, {"id": "A012", "sec": "anes", "stem": "Berikut ini yang BUKAN komponen penilaian airway preoperatif adalah", "vig": null, "opts": ["Mallampati", "Visibilitas uvula", "Jarak interinsisivus (interincisor distance)", "Jarak tiromental (thyromental distance)", "Otoskopi"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "e", "topic": "PREP", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Slide Persiapan mendaftar komponen pemeriksaan jalan napas: panjang dan kondisi gigi seri, hubungan gigi atas-bawah, kemampuan memajukan mandibula, jarak interinsisor, visibilitas uvula (Mallampati), ruang mandibula, jarak tiromental, panjang dan lingkar leher, serta rentang gerak kepala-leher. Otoskopi adalah pemeriksaan telinga dan sama sekali tidak menilai jalan napas untuk intubasi.", "w": {"a": "Mallampati adalah komponen utama (visibilitas uvula).", "b": "Visibilitas uvula tercantum di slide.", "c": "Jarak interinsisor tercantum di slide.", "d": "Jarak tiromental tercantum di slide."}, "hy": "LEMONS: Look externally, Evaluate 3-3-2, Mallampati, Obstruction, Neck mobility, Saturation.", "ev": [{"deck": "PREP", "page": 12, "quote": "KOMPONEN PEMERIKSAAN JALAN NAPAS"}, {"deck": "PREP", "page": 12, "quote": "Jarak interincisor"}], "refs": []}, {"id": "A013", "sec": "anes", "stem": "Obat anestesi lokal yang paling kardiotoksik adalah", "vig": null, "opts": ["Mepivakain", "Lidokain", "Bupivakain", "Prokain", "Prilokain"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "c", "topic": "LA", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Bupivakain paling kardiotoksik di antara pilihan yang ada. Obat ini sangat lipofilik dan berikatan kuat dengan kanal Na⁺ jantung dengan pola \"fast-in, slow-out\": cepat masuk tetapi lambat lepas. Akibatnya blokade konduksi menumpuk antardenyut, memicu aritmia ventrikel dan depresi kontraktilitas, dan henti jantungnya terkenal sulit diresusitasi. Slide Toksisitas mencatat secara khusus \"Cardiac arrest (bupivacaine)\".", "w": {"a": "Mepivakain kardiotoksisitasnya lebih rendah dari bupivakain. Slide Farmakologi hlm. 60 mencatat mepivakain tidak dipakai di anestesi obstetri karena toksik bagi neonatus; itu toksisitas pada janin, bukan kardiotoksisitas terkuat.", "b": "Lidokain memiliki indeks terapi jantung yang lebih lebar (bahkan dipakai sebagai antiaritmia).", "d": "Prokain (ester) masa kerjanya singkat; masalah utamanya alergi.", "e": "Masalah khas prilokain adalah methemoglobinemia, bukan kardiotoksisitas."}, "hy": "Toksisitas spesifik di slide: alergi (ester), Met-Hb (prilokain), adiksi (kokain), cardiac arrest (bupivakain).", "ev": [{"deck": "LA", "page": 23, "quote": "CARDIAC-ARREST (BUPIVACAINE)"}], "refs": []}, {"id": "A014", "sec": "anes", "stem": "Pasien 50 tahun akan menjalani laparotomi elektif. Riwayat merokok 30 pack-year dan batuk produktif. Langkah preoperatif yang paling sesuai?", "vig": null, "opts": ["Diet tinggi kalori", "Induksi dengan ketamin", "Berhenti merokok minimal 4–8 minggu dan optimasi paru", "Tidak perlu apa-apa", "Langsung CT scan toraks"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 2, "inc": false, "img": null, "pool": "all", "key": "c", "topic": "PREP", "st": "peng", "deb": null, "note": null, "gl": null, "r": "Perokok berat dengan batuk produktif berisiko tinggi mengalami komplikasi paru pascaoperasi, seperti atelektasis, pneumonia, dan bronkospasme, terutama setelah laparotomi yang mengganggu mekanika napas. Karena operasinya elektif, ada waktu untuk optimalisasi: berhenti merokok dan fisioterapi atau optimasi paru. Meta-analisis Wong dkk. (2012) menunjukkan berhenti merokok >4 minggu menurunkan komplikasi respirasi (RR 0,77), dan >8 minggu lebih kuat lagi (RR 0,53). Berhenti kurang dari 4 minggu tidak menurunkan risiko, tetapi juga tidak memperburuk. Slide Persiapan hanya meminta riwayat merokok digali; angka 4–8 minggu berasal dari literatur.", "w": {"a": "Diet tinggi kalori tidak mengatasi risiko paru.", "b": "Pilihan agen induksi bukan langkah optimalisasi praoperatif.", "d": "Risiko paru yang tinggi pada operasi elektif harus dioptimalkan.", "e": "CT toraks tidak rutin tanpa indikasi spesifik."}, "hy": "Berhenti merokok: ≥4 minggu menurunkan komplikasi respirasi; ≥3–4 minggu menurunkan komplikasi penyembuhan luka (Wong 2012).", "ev": [{"deck": "PREP", "page": 9, "quote": "Penggunaan minuman alcohol, merokok dan obat terlarang"}], "refs": ["wong2012"]}, {"id": "A015", "sec": "anes", "stem": "Intervensi pertama yang paling tepat adalah", "vig": "Pasien 44 tahun dengan emfisema disuntik lidokain 5 mL untuk infiltrasi lokal sebelum pemasangan akses IV. Tidak lama kemudian pasien mengeluh telinga berdenging, mulut terasa seperti logam (besi), tremor, dan cemas.", "opts": ["Furosemid", "Saline flush", "Hentikan pemberian anestesi lokal + oksigen 100%", "Adrenalin bolus", "Defibrilasi"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "c", "topic": "LA", "st": "peng", "deb": null, "note": null, "gl": null, "r": "Tinitus, rasa logam di mulut, tremor, dan cemas setelah injeksi lidokain adalah gejala toksisitas sistemik anestesi lokal (LAST) fase eksitasi SSP. Langkah pertama: hentikan injeksi anestesi lokal, minta bantuan, amankan jalan napas, dan beri O₂ 100%. Hipoksia dan asidosis memperberat toksisitas, sehingga mencegahnya adalah inti terapi awal. Slide Toksisitas menempatkan \"ABC resusitasi\" di urutan pertama, diikuti penanganan kejang, cairan, vasopresor, dan lipid emulsion. Checklist ASRA 2020 juga dimulai dengan menghentikan injeksi, memanggil bantuan, dan mengelola jalan napas dengan O₂ 100%.", "w": {"a": "Furosemid tidak berperan.", "b": "Saline flush malah mendorong sisa obat ke sirkulasi.", "d": "Bolus adrenalin dosis besar tidak diberikan pada gejala awal. Bila terjadi henti jantung akibat LAST, ASRA menganjurkan dosis adrenalin kecil (≤1 µg/kg).", "e": "Defibrilasi hanya untuk VF/pVT."}, "hy": "Gejala SSP mendahului kardiovaskular; gejala kardiovaskular jarang tetapi sulit dikelola (slide). Intravaskular: gejala <5 menit; infiltrasi: ±20 menit.", "ev": [{"deck": "LA", "page": 28, "quote": "ABC resusitasi atasi kejang"}], "refs": ["neal2020", "neal2018"]}, {"id": "A016", "sec": "anes", "stem": "Diagnosis yang paling mungkin adalah", "vig": "Pasien 44 tahun dengan emfisema disuntik lidokain 5 mL untuk infiltrasi lokal sebelum pemasangan akses IV. Tidak lama kemudian pasien mengeluh telinga berdenging, mulut terasa seperti logam (besi), tremor, dan cemas.", "opts": ["LAST (toksisitas sistemik anestesi lokal) fase awal", "Efek psikosomatik", "Syok anafilaksis", "Alergi anestesi lokal", "Efek analgesia"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "LA", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Kumpulan gejala tinitus, rasa logam, tremor, dan cemas yang muncul segera setelah injeksi lidokain adalah tahap awal LAST, yaitu fase eksitasi SSP. Anestesi lokal lebih dulu memblok jalur inhibisi di korteks, sehingga yang muncul pertama adalah eksitasi. Bila kadar terus naik, terjadi kejang, lalu depresi SSP, apnea, dan akhirnya toksisitas kardiovaskular. Gejala ini tidak cocok dengan alergi atau anafilaksis karena tidak ada urtikaria, bronkospasme, atau hipotensi.", "w": {"b": "Gejala objektif seperti tremor dan tinitus setelah obat dengan potensi toksik tidak boleh dianggap psikosomatik.", "c": "Anafilaksis ditandai urtikaria, bronkospasme/angioedema, dan hipotensi.", "d": "Alergi amida sangat jarang, dan gambarannya berbeda (kulit/respirasi).", "e": "Efek analgesia bersifat lokal, tidak menimbulkan gejala SSP."}, "hy": "Urutan LAST: eksitasi SSP (perioral, tinitus, rasa logam, gelisah, tremor) → kejang → depresi SSP/apnea → depresi kardiovaskular/aritmia.", "ev": [{"deck": "LA", "page": 24, "quote": "GEJALA SSP LEBIH DULU TIMBUL DARIPADA GEJALA KARDIOVASKULER"}], "refs": []}, {"id": "A017", "sec": "anes", "stem": "Bila pasien kejang, obat apa yang diberikan?", "vig": "Pasien 44 tahun dengan emfisema disuntik lidokain 5 mL untuk infiltrasi lokal sebelum pemasangan akses IV. Tidak lama kemudian pasien mengeluh telinga berdenging, mulut terasa seperti logam (besi), tremor, dan cemas.", "opts": ["Ketamin", "Opioid", "Midazolam", "Propofol bolus besar", "Suksinilkolin"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "c", "topic": "LA", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Kejang akibat LAST diatasi dengan benzodiazepin, dan midazolam adalah pilihan utama karena efektif dengan depresi kardiovaskular yang minimal. Slide Toksisitas mencantumkan \"midazolam, pentotal, propofol\". Pedoman ASRA menekankan bahwa propofol hanya boleh dosis kecil dan sebaiknya dihindari bila ada tanda instabilitas kardiovaskular, karena efek depresi miokardnya menambah kardiotoksisitas anestesi lokal.", "w": {"a": "Ketamin bukan antikonvulsan lini pertama.", "b": "Opioid tidak menghentikan kejang dan menambah depresi napas.", "d": "Propofol bolus besar berbahaya karena hipotensi dan depresi miokard memperparah LAST.", "e": "Suksinilkolin hanya melumpuhkan otot; aktivitas kejang di otak tetap berjalan. Dipakai hanya untuk mempermudah ventilasi."}, "hy": "Kejang pada LAST → benzodiazepin. Hindari propofol dosis besar, vasopresin, CCB, β-blocker, dan anestesi lokal lain (ASRA).", "ev": [{"deck": "LA", "page": 28, "quote": "atasi kejang (midazolam, pentotal, propofol)"}], "refs": ["neal2018"]}, {"id": "A018", "sec": "anes", "stem": "Kapan emulsi lipid (lipid emulsion) diberikan?", "vig": "Pasien 44 tahun dengan emfisema disuntik lidokain 5 mL untuk infiltrasi lokal sebelum pemasangan akses IV. Tidak lama kemudian pasien mengeluh telinga berdenging, mulut terasa seperti logam (besi), tremor, dan cemas.", "opts": ["Pada gejala ringan", "Bila terjadi kejang atau tanda kardiotoksik", "Saat saturasi normal", "Setelah operasi selesai", "Pada semua pasien LAST"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "b", "topic": "LA", "st": "peng", "deb": null, "note": null, "gl": "Protokol di slide adalah versi lama. Checklist ASRA 2020: pasien >70 kg diberi bolus 100 mL dalam 2–3 menit lalu infus 200–250 mL dalam 15–20 menit; pasien ≤70 kg diberi bolus 1,5 mL/kg dalam 2–3 menit lalu infus sekitar 0,25 mL/kg/menit. Batas dosis total sekitar 12 mL/kg.", "r": "Emulsi lipid 20% bekerja sebagai \"lipid sink\". Fase lipid menarik molekul anestesi lokal yang lipofilik keluar dari jaringan target, terutama jantung, dan juga punya efek inotropik langsung. ASRA menganjurkan lipid diberikan pada tanda pertama LAST yang serius: kejang yang tidak segera teratasi, tanda kardiotoksik seperti aritmia, hipotensi, atau bradikardia, dan henti jantung. Lipid tidak diberikan untuk gejala ringan yang membaik dengan tindakan suportif. Slide Toksisitas memuat protokol Intralipid 20%: bolus 1,5 mL/kg, lalu infus 0,25 mL/kg/menit.", "w": {"a": "Gejala ringan cukup dengan menghentikan obat, O₂, dan observasi.", "c": "Saturasi normal bukan kriteria pemberian.", "d": "Pasca-operasi bukan patokan; yang menentukan adalah beratnya gejala.", "e": "Tidak semua LAST perlu lipid; diberikan pada LAST serius."}, "hy": "Lipid 20% menurut slide: bolus 1,5 mL/kg dalam 1 menit, infus 0,25 mL/kg/menit, bolus boleh diulang 2× dengan jeda 5 menit.", "ev": [{"deck": "LA", "page": 29, "quote": "Treatment of cardiac arrest with lipid emulsion"}], "refs": ["neal2018", "neal2020"]}, {"id": "A019", "sec": "anes", "stem": "Pasien semakin gelisah, dan saturasi turun dari 94% menjadi 88% setelah gejala awal toksisitas anestesi lokal muncul. Auskultasi tidak menunjukkan ronki ataupun stridor. Mekanisme yang paling mungkin menjelaskan penurunan saturasi ini adalah", "vig": "Pasien 44 tahun dengan emfisema disuntik lidokain 5 mL untuk infiltrasi lokal sebelum pemasangan akses IV. Tidak lama kemudian pasien mengeluh telinga berdenging, mulut terasa seperti logam (besi), tremor, dan cemas.", "opts": ["Depresi napas akibat blokade pusat pernapasan oleh toksisitas lidokain", "Obstruksi jalan napas oleh sekret", "Bronkospasme akibat reaksi alergi terhadap lidokain", "Emboli paru akibat injeksi lidokain", "Atelektasis mendadak karena nyeri"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "LA", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Auskultasi tidak menemukan ronki atau stridor, sehingga penyebab dari paru maupun jalan napas atas kecil kemungkinannya. Penurunan saturasi yang menyertai progresi gejala toksisitas lebih cocok dengan depresi pusat napas di batang otak oleh kadar lidokain yang terus naik. Slide Toksisitas menggambarkan progresi intoksikasi SSP: tremor/twitching → kejang klonus → depresi napas/apnea. Pasien emfisema juga memiliki cadangan respirasi yang rendah, sehingga hipoventilasi sedikit saja sudah menurunkan saturasi.", "w": {"b": "Sekret akan menimbulkan ronki atau gurgling.", "c": "Bronkospasme akan terdengar sebagai wheezing; alergi amida juga sangat jarang.", "d": "Emboli paru tidak berhubungan dengan injeksi lidokain dosis kecil.", "e": "Tidak ada data atelektasis atau nyeri hebat."}, "hy": "Hipoksia dan asidosis memperburuk LAST. Itu sebabnya ventilasi dan oksigenasi adalah prioritas pertama.", "ev": [{"deck": "LA", "page": 26, "quote": "DEPRESI NAFAS / APNEA"}], "refs": []}, {"id": "A020", "sec": "anes", "stem": "Pada syok hipovolemik akibat perdarahan, kristaloid diberikan 2–4 kali estimated blood loss. Mengapa volume yang diberikan lebih besar daripada volume darah yang hilang?", "vig": null, "opts": ["Karena kristaloid cepat menaikkan hemoglobin", "Karena kristaloid cepat berdifusi ke interstisial sehingga hanya sebagian kecil yang menetap intravaskular", "Karena pasien syok membutuhkan cairan hipertonik", "Karena kristaloid cepat masuk ke ruang intrasel", "Karena kristaloid meningkatkan kontraktilitas"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "b", "topic": "FLUID", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Kristaloid isotonik (RL, NaCl 0,9%) bebas melewati dinding kapiler dan terdistribusi ke seluruh cairan ekstraseluler. Plasma hanya sekitar 1/4–1/5 dari CES, sedangkan sisanya interstisial. Dalam waktu sekitar 30–60 menit, hanya ±20–25% volume kristaloid yang masih tersisa di intravaskular. Karena itu, untuk mengganti satu volume darah yang hilang dibutuhkan 2–4 kali volumenya dalam kristaloid. Koloid lebih lama bertahan di intravaskular sehingga cukup 1–2 kali.", "w": {"a": "Kristaloid tidak menaikkan Hb; justru terjadi hemodilusi.", "c": "Cairan yang dimaksud isotonik, bukan hipertonik. NaCl 3–7,5% memang perlu volume lebih kecil (1/3–1/5 EBL di slide), bukan lebih besar.", "d": "Kristaloid isotonik tidak masuk ke intrasel; yang masuk ke ICF adalah air bebas (misalnya D5%).", "e": "Kristaloid tidak memiliki efek inotropik."}, "hy": "Kompartemen: CIS 40% BB, CES 20% BB (interstisial 80%, plasma 20% dari CES).", "ev": [{"deck": "FLUID", "page": 21, "quote": "Kristaloid : 2 - 4 x EBL"}, {"deck": "SHOCK", "page": 33, "quote": "RL, NaCl 0.9%, RA → 2-4x EBL"}], "refs": []}, {"id": "A021", "sec": "anes", "stem": "Pasien tidak responsif, napas tidak normal, dan tidak ada denyut nadi. Apa langkah pertama?", "vig": null, "opts": ["Cek nadi selama 20 detik", "Melakukan kompresi dada saja", "Memberi adrenalin segera", "Memberikan … (opsi tidak tercatat di rekap)", "Menghubungi bantuan/Code Blue dan mulai CPR"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": true, "img": null, "pool": "all", "key": "e", "topic": "CPR", "st": "ppt", "deb": null, "note": "Opsi d tidak tercatat lengkap (\"lupa\"), tetapi opsi e sudah memuat langkah yang benar.", "gl": null, "r": "Pasien tidak responsif dengan napas tidak normal (termasuk gasping) dan tanpa nadi berarti henti jantung. Langkah pertama adalah mengaktifkan sistem gawat darurat (Code Blue / panggil bantuan, minta AED/defibrilator) lalu segera memulai CPR berkualitas. Slide CPR menyebut kombinasi tidak responsif dan napas tidak normal sudah cukup untuk mengidentifikasi henti jantung. Perabaan nadi tidak andal, dan pemeriksaan nadi oleh tenaga kesehatan dibatasi maksimal 10 detik.", "w": {"a": "Cek nadi tidak boleh lebih dari 10 detik.", "b": "Kompresi saja tanpa memanggil bantuan dan defibrilator kurang lengkap. Bagi penolong awam, kompresi saja boleh, tetapi aktivasi bantuan tetap yang pertama.", "c": "Adrenalin diberikan setelah CPR berjalan dan akses IV/IO tersedia, bukan langkah pertama.", "d": "Opsi ini tidak tercatat lengkap di rekap/recall, sehingga tidak bisa dinilai."}, "hy": "Rantai keselamatan: pengenalan dan aktivasi → CPR dini → defibrilasi cepat → ALS → perawatan pasca-henti jantung.", "ev": [{"deck": "CPR", "page": 11, "quote": "Berteriak Code Blue minta bantuan"}, {"deck": "CPR", "page": 10, "quote": "Palpation of the pulse as the sole indicator of the presence or absence of cardiac arrest is unreliable"}], "refs": []}, {"id": "A022", "sec": "anes", "stem": "Pasien 55 tahun dengan perdarahan aktif setelah kecelakaan. TD 70/40 mmHg, nadi 140x/menit, kulit dingin. Setelah pemberian RL 1 liter, tekanan sistolik naik menjadi 110 mmHg tetapi turun lagi 20 menit kemudian. Respons ini disebut:", "vig": null, "opts": ["Transient response", "Vasovagal response", "Good response", "Over-resuscitation", "No response"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "a", "topic": "FLUID", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Respons terhadap bolus cairan awal mengklasifikasikan status volume dan perdarahan. Tekanan darah yang naik setelah 1 L RL lalu turun lagi dalam 20 menit adalah transient response: volume sempat terisi, tetapi perdarahan masih berlangsung atau kehilangannya lebih besar dari perkiraan. Pasien ini perlu transfusi dan kontrol sumber perdarahan (bedah/intervensi). Slide Terapi Cairan membagi respons menjadi tiga: good (membaik lalu stabil), transient (membaik lalu merosot), dan no response (tidak membaik).", "w": {"b": "Respons vasovagal adalah bradikardia dan hipotensi akibat refleks, bukan pola pasca-bolus pada perdarahan.", "c": "Good response berarti stabil setelah membaik.", "d": "Over-resuscitation akan tampak sebagai tanda kelebihan cairan, bukan tekanan yang turun lagi.", "e": "No response berarti tekanan tidak naik sama sekali."}, "hy": "Transient atau no response berarti ada perdarahan berlanjut. Cari sumbernya: toraks, abdomen, pelvis, femur, eksternal (slide).", "ev": [{"deck": "FLUID", "page": 21, "quote": "Sirkulasi membaik lalu merosot lagi transient response, masih hipovolemia, ada perdarahan berlanjut"}], "refs": []}, {"id": "A023", "sec": "anes", "stem": "Saat induksi dengan sevofluran, pasien memasuki stadium 2. Tanda khas stadium 2 adalah", "vig": null, "opts": ["Bradikardia dan apnea", "Hilang refleks bulu mata, relaksasi penuh", "Respirasi reguler, pupil normal", "Napas tidak teratur, gerakan tidak terkontrol, pupil melebar ringan", "Apnea dan pupil … (opsi tidak tercatat di rekap)"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": true, "img": null, "pool": "all", "key": "d", "topic": "FARM", "st": "luar", "deb": null, "note": null, "gl": null, "r": "Stadium Guedel (klasik, dari era eter) terdiri atas empat tahap. Stadium I (analgesia) berlangsung dari induksi sampai hilang kesadaran. Stadium II (eksitasi/delirium) berlangsung dari hilang kesadaran sampai napas teratur. Cirinya napas tidak teratur, gerakan tidak terkontrol, pupil melebar, refleks jalan napas hiperaktif, serta risiko muntah dan laringospasme. Stadium III (bedah) ditandai napas teratur dan pupil mengecil-sentral. Stadium IV adalah overdosis (apnea, kolaps kardiovaskular). Agen modern seperti sevofluran membuat stadium II berlangsung singkat, tetapi tandanya tetap sama. Topik ini tidak ada di PPT, jadi jawaban berasal dari textbook.", "w": {"a": "Bradikardia dan apnea adalah tanda stadium IV (overdosis).", "b": "Hilang refleks bulu mata dan relaksasi penuh menandakan masuk stadium III.", "c": "Respirasi teratur dan pupil normal adalah ciri stadium III (bedah).", "e": "Opsi tidak tercatat lengkap; apnea juga ciri stadium IV."}, "hy": "Stadium II adalah fase rawan: hindari stimulasi (suction, intubasi) karena risiko laringospasme dan muntah.", "ev": [], "refs": ["tb_guedel", "tb_morgan"]}, {"id": "A024", "sec": "anes", "stem": "Pasien sesak, RR 35x/menit, retraksi dinding dada, napas cuping hidung. Ini termasuk:", "vig": null, "opts": ["Tanda hiperkapnia", "Tanda obstruksi jalan napas atas", "Tanda kompensasi respirasi", "Tanda pneumonia ringan", "Tanda henti napas"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "c", "topic": "ICU1", "st": "peng", "deb": "Slide Gawat Darurat memasukkan \"retraksi\" ke tanda sumbatan jalan napas (Look). Karena stem tidak menyebut suara tambahan, kunci c lebih tepat; b dapat diperdebatkan.", "note": null, "gl": null, "r": "Takipnea (RR 35), retraksi, dan napas cuping hidung adalah tanda peningkatan kerja napas (work of breathing). Ini mekanisme kompensasi tubuh ketika kebutuhan ventilasi atau oksigenasi meningkat: otot bantu napas direkrut untuk menghasilkan tekanan negatif intratoraks yang lebih besar. Tanda ini menunjukkan distres napas yang masih terkompensasi. Bila berlanjut, pasien bisa lelah sampai terjadi gagal napas. Slide Konsep ICU menyebut otot bantu napas dan napas cuping hidung sebagai parameter yang dimonitor.", "w": {"a": "Hiperkapnia ditandai somnolen, flapping, dan vasodilatasi. Diagnosisnya lewat BGA, tidak dari tanda ini saja.", "b": "Retraksi memang tercantum di slide Gawat Darurat sebagai tanda sumbatan jalan napas. Namun tanpa snoring, gurgling, atau stridor, gambaran ini lebih cocok dengan distres napas umum.", "d": "Tidak ada data yang mengarah ke pneumonia ringan; tanda distres justru menunjukkan kondisi yang tidak ringan.", "e": "Henti napas berarti tidak bernapas, sedangkan pasien ini takipnea."}, "hy": "Tanda kelelahan napas (ancaman gagal napas): paradoxical / see-saw breathing, RR turun mendadak, penurunan kesadaran.", "ev": [{"deck": "ICU1", "page": 8, "quote": "adanya bantuan otot otot nafas natau nafas cuping hidung"}], "refs": []}, {"id": "A025", "sec": "anes", "stem": "Seorang pasien ditemukan dengan tangan dingin, basah, pucat, dan capillary refill > 2 detik. Hal ini menandakan:", "vig": null, "opts": ["Perfusi baik", "Perfusi buruk", "Curah jantung naik", "Normal", "Vasodilatasi perifer"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "b", "topic": "FLUID", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Slide Terapi Cairan mengajarkan penilaian perfusi perifer cukup dengan meraba telapak tangan dan menekan ujung kuku. Hangat, kering, merah dengan CRT <2 detik berarti normal. Dingin, basah, pucat dengan CRT >2 detik berarti syok. Vasokonstriksi perifer akibat aktivasi simpatis mengalihkan darah ke organ vital, sehingga kulit menjadi dingin, pucat, dan berkeringat dingin, dan pengisian kapiler melambat.", "w": {"a": "Perfusi baik berarti hangat, kering, merah, dengan CRT <2 detik.", "c": "Curah jantung justru cenderung turun.", "d": "Akral dingin-basah-pucat tidak normal.", "e": "Vasodilatasi perifer membuat akral hangat (warm shock), bukan dingin."}, "hy": "Cara cepat menilai perfusi tanpa alat: raba telapak tangan dan tekan-lepas ujung kuku.", "ev": [{"deck": "FLUID", "page": 13, "quote": "Dingin, Basah, Pucat : SHOCK"}], "refs": []}, {"id": "A026", "sec": "anes", "stem": "Manakah tahap proses nyeri yang menggambarkan perpindahan impuls dari perifer menuju medula spinalis?", "vig": null, "opts": ["Transduction", "Modulation", "Perception", "Transmission", "Projection"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "d", "topic": "PATFIS", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Ada empat proses nosisepsi. Transduksi adalah perubahan stimulus noksius menjadi impuls listrik di nosiseptor. Transmisi adalah perambatan impuls dari perifer melalui serabut Aδ/C ke kornu dorsalis medula spinalis lalu naik ke otak. Modulasi adalah penguatan atau penghambatan sinyal di kornu dorsalis oleh sistem descending/endogen. Persepsi adalah kesadaran subjektif akan nyeri di korteks. Pergerakan impuls dari perifer menuju medula spinalis termasuk transmisi.", "w": {"a": "Transduksi terjadi di ujung saraf (nosiseptor), sebelum impuls merambat.", "b": "Modulasi terjadi di kornu dorsalis dan jalur descending.", "c": "Persepsi terjadi di korteks.", "e": "\"Projection\" bukan salah satu dari empat proses nosisepsi standar."}, "hy": "Target obat per proses: transduksi (NSAID/COX-2, anestesi lokal), transmisi (anestesi lokal, blok saraf), modulasi (opioid, α2-agonis), persepsi (opioid, anestesi umum).", "ev": [{"deck": "PATFIS", "page": 30, "quote": "It is the process of forwarding pain impulses from peripheral nerve nocireseptors passing through the spinal cord"}], "refs": []}, {"id": "A027", "sec": "anes", "stem": "Pasien pasca-laparotomi mengeluh nyeri sedang. Dokter memberikan kombinasi parasetamol + NSAID + opioid dosis kecil. Pendekatan ini disebut:", "vig": null, "opts": ["Opioid rotation", "Multimodal analgesia", "Gate control therapy", "Step 3 WHO ladder", "Rescue analgesia"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "b", "topic": "PAINM", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Analgesia multimodal adalah kombinasi analgesik dengan mekanisme berbeda, misalnya parasetamol, NSAID, dan opioid dosis kecil, sering ditambah anestesi regional. Tujuannya mendapat efek aditif atau sinergis sehingga dosis tiap obat dan efek sampingnya lebih kecil, terutama untuk menghemat opioid. Konsep ini dipopulerkan Kehlet & Dahl (1993), yang juga dikutip di slide Manajemen Nyeri.", "w": {"a": "Opioid rotation adalah mengganti satu opioid ke opioid lain.", "c": "Gate control adalah teori modulasi nyeri (Melzack–Wall), bukan nama pendekatan terapi kombinasi.", "d": "Step 3 WHO ladder adalah opioid kuat untuk nyeri berat/kanker.", "e": "Rescue analgesia adalah dosis tambahan untuk breakthrough pain."}, "hy": "Manfaat multimodal (slide): dosis tiap analgesik lebih kecil, efikasi meningkat (sinergis), efek samping berkurang.", "ev": [{"deck": "PAINM", "page": 8, "quote": "Main goals of Multimodal Analgesia is to reduce the amount of Opioid"}], "refs": ["kehlet1993"]}, {"id": "A028", "sec": "anes", "stem": "Penyebab yang paling mungkin?", "vig": "Laki-laki 67 tahun dengan riwayat infark miokard datang dengan sesak akut. B: RR 36x/menit, SpO₂ 82% dengan NRBM, ronki basah sampai lapang paru atas. C: TD 78/46 mmHg, akral dingin, nadi 128x/menit. D: GCS 14. BGA: pH 7,31 (catatan perekam soal: \"hiperkapnia → hipoksemia\"; nilai lain tidak tercatat).", "opts": ["Sepsis", "Anemia", "ARDS", "Syok kardiogenik + … (sisa opsi tidak tercatat)", "Asma"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": true, "img": null, "pool": "all", "key": "d", "topic": "ICU2", "st": "ppt", "deb": null, "note": "Opsi d tidak tercatat lengkap (\"kardiogenik shock + ...\").", "gl": null, "r": "Pasien 67 tahun dengan riwayat infark ini datang dengan hipotensi (78/46), akral dingin, takikardia, dan ronki basah sampai lapang atas (edema paru). Kombinasi ini adalah syok kardiogenik: pompa gagal sehingga curah jantung turun dan tekanan pengisian naik, menyebabkan kongesti paru. Tabel slide ICU menuliskan syok kardiogenik dengan CO rendah dan filling pressure tinggi, yang berbeda dari syok hipovolemik maupun septik.", "w": {"a": "Sepsis biasanya disertai demam/sumber infeksi dan sering akral hangat di awal.", "b": "Anemia tidak menjelaskan edema paru dan hipotensi berat.", "c": "ARDS adalah edema non-kardiogenik akibat insult (sepsis/trauma); di sini ada riwayat infark dan syok.", "e": "Asma ditandai wheezing, bukan ronki basah dengan syok."}, "hy": "Syok kardiogenik = \"pompa gagal\" → CO↓, SVR↑, tekanan pengisian↑ (edema paru). Syok hipovolemik = \"tangki kosong\" → tekanan pengisian↓.", "ev": [{"deck": "ICU2", "page": 25, "quote": "Cardiogenic MI, arrhythmia, cardiomyopathy"}], "refs": []}, {"id": "A029", "sec": "anes", "stem": "Terapi sirkulasi awal yang benar?", "vig": "Laki-laki 67 tahun dengan riwayat infark miokard datang dengan sesak akut. B: RR 36x/menit, SpO₂ 82% dengan NRBM, ronki basah sampai lapang paru atas. C: TD 78/46 mmHg, akral dingin, nadi 128x/menit. D: GCS 14. BGA: pH 7,31 (catatan perekam soal: \"hiperkapnia → hipoksemia\"; nilai lain tidak tercatat).", "opts": ["Dopamin dosis tinggi", "Dobutamin", "Furosemid", "Kristaloid 30 mL/kg", "Albumin"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "b", "topic": "FARM", "st": "peng", "deb": "Idealnya noradrenalin dulu karena MAP <65, lalu dobutamin. Di antara opsi yang ada, dobutamin paling sesuai prinsip \"memperbaiki pompa\".", "note": "Opsi d di rekap tertulis \"kristaloid 30\"; dibaca sebagai kristaloid 30 mL/kg.", "gl": null, "r": "Masalah dasar pasien ini adalah pompa yang gagal, jadi tujuan terapi sirkulasi adalah memperbaiki kontraktilitas. Di antara pilihan yang tersedia, dobutamin (agonis β1) adalah inotropik yang dirancang untuk curah jantung rendah dengan hipoperfusi. Ada catatan penting: dobutamin dapat menurunkan TD lewat efek β2, sementara MAP pasien ini ±57 mmHg. Slide Farmakologi, slide ICU, dan AHA (van Diepen 2017) menyarankan noradrenalin dipakai bersamaan atau lebih dulu untuk menopang tekanan, dengan prinsip \"noradrenalin menopang tekanan, dobutamin membantu pompa\". Noradrenalin tidak ada di pilihan jawaban.", "w": {"a": "Dopamin dosis tinggi memicu takiaritmia lebih sering dan bukan pilihan rutin (slide Farmakologi dan ICU).", "c": "Furosemid pada pasien hipotensi berat memperburuk perfusi; diuresis baru dipertimbangkan setelah hemodinamik stabil.", "d": "Bolus kristaloid 30 mL/kg adalah resusitasi sepsis. Pada syok kardiogenik dengan edema paru, cairan memperberat kongesti.", "e": "Albumin tidak memperbaiki pompa dan menambah volume."}, "hy": "Syok kardiogenik: noradrenalin untuk MAP ≥65, ditambah inotropik (dobutamin) bila CO rendah; reperfusi/PCI bila karena infark; pertimbangkan dukungan mekanis (IABP/ECMO, slide Konsep ICU).", "ev": [{"deck": "FARM", "page": 6, "quote": "Inotropik untuk curah jantung rendah dengan hipoperfusi"}], "refs": ["vandiepen2017"]}, {"id": "A030", "sec": "anes", "stem": "Pilihan oksigenasi awal yang paling tepat?", "vig": "Laki-laki 67 tahun dengan riwayat infark miokard datang dengan sesak akut. B: RR 36x/menit, SpO₂ 82% dengan NRBM, ronki basah sampai lapang paru atas. C: TD 78/46 mmHg, akral dingin, nadi 128x/menit. D: GCS 14. BGA: pH 7,31 (catatan perekam soal: \"hiperkapnia → hipoksemia\"; nilai lain tidak tercatat).", "opts": ["Nebulizer", "HFNC", "NIV", "Intubasi segera", "NRBM"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "c", "topic": "ICU1", "st": "peng", "deb": "Ini soal yang paling bisa diperdebatkan. Hipotensi berat membuat sebagian ahli memilih intubasi segera. Kunci c dipilih karena edema paru kardiogenik adalah indikasi terkuat NIV.", "note": null, "gl": null, "r": "Pasien sudah memakai NRBM tetapi SpO₂ masih 82% dengan RR 36, jadi oksigenasi konvensional gagal dan perlu eskalasi ke tekanan positif. Penyebabnya edema paru kardiogenik. Tekanan positif (CPAP/NIV) merekrut alveoli yang terendam cairan, menurunkan preload dan afterload ventrikel kiri, dan mengurangi kerja napas. Pedoman ERS/ATS 2017 merekomendasikan NIV pada edema paru kardiogenik. Ada catatan penting: syok (TD 78/46) adalah kontraindikasi relatif NIV, karena tekanan positif bisa menurunkan venous return. Pasien perlu dipantau sangat ketat, dan bila memburuk atau tidak membaik cepat, segera intubasi.", "w": {"a": "Nebulisasi tidak mengatasi edema paru.", "b": "HFNC adalah alternatif untuk hipoksemia, tetapi tekanan positifnya lebih kecil dari NIV untuk edema paru kardiogenik.", "d": "Intubasi segera bisa dibenarkan pada syok berat. Namun induksi pada syok kardiogenik sangat berisiko kolaps hemodinamik (lihat soal risiko induksi GA), dan GCS 14 masih protektif.", "e": "NRBM sudah dipakai dan gagal."}, "hy": "Eskalasi oksigenasi: nasal kanul → masker → NRBM → HFNC/NIV → intubasi + ventilasi mekanik.", "ev": [{"deck": "ICU1", "page": 8, "quote": "Bantuan lain : HFNC, NIV"}], "refs": ["rochwerg2017"]}, {"id": "A031", "sec": "anes", "stem": "Temuan BGA menunjukkan gagal napas tipe?", "vig": "Laki-laki 67 tahun dengan riwayat infark miokard datang dengan sesak akut. B: RR 36x/menit, SpO₂ 82% dengan NRBM, ronki basah sampai lapang paru atas. C: TD 78/46 mmHg, akral dingin, nadi 128x/menit. D: GCS 14. BGA: pH 7,31 (catatan perekam soal: \"hiperkapnia → hipoksemia\"; nilai lain tidak tercatat).", "opts": ["Tipe 1", "Tipe 2", "Normal", "Metabolik … (opsi tidak tercatat di rekap)", "Respiratorik … (opsi tidak tercatat di rekap)"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": true, "img": null, "pool": "all", "key": "b", "topic": "AB", "st": "peng", "deb": null, "note": "Data BGA dan opsi d–e tidak tercatat lengkap.", "gl": null, "r": "Catatan BGA di stem menyebut hiperkapnia dan pH 7,31 (asidemia). Peningkatan PaCO₂ dengan asidemia berarti asidosis respiratorik, yaitu kegagalan ventilasi alveolar: gagal napas tipe II (hiperkapnik). Pada pasien ini kemungkinan terjadi karena kelelahan otot napas akibat edema paru berat. Gagal napas tipe I (hipoksemik) ditandai PaO₂ <60 mmHg dengan PaCO₂ normal atau rendah.", "w": {"a": "Tipe I tidak disertai hiperkapnia.", "c": "pH 7,31 dengan hiperkapnia tidak normal.", "d": "Opsi tidak tercatat lengkap (\"metabolik ...\").", "e": "Opsi tidak tercatat lengkap (\"respiratori ...\")."}, "hy": "Tipe I: PaO₂ <60, PaCO₂ normal/rendah (masalah pertukaran gas). Tipe II: PaCO₂ >50 dengan pH <7,35 (masalah pompa/ventilasi).", "ev": [{"deck": "AB", "page": 39, "quote": "pH < 7.4 as a result of PaCO2 > 40 mmHg"}], "refs": ["roussos2003"]}, {"id": "A032", "sec": "anes", "stem": "Risiko utama saat induksi anestesi umum (GA) pada pasien ini?", "vig": "Laki-laki 67 tahun dengan riwayat infark miokard datang dengan sesak akut. B: RR 36x/menit, SpO₂ 82% dengan NRBM, ronki basah sampai lapang paru atas. C: TD 78/46 mmHg, akral dingin, nadi 128x/menit. D: GCS 14. BGA: pH 7,31 (catatan perekam soal: \"hiperkapnia → hipoksemia\"; nilai lain tidak tercatat).", "opts": ["Mual", "Hipertensi rebound", "Takikardia ringan", "Afterload turun", "Tidak mempan anestesi"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "d", "topic": "FARM", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Pasien syok kardiogenik bertahan dengan tonus simpatis maksimal: vasokonstriksi untuk menjaga tekanan dan takikardia untuk menjaga curah jantung. Obat induksi anestesi umum menekan aktivitas simpatis, sehingga terjadi vasodilatasi dengan afterload dan SVR turun, venodilatasi dengan preload turun, serta penurunan kontraktilitas. Pada jantung yang sudah gagal, hilangnya kompensasi ini dapat menyebabkan hipotensi berat sampai henti jantung saat induksi. Slide Farmakologi menuliskan anestesia \"menekan aktifitas simpatis … vasodilatasi, hipotensi, kontraktilitas miokard berkurang\".", "w": {"a": "Mual adalah efek pascaoperasi, bukan risiko kritis saat induksi.", "b": "Yang terjadi hipotensi, bukan hipertensi rebound.", "c": "Takikardia ringan bukan risiko utama; yang berbahaya adalah kolaps hemodinamik.", "e": "Pada syok, kebutuhan obat anestesi justru menurun, bukan resisten."}, "hy": "Induksi pada syok: pilih obat yang stabil hemodinamik (misalnya ketamin/etomidat dosis kecil), siapkan vasopresor sebelum induksi, dan resusitasi dulu bila memungkinkan.", "ev": [{"deck": "FARM", "page": 43, "quote": "Menekan aktifitas simpatis (kecuali ketamine dan ether)"}], "refs": []}, {"id": "A033", "sec": "anes", "stem": "Seorang pasien syok tiba di IGD. Nadi 150x/menit, akral dingin, TD 60/30 mmHg. Petugas ingin segera memasang infus tetapi pembuluh darah tampak kolaps. Apa langkah terbaik sesuai kuliah?", "vig": null, "opts": ["Memberikan vasopresor segera", "Memberikan posisi syok untuk menambah preload", "Menurunkan posisi kepala lebih rendah", "Memasang infus intraoseus", "Memberikan oksigen saja sudah cukup"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "b", "topic": "FLUID", "st": "ppt", "deb": "Intraoseus (d) juga benar secara klinis bila IV gagal. Kunci b mengikuti pesan eksplisit slide.", "note": null, "gl": null, "r": "Slide Terapi Cairan secara eksplisit menjawab pertanyaan \"mengapa posisi shock, mengapa tidak langsung pasang infus?\". Mengangkat kedua tungkai memindahkan 300–500 mL darah dari tungkai ke sirkulasi sentral sebagai autotransfusi. Preload meningkat, dan vena tangan yang tadinya kolaps terisi kembali sehingga infus lebih mudah dipasang. Bila akses IV tetap gagal, intraoseus adalah alternatif yang valid (ada di slide Gawat Darurat), tetapi soal meminta langkah terbaik \"sesuai kuliah\".", "w": {"a": "Vasopresor butuh akses vaskular, dan hipovolemia harus diisi dulu.", "c": "\"Kepala lebih rendah\" (Trendelenburg) bukan yang diajarkan slide; yang diajarkan adalah mengangkat tungkai, dan Trendelenburg mengganggu ventilasi.", "d": "IO adalah alternatif bila IV gagal, tetapi bukan jawaban \"sesuai kuliah\" untuk vena kolaps.", "e": "Oksigen saja tidak mengatasi hipovolemia."}, "hy": "Posisi syok (angkat tungkai) setara passive leg raising, yang di ICU juga dipakai sebagai tes fluid responsiveness (slide Syok).", "ev": [{"deck": "FLUID", "page": 15, "quote": "Vena tangan yang tadinya kolaps (hilang), jadi terisi lagi, memudahkan memasang infus"}], "refs": []}, {"id": "A034", "sec": "anes", "stem": "Lama puasa minimal untuk makanan padat pada pasien dewasa sebelum anestesi umum?", "vig": null, "opts": ["12 jam", "2 jam", "6 jam", "8 jam", "4 jam"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "c", "topic": "PREP", "st": "ppt", "deb": "Istilah \"makanan padat\" ambigu. Slide memakai 6 jam (bersama susu formula), sedangkan makanan berat/berlemak 8 jam.", "note": null, "gl": "ASA 2017 tidak memakai istilah \"makanan padat\"; yang dipakai adalah light meal (6 jam) dan fried/fatty food atau daging (≥8 jam). Slide menggabungkan \"susu formula/makanan padat\" di 6 jam.", "r": "Slide Persiapan menulis \"Susu formula/makanan padat: 6 jam\" dan \"Makanan ringan: 6 jam\", sedangkan makanan berat dan berlemak ≥8 jam. Mengikuti slide, jawabannya 6 jam. Pedoman ASA 2017 menyatakan hal serupa: makanan ringan (light meal) minimal 6 jam, sedangkan gorengan, makanan berlemak, atau daging mungkin butuh ≥8 jam. Jadi bila stem berbunyi \"makanan berat/berlemak\", jawabannya 8 jam. Tujuan puasa adalah mencegah aspirasi isi lambung.", "w": {"a": "12 jam berlebihan dan tidak direkomendasikan; puasa terlalu lama menyebabkan dehidrasi dan katabolisme.", "b": "2 jam untuk cairan jernih.", "d": "8 jam untuk makanan berat dan berlemak.", "e": "4 jam untuk ASI."}, "hy": "Mnemonik 2-4-6-8: cairan jernih 2 jam, ASI 4 jam, formula/makanan ringan 6 jam, makanan berat/berlemak ≥8 jam.", "ev": [{"deck": "PREP", "page": 21, "quote": "Susu formula/makanan padat : 6 jam sebelum operasi"}, {"deck": "PREP", "page": 21, "quote": "Makanan berat dan berlemak : 8 jam atau lebih sebelum operasi"}], "refs": ["asa2017"]}, {"id": "A035", "sec": "anes", "stem": "Setelah dekompresi jarum, tindakan berikutnya adalah", "vig": "Pria 58 tahun datang dengan sesak berat setelah batuk hebat. A: bicara 1 kata, tampak panik. B: RR 40x/menit, SpO₂ 78% dengan nasal kanul; hemitoraks kanan ekspansi minimal, hipersonor, trakea deviasi ke kiri. C: TD 80/45 mmHg, nadi 135x/menit, CRT 5 detik. D: GCS 14. E: suhu 37,8 °C. Diagnosis klinis mengarah ke tension pneumothorax.", "opts": ["Observasi", "Torakotomi segera", "CT scan toraks", "Pemasangan chest tube", "Nebulizer bronkodilator"], "src": ["UAB 1 IPK 2025 (Oculus)"], "n": 1, "inc": false, "img": null, "pool": "all", "key": "d", "topic": "GD", "st": "peng", "deb": null, "note": null, "gl": null, "r": "Dekompresi jarum hanya mengubah tension pneumotoraks menjadi pneumotoraks terbuka atau simpel. Kateter mudah tertekuk, tersumbat, atau lepas, dan udara masih bisa terakumulasi lagi. Tatalaksana definitif yang harus segera menyusul adalah pemasangan chest tube (WSD) di ICS 5 anterior dari linea midaksilaris (ATLS). Torakotomi hanya untuk indikasi khusus seperti hemotoraks masif atau kebocoran udara per
