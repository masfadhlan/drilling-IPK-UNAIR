okteran yang menjabarkan:", "vig": null, "opts": ["Ilmu pemberian obat sedasi dan obat anestesi lokal", "Ilmu detoksifikasi opioid", "Bidang kajian pengelolaan life support dan pengelolaan stres serta nyeri", "Ilmu pemasangan ETT dan ventilator", "Bukan salah satu di atas"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "INTRO", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Anestesiologi modern tidak hanya \"membius\". Cakupannya meliputi evaluasi dan optimasi praoperasi, pengelolaan stres dan nyeri perioperatif, serta bantuan hidup (life support) di kamar operasi, IGD, dan ICU. Slide Pengantar menyebut anggapan bahwa peran anestesi hanya menidurkan pasien dan memberi obat adalah miskonsepsi historis; dokter anestesi adalah \"Guardians of Life\" yang mengelola life support dan memulihkan fisiologi.", "w": {"a": "Pemberian sedasi dan anestesi lokal hanya sebagian kecil dari cakupan anestesiologi.", "b": "Detoksifikasi opioid bukan definisi anestesiologi.", "d": "Intubasi dan ventilator adalah keterampilan, bukan definisi bidang ilmu.", "e": "Opsi c tepat."}, "hy": "Anestesiologi = life support + pengelolaan stres/nyeri perioperatif + resusitasi (anestesiologi dan reanimasi).", "ev": [{"deck": "INTRO", "page": 2, "quote": "The historical misconception that the role is simply to put people to sleep and administer drugs"}, {"deck": "INTRO", "page": 2, "quote": "Evaluating comorbidities, managing life support, and restoring physiology while ensuring optimal safety"}], "refs": []}, {"id": "A136", "sec": "anes", "stem": "Pernyataan di bawah ini tentang obat anestesi umum yang benar adalah:", "vig": null, "opts": ["Obat anestesi yang berbeda struktur kimianya memberikan gambaran perubahan fisiologi yang berbeda", "Obat anestesi umum hanya berinteraksi dengan satu macam reseptor yang spesifik", "Anestesi umum mengubah aktivitas neuron pada daerah tertentu di SSP", "Tidak terdapat hubungan antara kekuatan obat anestesi umum dengan daya kelarutan lemak", "Obat anestesi umum hanya dapat diberikan melalui inhalasi"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "INTRO", "st": "peng", "deb": null, "note": null, "gl": null, "r": "Anestetik umum bekerja dengan mengubah aktivitas neuron di area tertentu SSP (korteks, talamus, formasio retikularis, medula spinalis), terutama dengan memperkuat inhibisi lewat reseptor GABA-A dan menekan eksitasi (NMDA, kanal kalium). Walaupun struktur kimianya sangat beragam (gas inert, eter berhalogen, propofol, barbiturat, ketamin), efek akhirnya mirip: tidak sadar, amnesia, dan imobilitas. Potensinya berbanding lurus dengan kelarutan lemak (hukum Meyer-Overton). Agen diberikan intravena (induksi) maupun inhalasi (rumatan), seperti di slide Pengantar.", "w": {"a": "Justru agen yang struktur kimianya sangat berbeda menghasilkan keadaan anestesi yang mirip.", "b": "Anestetik umum bekerja pada banyak target (GABA-A, NMDA, glisin, kanal K⁺), bukan satu reseptor spesifik.", "d": "Ada hubungan erat: makin larut lemak, makin poten (MAC makin rendah). Ini korelasi Meyer-Overton.", "e": "Anestesi umum juga diberikan intravena (propofol, ketamin, tiopental)."}, "hy": "Potensi anestetik inhalasi ∝ kelarutan lemak (Meyer-Overton). Target utama: GABA-A (propofol, volatil), NMDA (ketamin, N₂O).", "ev": [{"deck": "INTRO", "page": 7, "quote": "A balanced, polypharmacy approach acting systemically on the Central Nervous System (CNS) is required"}, {"deck": "INTRO", "page": 8, "quote": "Intravenous Anesthetics"}], "refs": ["tb_morgan"]}, {"id": "A137", "sec": "anes", "stem": "Sistem kerja obat anestesi lokal adalah:", "vig": null, "opts": ["Mencegah transmisi impuls saraf (blokade konduksi) dengan menghambat masuknya ion natrium melalui kanal natrium selektif pada membran saraf", "Menyebabkan kegagalan peningkatan permeabilitas gerbang ion natrium sehingga laju depolarisasi melambat, ambang potensial tidak tercapai, dan potensial aksi tidak dirambatkan", "Memblokade konduksi dengan menghambat masuknya ion natrium melalui kanal natrium selektif pada membran saraf", "Semua di atas benar"], "src": ["Tabulasi IPK"], "n": 2, "inc": false, "img": null, "pool": "drill", "key": "d", "topic": "LA", "st": "ppt", "deb": null, "note": "Soal muncul dua kali di Tabulasi: versi bahasa Inggris (no. 1) dan bahasa Indonesia (no. 2) bagian Toksisitas Anestesi Lokal.", "gl": null, "r": "Anestetik lokal (bentuk tak bermuatan) menembus membran, lalu bentuk bermuatannya berikatan di sisi dalam kanal Na⁺ bergerbang voltase. Influks Na⁺ terhambat, sehingga laju depolarisasi turun, ambang tidak tercapai, dan potensial aksi tidak dirambatkan (blokade konduksi). Ketiga opsi a–c menjelaskan mekanisme yang sama dengan kata berbeda, jadi jawabannya \"semua benar\". Slide Pengantar: anestetik lokal secara reversibel menghambat konduksi saraf dengan memblok kanal natrium.", "w": {"a": "Benar, tetapi b dan c juga benar.", "b": "Benar, tetapi a dan c juga benar.", "c": "Benar, tetapi a dan b juga benar."}, "hy": "Anestetik lokal memblok kanal Na⁺ dari sisi dalam (bentuk bermuatan); efeknya reversibel.", "ev": [{"deck": "INTRO", "page": 9, "quote": "Local anesthetics reversibly inhibit nerve conduction at non-toxic concentrations by blocking sodium channels"}], "refs": []}, {"id": "A138", "sec": "anes", "stem": "Kejang akibat anestesi lokal (lidokain) terjadi ketika konsentrasi plasma mencapai:", "vig": null, "opts": ["50 µg/mL", "24 µg/mL", "12 µg/mL", "4 µg/mL", "Semua salah"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "LA", "st": "luar", "deb": null, "note": "Di Tabulasi satuannya tertulis \"mg/ml\"; yang benar µg/mL (kadar plasma lidokain).", "gl": null, "r": "Efek toksik lidokain berjenjang sesuai kadar plasma. Sekitar 4 µg/mL muncul rasa melayang dan kebas lidah/perioral; 6–8 µg/mL gangguan visual dan kedutan otot; sekitar 10–12 µg/mL kejang; sekitar 15 µg/mL koma; sekitar 20 µg/mL henti napas; di atas sekitar 25 µg/mL depresi kardiovaskular. Di antara pilihan, 12 µg/mL paling sesuai dengan ambang kejang. Slide hanya memberi urutan gejala (SSP dulu, lalu kardiovaskular), tidak memberi angka kadar plasma.", "w": {"a": "50 µg/mL jauh di atas ambang depresi kardiovaskular.", "b": "Sekitar 24 µg/mL adalah kisaran depresi kardiovaskular.", "d": "Sekitar 4 µg/mL baru menimbulkan rasa melayang dan kebas lidah.", "e": "Opsi c tepat."}, "hy": "Lidokain: ~4 kebas/melayang, ~10–12 kejang, ~20 henti napas, >25 depresi jantung (µg/mL). Gejala SSP mendahului kardiovaskular.", "ev": [], "refs": ["tb_morgan", "neal2018"]}, {"id": "A139", "sec": "anes", "stem": "Keuntungan anestesi regional jenis infiltrasi pada pasien rawat jalan adalah semua yang tersebut di bawah ini, kecuali:", "vig": null, "opts": ["Waktu perawatan di ruang pulih sadar sangat singkat", "Mobilisasi dilakukan dengan cepat", "Kembalinya rasa sakit secara bertahap", "Tidak membutuhkan observasi pascabedah dini", "Tidak terjadi mual-muntah"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "d", "topic": "LA", "st": "peng", "deb": null, "note": null, "gl": null, "r": "Anestesi infiltrasi lokal untuk pasien rawat jalan memberi pemulihan cepat: waktu di ruang pulih singkat, pasien cepat mobilisasi, mual-muntah pascaoperasi jarang, dan nyeri kembali bertahap saat efek obat habis. Namun observasi pascabedah dini tetap wajib, karena toksisitas sistemik bisa muncul hingga sekitar 20 menit setelah infiltrasi (slide LA 24) dan perdarahan atau reaksi lain bisa terjadi. Jadi \"tidak membutuhkan observasi pascabedah dini\" bukan keuntungan, melainkan pernyataan yang salah.", "w": {"a": "Ini memang keuntungan anestesi lokal: tidak ada efek residu anestesi umum.", "b": "Mobilisasi cepat adalah keuntungan anestesi infiltrasi.", "c": "Nyeri kembali bertahap saat blok menghilang; ini keuntungan dibanding nyeri mendadak.", "e": "Mual-muntah jauh lebih jarang dibanding anestesi umum."}, "hy": "Toksisitas sistemik anestetik lokal: <5 menit bila intravaskular, ±20 menit setelah infiltrasi. Pasien tetap diobservasi.", "ev": [{"deck": "LA", "page": 31, "quote": "Menghilangkan rasa sakit secara lokal, meminimalkan risiko komplikasi, dan mengurangi waktu pemulihan pasien"}], "refs": []}, {"id": "A140", "sec": "anes", "stem": "Dosis maksimum gabungan lidokain dengan adrenalin untuk sirkumsisi anak dengan BB 30 kg adalah:", "vig": null, "opts": ["30 mg", "90 mg", "150 mg", "60 mg", "Semua pernyataan tersebut di atas tidak benar"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "e", "topic": "LA", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Dosis maksimum lidokain dengan adrenalin adalah 7 mg/kg (maksimum 500 mg dewasa); tanpa adrenalin 3 mg/kg (maksimum 200 mg) menurut tabel di slide LA 20. Untuk anak 30 kg: 30 × 7 = 210 mg. Tidak ada opsi 210 mg, jadi jawabannya \"semua tidak benar\". Adrenalin menyebabkan vasokonstriksi sehingga absorpsi lebih lambat dan dosis maksimum lebih tinggi. Catatan penting: adrenalin tidak boleh dipakai untuk blok penis (end-artery) pada sirkumsisi, jadi secara klinis lidokain polos lebih tepat.", "w": {"a": "30 mg hanya 1 mg/kg.", "b": "90 mg adalah dosis lidokain polos (3 mg/kg × 30 kg), bukan dosis dengan adrenalin.", "c": "150 mg sekitar 5 mg/kg, bukan batas maksimum.", "d": "60 mg hanya 2 mg/kg."}, "hy": "Lidokain maksimum: 3 mg/kg polos, 7 mg/kg dengan adrenalin (slide). Jangan pakai adrenalin di jari, penis, telinga, hidung.", "ev": [{"deck": "LA", "page": 20, "quote": "Lidocaine 200 500 3 7"}], "refs": []}, {"id": "A141", "sec": "anes", "stem": "Lama puasa yang disarankan untuk mengonsumsi cairan bening sebelum operasi elektif adalah:", "vig": null, "opts": ["2 jam", "4 jam", "6 jam", "8 jam", "12 jam"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "PREP", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Cairan bening (air putih, teh tanpa susu, jus tanpa ampas) cepat dikosongkan dari lambung, sehingga boleh diminum sampai 2 jam sebelum anestesi elektif. Puasa terlalu lama justru menimbulkan dehidrasi, haus, hipoglikemia, dan ketidaknyamanan. Slide: air putih 2 jam, ASI 4 jam, susu formula/makanan ringan 6 jam, makanan berat/berlemak 8 jam atau lebih.", "w": {"b": "4 jam adalah batas untuk ASI.", "c": "6 jam untuk makanan ringan dan susu formula.", "d": "8 jam untuk makanan berat atau berlemak.", "e": "12 jam tidak diperlukan dan berisiko dehidrasi."}, "hy": "Puasa: air bening 2 jam, ASI 4 jam, formula/makanan ringan 6 jam, makanan berat 8 jam (aturan 2-4-6-8).", "ev": [{"deck": "PREP", "page": 21, "quote": "Puasa minum air putih : 2 jam sebelum operasi"}], "refs": ["asa2017"]}, {"id": "A142", "sec": "anes", "stem": "Puasa yang tepat dilakukan sebelum operasi adalah:", "vig": null, "opts": ["Air bening 2 jam sebelumnya", "ASI 4 jam sebelumnya", "Makan 6–8 jam sebelumnya", "a dan c benar", "Benar semua"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "e", "topic": "PREP", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Ketiga pernyataan sesuai slide puasa praoperasi: air putih 2 jam, ASI 4 jam, makanan ringan 6 jam, dan makanan berat/berlemak 8 jam atau lebih. Jadi semuanya benar.", "w": {"a": "Benar, tetapi b dan c juga benar.", "b": "Benar, tetapi a dan c juga benar.", "c": "Benar, tetapi a dan b juga benar.", "d": "ASI 4 jam juga benar, jadi bukan hanya a dan c."}, "hy": "Aturan 2-4-6-8: bening 2, ASI 4, ringan/formula 6, berat 8 jam.", "ev": [{"deck": "PREP", "page": 21, "quote": "Air susu ibu (ASI) : 4 jam sebelum operasi"}, {"deck": "PREP", "page": 21, "quote": "Maknan ringan : 6 jam sebelum operasi"}], "refs": ["asa2017"]}, {"id": "A143", "sec": "anes", "stem": "Berikut ini termasuk evaluasi pre-anestesi, kecuali:", "vig": null, "opts": ["Persiapan alat dan obat", "Persiapan darah", "Persetujuan tindakan", "Konsultasi bidang lain jika diperlukan", "Pemeriksaan fisik"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "PREP", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Evaluasi pra-anestesi adalah penilaian pasien: anamnesis, pemeriksaan fisik, pemeriksaan penunjang, terapi praoperasi (termasuk persiapan darah bila perlu), konsultasi ke dokter ahli lain, dokumentasi, dan persetujuan tindakan (slide PREP 6 dan 8). Persiapan alat dan obat anestesi adalah tahap persiapan di kamar operasi (cek mesin, STATICS), bukan bagian evaluasi pasien.", "w": {"b": "Persiapan darah (golongan darah, crossmatch) adalah bagian dari rencana praoperasi berdasarkan evaluasi.", "c": "Persetujuan tindakan masuk tahapan evaluasi pra operasi di slide (\"Komunikasi persetujuan Tindakan\").", "d": "Rujukan atau konsultasi ke dokter ahli lain tercantum di slide.", "e": "Pemeriksaan fisik adalah inti evaluasi."}, "hy": "Evaluasi pra-anestesi = menilai dan mengoptimalkan pasien. Persiapan alat/obat = persiapan kamar operasi.", "ev": [{"deck": "PREP", "page": 8, "quote": "TAHAPAN EVALUASI PRA OPERASI"}, {"deck": "PREP", "page": 6, "quote": "Merujuk untuk pemeriksaan dokter ahli lain"}], "refs": []}, {"id": "A144", "sec": "anes", "stem": "Berikut merupakan tujuan pre-anestesi:", "vig": null, "opts": ["Mengetahui risiko perioperatif", "Memberi dukungan psikologis", "Mengetahui rencana pembiusan", "A & B benar", "A, B, C benar"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "e", "topic": "PREP", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Slide Persiapan Perioperatif (tujuan evaluasi pra-anestesi) mencantumkan ketiganya: merumuskan penilaian risiko perioperatif, memberi dukungan psikologis, dan merumuskan rencana spesifik serta alternatif tindakan anestesi. Selain itu juga mendapatkan informasi relevan, mengoptimalkan kondisi pasien, dan mendapatkan persetujuan.", "w": {"a": "Benar, tetapi b dan c juga benar.", "b": "Benar, tetapi a dan c juga benar.", "c": "Benar, tetapi a dan b juga benar.", "d": "Rencana pembiusan (c) juga termasuk tujuan."}, "hy": "Tujuan pra-anestesi: informasi, risiko, optimasi, rencana anestesi dan nyeri, dukungan psikologis, persetujuan.", "ev": [{"deck": "PREP", "page": 3, "quote": "Merumuskan penilaian risiko perioperative"}, {"deck": "PREP", "page": 3, "quote": "Memberi dukungan psikologis pada pasien"}, {"deck": "PREP", "page": 3, "quote": "Perumusan rencana spesifik dan alternatif untuk tindakan anestesi"}], "refs": []}, {"id": "A145", "sec": "anes", "stem": "Pasien mengalami infeksi saluran pernapasan dan dijadwalkan untuk operasi elektif. Apa tindakan yang tepat?", "vig": null, "opts": ["Mengganti jenis anestesi yang digunakan", "Menunda operasi", "Melanjutkan operasi sesuai rencana", "Memberi antibiotik dan melanjutkan operasi", "Meningkatkan dosis premedikasi"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "PREP", "st": "peng", "deb": null, "note": null, "gl": null, "r": "Infeksi saluran napas akut membuat saluran napas hiperreaktif selama beberapa minggu: risiko laringospasme, bronkospasme, desaturasi, batuk, dan pneumonia pascaoperasi meningkat, terutama pada anak dan bila diintubasi. Untuk operasi elektif, langkah yang tepat adalah menunda sampai infeksi sembuh (umumnya 2–4 minggu, tergantung beratnya). Slide menyebut salah satu hasil evaluasi praoperasi adalah \"operasi ditunda\" untuk memperbaiki kondisi pasien.", "w": {"a": "Mengganti teknik anestesi tidak menghilangkan risiko saluran napas reaktif; keputusan utamanya menunda operasi elektif.", "c": "Melanjutkan sesuai rencana mengabaikan peningkatan risiko komplikasi respirasi.", "d": "Antibiotik tidak menghilangkan hiperreaktivitas jalan napas, dan sebagian besar ISPA disebabkan virus.", "e": "Menambah premedikasi tidak mengatasi risiko respirasi, bahkan bisa menekan napas."}, "hy": "Operasi elektif dengan infeksi saluran napas akut: tunda (sekitar 2–4 minggu). Operasi darurat tetap jalan dengan antisipasi.", "ev": [{"deck": "PREP", "page": 4, "quote": "Operasi ditunda waktunya"}, {"deck": "PREP", "page": 5, "quote": "Memperbaiki perawatan preoperative"}], "refs": ["tb_morgan"]}, {"id": "A146", "sec": "anes", "stem": "Penderita usia 70 tahun akan menjalani anestesi umum. Fisik sehat dan laboratorium normal, tetapi penderita memiliki hipertensi dan DM terkontrol. Menurut penggolongan status fisik ASA, pasien tergolong:", "vig": null, "opts": ["PS 1", "PS 2", "PS 3", "PS 4", "PS 5"], "src": ["Tabulasi IPK"], "n": 3, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "PREP", "st": "ppt", "deb": null, "note": "Soal ini muncul tiga kali di Tabulasi (no. 7, 8 versi bahasa Inggris, dan 9 bagian Persiapan) dengan urutan opsi berbeda.", "gl": null, "r": "ASA 2 adalah pasien dengan penyakit sistemik ringan tanpa keterbatasan fungsional. Contoh di slide: diabetes ringan, hipertensi terkontrol, obesitas, serta usia ekstrem (neonatus, geriatri) tanpa penyakit sistemik. Pasien 70 tahun dengan HT dan DM terkontrol, fisik sehat, dan laboratorium normal termasuk ASA 2.", "w": {"a": "ASA 1 hanya untuk pasien sehat normal tanpa penyakit sistemik.", "c": "ASA 3 bila penyakit sistemik berat dengan keterbatasan fungsional (misalnya DM dengan komplikasi vaskular, angina, riwayat infark).", "d": "ASA 4 bila penyakit sistemik berat yang mengancam jiwa terus-menerus.", "e": "ASA 5 adalah pasien moribund yang tidak diharapkan hidup tanpa operasi."}, "hy": "ASA 2 = penyakit sistemik ringan, terkontrol, tanpa batasan aktivitas (HT/DM terkontrol, obesitas, usia ekstrem).", "ev": [{"deck": "PREP", "page": 20, "quote": "misalnya diabetes ringan, hipertensi terkontrol, dan obesitas"}, {"deck": "PREP", "page": 19, "quote": "Pasien dengan DM ringan direncanakan untuk operasi appendectomy"}], "refs": ["hurwitz2017"]}, {"id": "A147", "sec": "anes", "stem": "Seorang laki-laki 70 tahun dengan hipertrofi prostat akan menjalani pembedahan. Pada pemeriksaan didapatkan tekanan darah 180/110 mmHg. Pemeriksaan lain tidak didapatkan kelainan. Pasien tersebut termasuk status fisik:", "vig": null, "opts": ["ASA 3", "ASA 4", "ASA 2", "ASA 1", "ASA 5"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "PREP", "st": "peng", "deb": "Sebagian buku lama menilai ASA hanya dari dampak fungsional, sehingga ada yang memilih ASA 2. Contoh ASA terbaru menempatkan hipertensi tidak terkontrol di ASA 3.", "note": null, "gl": null, "r": "Tekanan darah 180/110 mmHg adalah hipertensi tidak terkontrol (derajat 3). Menurut contoh resmi ASA, hipertensi yang terkontrol termasuk ASA 2, sedangkan hipertensi yang tidak terkontrol (poorly controlled) termasuk ASA 3. Pada TD ≥180/110 operasi elektif umumnya ditunda untuk optimasi tekanan darah lebih dahulu. Slide hanya memberi contoh \"hipertensi terkontrol\" untuk ASA 2, sehingga klasifikasi hipertensi tak terkontrol di sini mengikuti contoh ASA.", "w": {"b": "ASA 4 bila penyakit mengancam jiwa terus-menerus (misalnya krisis hipertensi dengan kerusakan organ, gagal jantung dekompensasi).", "c": "ASA 2 untuk hipertensi yang terkontrol, sedangkan 180/110 tidak terkontrol.", "d": "Pasien ini punya penyakit sistemik, jadi bukan ASA 1.", "e": "ASA 5 untuk pasien moribund."}, "hy": "HT terkontrol = ASA 2. HT tidak terkontrol (≥180/110) = ASA 3 dan biasanya operasi elektif ditunda.", "ev": [{"deck": "PREP", "page": 20, "quote": "ASA III Penyakit sistemik parah yang membatasi aktivitas"}, {"deck": "PREP", "page": 20, "quote": "hipertensi terkontrol"}], "refs": ["hurwitz2017"]}, {"id": "A148", "sec": "anes", "stem": "Jika seseorang memiliki Revised Cardiac Risk Index (RCRI) 3, apa artinya bila ia akan menjalani operasi non-jantung?", "vig": null, "opts": ["Risiko ringan kejadian jantung", "Risiko sedang ke tinggi kejadian jantung", "Pasien tidak bisa dioperasi", "Indeks tidak ada hubungannya", "(opsi tidak tercatat di rekap)"], "src": ["Tabulasi IPK"], "n": 1, "inc": true, "img": null, "pool": "drill", "key": "b", "topic": "PREP", "st": "ppt", "deb": null, "note": "Opsi asli di rekap menulis \"risiko ... pembesaran jantung\"; yang dimaksud RCRI adalah risiko kejadian jantung mayor (infark, edema paru, henti jantung, blok jantung). Opsi e tidak tercatat.", "gl": null, "r": "RCRI (Lee 1999) memberi 1 poin untuk tiap faktor: operasi risiko tinggi, penyakit jantung iskemik, riwayat gagal jantung, riwayat penyakit serebrovaskular, DM dengan insulin, dan kreatinin >2 mg/dL. Slide memberi risiko kejadian jantung mayor: 0 poin 0,4%; 1 poin 1,0%; 2 poin 2,4%; ≥3 poin 5,4%. Skor 3 berarti risiko tinggi, sehingga perlu evaluasi lanjut (kapasitas fungsional, pemeriksaan jantung bila akan mengubah tata laksana) dan optimasi, bukan larangan operasi.", "w": {"a": "Risiko rendah hanya untuk skor 0–1.", "c": "RCRI tinggi bukan kontraindikasi absolut; ia memandu evaluasi dan optimasi lanjutan.", "d": "RCRI justru dibuat untuk memprediksi risiko jantung pada bedah non-jantung.", "e": "Opsi ini tidak tercatat lengkap di rekap/recall, sehingga tidak bisa dinilai."}, "hy": "RCRI ≥3: risiko kejadian jantung mayor sekitar 5,4% (slide), artinya risiko tinggi.", "ev": [{"deck": "PREP", "page": 16, "quote": "REVISI INDEKS RISIKO JANTUNG UNTUK MEMPREDIKSI RISIKO JANTUNG PERIOPERATIF PADA BEDAH NON JANTUNG"}, {"deck": "PREP", "page": 17, "quote": ">3 5.4%"}], "refs": ["lee1999"]}, {"id": "A149", "sec": "anes", "stem": "Yang termasuk dalam status fisik ASA 1 adalah sebagai berikut, kecuali:", "vig": null, "opts": ["Pasien tanpa gangguan psikiatrik", "Pasien tanpa gangguan organik", "Pasien tanpa gangguan biokimia", "Pasien dengan gangguan sistemik ringan", "Pasien tanpa gangguan fisiologik"], "src": ["Tabulasi IPK"], "n": 2, "inc": false, "img": null, "pool": "drill", "key": "d", "topic": "PREP", "st": "ppt", "deb": null, "note": "Soal muncul dua kali di Tabulasi (no. 15 dan 16 bagian Persiapan) dengan redaksi hampir sama.", "gl": null, "r": "ASA 1 adalah pasien sehat normal: tanpa gangguan organik, fisiologis, biokimia, maupun psikiatrik. Begitu ada penyakit sistemik ringan, pasien masuk ASA 2.", "w": {"a": "Tanpa gangguan psikiatrik adalah ciri ASA 1.", "b": "Tanpa gangguan organik adalah ciri ASA 1.", "c": "Tanpa gangguan biokimia adalah ciri ASA 1.", "e": "Tanpa gangguan fisiologik adalah ciri ASA 1."}, "hy": "ASA 1: sehat total. Ada penyakit sistemik ringan: ASA 2.", "ev": [{"deck": "PREP", "page": 20, "quote": "ASA I Penyakit organik, biokimia, atau kejiwaan pasien sehat normal"}], "refs": []}, {"id": "A150", "sec": "anes", "stem": "Kategori yang paling tepat untuk pasien dewasa muda sehat dengan mioma uteri yang akan menjalani miomektomi adalah:", "vig": null, "opts": ["ASA 1", "ASA 2", "ASA 1E (1D)", "ASA 2E (2D)", "Semua salah"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "PREP", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Penyakit bedah lokal (mioma uteri) yang tidak menimbulkan gangguan sistemik tidak menaikkan ASA. Slide memakai contoh persis ini untuk ASA 1: wanita muda sehat dengan mioma uteri yang akan menjalani miomektomi. Operasinya elektif, jadi tanpa sufiks E/D.", "w": {"b": "ASA 2 bila ada penyakit sistemik ringan, misalnya anemia akibat perdarahan mioma (lihat soal berikutnya).", "c": "Sufiks E/D hanya untuk operasi darurat.", "d": "Tidak ada penyakit sistemik dan bukan darurat.", "e": "Opsi a benar."}, "hy": "Kelainan bedah lokal tanpa efek sistemik tidak menaikkan ASA.", "ev": [{"deck": "PREP", "page": 19, "quote": "Seorang Wanita muda sehat dengan myoma uteri akan dilakukan myomectomy"}], "refs": []}, {"id": "A151", "sec": "anes", "stem": "Kategori yang paling tepat untuk pasien dewasa muda dengan mioma uteri dan anemia (Hb sekitar 8 g/dL) yang akan menjalani miomektomi adalah:", "vig": null, "opts": ["ASA 1", "ASA 2", "ASA 1E (1D)", "ASA 2E (2D)", "Semua salah"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "PREP", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Mioma uteri saja termasuk ASA 1 (contoh di slide). Anemia sedang (Hb sekitar 8 g/dL) akibat perdarahan mioma adalah gangguan sistemik ringan tanpa batasan fungsional, sehingga pasien naik menjadi ASA 2. Miomektomi tetap operasi elektif, jadi tanpa sufiks E/D. Pada praktiknya anemia ini sebaiknya dikoreksi dulu sebelum operasi elektif.", "w": {"a": "ASA 1 hanya bila pasien sehat tanpa gangguan sistemik seperti anemia.", "c": "Bukan operasi darurat dan ada gangguan sistemik.", "d": "Penyakit sistemik ringan ya, tetapi operasinya elektif, jadi tanpa E/D.", "e": "Opsi b benar."}, "hy": "Anemia ringan-sedang = gangguan sistemik ringan = ASA 2.", "ev": [{"deck": "PREP", "page": 18, "quote": "2 Pasien dengan penyakit sistemik ringan (tidak ada batasan fungsional)"}, {"deck": "PREP", "page": 19, "quote": "Seorang Wanita muda sehat dengan myoma uteri akan dilakukan myomectomy"}], "refs": []}, {"id": "A152", "sec": "anes", "stem": "Kategori yang paling tepat untuk pasien dewasa muda sehat yang akan dioperasi karena hernia inguinalis inkarserata yang menyebabkan mual dan muntah adalah:", "vig": null, "opts": ["ASA 1", "ASA 2", "ASA 1E (1D)", "ASA 2E (2D)", "Semua salah"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "PREP", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Pasien dewasa muda sehat dengan hernia termasuk ASA 1 (contoh slide). Hernia inkarserata dengan mual-muntah adalah keadaan darurat (risiko strangulasi), sehingga ditambah sufiks E (di Indonesia sering ditulis D, darurat): ASA 1E. Bila muntah sudah menimbulkan dehidrasi bermakna atau gangguan elektrolit, ASA-nya bisa naik.", "w": {"a": "Operasinya darurat, jadi harus ada sufiks E/D.", "b": "Pasien sehat, tidak ada penyakit sistemik.", "d": "Tidak ada penyakit sistemik yang disebut, jadi bukan ASA 2.", "e": "Opsi c benar."}, "hy": "Operasi darurat: tambah E (atau D). Hernia inkarserata pada pasien sehat = ASA 1E.", "ev": [{"deck": "PREP", "page": 18, "quote": "Jika prosedurnya darurat, status fisik diikuti oleh \"E\""}, {"deck": "PREP", "page": 19, "quote": "Seorang dewasa muda sehat akan menjalani operasi hernia inguinalis"}], "refs": []}, {"id": "A153", "sec": "anes", "stem": "Tujuan pemberian premedikasi pada pasien yang akan menjalani anestesi untuk pembedahan adalah hal-hal di bawah ini, kecuali:", "vig": null, "opts": ["Menghilangkan perasaan cemas", "Memberikan ketenangan pada pasien", "Tidak diperlukan pada pasien rawat jalan", "Mengurangi kebutuhan obat anestesi", "Mengurangi sekresi kelenjar"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "PREP", "st": "peng", "deb": null, "note": null, "gl": null, "r": "Premedikasi bertujuan mengurangi cemas dan menenangkan pasien, memberi amnesia, mengurangi kebutuhan obat anestesi, mengurangi sekresi (antisialagog), mengurangi risiko aspirasi (antasida/H2-blocker), dan mencegah refleks vagal. Pernyataan \"tidak diperlukan pada pasien rawat jalan\" bukan tujuan premedikasi; kebutuhan premedikasi dinilai per pasien (slide: \"Akankah premedikasi sedative-hypnotic bermanfaat?\"), termasuk pasien rawat jalan yang cemas, tetapi dengan obat kerja singkat.", "w": {"a": "Ansiolisis adalah tujuan utama premedikasi.", "b": "Sedasi ringan termasuk tujuan premedikasi.", "d": "Premedikasi (misalnya opioid atau benzodiazepin) mengurangi kebutuhan agen induksi dan rumatan.", "e": "Antikolinergik (atropin, glikopirolat) dipakai untuk mengurangi sekresi."}, "hy": "Tujuan premedikasi: ansiolisis, sedasi, amnesia, analgesia, antisialagog, profilaksis aspirasi, antivagal.", "ev": [{"deck": "PREP", "page": 23, "quote": "Akankah premedikasi sedative-hypnotic bermanfaat?"}], "refs": ["tb_morgan"]}, {"id": "A154", "sec": "anes", "stem": "Tujuan evaluasi pra operasi pada pasien yang akan dibedah adalah:", "vig": null, "opts": ["Melakukan penilaian medis pada pasien yang akan dilakukan pembedahan rawat jalan", "Mencari informasi tentang riwayat penyakit yang pernah diderita sebelum dilakukan pembedahan", "Pemeriksaan preoperatif merupakan prosedur yang harus dilalui pada pasien yang dilakukan pembedahan", "Memberikan informasi tentang pembedahan dan pembiusan untuk mengurangi kecemasan", "Pemeriksaan preoperatif tidak menentukan apakah boleh dilakukan pembedahan secara rawat jalan"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "d", "topic": "PREP", "st": "ppt", "deb": "Opsi b juga bisa dibela sebagai bagian dari tujuan \"mendapatkan informasi yang relevan\" di slide. Kunci memilih d karena paling jelas berbentuk tujuan.", "note": null, "gl": null, "r": "Soal rekap ini kurang jelas karena beberapa opsi terdengar benar. Yang paling tepat sebagai tujuan adalah memberi informasi tentang pembedahan dan pembiusan untuk mengurangi kecemasan. Slide mencantumkan \"memberi dukungan psikologis\" dan \"memberi tahu pasien tentang prosedur yang diusulkan dan mendapatkan persetujuan\" sebagai tujuan evaluasi pra-anestesi.", "w": {"a": "Evaluasi praoperasi berlaku untuk semua pasien, tidak hanya rawat jalan.", "b": "Mencari riwayat penyakit adalah cara (anamnesis), bukan tujuan itu sendiri; tujuannya menilai risiko dan mengoptimalkan pasien.", "c": "Ini pernyataan prosedural (\"harus dilalui\"), bukan tujuan.", "e": "Salah: evaluasi praoperasi justru menentukan apakah pasien layak dioperasi secara rawat jalan."}, "hy": "Tujuan evaluasi pra-anestesi: informasi relevan, risiko, optimasi, rencana anestesi, dukungan psikologis, persetujuan.", "ev": [{"deck": "PREP", "page": 3, "quote": "Memberi tahu pasien tentang prosedur yang diusulkan dan mendapatkan persetujuan"}, {"deck": "PREP", "page": 3, "quote": "Memberi dukungan psikologis pada pasien"}], "refs": []}, {"id": "A155", "sec": "anes", "stem": "Tujuan kunjungan pra bedah pada pasien yang akan menjalani pembedahan adalah hal-hal di bawah ini, kecuali:", "vig": null, "opts": ["Memberikan gambaran kepada pasien tentang apa yang akan dilakukan", "Melakukan pemeriksaan fisik", "Mengenal lebih jauh tentang status sosial pasien", "Memperoleh informed consent dari pasien dan keluarganya untuk pembedahan dan anestesinya", "Menghimpun masalah pasien untuk dibicarakan dengan ahli bedahnya"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "PREP", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Kunjungan pra bedah (visite pra-anestesi) bertujuan menilai pasien (anamnesis, pemeriksaan fisik), menjelaskan rencana tindakan dan anestesi, mendapatkan persetujuan, serta mengomunikasikan masalah pasien dengan ahli bedah (slide PREP 3 dan 11). Status sosial pasien tidak relevan dengan penilaian risiko anestesi dan tidak boleh memengaruhi pelayanan.", "w": {"a": "Menjelaskan rencana tindakan adalah tujuan kunjungan pra bedah.", "b": "Pemeriksaan fisik adalah inti visite pra-anestesi.", "d": "Persetujuan tindakan didapat saat kunjungan pra bedah.", "e": "Slide: \"Berkomunikasi dengan ahli bedah mengenai kondisi penderita\"."}, "hy": "Status sosial bukan bagian dari penilaian pra-anestesi.", "ev": [{"deck": "PREP", "page": 11, "quote": "Berkomunikasi dengan ahli bedah mengenai kondisi penderita"}, {"deck": "PREP", "page": 3, "quote": "Memberi tahu pasien tentang prosedur yang diusulkan dan mendapatkan persetujuan"}], "refs": []}, {"id": "A156", "sec": "anes", "stem": "Keuntungan pembedahan yang dilakukan secara rawat jalan adalah:", "vig": null, "opts": ["Memberikan ketenangan untuk anak yang akan dibedah", "Mengurangi risiko infeksi pada anak yang mengidap penyakit imunologi", "Tidak perlu didampingi keluarga", "Tidak tergantung pada ketersediaan tempat tidur rumah sakit", "Penggunaan kamar operasi yang efisien"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "d", "topic": "PREP", "st": "luar", "deb": "Opsi a dan e juga sering disebut sebagai keuntungan di beberapa buku. Kunci memilih d sebagai keuntungan yang paling spesifik untuk bedah rawat jalan.", "note": null, "gl": null, "r": "Bedah rawat jalan (day surgery) dipilih untuk pasien dan prosedur risiko rendah. Keuntungan khasnya: tidak bergantung pada ketersediaan tempat tidur rawat inap, biaya lebih rendah, risiko infeksi nosokomial lebih kecil, dan anak cepat kembali ke lingkungan keluarga. Dari pilihan, keuntungan yang paling khas dan tidak diperdebatkan adalah tidak tergantung pada tempat tidur rumah sakit. Topik ini tidak dibahas di PPT.", "w": {"a": "Anak memang lebih tenang bila cepat pulang, tetapi ini bukan keuntungan yang baku; anak yang cemas tetap butuh premedikasi dan pendampingan.", "b": "Anak dengan gangguan imunologi biasanya bukan kandidat ideal untuk bedah rawat jalan.", "c": "Pasien rawat jalan justru wajib didampingi orang dewasa saat pulang dan 24 jam pertama.", "e": "Efisiensi kamar operasi lebih dipengaruhi penjadwalan, bukan status rawat jalan."}, "hy": "Bedah rawat jalan: pasien wajib didampingi saat pulang; keuntungan utamanya bebas dari ketersediaan tempat tidur dan biaya lebih rendah.", "ev": [], "refs": ["tb_morgan"]}, {"id": "A157", "sec": "anes", "stem": "Pemilihan obat premedikasi dipertimbangkan atas dasar semua di bawah ini, KECUALI:", "vig": null, "opts": ["Umur", "Penyakit yang menyertai", "Jenis kelamin", "Obat anestesi yang dipergunakan", "Berat badan"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "PREP", "st": "luar", "deb": null, "note": null, "gl": null, "r": "Obat dan dosis premedikasi disesuaikan dengan umur (anak dan lansia lebih sensitif), berat badan (dosis per kg), penyakit penyerta (misalnya hindari sedatif pada OSA atau gagal napas), dan rencana obat anestesi (misalnya antisialagog sebelum ketamin). Jenis kelamin tidak menjadi dasar pemilihan premedikasi. Topik ini tidak dibahas detail di PPT.", "w": {"a": "Umur memengaruhi sensitivitas obat.", "b": "Penyakit penyerta menentukan obat yang aman.", "d": "Rencana obat anestesi memengaruhi kebutuhan premedikasi.", "e": "Dosis dihitung per berat badan."}, "hy": "Premedikasi disesuaikan dengan umur, BB, komorbid, dan rencana anestesi.", "ev": [], "refs": ["tb_morgan"]}, {"id": "A158", "sec": "anes", "stem": "Pemeriksaan preoperatif/pre-anestesi mencakup hal-hal berikut, kecuali:", "vig": null, "opts": ["Pemeriksaan psikologis", "Menghentikan semua obat yang dikonsumsi pasien", "Anamnesis", "Pemeriksaan laboratorium", "Pemeriksaan fisik"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "PREP", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Evaluasi pra-anestesi mencakup anamnesis (termasuk daftar obat dan dosisnya), pemeriksaan fisik, pemeriksaan penunjang, serta penilaian psikologis. Obat rutin tidak dihentikan semuanya. Sebagian besar justru dilanjutkan (misalnya beta-blocker, statin, antiepilepsi, bronkodilator), dan hanya obat tertentu yang dihentikan atau disesuaikan (misalnya antikoagulan, sebagian antidiabetik, ACE inhibitor/ARB pada kasus tertentu). Slide meminta mencatat obat yang diminum dengan dosis dan jadwalnya.", "w": {"a": "Penilaian kondisi psikologis (kecemasan) termasuk evaluasi pra-anestesi.", "c": "Anamnesis adalah tahap pertama evaluasi.", "d": "Pemeriksaan laboratorium dilakukan sesuai indikasi.", "e": "Pemeriksaan fisik termasuk evaluasi."}, "hy": "Obat rutin dinilai satu per satu; sebagian besar dilanjutkan sampai hari operasi.", "ev": [{"deck": "PREP", "page": 9, "quote": "Resep dan obat yang diminum dengan dosis dan jadwalnya"}, {"deck": "PREP", "page": 8, "quote": "Melakukan test diagnostic"}], "refs": []}, {"id": "A159", "sec": "anes", "stem": "Halotan dapat menyebabkan efek samping yang sering menyebabkan kematian, yaitu:", "vig": null, "opts": ["Aritmia", "Malignant hyperthermia", "Tekanan darah turun", "Apnea", "Syok"], "src": ["Tabulasi IPK"], "n": 2, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "FARM", "st": "ppt", "deb": null, "note": "Di Tabulasi soal ini juga muncul dalam versi bahasa Inggris (no. 2 bagian Farmakologi): \"Halothane is less irritating to the respiratory tract, but it has one disadvantage\", jawabannya juga aritmia.", "gl": null, "r": "Halotan mensensitisasi miokard terhadap katekolamin, sehingga mudah timbul aritmia ventrikel (ekstrasistol, takikardia ventrikel, sampai fibrilasi), apalagi bila ada hiperkapnia, hipoksia, atau pemberian adrenalin. Slide Farmakologi menyebut halotan membuat miokard lebih peka aritmia. Halotan juga dikenal karena hepatitis halotan dan dapat memicu hipertermia maligna, tetapi kedua komplikasi itu jarang; risiko aritmia lebih sering menjadi masalah klinis.", "w": {"b": "Hipertermia maligna bisa dipicu semua agen volatil dan suksinilkolin, tetapi kejadiannya jarang (sekitar 1:50.000–100.000 dewasa).", "c": "Halotan memang menurunkan tekanan darah (depresi miokard), tetapi umumnya bisa dikendalikan dengan menurunkan konsentrasi.", "d": "Apnea bergantung dosis dan bisa ditangani dengan ventilasi.", "e": "Syok bukan efek samping khas halotan."}, "hy": "Halotan: tidak iritatif (cocok induksi inhalasi), tetapi sensitisasi miokard terhadap katekolamin (aritmia) dan hepatitis halotan.", "ev": [{"deck": "FARM", "page": 43, "quote": "Beberapa obat anestesi (misal : Halothan) membuat miokard lebih peka aritmia"}], "refs": ["tb_morgan"]}, {"id": "A160", "sec": "anes", "stem": "Obat anestesi berikut yang mempunyai efek aritmogenik paling besar adalah:", "vig": null, "opts": ["Sevofluran", "Isofluran", "Enfluran", "Halotan", "Desfluran"], "src": ["Tabulasi IPK"], "n": 2, "inc": false, "img": null, "pool": "drill", "key": "d", "topic": "FARM", "st": "ppt", "deb": null, "note": "Soal muncul dua kali di Tabulasi (versi bahasa Inggris no. 3 dan versi bahasa Indonesia no. 7 bagian Farmakologi).", "gl": null, "r": "Di antara agen volatil, halotan paling kuat mensensitisasi miokard terhadap katekolamin. Dosis adrenalin yang aman (submukosa) pada halotan jauh lebih kecil dibanding pada isofluran atau sevofluran. Agen eter berhalogen (isofluran, sevofluran, desfluran) jauh lebih sedikit sifat aritmogeniknya. Slide Farmakologi menjadikan halotan sebagai contoh obat yang membuat miokard peka aritmia.", "w": {"a": "Sevofluran stabil secara elektrofisiologis dan jarang memicu aritmia.", "b": "Isofluran minimal mensensitisasi miokard.", "c": "Enfluran lebih rendah sifat aritmogeniknya dibanding halotan (masalah utamanya aktivitas epileptiform pada EEG).", "e": "Desfluran bisa menyebabkan takikardia bila konsentrasinya dinaikkan cepat (stimulasi simpatis), tetapi bukan sensitisasi miokard."}, "hy": "Paling aritmogenik: halotan.", "ev": [{"deck": "FARM", "page": 43, "quote": "Beberapa obat anestesi (misal : Halothan) membuat miokard lebih peka aritmia"}], "refs": ["tb_morgan"]}, {"id": "A161", "sec": "anes", "stem": "Titik tangkap utama prostigmin (neostigmin) sebagai reversal/antidot pelumpuh otot adalah pada:", "vig": null, "opts": ["Asetilkolinesterase", "Reseptor pascasinaps", "Asetilkolin", "Terminal akson", "Aktin"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "FARM", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Neostigmin menghambat enzim asetilkolinesterase di celah sinaps, sehingga asetilkolin tidak cepat dipecah dan kadarnya naik. Asetilkolin yang lebih banyak ini bersaing dengan pelumpuh otot nondepolarisasi di reseptor nikotinik pascasinaps dan memulihkan transmisi neuromuskular. Karena efek muskariniknya (bradikardia, hipersekresi), neostigmin selalu diberikan bersama atropin atau glikopirolat. Slide: \"PROSTIGMIN / NEOSTIGMINE Acetylcholinesterase Inhibitor\".", "w": {"b": "Reseptor pascasinaps adalah tempat kerja pelumpuh otot, bukan neostigmin.", "c": "Asetilkolin adalah neurotransmiter yang kadarnya dinaikkan secara tidak langsung, bukan target obat.", "d": "Neostigmin tidak bekerja di terminal akson.", "e": "Aktin adalah protein kontraktil otot, tidak berhubungan."}, "hy": "Neostigmin = antikolinesterase, reversal pelumpuh otot nondepolarisasi; berikan bersama atropin/glikopirolat.", "ev": [{"deck": "FARM", "page": 57, "quote": "PROSTIGMIN / NEOSTIGMINE Acetylcholinesterase Inhibitor"}], "refs": []}, {"id": "A162", "sec": "anes", "stem": "Pertolongan penderita gawat darurat diupayakan untuk:", "vig": null, "opts": ["Mempertahankan jiwa penderita", "Mengurangi penyulit yang mungkin timbul", "Meringankan penderitaan", "Penolong melakukan dengan kaidah-kaidah aseptik", "Semua benar"], "src": ["Tabulasi IPK"], "n": 2, "inc": false, "img": null, "pool": "drill", "key": "e", "topic": "GD", "st": "ppt", "deb": null, "note": "Soal muncul dua kali di Tabulasi (versi bahasa Inggris no. 3 dan bahasa Indonesia no. 12 bagian Gawat Darurat).", "gl": null, "r": "Penderita gawat darurat adalah penderita yang akan cacat, kehilangan anggota tubuh, atau meninggal bila tidak segera ditolong (slide). Karena itu pertolongan bertujuan mempertahankan jiwa, mencegah atau mengurangi penyulit (kecacatan), dan meringankan penderitaan. Pertolongan tetap dilakukan dengan prinsip aseptik sejauh memungkinkan agar tidak menambah komplikasi (infeksi). Semua opsi benar.", "w": {"a": "Benar, tetapi opsi lain juga benar.", "b": "Benar, tetapi opsi lain juga benar.", "c": "Benar, tetapi opsi lain juga benar.", "d": "Benar, tetapi opsi lain juga benar."}, "hy": "Tujuan pertolongan gawat darurat: selamatkan nyawa, cegah cacat, ringankan penderitaan.", "ev": [{"deck": "GD", "page": 2, "quote": "Penderita yang oleh karena suatu penyebab (penyakit, tindakan, kecelakaan) bila tidak segera ditolong akan cacat, kehilangan anggota tubuh atau meninggal"}], "refs": []}, {"id": "A163", "sec": "anes", "stem": "Obstruksi jalan napas karena tersedak bakso dapat ditolong dengan cara:", "vig": null, "opts": ["Hentakan mendadak pada ulu hati (Heimlich)", "Hentakan mendadak pada leher bagian belakang", "Hentakan mendadak pada punggung setinggi garis antarskapula (back blow)", "Precordial thump", "Semua benar"], "src": ["Tabulasi IPK"], "n": 2, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "GD", "st": "ppt", "deb": "Soal ini cacat karena dua opsi benar (a dan c). Versi bahasa Inggrisnya (no. 4) berbentuk \"kecuali\", dengan jawaban precordial thump atau hentakan di leher belakang.", "note": "Versi bahasa Inggris di Tabulasi (no. 4 bagian Gawat Darurat) bertanya \"can be helped in any way, except\", jadi jawabannya hentakan di leher belakang atau precordial thump.", "gl": null, "r": "Sumbatan benda asing (tersedak) pada korban sadar ditolong dengan back blows (lima hentakan di punggung di antara kedua skapula) dan abdominal thrust (manuver Heimlich, hentakan ke arah atas di ulu hati). Slide Gawat Darurat mencantumkan keduanya, juga thoracal thrust untuk pasien hamil atau gemuk. Soal rekap ini punya dua jawaban yang benar (a dan c). Kunci memilih a karena Heimlich adalah manuver yang paling dikenal, tetapi back blow juga benar.", "w": {"b": "Hentakan di leher belakang tidak termasuk teknik penanganan tersedak dan berbahaya.", "c": "Back blow juga teknik yang benar menurut slide, tetapi kunci memilih Heimlich sebagai jawaban utama.", "d": "Precordial thump adalah tindakan untuk VF/VT yang disaksikan (sekarang hampir tidak dianjurkan), bukan untuk tersedak.", "e": "Opsi b dan d salah."}, "hy": "Tersedak, korban sadar: 5 back blows bergantian dengan 5 abdominal thrust. Tidak sadar: mulai CPR.", "ev": [{"deck": "GD", "page": 21, "quote": "Abdominal thrust (Heimlich manuver)"}, {"deck": "GD", "page": 24, "quote": "Back blows Lima kali hentakan pada punggung, diantara dua scapula"}], "refs": ["panchal2020"]}, {"id": "A164", "sec": "anes", "stem": "Manuver Heimlich adalah tindakan:", "vig": null, "opts": ["Jaw thrust", "Precordial thump", "Hentakan pada epigastrium", "Head tilt", "Chin lift"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "GD", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Manuver Heimlich (abdominal thrust) adalah hentakan ke arah dalam dan atas di epigastrium, antara pusar dan prosesus xifoideus. Tekanan intratoraks naik mendadak sehingga benda asing terdorong keluar dari jalan napas. Dilakukan pada korban tersedak yang masih sadar (slide).", "w": {"a": "Jaw thrust adalah manuver membuka jalan napas pada sumbatan lidah, terutama pada trauma.", "b": "Precordial thump adalah pukulan di sternum untuk aritmia yang disaksikan.", "d": "Head tilt membuka jalan napas pada pasien nontrauma.", "e": "Chin lift membuka jalan napas."}, "hy": "Heimlich = abdominal thrust di epigastrium, untuk tersedak pada korban sadar.", "ev": [{"deck": "GD", "page": 25, "quote": "CHOKING Heimlich Abdominal trust Korban : sadar"}], "refs": []}, {"id": "A165", "sec": "anes", "stem": "Pernyataan yang benar tentang ambulans darat adalah:", "vig": null, "opts": ["Harus dapat berjalan kencang", "Stabilitas kecepatan saat mengangkut pasien harus diutamakan", "Penerangan kabin pasien", "Sirene selalu dinyalakan saat berjalan", "Semua pernyataan di atas benar"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "GD", "st": "luar", "deb": "Opsi c juga merupakan persyaratan ambulans. Soal rekap ini kurang jelas, dan kunci memilih prinsip yang paling penting.", "note": null, "gl": null, "r": "Transportasi pasien gawat darurat mengutamakan keamanan dan stabilitas: kecepatan yang stabil tanpa akselerasi atau pengereman mendadak, supaya pemantauan dan tindakan di kabin tetap bisa dilakukan dan kondisi pasien (terutama cedera spinal, kehamilan, atau pasien terintubasi) tidak memburuk. Kecepatan tinggi meningkatkan risiko kecelakaan tanpa bukti memperbaiki luaran untuk sebagian besar pasien. Topik ini tidak ada di PPT.", "w": {"a": "Kecepatan tinggi bukan prioritas; keselamatan dan stabilitas yang utama.", "c": "Penerangan kabin memang diperlukan, tetapi kunci memilih stabilitas sebagai prinsip utama.", "d": "Sirene dinyalakan sesuai kebutuhan (kondisi gawat), tidak selalu.", "e": "Opsi a dan d salah."}, "hy": "Transportasi pasien: stabilisasi dulu, lalu transport yang aman dan stabil dengan pemantauan.", "ev": [], "refs": ["tb_atls"]}, {"id": "A166", "sec": "anes", "stem": "Pernyataan tentang transportasi pasien gawat darurat adalah benar, kecuali:", "vig": null, "opts": ["Telah dilakukan evaluasi ada/tidaknya gangguan fungsi vital", "Dijaga agar jalan napas tetap bebas selama perjalanan", "Perdarahan yang tampak telah dihentikan", "Fraktur yang ada telah difiksasi", "Memakai ambulans"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "e", "topic": "GD", "st": "luar", "deb": "Soal rekap ini kurang jelas; kunci memilih e karena keempat opsi lain adalah syarat stabilisasi baku sebelum transportasi.", "note": null, "gl": null, "r": "Sebelum transportasi, pasien harus dinilai dan distabilkan: fungsi vital dievaluasi, jalan napas diamankan, perdarahan dihentikan, dan fraktur difiksasi. Selama perjalanan jalan napas dan fungsi vital terus dipantau. \"Memakai ambulans\" bukan syarat mutlak; yang penting kendaraan dan pendamping sesuai kondisi pasien. Pada situasi tertentu dipakai kendaraan lain atau transportasi udara. Topik ini tidak ada di PPT.", "w": {"a": "Evaluasi fungsi vital wajib sebelum transportasi.", "b": "Jalan napas harus tetap bebas selama perjalanan.", "c": "Perdarahan yang tampak harus dihentikan sebelum transportasi.", "d": "Fraktur harus difiksasi untuk mencegah cedera tambahan dan nyeri."}, "hy": "Stabilkan sebelum transport: ABC aman, perdarahan berhenti, fraktur terfiksasi.", "ev": [], "refs": ["tb_atls"]}, {"id": "A167", "sec": "anes", "stem": "Head tilt, chin lift, dan jaw thrust adalah tindakan:", "vig": null, "opts": ["Menentukan derajat gangguan pernapasan", "Menentukan derajat gangguan kesadaran", "Memberikan napas buatan", "Membebaskan jalan napas", "Menentukan derajat gangguan sirkulasi"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "d", "topic": "GD", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Head tilt, chin lift, dan jaw thrust adalah manuver manual untuk membebaskan jalan napas dari sumbatan lidah pada pasien tidak sadar. Pada pasien trauma dipakai jaw thrust dengan imobilisasi in-line (slide GD 15). Manuver ini tidak memberi napas, hanya membuka jalan napas.", "w": {"a": "Derajat gangguan napas dinilai dengan look-listen-feel dan pemeriksaan, bukan manuver ini.", "b": "Kesadaran dinilai dengan AVPU atau GCS.", "c": "Napas buatan diberikan setelah jalan napas terbuka (mouth to mask, BVM).", "e": "Sirkulasi dinilai dari nadi, tekanan darah, dan perfusi."}, "hy": "Lidah jatuh: head tilt-chin lift (nontrauma) atau jaw thrust (trauma), lalu alat bantu oro/nasofaring.", "ev": [{"deck": "GD", "page": 15, "quote": "PEMBEBASAN JALAN NAFAS PENYEBAB LIDAH • Manual : - Non trauma : Head tilt Neck lift Chin lift Jaw thrust"}], "refs": []}, {"id": "A168", "sec": "anes", "stem": "Pertolongan pertama pada pasien tenggelam adalah:", "vig": null, "opts": ["Membersihkan jalan napasnya dari kotoran", "Mengangkat badan dengan kepala di bawah dan kaki di atas", "Memberikan napas buatan", "Mengangkat panggulnya dan menekan perutnya", "Melakukan precordial thump"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "CPR", "st": "luar", "deb": "Opsi a juga bisa dibela karena jalan napas harus terbuka sebelum ventilasi. Kunci memilih c karena prioritas pada tenggelam adalah segera mengoreksi hipoksia.", "note": null, "gl": null, "r": "Kematian pada tenggelam terutama karena hipoksia. Karena itu, berbeda dari henti jantung primer, korban tenggelam yang tidak bernapas perlu segera diberi napas buatan: AHA menganjurkan 2–5 napas bantuan awal, lalu CPR bila tidak ada tanda kehidupan. Jalan napas dibuka dan dibersihkan dari kotoran yang terlihat, tetapi tidak perlu mengeluarkan air dari paru: manuver memiringkan kepala ke bawah atau menekan perut tidak dianjurkan karena menunda ventilasi dan menimbulkan aspirasi muntahan.", "w": {"a": "Benda yang terlihat di mulut dibersihkan, tetapi itu bagian dari membuka jalan napas; intervensi utamanya adalah ventilasi.", "b": "Posisi kepala di bawah untuk mengeluarkan air tidak dianjurkan dan menunda resusitasi.", "d": "Menekan perut (Heimlich) untuk mengeluarkan air tidak dianjurkan; risikonya muntah dan aspirasi.", "e": "Precordial thump tidak dianjurkan untuk korban tenggelam."}, "hy": "Tenggelam = henti napas karena hipoksia: segera beri napas bantuan, jangan buang waktu mengeluarkan air.", "ev": [], "refs": ["panchal2020"]}, {"id": "A169", "sec": "anes", "stem": "Keberhasilan pertolongan pada penderita gawat darurat tergantung dari hal-hal berikut, kecuali:", "vig": null, "opts": ["Tenaga medis yang terlatih", "Tenaga medis yang tidak terlatih", "Tenaga paramedis yang terlatih", "Tindakan cepat dan tepat", "Fasilitas alat dan obat yang lengkap"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "GD", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Asas pertolongan pasien gawat di slide adalah \"time saving is life saving\", dengan konsep berpikir sederhana, tindakan sistematik, dan keterampilan memadai. Keberhasilan bergantung pada tenaga medis dan paramedis yang terlatih, tindakan cepat dan tepat, serta fasilitas yang memadai. Tenaga yang tidak terlatih bukan faktor penentu keberhasilan.", "w": {"a": "Tenaga medis terlatih adalah faktor keberhasilan.", "c": "Paramedis terlatih juga faktor keberhasilan.", "d": "Cepat dan tepat adalah inti asas time saving is life saving.", "e": "Fasilitas yang memadai mendukung keberhasilan."}, "hy": "Time saving is life saving: berpikir sederhana, sistematik, terampil.", "ev": [{"deck": "GD", "page": 6, "quote": "Azas Pertolongan Pasien Gawat : TIME SAVING is LIFE SAVING 1. Konsep berfikir sederhana 2. Tindakan sistematik 3. Ketrampilan memadai"}], "refs": []}, {"id": "A170", "sec": "anes", "stem": "Pasien kecelakaan lalu lintas dengan trauma kepala didapatkan: mata terbuka bila dirangsang nyeri, terjadi gerakan ekstensi tubuh bila dirangsang, dan suara yang menggumam. Penilaian Glasgow Coma Scale-nya adalah:", "vig": null, "opts": ["E3 M4 V4", "E3 M4 V3", "E2 M2 V2", "E2 M3 V3", "E3 M5 V5"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "GD", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Mata terbuka dengan rangsang nyeri: E2 (spontan 4, suara 3, nyeri 2, tidak ada 1). Gerakan ekstensi (deserebrasi): M2 (mengikuti perintah 6, melokalisasi 5, menarik/fleksi normal 4, fleksi abnormal 3, ekstensi 2, tidak ada 1). Suara menggumam (incomprehensible sounds): V2 (orientasi baik 5, bingung 4, kata-kata tidak tepat 3, suara tidak dimengerti 2, tidak ada 1). Total GCS 6.", "w": {"a": "Membuka mata terhadap nyeri adalah E2, bukan E3.", "b": "E salah dan respons motorik ekstensi adalah M2.", "d": "Ekstensi adalah M2 (M3 untuk fleksi abnormal), dan menggumam adalah V2.", "e": "Semua komponen terlalu tinggi."}, "hy": "GCS M: 6 perintah, 5 lokalisasi, 4 menarik, 3 fleksi abnormal (dekortikasi), 2 ekstensi (deserebrasi), 1 tidak ada.", "ev": [{"deck": "GD", "page": 55, "quote": "Extension (decerebrate)"}, {"deck": "GD", "page": 55, "quote": "Incomprehensible sounds"}], "refs": ["teasdale1974"]}, {"id": "A171", "sec": "anes", "stem": "Evaluasi Glasgow Coma Scale (GCS) pada pasien trauma kapitis: membuka mata pada rangsangan nyeri, menarik tangan pada rangsangan nyeri, dan berbicara melantur (kata-kata tidak tepat). GCS-nya adalah:", "vig": null, "opts": ["E3 M5 V4", "E1 M3 V2", "E1 M4 V3", "E2 M4 V3", "E2 M2 V4"], "src": ["Tabulasi IPK"], "n": 2, "inc": false, "img": null, "pool": "drill", "key": "d", "topic": "GD", "st": "ppt", "deb": null, "note": "Soal serupa muncul di Tabulasi (no. 13 bagian Gawat Darurat) dengan label V dan M tertukar: \"v: flexion movement with painful stimulation, m: berbicara ngelantur\". Bila labelnya dibaca sesuai isinya, hasilnya E2, fleksi = M3–4, kata-kata tidak tepat = V3.", "gl": null, "r": "Membuka mata terhadap nyeri: E2. Menarik tangan saat dirangsang nyeri (withdrawal, fleksi normal): M4. Bicara melantur dengan kata-kata tidak tepat (inappropriate words): V3. GCS = E2 M4 V3 = 9.", "w": {"a": "E3 adalah membuka mata terhadap suara; M5 adalah melokalisasi nyeri; V4 adalah bingung.", "b": "E1 berarti tidak membuka mata sama sekali.", "c": "Pasien membuka mata terhadap nyeri (E2), bukan E1.", "e": "M2 adalah ekstensi, dan V4 adalah percakapan bingung."}, "hy": "V: 5 orientasi baik, 4 bingung, 3 kata tidak tepat, 2 suara tak bermakna, 1 tidak ada.", "ev": [{"deck": "GD", "page": 55, "quote": "Normal flexion (withdraws)"}, {"deck": "GD", "page": 55, "quote": "Inappropriate words"}], "refs": ["teasdale1974"]}, {"id": "A172", "sec": "anes", "stem": "Seorang penderita datang ke IGD dengan cedera otak berat (COB) setelah KLL. Tindakan kita adalah sebagai berikut, kecuali:", "vig": null, "opts": ["Pemeriksaan primary survey", "Pemeriksaan secondary survey", "Posisi sedikit head-up 15–30 derajat", "Posisi miring (stable position) untuk mencegah aspirasi", "Semua tersebut di atas betul"], "src": ["Tabulasi IPK"], "n": 2, "inc": false, "img": null, "pool": "drill", "key": "d", "topic": "GD", "st": "peng", "deb": null, "note": "Soal muncul juga dalam versi bahasa Inggris (no. 19 bagian Gawat Darurat).", "gl": null, "r": "Pasien cedera otak berat akibat trauma harus dianggap mengalami cedera servikal sampai terbukti tidak. Penanganannya: primary survey (ABCDE dengan proteksi servikal), resusitasi, lalu secondary survey (slide GD 9). Posisi kepala sedikit dinaikkan (head-up sekitar 15–30°, dengan leher lurus) membantu aliran vena dan menurunkan TIK. Posisi miring (recovery/stable position) tidak dilakukan pada pasien trauma karena menggerakkan tulang belakang; pencegahan aspirasi dilakukan dengan suction dan airway definitif (intubasi) bila GCS ≤8. Bila harus dimiringkan (muntah), dilakukan log roll.", "w": {"a": "Primary survey adalah langkah pertama.", "b": "Secondary survey dilakukan setelah pasien stabil.", "c": "Head-up 15–30° dengan kepala netral adalah tata laksana TIK yang benar.", "e": "Opsi d salah, jadi tidak semuanya benar."}, "hy": "Trauma kepala berat: proteksi servikal, intubasi bila GCS ≤8, head-up 30° dengan leher netral, hindari hipoksia dan hipotensi.", "ev": [{"deck": "GD", "page": 9, "quote": "Pem. Fisik awal (Primary survey) (A-B-C-D) + Lab. Awal"}, {"deck": "GD", "page": 16, "quote": "Pada pasien trauma head tilt chin lift neck lift neck lift Don’t do Be careful"}], "refs": ["tb_atls"]}, {"id": "A173", "sec": "anes", "stem": "Pada penanganan kasus gawat darurat, sikap kita harus mengikuti kaidah dan sistematika penanganan berikut:", "vig": null, "opts": ["Melihat, mendengar, dan meraba kelainan pada jalan napas serta segera menangani gangguan yang mengancam nyawa", "Membutuhkan penunjang medis yang canggih", "Survei sekunder segera dilakukan walau kondisi pasien tidak stabil", "Menunggu hasil laboratorium untuk memastikan terapi yang akan dilakukan", "Anamnesis didahulukan karena dapat mengarahkan pemeriksaan fisik atau kelainan yang dicari"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "GD", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Pada pasien gawat darurat urutannya berbeda dari pasien tidak gawat. Primary survey (A-B-C-D) dilakukan lebih dulu dengan look-listen-feel, setiap gangguan yang mengancam nyawa langsung ditangani (resusitasi, stabilisasi), baru kemudian secondary survey (anamnesis, pemeriksaan kepala sampai kaki), pemeriksaan penunjang, diagnosis, dan terapi definitif (slide GD 8–9).", "w": {"b": "Penanganan awal tidak bergantung pada penunjang canggih; ABC bisa dikerjakan dengan alat sederhana.", "c": "Secondary survey dilakukan setelah pasien stabil.", "d": "Resusitasi tidak boleh menunggu laboratorium.", "e": "Mendahulukan anamnesis adalah pola pasien tidak gawat; pada pasien gawat, primary survey didahulukan."}, "hy": "Pasien gawat: primary survey dan resusitasi dulu, lalu secondary survey, baru diagnosis dan terapi definitif.", "ev": [{"deck": "GD", "page": 9, "quote": "Terapi suportif / resusitasi (life support) Stabilisasi"}, {"deck": "GD", "page": 12, "quote": "Look / Lihat"}], "refs": []}, {"id": "A174", "sec": "anes", "stem": "Seorang laki-laki 25 tahun mengalami patah tulang tertutup os radius akibat kecelakaan. Pasien sadar baik dan dirawat menunggu jadwal operasi elektif. Saat visite hari pertama setelah kecelakaan, pasien mengeluh kesakitan. Prinsip penatalaksanaan pasien tersebut yang paling tepat adalah:", "vig": null, "opts": ["Pasien mengalami trauma pada satu organ, sehingga prinsip analgesia multimodal belum perlu dilakukan", "Pasien diberikan penanganan nonfarmakologis berupa proteksi, istirahat, kompres dingin, dan elevasi", "Pasien telah mengalami nyeri neuropatik sehingga memerlukan gabapentin", "Pasien mengalami nyeri kronis yang perlu obat golongan antidepresan (amitriptilin)", "Bila nyeri berlanjut hingga 2 minggu ke depan, NSAID masih dapat digunakan sejak hari pertama"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "PAINM", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Nyeri fraktur hari pertama adalah nyeri akut nosiseptif. Penanganannya multimodal: farmakologis (parasetamol, NSAID, opioid sesuai intensitas) dan nonfarmakologis fisik berupa PRICE (proteksi/imobilisasi, istirahat, es, kompresi, elevasi), seperti di slide Manajemen Nyeri. Dari opsi yang ada, hanya b yang sepenuhnya benar.", "w": {"a": "Analgesia multimodal justru dianjurkan untuk nyeri akut trauma, walaupun hanya satu organ yang cedera.", "c": "Nyeri hari pertama setelah fraktur adalah nosiseptif, bukan neuropatik.", "d": "Nyeri baru satu hari, jadi masih akut, bukan kronis.", "e": "NSAID dipakai jangka pendek sesuai indikasi; penggunaan berkepanjangan perlu memperhatikan efek samping (lambung, ginjal, perdarahan) dan kemungkinan memperlambat penyembuhan tulang."}, "hy": "Nyeri akut muskuloskeletal: PRICE + analgesia multimodal.", "ev": [{"deck": "PAINM", "page": 9, "quote": "Protection , Rest, ice, compression, elevation (PRICE)"}], "refs": []}, {"id": "A175", "sec": "anes", "stem": "Penderita usia 80 tahun, BB 80 kg, datang ke IGD dengan keluhan tidak sadarkan diri setelah salat subuh. Yang perlu kita lakukan/evaluasi adalah:", "vig": null, "opts": ["Status kardiovaskular", "Status kondisi paru", "Status neurologis", "Status metabolik/endokrin", "Semua tersebut di atas betul"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "e", "topic": "GD", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Penurunan kesadaran mendadak pada lansia bisa berasal dari banyak sistem: kardiovaskular (aritmia, infark, syok), respirasi (hipoksia, hiperkapnia), neurologis (stroke, perdarahan), dan metabolik/endokrin (hipoglikemia, hiperglikemia, gangguan elektrolit). Evaluasinya sistematik (A-B-C-D, termasuk gula darah) dan mencakup semua sistem.", "w": {"a": "Benar, tetapi tidak cukup sendiri.", "b": "Benar, tetapi tidak cukup sendiri.", "c": "Benar, tetapi tidak cukup sendiri.", "d": "Benar, tetapi tidak cukup sendiri."}, "hy": "Penurunan kesadaran: selalu cek gula darah dan nilai ABCD.", "ev": [{"deck": "GD", "page": 9, "quote": "Pem. Fisik awal (Primary survey) (A-B-C-D) + Lab. Awal"}, {"deck": "ICU2", "page": 24, "quote": "Assess: GCS or AVPU, pupils, glucose"}], "refs": []}, {"id": "A176", "sec": "anes", "stem": "Laki-laki 30 tahun, BB 50 kg, mengalami ruptur hepar dengan tekanan darah 100/70 mmHg, nadi 110x/menit, dan RR 24x/menit. Tindakan yang tepat adalah:", "vig": null, "opts": ["Beri oksigen 6 L/menit", "Pasang infus jarum besar untuk mengambil darah dan cek Hb", "Beri infus 1.000 mL secepatnya", "Semua jawaban benar", "Tidak ada jawaban yang benar"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "d", "topic": "FLUID", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Pasien perdarahan intraabdomen dengan takikardia dan takipnea sedang dalam syok hemoragik (terkompensasi). Tata laksananya sekaligus: oksigen, pasang IV jarum besar sambil mengambil sampel darah (Hb, golongan darah, crossmatch), dan loading kristaloid 20 mL/kgBB = 50 × 20 = 1.000 mL secepatnya, lalu evaluasi respons dan kontrol sumber perdarahan (konsultasi bedah). Semua opsi benar.", "w": {"a": "Benar, tetapi b dan c juga benar.", "b": "Benar, tetapi a dan c juga benar.", "c": "Benar (20 mL/kg × 50 kg = 1.000 mL), tetapi a dan b juga benar.", "e": "Semua opsi a–c benar."}, "hy": "Perdarahan: O₂, IV besar + ambil darah, kristaloid 20 mL/kg, hentikan perdarahan.", "ev": [{"deck": "FLUID", "page": 19, "quote": "Airway + Breathing • Oxygen • Posisi syok • Pasang iv line nomer besar • Terapi cairan • Hentikan perdarahan"}, {"deck": "FLUID", "page": 21, "quote": "Infus Kristaloid 20 mL / kgBB"}], "refs": []}, {"id": "A177", "sec": "anes", "stem": "Hasil analisis gas darah menunjukkan SvO₂ 55%. Keadaan tersebut mengindikasikan apa?", "vig": null, "opts": ["Terjadi kematian sel", "Terjadi asidosis laktat yang berat", "Penurunan kebutuhan oksigen", "Kondisi tersebut normal", "Penurunan hantaran oksigen"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "e", "topic": "SHOCK", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "SvO₂ (saturasi vena campuran) mencerminkan keseimbangan antara hantaran (DO₂) dan konsumsi oksigen (VO₂). Normalnya di atas 65–75%. Tabel di slide Syok membagi: SvO₂ >75% ekstraksi normal; 75–50% ekstraksi kompensasi (kebutuhan O₂ naik atau suplai O₂ turun); 50–30% ekstraksi habis dan mulai asidosis laktat; 30–25% asidosis laktat berat; <25% kematian sel. SvO₂ 55% berada pada fase kompensasi, yaitu hantaran oksigen tidak mencukupi kebutuhan sehingga jaringan mengekstraksi lebih banyak.", "w": {"a": "Kematian sel terjadi bila SvO₂ <25%.", "b": "Asidosis laktat berat pada SvO₂ sekitar 30–25%.", "c": "Penurunan kebutuhan O₂ justru menaikkan SvO₂.", "d": "Normal >65–75%."}, "hy": "SvO₂/ScvO₂ rendah berarti DO₂ tidak cukup (Hb, SaO₂, atau curah jantung turun) atau VO₂ naik (demam, nyeri, menggigil).", "ev": [{"deck": "SHOCK", "page": 18, "quote": "Compensatory extraction Increasing O2 demand or decreasing"}, {"deck": "ICU2", "page": 14, "quote": "ScvO₂ below 70% suggests oxygen delivery is not meeting demand"}], "refs": []}, {"id": "A178", "sec": "anes", "stem": "Kesalahan (sumber eror) yang umum saat pengukuran oksimetri nadi adalah:", "vig": null, "opts": ["Ruangan terlalu gelap", "Lipemia", "Perfusi normal", "Hemoglobin normal", "Pasien tidak responsif"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "ICU2", "st": "luar", "deb": "Lipemia bukan sumber eror yang paling sering. Kunci dipilih karena opsi lain jelas bukan sumber eror; soal rekap ini kemungkinan tidak mencantumkan opsi seperti gerakan atau perfusi buruk.", "note": null, "gl": null, "r": "Oksimetri nadi membandingkan absorbsi dua panjang gelombang cahaya (merah dan inframerah) pada denyut arteri. Pembacaan bisa keliru karena dishemoglobin (karboksi- dan methemoglobin), zat warna (metilen biru, cat kuku), perfusi perifer buruk, gerakan, cahaya ruangan yang terlalu terang, dan anemia berat. Hiperlipidemia berat (lipemia, termasuk infus emulsi lemak) dilaporkan dapat mengganggu pembacaan oksimetri dan ko-oksimetri. Dari opsi, hanya lipemia yang merupakan sumber eror; opsi lain adalah kondisi normal yang tidak mengganggu.", "w": {"a": "Yang mengganggu adalah cahaya ruangan terlalu terang (lampu operasi, fototerapi), bukan ruangan gelap.", "c": "Perfusi normal justru memberi sinyal pletismografi yang baik. Yang menimbulkan eror adalah perfusi buruk.", "d": "Hemoglobin normal tidak mengganggu. Anemia berat yang bisa mengganggu.", "e": "Pasien tidak responsif tidak mengganggu pembacaan, asalkan perfusi dan probe baik."}, "hy": "Eror oksimetri nadi: perfusi buruk, gerakan, cahaya terang, cat kuku, COHb (SpO₂ palsu tinggi), MetHb (cenderung 85%).", "ev": [], "refs": ["jubran2015"]}, {"id": "A179", "sec": "anes", "stem": "Berikut ini adalah kondisi yang dapat diberi terapi ventilasi mekanik sejak dini, kecuali:", "vig": null, "opts": ["PJK dengan edema paru akut", "Sepsis", "Respons terhadap terapi yang lambat", "PPOK dengan giant bleb", "Kompensasi terbatas"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "d", "topic": "ICU2", "st": "luar", "deb": null, "note": null, "gl": null, "r": "Bantuan ventilasi dini menguntungkan pasien dengan cadangan kompensasi terbatas atau yang lambat merespons terapi: edema paru akut kardiogenik (tekanan positif menurunkan preload dan afterload ventrikel kiri), sepsis dengan peningkatan kerja napas, dan pasien yang kompensasinya terbatas. Sebaliknya, PPOK dengan giant bleb (bula besar) berisiko tinggi barotrauma dan pneumotoraks bila diberi ventilasi tekanan positif, sehingga ventilasi mekanik dihindari bila masih mungkin dan, bila terpaksa, dipakai tekanan rendah. Topik ini tidak dibahas di PPT.", "w": {"a": "Edema paru akut kardiogenik sangat responsif terhadap tekanan positif (CPAP/NIV atau ventilasi mekanik).", "b": "Sepsis dengan distres napas dan syok sering memerlukan intubasi dini untuk mengurangi kebutuhan oksigen otot napas.", "c": "Pasien yang respons terapinya lambat berisiko kelelahan napas, jadi bantuan dini dipertimbangkan.", "e": "Kompensasi terbatas (misalnya lansia, gizi buruk) adalah alasan untuk bantuan ventilasi dini."}, "hy": "Bula atau bleb besar: risiko barotrauma dan pneumotoraks dengan ventilasi tekanan positif.", "ev": [], "refs": ["slutsky2013"]}, {"id": "A180", "sec": "anes", "stem": "Di bawah ini yang bukan perangkat oksigen variabel (low-flow/variable performance) adalah:", "vig": null, "opts": ["Non-rebreathing mask", "Nasal kanul", "HFNC", "Simple mask", "Reservoir mask"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "ICU1", "st": "peng", "deb": null, "note": null, "gl": null, "r": "Perangkat oksigen variabel (variable performance/low-flow) memberi aliran lebih kecil dari aliran inspirasi pasien, sehingga udara ruangan ikut terhirup dan FiO₂ berubah-ubah sesuai pola napas. Contohnya nasal kanul, simple mask, masker dengan reservoir (partial atau non-rebreathing). HFNC (high-flow nasal cannula) adalah perangkat fixed performance: aliran tinggi (hingga 60 L/menit) yang dipanaskan dan dilembapkan melebihi aliran inspirasi pasien, sehingga FiO₂ yang diatur (21–100%) benar-benar terhantar. Venturi mask juga termasuk fixed performance.", "w": {"a": "Non-rebreathing mask tetap variabel karena FiO₂-nya bergantung pada pola napas dan kerapatan masker.", "b": "Nasal kanul adalah perangkat variabel klasik (FiO₂ sekitar 24–44%).", "d": "Simple mask adalah perangkat variabel.", "e": "Masker dengan reservoir tetap variabel."}, "hy": "Fixed performance: Venturi mask dan HFNC. Lainnya variabel.", "ev": [{"deck": "ICU1", "page": 21, "quote": "High-Flow Nasal Cannula"}, {"deck": "GD", "page": 44, "quote": "NASAL PRONG O2 flow 1 – 6 lpm FiO2 : 24 – 44 %"}], "refs": ["tb_morgan"]}, {"id": "A181", "sec": "anes", "stem": "Berikut ini yang terjadi saat pasien mengalami gagal napas, kecuali:", "vig": null, "opts": ["Bradikardia", "Takikardia", "Anemia", "Saturasi oksigen menurun", "Pernapasan cuping hidung"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "AB", "st": "peng", "deb": null, "note": null, "gl": null, "r": "Gagal napas menimbulkan tanda peningkatan kerja napas (takipnea, otot bantu, napas cuping hidung), hipoksemia (SpO₂ turun, sianosis), dan respons kardiovaskular: takikardia pada awalnya, lalu bradikardia ketika hipoksia berat (tanda menjelang henti jantung). Anemia bukan akibat gagal napas; anemia adalah kondisi tersendiri yang menurunkan kandungan oksigen darah.", "w": {"a": "Bradikardia muncul pada hipoksia berat dan merupakan tanda bahaya menjelang henti jantung.", "b": "Takikardia adalah respons awal terhadap hipoksia dan hiperkapnia.", "d": "Desaturasi adalah tanda gagal napas hipoksemik.", "e": "Napas cuping hidung adalah tanda kerja napas meningkat (slide ICU)."}, "hy": "Hipoksia: awalnya takikardia, lalu bradikardia bila berat (pre-arrest).", "ev": [{"deck": "ICU1", "page": 8, "quote": "adanya bantuan otot otot nafas natau nafas cuping hidung"}, {"deck": "GD", "page": 36, "quote": "Sianosis Status mental Asimetri dada Takhipnea"}], "refs": []}, {"id": "A182", "sec": "anes", "stem": "Pernyataan yang benar mengenai penilaian status oksigenasi adalah:", "vig": null, "opts": ["PaO₂ normal 80–100 mmHg untuk semua pasien", "SpO₂ tidak dapat digunakan untuk menilai oksigenasi", "Rasio P/F adalah alat yang objektif untuk menilai status oksigenasi", "SaO₂ adalah angka yang didapat dari oksimetri nadi", "Fraksi oksigen inspirasi (FiO₂) dapat diabaikan"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "ICU2", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Rasio P/F (PaO₂/FiO₂) menilai oksigenasi dengan memperhitungkan oksigen yang diberikan. Contoh di slide: PaO₂ 80 mmHg dengan FiO₂ 0,4 menghasilkan P/F 200. Rasio ini dipakai untuk menilai derajat gangguan oksigenasi, misalnya pada ARDS (≤300 ringan, ≤200 sedang, ≤100 berat).", "w": {"a": "PaO₂ normal bergantung pada umur, ketinggian, dan FiO₂; pada lansia nilainya lebih rendah.", "b": "SpO₂ adalah alat noninvasif standar untuk menilai oksigenasi (target biasa 92–96%).", "d": "SaO₂ diukur dari analisis gas darah arteri; angka dari oksimetri nadi disebut SpO₂.", "e": "FiO₂ tidak boleh diabaikan, karena PaO₂ 80 mmHg pada udara ruangan sangat berbeda artinya dengan 80 mmHg pada FiO₂ 100%."}, "hy": "P/F = PaO₂/FiO₂; normal sekitar 400–500. ARDS: ≤300 / ≤200 / ≤100.", "ev": [{"deck": "ICU2", "page": 16, "quote": "P/F ratio = PaO₂ ÷ FiO₂: 80 mmHg on FiO₂ 0.4 = 200"}, {"deck": "ICU2", "page": 18, "quote": "PaO₂ and P/F ratio: is the patient hypoxaemic?"}], "refs": []}, {"id": "A183", "sec": "anes", "stem": "Faktor yang berperan dalam hantaran oksigen (oxygen delivery), kecuali:", "vig": null, "opts": ["Hb", "PaO₂", "SaO₂", "Cardiac output", "SpO₂"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "e", "topic": "SHOCK", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "DO₂ = curah jantung × CaO₂, dengan CaO₂ = (1,34 × Hb × SaO₂) + (0,0031 × PaO₂). Jadi faktor penentunya Hb, SaO₂, PaO₂ (porsi terlarut, kecil), dan curah jantung. SpO₂ hanyalah perkiraan noninvasif SaO₂ dari oksimetri nadi, sebuah alat ukur, bukan variabel dalam rumus.", "w": {"a": "Hb adalah penentu utama kandungan oksigen.", "b": "PaO₂ masuk rumus sebagai oksigen terlarut, walaupun porsinya kecil.", "c": "SaO₂ adalah komponen utama kandungan oksigen.", "d": "Curah jantung adalah faktor pengali DO₂."}, "hy": "DO₂ = CO × (1,34 × Hb × SaO₂ + 0,003 × PaO₂).", "ev": [{"deck": "SHOCK", "page": 14, "quote": "CaO2 (mL O2/dL) = (1.34 x Hb concentration x SaO2) + (0.0031 x PaO2)"}, {"deck": "SHOCK", "page": 10, "quote": "Oxygen Delivery (DO2) = Cardiac Out put X Oxygen Content"}], "refs": []}, {"id": "A184", "sec": "anes", "stem": "Seorang anak laki-laki 7 tahun dengan riwayat epilepsi datang kontrol ke poliklinik. Tiba-tiba pasien kejang tonik-klonik. Diazepam 10 mg per rektal diberikan karena kejang tidak berhenti dalam 5 menit. Masker O₂ 6–10 L/menit sudah diberikan. Setelah kejang berhenti, pasien mulai sianosis dan napasnya tampak sangat lambat. Apa yang harus dilakukan?", "vig": null, "opts": ["Berikan napas buatan menggunakan bag-valve-mask (ambu bag) atau Jackson Rees", "Posisi syok dan berikan adrenalin 0,3–0,5 mg IM/SK", "Pijat jantung segera", "Pasang infus, berikan RL 500 mL diguyur, lalu segera intubasi", "Naikkan aliran oksigen menjadi 10–15 L/menit"], "src": ["Tabulasi IPK"], "n": 2, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "GD", "st": "ppt", "deb": null, "note": "Di Tabulasi soal ini muncul juga dalam versi bahasa Inggris (no. 9 bagian Kegawatan Napas).", "gl": null, "r": "Benzodiazepin (diazepam) dan fase pascaiktal menekan pusat napas. Pasien bernapas sangat lambat (hipoventilasi) dan sianosis. Masalahnya ventilasi, bukan kurangnya oksigen di masker: menaikkan aliran oksigen tidak membantu bila udara tidak masuk ke paru. Tindakan yang tepat adalah membuka jalan napas dan membantu ventilasi dengan bag-valve-mask atau Jackson Rees dengan oksigen. Pasien masih bernapas dan diasumsikan bernadi, jadi belum perlu kompresi dada.", "w": {"b": "Posisi syok dan adrenalin IM adalah tata laksana anafilaksis, tidak ada tanda anafilaksis di sini.", "c": "Kompresi dada hanya bila nadi tidak teraba (henti jantung).", "d": "Cairan bolus tidak menyelesaikan hipoventilasi; intubasi dipertimbangkan bila ventilasi BVM gagal atau dibutuhkan lama.", "e": "Hipoventilasi tidak teratasi dengan menaikkan aliran O₂; yang diperlukan adalah bantuan ventilasi."}, "hy": "Hipoventilasi (napas lambat atau dangkal): bantu ventilasi (BVM), bukan sekadar menaikkan O₂.", "ev": [{"deck": "GD", "page": 41, "quote": "Bag-valve-mask"}, {"deck": "FARM", "page": 25, "quote": "Depresi napas dan hipotensi, terutama bila bersama opioid"}], "refs": []}, {"id": "A185", "sec": "anes", "stem": "Manakah yang bukan penyebab shunt intrapulmoner?", "vig": null, "opts": ["Kontusio paru", "Edema paru", "Pneumonia", "Atelektasis", "Hipertensi pulmonal dengan defek septum"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "e", "topic": "AB", "st": "luar", "deb": null, "note": null, "gl": null, "r": "Shunt intrapulmoner terjadi bila alveoli mendapat perfusi tetapi tidak terventilasi karena terisi cairan, darah, eksudat, atau kolaps: kontusio paru, edema paru, pneumonia, dan atelektasis. Hipertensi pulmonal dengan defek septum (misalnya sindrom Eisenmenger) menimbulkan shunt intrakardiak kanan ke kiri, yaitu darah melewati paru sama sekali, bukan shunt di dalam paru. Lihat juga A105 tentang definisi shunt.", "w": {"a": "Kontusio paru menyebabkan alveoli terisi darah dan edema, sehingga terjadi shunt intrapulmoner.", "b": "Edema paru menyebabkan alveoli terisi cairan.", "c": "Pneumonia menyebabkan alveoli terisi eksudat.", "d": "Atelektasis menyebabkan alveoli kolaps sehingga tidak terventilasi."}, "hy": "Shunt intrapulmoner: alveoli tidak terventilasi tetapi berperfusi. Shunt intrakardiak: kanan-ke-kiri lewat defek septum.", "ev": [], "refs": ["petersson2014"]}, {"id": "A186", "sec": "anes", "stem": "Pemberian terapi O₂ dengan masker sederhana 6–8 liter/menit menghasilkan konsentrasi O₂ sekitar:", "vig": null, "opts": ["40%", "80%", "100%", "60%", "30%"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "GD", "st": "ppt", "deb": "Kisaran yang dikenal untuk masker sederhana adalah 40–60%, sehingga opsi d (60%) juga bisa dibela. Kunci memilih 40% karena aliran 6–8 L/menit berada di bawah aliran 8–10 L/menit yang di slide menghasilkan 40–60%.", "note": null, "gl": null, "r": "Masker sederhana (simple face mask) menghasilkan FiO₂ sekitar 40–60%, bergantung pada aliran dan pola napas pasien. Slide memberi kisaran 40–60% untuk aliran 8–10 L/menit. Pada aliran 6–8 L/menit, FiO₂ berada di ujung bawah kisaran itu, sekitar 40%. Aliran minimal 5–6 L/menit diperlukan agar CO₂ ekspirasi tidak terhirup ulang.", "w": {"b": "FiO₂ 80% atau lebih hanya tercapai dengan masker reservoir/non-rebreathing.", "c": "100% hanya didapat dengan sistem tertutup (BVM dengan reservoir, Jackson Rees, ventilator).", "d": "60% adalah batas atas masker sederhana pada aliran tinggi (8–10 L/menit).", "e": "30% sesuai untuk nasal kanul aliran rendah."}, "hy": "Nasal kanul 1–6 L: 24–44%. Simple mask: 40–60%. Masker reservoir: 60–100%. Jackson Rees/BVM + reservoir: mendekati 100%.", "ev": [{"deck": "GD", "page": 44, "quote": "FACE MASK O2 8-10 lpm FiO2 : 40-60%"}], "refs": []}, {"id": "A187", "sec": "anes", "stem": "Alat terapi oksigen yang menghasilkan konsentrasi lebih kurang 100% adalah:", "vig": null, "opts": ["Kanula hidung dengan aliran 3 liter per menit", "Kateter nasal dengan aliran 3 liter per menit", "Masker dengan aliran 10 liter per menit", "Masker dengan aliran 6 liter per menit", "Masker dengan kantung reservoir dengan aliran cukup untuk mengisi kantung"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "e", "topic": "GD", "st": "ppt", "deb": null, "note": "Opsi e di rekap tertulis \"masker dengan kantung udara dengan aliran 2 kali volume napas semenit\".", "gl": null, "r": "Masker dengan kantung reservoir (dan katup satu arah pada non-rebreathing mask) menyimpan oksigen murni yang dihirup saat inspirasi, sehingga pengenceran oleh udara ruangan berkurang. Slide memberi FiO₂ 60–100% untuk masker dengan reservoir bag. Aliran harus cukup agar kantung tidak kolaps saat inspirasi.", "w": {"a": "Nasal kanul 3 L/menit menghasilkan FiO₂ sekitar 32%.", "b": "Kateter nasal 3 L/menit juga hanya sekitar 30%.", "c": "Masker sederhana 10 L/menit menghasilkan maksimal sekitar 60%.", "d": "Masker sederhana 6 L/menit menghasilkan sekitar 40%."}, "hy": "FiO₂ tertinggi tanpa alat tertutup: masker non-rebreathing dengan reservoir.", "ev": [{"deck": "GD", "page": 44, "quote": "Masker sederhana Dengan reservoir bag Flow O2 : 6-10 lpm FiO2 : 60%- 100%"}], "refs": []}, {"id": "A188", "se
