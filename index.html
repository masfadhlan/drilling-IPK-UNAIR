c": "anes", "stem": "Terapi oksigen diberikan pada:", "vig": null, "opts": ["Henti napas", "Bronkopneumonia", "Sumbatan jalan napas", "Syok", "Semua benar"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "e", "topic": "GD", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Oksigen diindikasikan pada semua keadaan yang berisiko hipoksia jaringan: henti napas (diberikan lewat ventilasi bantuan), bronkopneumonia (hipoksemia akibat shunt), sumbatan jalan napas (setelah jalan napas dibebaskan), dan syok (hantaran oksigen turun). Slide Gawat Darurat membagi pemberian oksigen untuk pasien yang napasnya berhenti (lewat ventilasi) dan yang masih bernapas (lewat kanul atau masker), dan slide Terapi Cairan memasukkan oksigen dalam tata laksana syok.", "w": {"a": "Benar, tetapi opsi lain juga benar.", "b": "Benar, tetapi opsi lain juga benar.", "c": "Benar, tetapi opsi lain juga benar.", "d": "Benar, tetapi opsi lain juga benar."}, "hy": "Oksigen untuk henti napas harus disertai ventilasi; oksigen tanpa ventilasi tidak menolong pasien apnea.", "ev": [{"deck": "FLUID", "page": 19, "quote": "Airway + Breathing • Oxygen"}, {"deck": "GD", "page": 43, "quote": "Nafas berhenti Nafas ada"}], "refs": []}, {"id": "A189", "sec": "anes", "stem": "Seorang laki-laki 67 tahun datang ke IGD karena sesak napas yang bertambah. Pasien gelisah, laju napas 35x/menit, retraksi interkostal, berkeringat. SpO₂ 96% dengan masker 12 L/menit. Nadi 130x/menit reguler, ujung tangan dingin. TD 160/100 mmHg. Suhu aksila 37,8 °C. Ronki basah di kedua lapangan paru, ada wheezing. Iktus kordis di ICS 5 linea aksilaris anterior. Vena-vena leher tampak prominen. Riwayat hipertensi sejak 5 tahun, tidak minum obat teratur. Pernyataan yang tepat mengenai kasus ini adalah:", "vig": null, "opts": ["Rasio PaO₂/FiO₂ (P/F) kemungkinan rendah, mendekati atau di bawah 100", "Diagnosisnya pneumonia dengan komorbid asma", "Pemeriksaan yang paling diperlukan adalah darah lengkap dan CRP", "Belum memenuhi kriteria gagal napas akut karena SpO₂ masih >95%", "PaO₂ pasien ini diperkirakan <60 mmHg"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "ICU2", "st": "peng", "deb": "Angka P/F di bawah 100 bergantung pada FiO₂ sebenarnya (masker 12 L/menit bisa 0,6–0,9). Kunci dipilih karena opsi lain jelas salah dan P/F pasien ini memang sangat rendah.", "note": null, "gl": null, "r": "Gambaran ini adalah edema paru akut kardiogenik pada gagal jantung hipertensif: ronki basah bilateral, \"cardiac wheezing\", kardiomegali (iktus bergeser ke lateral), vena leher prominen, dan hipertensi tidak terkontrol. SpO₂ 96% tampak baik, tetapi dicapai dengan masker 12 L/menit (FiO₂ kemungkinan 0,6–0,9). SpO₂ 96% setara PaO₂ sekitar 80–90 mmHg, sehingga P/F kira-kira 90–150, yaitu gangguan oksigenasi berat. Inilah alasan oksigenasi harus dinilai bersama FiO₂, bukan dari SpO₂ saja.", "w": {"b": "Ronki basah bilateral dengan kardiomegali, JVP meningkat, dan hipertensi lebih mengarah ke edema paru kardiogenik; wheezing di sini adalah cardiac asthma, bukan asma bronkial.", "c": "Pemeriksaan yang lebih diperlukan adalah BGA, foto toraks, EKG, ekokardiografi, troponin, dan BNP; darah lengkap dan CRP bukan prioritas.", "d": "SpO₂ >95% dengan FiO₂ tinggi tetap berarti gangguan oksigenasi berat; pasien juga menunjukkan distres napas.", "e": "SpO₂ 96% hampir pasti berarti PaO₂ di atas 60 mmHg (kurva disosiasi)."}, "hy": "Nilai SpO₂ selalu bersama FiO₂: SpO₂ 96% dengan masker 12 L/menit bukan oksigenasi yang baik.", "ev": [{"deck": "ICU2", "page": 16, "quote": "P/F ratio = PaO₂ ÷ FiO₂: 80 mmHg on FiO₂ 0.4 = 200"}], "refs": []}, {"id": "A190", "sec": "anes", "stem": "Pernyataan tentang konsumsi oksigen (VO₂) yang benar adalah:", "vig": null, "opts": ["Jumlah oksigen yang digunakan tubuh", "Dapat diukur secara langsung ataupun dihitung", "Dapat diukur dari selisih oksigen yang masuk dan keluar paru", "Benar semua", "Tidak ada jawaban benar"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "d", "topic": "SHOCK", "st": "ppt", "deb": null, "note": "Opsi c di rekap berbunyi \"penghitungan berdasarkan jumlah oksigen yang masuk paru\"; dibaca sebagai pengukuran langsung dengan respirometri.", "gl": null, "r": "VO₂ adalah laju oksigen yang diambil dari darah untuk dipakai jaringan, normalnya sekitar 250 mL O₂/menit saat istirahat. Menurut slide Syok, VO₂ dapat diukur langsung (respirometri, yaitu selisih O₂ yang dihirup dan dihembuskan di paru) atau dihitung dengan rumus Fick: VO₂ = Q × (CaO₂ − CvO₂).", "w": {"a": "Benar, tetapi b dan c juga benar.", "b": "Benar, tetapi a dan c juga benar.", "c": "Benar (respirometri), tetapi a dan b juga benar.", "e": "Pernyataan a–c benar."}, "hy": "VO₂ = CO × (CaO₂ − CvO₂), normal sekitar 250 mL/menit; rasio ekstraksi normal 0,25–0,3.", "ev": [{"deck": "SHOCK", "page": 15, "quote": "Oxygen consumption (VO2) is the rate at which oxygen is removed from the blood for use by the tissues"}, {"deck": "SHOCK", "page": 15, "quote": "It can be measured directly (respirometry) or calculated"}], "refs": []}, {"id": "A191", "sec": "anes", "stem": "Untuk mengoptimalkan hantaran oksigen (DO₂) pada pasien syok akibat diare berat, tindakan yang tepat adalah:", "vig": null, "opts": ["Beri albumin untuk meningkatkan tekanan onkotik", "Beri oksigen hanya ketika saturasi <90%", "Beri kristaloid 15 mL/kgBB secepatnya", "a dan b benar", "Benar semua"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "FLUID", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Syok akibat diare adalah syok hipovolemik karena kehilangan cairan ekstraseluler. DO₂ dioptimalkan terutama dengan mengembalikan preload, yaitu resusitasi kristaloid cepat. Slide Syok memberi dosis resusitasi 10–20 mL/kgBB diguyur secepatnya (slide Terapi Cairan memakai 20 mL/kg), lalu dievaluasi. Kristaloid 15 mL/kgBB berada dalam kisaran itu. Oksigen juga diberikan pada syok, tidak menunggu saturasi turun di bawah 90%.", "w": {"a": "Albumin bukan pilihan pertama untuk syok akibat dehidrasi; kehilangannya adalah cairan ekstraseluler, jadi diganti kristaloid.", "b": "Pada syok, oksigen diberikan sejak awal, tidak menunggu saturasi <90%.", "d": "a dan b salah.", "e": "a dan b salah."}, "hy": "Syok hipovolemik karena dehidrasi: kristaloid 10–20 mL/kg diguyur, evaluasi, ulangi bila perlu.", "ev": [{"deck": "SHOCK", "page": 35, "quote": "Total Defisit 10 – 20 ml/Kg BB Guyur secepatnya"}, {"deck": "SHOCK", "page": 43, "quote": "Optimizing Oxygen Delivery in Shock"}], "refs": []}, {"id": "A192", "sec": "anes", "stem": "Kandungan oksigen adalah salah satu faktor penentu hantaran oksigen. Faktor-faktor apa saja yang memengaruhi nilai kandungan oksigen?", "vig": null, "opts": ["Hematokrit dan Hb", "Nadi dan isi sekuncup", "Hb dan saturasi oksigen", "Saturasi oksigen dan … (opsi tidak tercatat di rekap)", "Preload, kontraktilitas, dan afterload"], "src": ["Tabulasi IPK"], "n": 1, "inc": true, "img": null, "pool": "drill", "key": "c", "topic": "SHOCK", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "CaO₂ = (1,34 × Hb × SaO₂) + (0,0031 × PaO₂). Oksigen terlarut (dari PaO₂) sangat kecil, sehingga kandungan oksigen terutama ditentukan oleh Hb dan saturasi oksigen.", "w": {"a": "Hematokrit dan Hb menggambarkan hal yang sama (massa sel darah merah) dan tidak memperhitungkan saturasi.", "b": "Nadi dan isi sekuncup menentukan curah jantung, bukan kandungan oksigen.", "e": "Preload, kontraktilitas, dan afterload menentukan isi sekuncup dan curah jantung.", "d": "Opsi ini tidak tercatat lengkap di rekap/recall, sehingga tidak bisa dinilai."}, "hy": "CaO₂ ≈ 1,34 × Hb × SaO₂ (Hb 15, SaO₂ 100% menghasilkan sekitar 20 mL O₂/dL).", "ev": [{"deck": "SHOCK", "page": 14, "quote": "Oxygen bound to hemoglobin → 1.34 x Hb concentration x SaO2"}, {"deck": "SHOCK", "page": 14, "quote": "Oxygen dissolved → 0.0031 x PaO2 → (Relatively negligible)"}], "refs": []}, {"id": "A193", "sec": "anes", "stem": "Pada syok septik terjadi hipovolemia relatif. Penanganannya adalah:", "vig": null, "opts": ["Berikan kristaloid bila kadar laktat darah 2 mmol/L", "Berikan vasopresor bila tekanan darah tetap turun", "Pemberian antibiotik menunggu hasil kultur darah", "Benar semua", "Tidak ada jawaban yang benar"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "SHOCK", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Bundel jam pertama Surviving Sepsis Campaign (slide Syok): ukur laktat, ambil kultur darah sebelum antibiotik, berikan antibiotik spektrum luas dalam 1 jam, berikan kristaloid 30 mL/kg bila hipotensi atau laktat ≥4 mmol/L, dan berikan vasopresor bila tetap hipotensi selama atau setelah resusitasi cairan untuk mempertahankan MAP ≥65 mmHg. Jadi hanya pernyataan b yang benar.", "w": {"a": "Ambang loading 30 mL/kg adalah laktat ≥4 mmol/L (atau hipotensi), bukan 2 mmol/L.", "c": "Antibiotik tidak boleh menunggu hasil kultur; kultur diambil dulu lalu antibiotik diberikan dalam 1 jam.", "d": "a dan c salah.", "e": "Opsi b benar."}, "hy": "Sepsis hour-1 bundle: laktat, kultur, antibiotik <1 jam, kristaloid 30 mL/kg (bila hipotensi atau laktat ≥4), vasopresor untuk MAP ≥65.", "ev": [{"deck": "SHOCK", "page": 27, "quote": "hypotensive during or after fluid resuscitation to maintain a mean arterial"}, {"deck": "ICU1", "page": 15, "quote": "perlu dilakukan segera, dalam 1 jam pertama pasien diterima"}], "refs": ["evans2021"]}, {"id": "A194", "sec": "anes", "stem": "Syok sepsis termasuk:", "vig": null, "opts": ["Syok distributif", "Syok kardiogenik", "Syok obstruktif", "Syok hipovolemik", "Nonspesifik"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "SHOCK", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Syok septik adalah syok distributif: mediator inflamasi menyebabkan vasodilatasi luas dan kebocoran kapiler sehingga volume darah relatif tidak cukup mengisi pembuluh yang melebar (hipovolemia relatif), disertai gangguan ekstraksi oksigen di jaringan. Syok distributif lain adalah anafilaksis dan syok neurogenik/spinal (slide Syok dan Gawat Darurat).", "w": {"b": "Syok kardiogenik disebabkan gagal pompa. Sepsis dapat menimbulkan kardiomiopati septik, tetapi klasifikasi utamanya tetap distributif.", "c": "Syok obstruktif disebabkan tamponade, emboli paru, atau tension pneumothorax.", "d": "Hipovolemia pada sepsis bersifat relatif (vasodilatasi dan kebocoran), bukan hilangnya volume absolut.", "e": "Sepsis punya klasifikasi yang jelas."}, "hy": "Distributif: septik, anafilaksis, neurogenik. Kulit bisa hangat di fase awal.", "ev": [{"deck": "SHOCK", "page": 21, "quote": "Shock Distributive • Septic"}, {"deck": "GD", "page": 50, "quote": "Distributive - Septic - Anaphylaxsis - Spinal cord injury"}], "refs": []}, {"id": "A195", "sec": "anes", "stem": "Syok yang terjadi karena curah jantung rendah akibat kegagalan jantung memompa darah adalah:", "vig": null, "opts": ["Syok kardiogenik", "Syok hipovolemik", "Syok sepsis", "Syok distributif", "Syok obstruktif"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "SHOCK", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Syok kardiogenik adalah kegagalan pompa jantung sehingga curah jantung turun walaupun volume cukup. Penyebabnya infark atau iskemia miokard, aritmia, gagal jantung, kontusio miokard, atau disfungsi katup. Cirinya hipotensi dengan tanda kongesti (JVP naik, ronki) dan akral dingin.", "w": {"b": "Hipovolemik disebabkan kehilangan volume, sementara jantungnya normal.", "c": "Syok sepsis adalah syok distributif.", "d": "Distributif disebabkan vasodilatasi.", "e": "Obstruktif disebabkan hambatan aliran di luar otot jantung (tamponade, emboli, tension pneumothorax)."}, "hy": "Kardiogenik: pompa gagal, CO turun, tekanan pengisian naik (JVP, ronki).", "ev": [{"deck": "SHOCK", "page": 21, "quote": "Myocardial ischemia/infarction, arrhythmias, Shock Cardiogenic"}, {"deck": "GD", "page": 51, "quote": "Cardiogenik : - Arrytmias - Heart failure - Myocardial contusion / infarction"}], "refs": []}, {"id": "A196", "sec": "anes", "stem": "Keadaan curah jantung rendah akibat penumpukan cairan atau darah di rongga perikardium disebut:", "vig": null, "opts": ["Syok kardiogenik", "Syok obstruktif", "Syok hipovolemik", "Syok distributif", "(opsi tidak tercatat di rekap)"], "src": ["Tabulasi IPK"], "n": 1, "inc": true, "img": null, "pool": "drill", "key": "b", "topic": "SHOCK", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Tamponade jantung (cairan atau darah di kantung perikardium) menekan jantung dari luar sehingga pengisian diastolik terhambat dan curah jantung turun. Masalahnya ada pada hambatan aliran, bukan pada otot jantung, sehingga termasuk syok obstruktif, bersama tension pneumothorax dan emboli paru masif. Tanda klasiknya trias Beck: hipotensi, JVP meningkat, dan bunyi jantung menjauh. Tata laksananya perikardiosentesis.", "w": {"a": "Pada tamponade otot jantungnya normal; yang terganggu adalah pengisiannya.", "c": "Volume intravaskular tidak berkurang; JVP justru meningkat.", "d": "Tamponade tidak menyebabkan vasodilatasi.", "e": "Opsi ini tidak tercatat lengkap di rekap/recall, sehingga tidak bisa dinilai."}, "hy": "Obstruktif: tamponade, tension pneumothorax, emboli paru. Tangani penyebab mekanisnya.", "ev": [{"deck": "SHOCK", "page": 21, "quote": "Shock Obstructive • Tamponade, pulmonary embolism, cor pulmonale, air embolism"}, {"deck": "GD", "page": 51, "quote": "Obstructive - Tension pneumothorax - Cardiac tamponade"}], "refs": []}, {"id": "A197", "sec": "anes", "stem": "Penanganan penurunan curah jantung akibat kegagalan jantung memompa darah adalah dengan memberikan:", "vig": null, "opts": ["Infus kristaloid 1.000 mL", "Obat inotropik", "Vasopresor", "(opsi tidak tercatat di rekap)", "(opsi tidak tercatat di rekap)"], "src": ["Tabulasi IPK"], "n": 1, "inc": true, "img": null, "pool": "drill", "key": "b", "topic": "SHOCK", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Bila curah jantung turun karena kontraktilitas buruk (gagal pompa), intervensi yang menargetkan masalahnya adalah inotropik (dobutamin, milrinon, dopamin, atau adrenalin) untuk meningkatkan kontraktilitas. Slide Syok menempatkan inotropik pada komponen kontraktilitas dalam optimalisasi hantaran oksigen. Vasopresor ditambahkan bila tekanan darah sangat rendah (misalnya noradrenalin untuk mempertahankan perfusi koroner). Loading cairan besar berisiko memperberat edema paru. Lihat juga A029.", "w": {"a": "Bolus cairan 1 L pada gagal pompa berisiko edema paru; cairan hanya diberikan hati-hati bila ada hipovolemia.", "c": "Vasopresor menaikkan afterload dan tekanan, tetapi tidak memperbaiki kontraktilitas; dipakai bila hipotensi berat, bersama inotropik.", "d": "Opsi ini tidak tercatat lengkap di rekap/recall, sehingga tidak bisa dinilai.", "e": "Opsi ini tidak tercatat lengkap di rekap/recall, sehingga tidak bisa dinilai."}, "hy": "Gagal pompa: inotropik (dobutamin). Hipotensi berat: tambah vasopresor (noradrenalin).", "ev": [{"deck": "SHOCK", "page": 43, "quote": "Afterload vasoactive inotrope"}, {"deck": "ICU1", "page": 9, "quote": "NE, Epinephrine, Dopamin , Dobutamin, Milrinon, Vasopressin"}], "refs": []}, {"id": "A198", "sec": "anes", "stem": "Berikut merupakan gejala klinis saat perfusi menurun, kecuali:", "vig": null, "opts": ["Ileus", "Hipotensi", "Gangguan kesadaran (altered sensorium)", "Asidosis laktat", "Urine output berkurang"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "SHOCK", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Slide Syok mendaftar tanda penurunan perfusi organ: urine berkurang, ileus, gangguan kesadaran (altered sensorium), dan asidosis laktat. Hipotensi justru disebut \"timbul terlambat\", karena kompensasi (takikardia, vasokonstriksi) bisa mempertahankan tekanan darah walaupun perfusi sudah turun. Jadi hipotensi bukan gejala awal (\"sesaat\") penurunan perfusi. Lihat juga A103.", "w": {"a": "Ileus adalah tanda penurunan perfusi splanknik.", "c": "Gangguan kesadaran adalah tanda perfusi otak turun.", "d": "Asidosis laktat menandakan metabolisme anaerob akibat hipoperfusi.", "e": "Urine berkurang menandakan perfusi ginjal turun."}, "hy": "Hipotensi adalah tanda lambat syok.", "ev": [{"deck": "SHOCK", "page": 24, "quote": "Decreased urine output, ileus, altered sensorium, lactic acidosis • Hypotension timbul terlambat"}], "refs": []}, {"id": "A199", "sec": "anes", "stem": "Pernyataan yang benar tentang pengangkutan (transport) oksigen dalam darah adalah:", "vig": null, "opts": ["Terbanyak adalah oksigen yang larut dalam plasma", "Terbanyak adalah oksigen yang terikat dengan hemoglobin", "Jumlah oksigen yang larut dalam plasma dan yang terikat hemoglobin sama banyaknya", "Gangguan keseimbangan asam-basa akut tidak memengaruhi pengangkutan oksigen", "Bukan salah satu pernyataan di atas"], "src": ["Tabulasi IPK"], "n": 3, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "SHOCK", "st": "ppt", "deb": null, "note": "Soal ini muncul tiga kali di Tabulasi (no. 10, 11, dan versi bahasa Inggris no. 13 bagian Sirkulasi).", "gl": null, "r": "Hampir semua oksigen (sekitar 98%) diangkut terikat pada hemoglobin: 1,34 mL O₂ per gram Hb yang tersaturasi. Oksigen terlarut hanya 0,003 mL/dL per mmHg PaO₂, yaitu sekitar 0,3 mL/dL pada PaO₂ 100, dibanding sekitar 20 mL/dL yang terikat Hb. Slide menyebut porsi terlarut \"relatively negligible\". Asam-basa memengaruhi transport oksigen lewat efek Bohr: asidosis menggeser kurva ke kanan sehingga O₂ lebih mudah dilepas ke jaringan.", "w": {"a": "Oksigen terlarut sangat kecil.", "c": "Jumlahnya sangat jauh berbeda (sekitar 20 vs 0,3 mL/dL).", "d": "Asidosis dan alkalosis akut menggeser kurva disosiasi oksihemoglobin (efek Bohr).", "e": "Opsi b benar."}, "hy": "Sekitar 98% O₂ terikat Hb. Asidosis, hiperkapnia, demam, dan 2,3-DPG menggeser kurva ke kanan.", "ev": [{"deck": "SHOCK", "page": 14, "quote": "Oxygen dissolved → 0.0031 x PaO2 → (Relatively negligible)"}], "refs": []}, {"id": "A200", "sec": "anes", "stem": "Apakah yang dimaksud dengan hantaran oksigen (oxygen delivery, DO₂)?", "vig": null, "opts": ["Jumlah oksigen yang diangkut oleh hemoglobin dalam 100 mL darah", "Cardiac output", "Jumlah seluruh oksigen dalam darah", "Jumlah oksigen yang terlarut dalam 100 mL plasma", "Jumlah oksigen yang dipasok ke jaringan tubuh setiap 1 menit"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "e", "topic": "SHOCK", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "DO₂ adalah jumlah oksigen yang dihantarkan ke jaringan per menit: curah jantung (L/menit) × kandungan oksigen arteri (mL/dL) × 10. Normalnya sekitar 1.000 mL/menit (5 L/menit × 20 mL/dL × 10).", "w": {"a": "Oksigen terikat Hb per 100 mL darah adalah bagian dari kandungan oksigen (CaO₂), bukan DO₂.", "b": "Curah jantung hanya salah satu faktor DO₂.", "c": "Jumlah seluruh oksigen dalam darah adalah kandungan oksigen, bukan hantaran per menit.", "d": "Itu porsi oksigen terlarut."}, "hy": "DO₂ ≈ 1.000 mL/menit; VO₂ ≈ 250 mL/menit; ekstraksi sekitar 25%.", "ev": [{"deck": "SHOCK", "page": 10, "quote": "Oxygen Delivery (DO2) = Cardiac Out put X Oxygen Content"}], "refs": []}, {"id": "A201", "sec": "anes", "stem": "Semua penyebab di bawah ini merupakan contoh syok distributif, KECUALI:", "vig": null, "opts": ["Obat yang menyebabkan vasodilatasi", "Perdarahan", "Anafilaksis", "Cedera korda spinalis", "Sepsis"], "src": ["Tabulasi IPK"], "n": 2, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "SHOCK", "st": "ppt", "deb": null, "note": "Soal muncul dua kali di Tabulasi (versi bahasa Inggris no. 14 dan bahasa Indonesia no. 15 bagian Sirkulasi).", "gl": null, "r": "Syok distributif disebabkan vasodilatasi dan maldistribusi aliran darah: sepsis, anafilaksis, cedera korda spinalis (neurogenik), obat atau toksin vasodilator, insufisiensi adrenal. Perdarahan menyebabkan kehilangan volume absolut, sehingga termasuk syok hipovolemik.", "w": {"a": "Obat vasodilator (misalnya overdosis antihipertensi, anestetik) termasuk penyebab distributif.", "c": "Anafilaksis adalah syok distributif.", "d": "Cedera korda spinalis menyebabkan syok neurogenik (distributif).", "e": "Sepsis adalah penyebab distributif tersering."}, "hy": "Perdarahan = hipovolemik. Vasodilatasi = distributif.", "ev": [{"deck": "SHOCK", "page": 21, "quote": "Septic, hypoxemia, hypoglycemia, vaso-vagal syncope, adrenocortico-insufficiency, spinal shock, drugs and toxins"}, {"deck": "GD", "page": 50, "quote": "Hypovolemic : - Haemorrhage"}], "refs": []}, {"id": "A202", "sec": "anes", "stem": "Pasien syok berat akan mengalami:", "vig": null, "opts": ["Asidosis metabolik", "Asidosis respiratorik", "Alkalosis metabolik", "Alkalosis respiratorik", "Semua benar"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "SHOCK", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Pada syok berat, hantaran oksigen tidak mencukupi kebutuhan sehingga sel beralih ke metabolisme anaerob dan menghasilkan asam laktat: asidosis metabolik dengan anion gap tinggi (asidosis laktat). Slide Syok mencantumkan asidosis laktat sebagai tanda hipoperfusi, dan tabel SvO₂ menunjukkan asidosis laktat muncul saat ekstraksi oksigen sudah maksimal.", "w": {"b": "Asidosis respiratorik bisa menyertai bila ada gagal napas, tetapi bukan ciri khas syok.", "c": "Alkalosis metabolik bukan akibat syok (bisa terjadi pada muntah tanpa syok).", "d": "Alkalosis respiratorik bisa muncul sebagai kompensasi (takipnea), tetapi gangguan primernya asidosis metabolik.", "e": "Tidak semua terjadi."}, "hy": "Syok berarti metabolisme anaerob, laktat naik, asidosis metabolik dengan anion gap tinggi.", "ev": [{"deck": "SHOCK", "page": 24, "quote": "Decreased urine output, ileus, altered sensorium, lactic acidosis"}, {"deck": "SHOCK", "page": 18, "quote": "Beginning of lactic acidosis"}], "refs": []}, {"id": "A203", "sec": "anes", "stem": "Kehilangan cairan tubuh yang dapat menyebabkan syok, KECUALI:", "vig": null, "opts": ["Patah tulang paha tertutup", "Peritonitis", "Diare", "Muntah", "Perdarahan otak karena trauma"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "e", "topic": "SHOCK", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Patah tulang femur tertutup dapat menyembunyikan 1–1,5 L darah. Peritonitis menyebabkan perpindahan cairan ke ruang ketiga. Diare dan muntah menyebabkan kehilangan cairan ekstraseluler. Semuanya dapat menimbulkan syok hipovolemik (slide Terapi Cairan dan Syok). Perdarahan otak pada orang dewasa tidak bisa menampung volume darah yang cukup untuk menimbulkan syok hipovolemik, karena tengkorak adalah ruang tertutup dan tekanan intrakranial akan meningkat lebih dulu. Hipotensi pada trauma kepala harus dicari sumber perdarahan lain.", "w": {"a": "Fraktur femur bisa menyebabkan kehilangan darah 1–1,5 L (sumber perdarahan tersembunyi di slide).", "b": "Peritonitis menyebabkan kehilangan cairan ke ruang ketiga.", "c": "Diare adalah penyebab klasik syok hipovolemik.", "d": "Muntah hebat menyebabkan kehilangan cairan."}, "hy": "Trauma kepala dengan hipotensi: cari perdarahan di tempat lain (toraks, abdomen, pelvis, femur, kulit kepala).", "ev": [{"deck": "FLUID", "page": 36, "quote": "Perdarahan intra abdominal • Fraktur pelvis • Fraktur femur"}, {"deck": "SHOCK", "page": 41, "quote": "Diare / muntah /hematemesis"}], "refs": ["tb_atls"]}, {"id": "A204", "sec": "anes", "stem": "Tindakan utama pada penderita yang datang ke UGD dengan hipotensi karena perdarahan adalah:", "vig": null, "opts": ["Memberi O₂", "Memasang tensimeter untuk monitoring", "Memasang infus", "Memberikan vasopresor", "Posisi head down"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "FLUID", "st": "ppt", "deb": "Urutan slide menempatkan airway-breathing dan oksigen lebih dulu, sehingga opsi a juga bisa dibela. Kunci memilih c karena soal menanyakan tindakan utama untuk mengatasi hipotensi akibat perdarahan.", "note": null, "gl": null, "r": "Hipotensi karena perdarahan disebabkan kehilangan volume, jadi tindakan utama untuk mengatasinya adalah memasang infus jarum besar (dua jalur) untuk resusitasi cairan dan darah, sambil menghentikan sumber perdarahan. Oksigen dan posisi syok juga diberikan dalam alur yang sama (slide Terapi Cairan), tetapi tidak memperbaiki volume.", "w": {"a": "Oksigen penting dan diberikan bersamaan, tetapi tidak mengatasi penyebab hipotensi.", "b": "Monitoring perlu, tetapi bukan tindakan utama.", "d": "Vasopresor pada syok hemoragik yang belum diresusitasi cairan memperburuk perfusi jaringan.", "e": "Yang dianjurkan adalah posisi syok (angkat kedua tungkai), bukan head down (Trendelenburg), yang mengganggu ventilasi."}, "hy": "Hipotensi karena perdarahan: dua jalur IV besar, kristaloid lalu darah, dan hentikan perdarahan.", "ev": [{"deck": "FLUID", "page": 19, "quote": "Pasang iv line nomer besar • Terapi cairan • Hentikan perdarahan"}, {"deck": "FLUID", "page": 21, "quote": "Pasang Infus Jarum Besar Ambil Sample Darah U/ Cari Donor"}], "refs": []}, {"id": "A205", "sec": "anes", "stem": "Apakah penyebab penurunan tekanan darah pada syok neurogenik?", "vig": null, "opts": ["Rasa nyeri yang kuat", "Poliuria", "Perpindahan cairan masuk ke sistem vaskular", "Gangguan komunikasi pada sistem saraf simpatis", "Perpindahan cairan masuk ke dalam sel"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "d", "topic": "SHOCK", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Syok neurogenik terjadi pada cedera medula spinalis servikal atau torakal atas (di atas sekitar T6). Jalur simpatis desendens terputus sehingga tonus vasomotor hilang (vasodilatasi) dan, bila lesi di atas T1–T4, serabut akselerator jantung ikut terputus sehingga timbul bradikardia. Hasilnya hipotensi dengan bradikardia dan kulit hangat. Ini syok distributif (slide Syok dan Gawat Darurat).", "w": {"a": "Nyeri hebat bisa menimbulkan refleks vasovagal, tetapi itu bukan mekanisme syok neurogenik.", "b": "Poliuria menyebabkan hipovolemia.", "c": "Perpindahan cairan masuk ke vaskular justru menaikkan volume intravaskular.", "e": "Perpindahan cairan ke dalam sel bukan mekanisme syok neurogenik."}, "hy": "Syok neurogenik: hipotensi + bradikardia + kulit hangat setelah cedera spinal tinggi. Berikan cairan, vasopresor (noradrenalin), atropin bila bradikardia.", "ev": [{"deck": "SHOCK", "page": 21, "quote": "spinal shock"}, {"deck": "GD", "page": 50, "quote": "Spinal cord injury"}], "refs": ["tb_atls"]}, {"id": "A206", "sec": "anes", "stem": "Apakah pilihan terapi pada syok anafilaktik?", "vig": null, "opts": ["Memberikan antibiotik", "Mencegah timbulnya dengan cara mengajari pasien", "Memberikan kompres es pada daerah reaksi, memberikan antihistamin dan kortikosteroid", "Meletakkan pasien pada posisi duduk dan memberikan oksigen", "Epinefrin"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "e", "topic": "FARM", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Adrenalin (epinefrin) adalah obat pilihan pertama anafilaksis: efek alfa-1 mengatasi vasodilatasi dan edema, beta-1 meningkatkan kontraktilitas, dan beta-2 mengatasi bronkospasme serta menstabilkan sel mast. Dosis dewasa 0,5 mg IM (1:1.000) di paha anterolateral, dapat diulang tiap 5 menit. Slide Farmakologi: hentikan pemicu, panggil bantuan, berikan adrenalin IM segera serta tata laksana ABC dan cairan; antihistamin atau steroid tidak menggantikan adrenalin.", "w": {"a": "Antibiotik tidak berperan; antibiotik sering justru menjadi pemicu anafilaksis.", "b": "Edukasi untuk pencegahan penting setelahnya, tetapi bukan terapi syok.", "c": "Antihistamin dan kortikosteroid adalah terapi tambahan dan tidak menggantikan adrenalin (slide).", "d": "Pasien syok anafilaktik dibaringkan dengan tungkai diangkat. Posisi duduk hanya bila sesak berat tanpa hipotensi, karena posisi tegak bisa memicu henti jantung."}, "hy": "Anafilaksis: adrenalin 0,5 mg IM (1:1.000). Bolus 1 mg IV adalah dosis henti jantung (slide).", "ev": [{"deck": "FARM", "page": 3, "quote": "berikan adrenalin IM segera serta tata laksana ABC dan cairan"}, {"deck": "FARM", "page": 3, "quote": "Antihistamin atau steroid tidak menggantikan adrenalin untuk gangguan ABC pada anafilaksis"}], "refs": []}, {"id": "A207", "sec": "anes", "stem": "Pernyataan yang benar tentang posisi syok adalah:", "vig": null, "opts": ["Tungkai diposisikan setinggi 20°", "Darah dari tungkai mengalir kembali ke jantung", "Salah satu tungkai diangkat ke atas dan dipertahankan", "Posisi syok paling tepat dilakukan setelah infus terpasang", "Tidak ada pernyataan yang benar"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "FLUID", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Posisi syok adalah mengangkat kedua tungkai sehingga 300–500 mL darah dari tungkai pindah ke sirkulasi sentral (autotransfusi) dan preload naik. Slide Terapi Cairan juga menjelaskan bahwa posisi ini dilakukan sebelum memasang infus: vena tangan yang kolaps menjadi terisi kembali sehingga infus lebih mudah dipasang.", "w": {"a": "Slide tidak menyebut angka 20°; yang ditekankan adalah mengangkat kedua tungkai (passive leg raising biasanya sekitar 45°).", "c": "Yang diangkat kedua tungkai, bukan salah satu.", "d": "Posisi syok justru dilakukan sebelum infus terpasang untuk membantu pemasangan.", "e": "Opsi b benar."}, "hy": "Posisi syok: angkat kedua tungkai, autotransfusi 300–500 mL; membantu vena terisi sebelum pasang infus.", "ev": [{"deck": "FLUID", "page": 15, "quote": "Angkat kedua kaki 300 - 500 cc darah dari kaki pindah ke sirkulasi sentral"}, {"deck": "FLUID", "page": 15, "quote": "Vena tangan yang tadinya kolaps (hilang), jadi terisi lagi, memudahkan memasang infus"}], "refs": []}, {"id": "A208", "sec": "anes", "stem": "Gangguan faal sirkulasi diakibatkan oleh terjadinya gangguan pada:", "vig": null, "opts": ["Volume darah", "Jantung", "Pembuluh darah", "Semua jawaban betul", "Semua jawaban salah"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "d", "topic": "SHOCK", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Sirkulasi bergantung pada tiga komponen: volume darah (isi), jantung (pompa), dan pembuluh darah (pipa). Gangguan pada salah satunya menimbulkan gangguan sirkulasi atau syok: hipovolemik (volume), kardiogenik (pompa), distributif (pembuluh), dan obstruktif (hambatan aliran). Slide Pengantar menggambarkannya sebagai tangki kosong, pompa gagal, dan pipa melebar.", "w": {"a": "Benar, tetapi tidak lengkap.", "b": "Benar, tetapi tidak lengkap.", "c": "Benar, tetapi tidak lengkap.", "e": "Semua komponen dapat terganggu."}, "hy": "Sirkulasi = volume + pompa + pipa.", "ev": [{"deck": "INTRO", "page": 12, "quote": "Hypovolemic (The Tank is Empty) Distributive (The Pipes are Dilated)"}, {"deck": "GD", "page": 47, "quote": "GANGGUAN SIRKULASI • Syok • Disritmia • Henti jantung"}], "refs": []}, {"id": "A209", "sec": "anes", "stem": "Penggantian kehilangan cairan karena perdarahan atau dehidrasi dengan dekstrosa 5%:", "vig": null, "opts": ["Menjadi lebih baik, karena dekstrosa memberikan kalori", "Menjadi lebih baik, karena kehilangan cairan bisa diganti dengan dekstrosa 5%", "Dapat terjadi kejang karena edema otak", "Tidak akan terjadi apa-apa", "Semua benar"], "src": ["Tabulasi IPK"], "n": 2, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "FLUID", "st": "peng", "deb": null, "note": "Soal muncul juga dalam versi bahasa Inggris di Tabulasi (no. 5 bagian Terapi Cairan).", "gl": null, "r": "Dekstrosa 5% bersifat isotonik dalam kantong, tetapi glukosanya cepat dimetabolisme sehingga yang tersisa adalah air bebas. Air bebas menyebar ke semua kompartemen, sebagian besar ke intraseluler, sehingga hanya sekitar 1/12 yang tetap di intravaskular. Akibatnya volume darah tidak terganti, sedangkan natrium plasma turun (hiponatremia) dan air masuk ke sel otak: edema otak dan kejang. Pengganti kehilangan darah atau dehidrasi adalah kristaloid isotonik seperti RL atau NaCl 0,9%. Slide Terapi Cairan mencantumkan edema otak sebagai salah satu akibat pergeseran cairan yang merugikan.", "w": {"a": "Kalorinya kecil (200 kkal/L) dan bukan tujuan resusitasi.", "b": "D5% tidak mengganti volume intravaskular karena menjadi air bebas.", "d": "Risikonya nyata: hiponatremia, edema otak, hiperglikemia.", "e": "Opsi a, b, d salah."}, "hy": "D5% = air bebas. Jangan dipakai untuk resusitasi; risiko hiponatremia dan edema otak.", "ev": [{"deck": "FLUID", "page": 2, "quote": "pergeseran cairan merugikan (edema otak, ginjal,usus)"}], "refs": ["tb_morgan"]}, {"id": "A210", "sec": "anes", "stem": "Cairan yang dipakai untuk mengatasi syok hipovolemik, KECUALI:", "vig": null, "opts": ["Ringer laktat", "Dekstrosa 5%", "Haemaccel (gelatin)", "Dekstran", "Normal saline"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "FLUID", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Slide Syok mendaftar cairan resusitasi: kristaloid (RL, NaCl 0,9%, Ringer asetat) 2–4 kali EBL, dan koloid (gelatin seperti Haemaccel 2 kali EBL; dekstran dan HES 1 kali EBL). Dekstrosa 5% tidak termasuk karena setelah glukosa dimetabolisme yang tersisa air bebas yang tidak bertahan di intravaskular.", "w": {"a": "RL adalah kristaloid resusitasi utama.", "c": "Haemaccel adalah koloid gelatin.", "d": "Dekstran adalah koloid sintetis.", "e": "NaCl 0,9% adalah kristaloid isotonik."}, "hy": "Resusitasi: kristaloid isotonik (2–4 × EBL) atau koloid (1–2 × EBL). D5% bukan cairan resusitasi.", "ev": [{"deck": "SHOCK", "page": 33, "quote": "Cairan Kristaloid • RL, NaCl 0.9%, RA → 2-4x EBL"}, {"deck": "SHOCK", "page": 33, "quote": "Cairan Koloid • gelatin → 2x EBL • dextran, HES → 1x EBL"}], "refs": []}, {"id": "A211", "sec": "anes", "stem": "Pernyataan yang benar mengenai terapi natrium bikarbonat adalah:", "vig": null, "opts": ["Meningkatkan respons kardiovaskular terhadap katekolamin", "Meningkatkan risiko volume overload", "Dapat diberikan dengan dosis tinggi melalui jalur intravena perifer", "Sebaiknya digunakan rutin untuk terapi asidemia", "Meningkatkan kadar kalsium terionisasi dalam plasma"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "AB", "st": "luar", "deb": null, "note": null, "gl": null, "r": "Natrium bikarbonat (8,4% = 1 mEq/mL) mengandung natrium tinggi dan hiperosmolar, sehingga dapat menyebabkan hipernatremia, hiperosmolalitas, dan kelebihan volume. Efek lainnya: menurunkan kalsium terionisasi (alkalinisasi menaikkan ikatan Ca²⁺ dengan albumin), hipokalemia, peningkatan CO₂ yang memperburuk asidosis intraseluler bila ventilasi tidak memadai, dan iritasi atau nekrosis jaringan bila ekstravasasi. Bukti manfaatnya pada asidosis laktat atau syok tidak kuat, sehingga tidak dipakai rutin; indikasinya terbatas (misalnya hiperkalemia, overdosis trisiklik, asidosis metabolik non-anion gap berat). Topik ini tidak dibahas di PPT.", "w": {"a": "Respons terhadap katekolamin tidak terbukti membaik dengan koreksi pH oleh bikarbonat.", "c": "Bikarbonat pekat bersifat hiperosmolar dan iritatif; dosis tinggi sebaiknya lewat vena sentral.", "d": "Tidak dipakai rutin; koreksi penyebab asidosis lebih penting.", "e": "Justru menurunkan kalsium terionisasi."}, "hy": "Bikarbonat: risiko hipernatremia, overload, Ca²⁺ terionisasi turun, hipokalemia, CO₂ naik. Bukan untuk asidosis laktat rutin.", "ev": [], "refs": ["tb_morgan"]}, {"id": "A212", "sec": "anes", "stem": "Pasien laki-laki 20 tahun dengan berat badan 70 kg mengalami perdarahan karena patah tulang terbuka; perdarahan diperkirakan sekitar 500 mL. Tindakan yang dilakukan adalah:", "vig": null, "opts": ["Segera diberikan darah", "Diberikan minum oralit sebanyak 1.000 mL", "Diberikan normal saline atau Ringer laktat 1.000–1.500 mL", "Diberikan plasma ekspander 1.000 mL", "Diberikan dekstrosa 5% atau 10% 1.000–1.500 mL"], "src": ["Tabulasi IPK"], "n": 2, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "FLUID", "st": "ppt", "deb": null, "note": "Stem asli menyebut pasien \"mengalami syok hipovolemik\" dengan perdarahan sekitar 500 mL. Kehilangan 10% EBV pada dewasa muda biasanya belum menimbulkan syok; perhitungan di atas mengikuti angka 500 mL. Soal juga muncul dalam versi bahasa Inggris (no. 9 bagian Terapi Cairan).", "gl": null, "r": "EBV pria 70 kg = 70 × 70 = 4.900 mL. Perdarahan 500 mL sekitar 10% EBV (kelas I), cukup diganti dengan kristaloid 2–4 kali EBL: 1.000–2.000 mL. Opsi c (NS atau RL 1.000–1.500 mL) sesuai. Transfusi belum diperlukan pada perdarahan kelas I dengan Hb awal normal.", "w": {"a": "Darah belum diperlukan untuk kehilangan sekitar 10% EBV pada pasien muda sehat.", "b": "Oralit tidak tepat pada pasien perdarahan yang mungkin perlu operasi (puasa) dan tidak cukup cepat.", "d": "Koloid 1–1,5 kali EBL bisa dipakai, tetapi 1.000 mL (2 kali EBL) berlebihan untuk koloid sintetis dan bukan pilihan pertama.", "e": "Dekstrosa bukan cairan pengganti volume."}, "hy": "Kristaloid 2–4 × EBL; koloid 1–2 × EBL; whole blood 1 × EBL. EBV pria 70 mL/kg, wanita 65 mL/kg.", "ev": [{"deck": "SHOCK", "page": 33, "quote": "Cairan Kristaloid • RL, NaCl 0.9%, RA → 2-4x EBL"}, {"deck": "FLUID", "page": 20, "quote": "Laki laki : 70 ml / kgBB"}], "refs": []}, {"id": "A213", "sec": "anes", "stem": "Pasien dengan luka tusuk di abdomen kanan atas menunjukkan hipotensi, nadi 140x/menit, telapak tangan basah, dan penurunan kesadaran. Pasien kemungkinan telah kehilangan darah sebanyak:", "vig": null, "opts": ["Hingga 10% volume darah", "Hingga 10% berat badan", "Lebih dari 30% volume darah", "Lebih dari 30% berat badan", "Semua benar"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "SHOCK", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Hipotensi, nadi lebih dari 120–140x/menit, dan penurunan kesadaran adalah tanda perdarahan kelas III–IV ATLS, yaitu kehilangan lebih dari 30% volume darah (lebih dari sekitar 1.500 mL pada dewasa). Tabel slide Syok: perdarahan lebih dari 1.500 mL ditandai CRT memanjang, nadi >120, tekanan sistolik menurun, napas lebih dari 30–40x/menit, dan gelisah sampai koma.", "w": {"a": "Kehilangan hingga 10–15% volume darah (kelas I) hampir tanpa gejala.", "b": "Perdarahan dinyatakan dalam persen volume darah, bukan berat badan.", "d": "Kehilangan 30% berat badan tidak masuk akal (volume darah hanya sekitar 7% BB).", "e": "Hanya c yang benar."}, "hy": "Hipotensi muncul pada kelas III (30–40% EBV). Kelas IV (>40%): mengancam jiwa.", "ev": [{"deck": "SHOCK", "page": 32, "quote": "Perdarahan & tanda-tandanya (korban dewasa)"}], "refs": ["tb_atls"]}, {"id": "A214", "sec": "anes", "stem": "Manakah pernyataan yang benar berikut ini?", "vig": null, "opts": ["Golongan darah O dapat menerima semua golongan darah lainnya", "Golongan darah O sangat langka", "Golongan darah O tidak dapat diberikan kepada golongan darah AB", "Golongan darah O adalah donor universal", "Semua jawaban di atas benar"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "d", "topic": "FLUID", "st": "luar", "deb": null, "note": null, "gl": null, "r": "Sel darah merah golongan O tidak memiliki antigen A maupun B, sehingga dapat diberikan kepada resipien golongan apa pun (donor universal untuk PRC). Idealnya O Rh-negatif untuk kegawatan bila golongan belum diketahui. Sebaliknya, plasma golongan O mengandung anti-A dan anti-B, sehingga untuk plasma donor universalnya adalah AB. Golongan AB adalah resipien universal untuk sel darah merah. Topik ini tidak dibahas detail di PPT.", "w": {"a": "Golongan O hanya bisa menerima darah O, karena plasmanya mengandung anti-A dan anti-B.", "b": "Golongan O justru golongan darah tersering di Indonesia dan dunia.", "c": "Sel darah merah O dapat diberikan kepada AB.", "e": "Hanya d yang benar."}, "hy": "PRC: O donor universal, AB resipien universal. Plasma: kebalikannya.", "ev": [], "refs": ["tb_morgan"]}, {"id": "A215", "sec": "anes", "stem": "Pilih pernyataan yang benar:", "vig": null, "opts": ["Untuk transfusi elektif, ABO dan Rhesus harus sama", "Untuk transfusi elektif, ABO dan Rhesus tidak harus sama", "Untuk transfusi darurat, ABO tidak harus kompatibel dan Rhesus tidak harus sama", "Untuk transfusi darurat, ABO dan Rhesus harus sama", "Tidak ada pernyataan yang benar"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "FLUID", "st": "peng", "deb": null, "note": null, "gl": null, "r": "Pada transfusi elektif ada waktu untuk pemeriksaan golongan darah dan uji silang, sehingga diberikan darah yang ABO dan Rhesusnya sama (type-specific, crossmatched). Pada kegawatan ketika tidak ada waktu, dipakai golongan O (idealnya Rh-negatif, terutama untuk perempuan usia subur), lalu beralih ke type-specific setelah golongan diketahui. ABO yang tidak kompatibel tidak pernah boleh diberikan, karena menimbulkan reaksi hemolitik akut (slide mencantumkan inkompatibilitas ABO sebagai risiko transfusi).", "w": {"b": "Transfusi elektif harus ABO dan Rhesus sama.", "c": "ABO tidak kompatibel tidak boleh diberikan, sekalipun darurat.", "d": "Dalam keadaan darurat boleh memakai O (tidak harus sama golongannya) selama kompatibel.", "e": "Opsi a benar."}, "hy": "Elektif: type-specific + crossmatch. Darurat: O neg (atau O pos untuk laki-laki), lalu type-specific.", "ev": [{"deck": "FLUID", "page": 28, "quote": "Inkompatibilitas ABO dari human error"}], "refs": ["tb_morgan"]}, {"id": "A216", "sec": "anes", "stem": "Pernyataan yang benar mengenai terapi cairan pada situasi gawat darurat adalah:", "vig": null, "opts": ["Cairan apa pun dapat dipakai untuk resusitasi", "Gunakan kristaloid untuk semua pasien (anak dan dewasa)", "Koloid adalah pilihan pertama untuk syok hemoragik", "Dekstrosa 5% adalah cairan yang paling berguna", "Berikan transfusi darah sesegera mungkin"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "FLUID", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Cairan resusitasi awal untuk anak maupun dewasa adalah kristaloid isotonik (RL atau NaCl 0,9%) 20 mL/kgBB, lalu evaluasi respons (slide Terapi Cairan untuk syok perdarahan dan dehidrasi). Koloid tidak lebih unggul dan berisiko gangguan koagulasi dan ginjal. Darah diberikan sesuai respons dan derajat perdarahan, bukan otomatis pada semua pasien.", "w": {"a": "Cairan resusitasi harus isotonik; D5% dan cairan hipotonik tidak tepat.", "c": "Kristaloid adalah pilihan pertama; koloid tidak terbukti lebih baik.", "d": "D5% bukan cairan resusitasi.", "e": "Transfusi diberikan sesuai indikasi (respons transient atau no response, perdarahan kelas III–IV)."}, "hy": "Resusitasi awal: kristaloid isotonik 20 mL/kg untuk semua usia, lalu evaluasi.", "ev": [{"deck": "FLUID", "page": 21, "quote": "Infus Kristaloid 20 mL / kgBB"}, {"deck": "FLUID", "page": 18, "quote": "(Infus kristaloid 20 mL / kgBB)"}], "refs": []}, {"id": "A217", "sec": "anes", "stem": "Pernyataan yang SALAH mengenai transfusi adalah:", "vig": null, "opts": ["Golongan darah O dapat diberikan kepada semua golongan darah", "Golongan darah AB dapat menerima semua golongan darah lain", "Golongan darah AB tidak dapat menerima golongan darah B", "Golongan darah B tidak dapat menerima golongan darah A", "Pada situasi gawat darurat, gunakan golongan darah yang kompatibel"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "FLUID", "st": "luar", "deb": null, "note": null, "gl": null, "r": "Golongan AB tidak memiliki anti-A maupun anti-B dalam plasmanya, sehingga dapat menerima sel darah merah A, B, AB, maupun O (resipien universal). Pernyataan \"AB tidak dapat menerima B\" salah. Pernyataan lain benar untuk transfusi sel darah merah: O donor universal; B memiliki anti-A sehingga tidak bisa menerima A; dalam keadaan darurat tetap dipakai darah yang kompatibel (misalnya O).", "w": {"a": "Benar untuk sel darah merah (O tidak memiliki antigen A dan B).", "b": "Benar: AB adalah resipien universal.", "d": "Benar: plasma golongan B mengandung anti-A.", "e": "Benar: darah yang diberikan selalu harus kompatibel."}, "hy": "AB = resipien universal (PRC). O = donor universal (PRC).", "ev": [], "refs": ["tb_morgan"]}, {"id": "A218", "sec": "anes", "stem": "Estimated blood volume (EBV) untuk laki-laki dengan berat 80 kg adalah:", "vig": null, "opts": ["5,6 L", "5,2 L", "5,9 L", "5,4 L", "5,0 L"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "FLUID", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Slide Terapi Cairan memberi EBV laki-laki 70 mL/kgBB dan perempuan 65 mL/kgBB. Untuk laki-laki 80 kg: 80 × 70 = 5.600 mL = 5,6 L.", "w": {"b": "5,2 L adalah 65 mL/kg × 80 kg, yaitu nilai untuk perempuan.", "c": "5,9 L tidak sesuai rumus slide.", "d": "5,4 L tidak sesuai rumus slide.", "e": "5,0 L adalah 62,5 mL/kg."}, "hy": "EBV: pria 70, wanita 65, anak sekitar 70–80, bayi 80–85, neonatus 85–90 mL/kg.", "ev": [{"deck": "FLUID", "page": 20, "quote": "Laki laki : 70 ml / kgBB"}], "refs": []}, {"id": "A219", "sec": "anes", "stem": "Singkatan EBL berarti:", "vig": null, "opts": ["Estimated Baby Length", "Estimated Blood Lacking", "Estimated Body Length", "Estimated Body Loss", "Estimated Blood Loss"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "e", "topic": "FLUID", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "EBL adalah estimated blood loss (perkiraan kehilangan darah). Nilai ini dipakai untuk menghitung kebutuhan penggantian: kristaloid 2–4 × EBL, koloid 1–2 × EBL, whole blood 1 × EBL (slide Syok dan Terapi Cairan).", "w": {"a": "Bukan istilah medis yang dipakai.", "b": "Bukan kepanjangan EBL.", "c": "Bukan kepanjangan EBL.", "d": "Bukan kepanjangan EBL."}, "hy": "EBV = estimated blood volume; EBL = estimated blood loss.", "ev": [{"deck": "SHOCK", "page": 33, "quote": "* EBL = estimate blood loss"}], "refs": []}, {"id": "A220", "sec": "anes", "stem": "Jenis darah yang paling sesuai untuk transfusi pasien dengan anemia kronik adalah:", "vig": null, "opts": ["Plasma (fresh frozen plasma)", "Konsentrat trombosit", "Darah utuh segar (whole blood)", "Darah utuh simpan (whole blood)", "Sel darah merah pekat (packed red cells)"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "e", "topic": "FLUID", "st": "peng", "deb": null, "note": null, "gl": null, "r": "Pada anemia kronik, volume darah biasanya normal (normovolemik); yang kurang adalah massa sel darah merah. PRC menaikkan kapasitas angkut oksigen tanpa menambah banyak volume, sehingga risiko overload sirkulasi (TACO) lebih kecil dibanding whole blood. Ambang transfusi umumnya Hb 7 g/dL pada pasien stabil (slide).", "w": {"a": "FFP untuk defisiensi faktor koagulasi.", "b": "Trombosit untuk trombositopenia atau perdarahan karena gangguan trombosit.", "c": "Whole blood menambah volume berlebih pada pasien normovolemik.", "d": "Whole blood simpan juga menambah volume dan faktor labilnya sudah berkurang."}, "hy": "Anemia kronik normovolemik: PRC. Perdarahan akut masif: PRC + plasma + trombosit (atau whole blood).", "ev": [{"deck": "FLUID", "page": 23, "quote": "Hb critical 7 (PCV~20%)"}], "refs": ["carson2023"]}, {"id": "A221", "sec": "anes", "stem": "Transfusi darah utuh (whole blood) pada perdarahan akut diindikasikan bila:", "vig": null, "opts": ["Perdarahan lebih dari 30% EBV", "Hipovolemia dengan Hb <8 g/dL", "Untuk meningkatkan kebutuhan oksigen", "Hematokrit 20–25%", "Semua benar"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "FLUID", "st": "peng", "deb": null, "note": null, "gl": null, "r": "Whole blood mengganti volume, sel darah merah, dan sebagian faktor koagulasi sekaligus, sehingga paling bermanfaat pada perdarahan akut yang banyak, yaitu lebih dari 30% EBV (kelas III–IV), ketika kristaloid saja tidak cukup dan pasien menunjukkan respons transient atau no response. Slide memberi whole blood 1 × EBL.", "w": {"b": "Hb pada fase awal perdarahan akut belum turun (belum terjadi hemodilusi), sehingga bukan dasar indikasi; keputusan berdasarkan derajat perdarahan dan respons hemodinamik.", "c": "Transfusi bertujuan meningkatkan hantaran oksigen, bukan kebutuhan oksigen.", "d": "Hematokrit 20–25% saja (misalnya pada anemia kronik) bukan indikasi whole blood.", "e": "Tidak semua benar."}, "hy": "Indikasi darah pada perdarahan akut: kehilangan >30% EBV atau respons transient/no response terhadap kristaloid.", "ev": [{"deck": "FLUID", "page": 21, "quote": "Whole blood 1 x EBL"}, {"deck": "FLUID", "page": 22, "quote": "Perdarahan masif dide nisikan sebagai kehilangan satu volume darah dalam 24 jam"}], "refs": ["tb_atls"]}, {"id": "A222", "sec": "anes", "stem": "Reaksi transfusi segera yang mengancam jiwa adalah:", "vig": null, "opts": ["Anafilaktik (antibodi terhadap protein plasma donor)", "Hemolitik (inkompatibilitas ABO/Rh)", "Septik (misalnya darah terkontaminasi bakteri)", "Febris (nonhemolitik)", "A, B, dan C benar"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "e", "topic": "FLUID", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Reaksi transfusi akut yang dapat mengancam jiwa adalah reaksi hemolitik akut (inkompatibilitas ABO, biasanya karena human error), reaksi anafilaktik (misalnya pada defisiensi IgA), sepsis karena kontaminasi bakteri (terutama trombosit), serta TRALI dan TACO. Reaksi febris nonhemolitik adalah reaksi tersering tetapi umumnya ringan. Slide Terapi Cairan mendaftar kontaminasi bakteri, reaksi imunologis, reaksi hemolitik, TRALI, dan inkompatibilitas ABO sebagai risiko transfusi.", "w": {"a": "Benar, tetapi b dan c juga benar.", "b": "Benar, tetapi a dan c juga benar.", "c": "Benar, tetapi a dan b juga benar.", "d": "Reaksi febris nonhemolitik paling sering tetapi biasanya tidak mengancam jiwa."}, "hy": "Reaksi transfusi akut berat: hemolitik ABO, anafilaksis, sepsis, TRALI, TACO. Hentikan transfusi segera.", "ev": [{"deck": "FLUID", "page": 28, "quote": "Risiko transfusi darah alogenik meliputi: • Kontaminasi bakteri"}, {"deck": "FLUID", "page": 28, "quote": "Reaksi transfusi hemolitik"}], "refs": []}, {"id": "A223", "sec": "anes", "stem": "Pada perdarahan yang diterapi dengan Ringer laktat, penurunan kapasitas angkut oksigen dapat diatasi melalui mekanisme:", "vig": null, "opts": ["Kompensasi tubuh menaikkan saturasi oksigen", "Kompensasi tubuh menaikkan curah jantung (cardiac output)", "Kompensasi tubuh menaikkan Hb", "Pernyataan A dan B benar", "Pernyataan B dan C benar"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "b", "topic": "SHOCK", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Ringer laktat mengembalikan volume tetapi mengencerkan Hb (hemodilusi), sehingga kandungan oksigen turun. DO₂ dipertahankan dengan menaikkan curah jantung: preload yang pulih dan viskositas darah yang lebih rendah memudahkan aliran, ditambah takikardia. Jaringan juga meningkatkan ekstraksi oksigen. Saturasi sudah mendekati 100% sehingga tidak bisa naik banyak, dan Hb tidak naik dalam waktu singkat (eritropoiesis butuh hari sampai minggu).", "w": {"a": "Saturasi arteri pada pasien tanpa gangguan paru sudah sekitar 97–100%.", "c": "Hb tidak dapat naik cepat; RL justru mengencerkannya.", "d": "a salah.", "e": "c salah."}, "hy": "Hemodilusi normovolemik: CaO₂ turun, kompensasi lewat CO naik dan ekstraksi O₂ naik.", "ev": [{"deck": "SHOCK", "page": 10, "quote": "Oxygen Delivery (DO2) = Cardiac Out put X Oxygen Content"}, {"deck": "SHOCK", "page": 17, "quote": "Oxygen Extraction"}], "refs": []}, {"id": "A224", "sec": "anes", "stem": "Efek samping pemberian plasma ekspander (koloid: dekstran, hetastarch, albumin) adalah:", "vig": null, "opts": ["Gangguan fungsi metabolisme protein", "Gangguan fungsi hati", "Gangguan fungsi pencernaan", "Gangguan fungsi pembekuan darah", "Semua salah"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "d", "topic": "FLUID", "st": "peng", "deb": null, "note": null, "gl": null, "r": "Koloid sintetis, terutama dekstran dan hidroksietil starch (HES), mengganggu hemostasis: menurunkan faktor von Willebrand dan faktor VIII, mengganggu fungsi trombosit, dan polimerisasi fibrin, selain efek dilusi. Dekstran juga dapat memicu reaksi anafilaktoid, dan HES berhubungan dengan gangguan ginjal pada pasien sepsis. Slide Terapi Cairan menyebut gangguan koagulasi dan eksaserbasi perdarahan sebagai komplikasi terapi cairan yang tidak rasional.", "w": {"a": "Bukan efek samping khas koloid.", "b": "Bukan efek samping khas koloid.", "c": "Bukan efek samping khas koloid.", "e": "Opsi d benar."}, "hy": "Koloid sintetis: koagulopati, anafilaktoid (dekstran), cedera ginjal (HES).", "ev": [{"deck": "FLUID", "page": 2, "quote": "gangguan koagulasi dan eksaserbasi perdarahan"}], "refs": ["tb_morgan"]}, {"id": "A225", "sec": "anes", "stem": "Pasien 60 tahun dengan diagnosis ileus, pada pemeriksaan didapatkan dehidrasi 5%. Terapi cairan yang diberikan adalah:", "vig": null, "opts": ["Larutan Ringer laktat", "Larutan NaCl 3% untuk pasien dengan kadar Na serum 130 mEq/L", "Larutan gabungan dekstrosa 5% dan NaCl 0,45%", "Plasma ekspander", "Larutan dekstrosa 5%"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "FLUID", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Ileus (obstruksi usus) menyebabkan kehilangan cairan ekstraseluler: sekuestrasi di lumen usus, muntah, dan ruang ketiga. Penggantinya adalah kristaloid isotonik dengan komposisi mirip ECF, yaitu Ringer laktat (atau NaCl 0,9%). Defisit dihitung BB × % dehidrasi; 50% diberikan dalam 8 jam pertama dan 50% dalam 16 jam berikutnya, ditambah rumatan (slide Terapi Cairan).", "w": {"b": "NaCl 3% (hipertonik) untuk hiponatremia berat simtomatik, bukan untuk mengganti defisit ECF; Na 130 tidak memerlukan cairan hipertonik.", "c": "D5 ¼–½ NS adalah cairan rumatan, bukan pengganti defisit ECF.", "d": "Plasma ekspander tidak mengganti cairan interstisial yang hilang.", "e": "D5% bukan pengganti defisit ECF."}, "hy": "Defisit ECF (diare, muntah, ileus, luka bakar): kristaloid isotonik. Rumatan: cairan dengan dekstrosa.", "ev": [{"deck": "FLUID", "page": 17, "quote": "Dehidrasi : Diare, mual-muntah, intake terganggu • Burn • Obstruksi usus dll"}, {"deck": "FLUID", "page": 18, "quote": "Jumlah penggantian cairan : BB x % de sit ECF"}], "refs": []}, {"id": "A226", "sec": "anes", "stem": "Anion gap sebaiknya dihitung bila interpretasi gas darah menunjukkan:", "vig": null, "opts": ["Alkalosis respiratorik", "Peningkatan kadar asam laktat", "Asidosis metabolik", "Asidosis respiratorik", "Alkalosis metabolik"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "AB", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Langkah 4 pendekatan bertahap di slide Asam-Basa: bila ada asidosis metabolik, hitung anion gap, AG = Na⁺ − (Cl⁻ + HCO₃⁻), normal 3–11 mEq/L. AG membedakan asidosis metabolik dengan AG tinggi (laktat, ketoasidosis, uremia, toksin) dan AG normal atau hiperkloremik (diare, RTA, NaCl berlebih), sehingga mengarahkan penyebab dan terapi.", "w": {"a": "Anion gap tidak diperlukan untuk alkalosis respiratorik.", "b": "Asam laktat yang tinggi memang menaikkan AG, tetapi indikasi menghitung AG adalah temuan asidosis metabolik pada BGA.", "d": "Asidosis respiratorik dinilai dari PaCO₂, akut atau kronik.", "e": "Pada alkalosis metabolik, langkah pertama adalah klorida urine (slide)."}, "hy": "Asidosis metabolik: hitung AG, koreksi dengan albumin, lalu hitung delta ratio bila AG tinggi.", "ev": [{"deck": "AB", "page": 17, "quote": "Step 4 If metabolic acidosis, calculate Anion Gap (AG)"}, {"deck": "AB", "page": 52, "quote": "First step in assessing metabolic acidosis is calculating the AG"}], "refs": []}, {"id": "A227", "sec": "anes", "stem": "Pernyataan yang benar tentang pendekatan bertahap (stepwise approach) interpretasi asam-basa adalah:", "vig": null, "opts": ["Penting untuk mengetahui gangguan primernya", "Bila hasil tidak konsisten secara internal, kita boleh lanjut ke langkah 2", "Kecukupan kompensasi tidak mungkin dinilai", "Data elektrolit tambahan tidak diperlukan", "Anion gap tidak berguna pada pasien dengan asidosis metabolik"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "AB", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Pendekatan bertahap (slide Asam-Basa): cek konsistensi internal, nilai pH, PaCO₂, HCO₃⁻ untuk menentukan gangguan primer, hitung anion gap bila asidosis metabolik, tentukan akut atau kronik untuk gangguan respiratorik, nilai kecukupan kompensasi, lalu simpulkan. Menentukan gangguan primer adalah inti interpretasi.", "w": {"b": "Bila tidak konsisten, BGA kemungkinan tidak valid (slide) dan sebaiknya diulang, bukan dilanjutkan.", "c": "Kecukupan kompensasi dinilai dengan rumus (misalnya expected PaCO₂ = 40 − 1,2 × [24 − HCO₃⁻]).", "d": "Elektrolit (Na⁺, Cl⁻) diperlukan untuk menghitung anion gap.", "e": "Anion gap justru langkah kunci pada asidosis metabolik."}, "hy": "Langkah: konsistensi, pH, PaCO₂, HCO₃⁻, AG, akut/kronik, kompensasi, kesimpulan.", "ev": [{"deck": "AB", "page": 17, "quote": "Step 1 Asses pH to determine acidemia or alkalemia Step 2 Asses PaCO2 Step 3 Assess serum HCO3-"}, {"deck": "AB", "page": 18, "quote": "If pH and H+ are found to be inconsistent, then the BGA may be invalid"}], "refs": []}, {"id": "A228", "sec": "anes", "stem": "Pasien dengan riwayat diare. Hasil analisis gas darah: pH 7,24; PaCO₂ 24 mmHg; HCO₃⁻ 14 mEq/L. Kondisi pasien yang tepat adalah:", "vig": null, "opts": ["Asidosis respiratorik", "Asidosis metabolik", "Alkalosis respiratorik", "Asidosis metabolik dengan alkalosis respiratorik (kompensasi)", "Tidak dapat diinterpretasi karena tidak ada pemeriksaan elektrolit serum"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "d", "topic": "AB", "st": "ppt", "deb": "Secara ketat, PaCO₂ 24 di bawah expected PaCO₂ (28–29), sehingga ada alkalosis respiratorik tambahan, bukan sekadar kompensasi. Kunci tetap d karena opsi ini yang menyebut kedua komponen.", "note": null, "gl": null, "r": "pH 7,24 berarti asidemia. HCO₃⁻ 14 (rendah) sejalan dengan asidemia, jadi gangguan primernya asidosis metabolik (konsisten dengan diare yang menghilangkan bikarbonat). PaCO₂ 24 (rendah) menunjukkan respons respiratorik berupa hiperventilasi. Expected PaCO₂ menurut slide = 40 − 1,2 × (24 − 14) = 28 mmHg (rumus Winter: 1,5 × 14 + 8 = 29 ± 2). PaCO₂ 24 sedikit lebih rendah dari perkiraan, jadi selain kompensasi ada kecenderungan alkalosis respiratorik tambahan. Dari pilihan, d paling tepat karena menyebut kedua komponen.", "w": {"a": "PaCO₂ rendah, jadi bukan asidosis respiratorik.", "b": "Benar tetapi tidak lengkap; komponen respiratoriknya tidak disebut.", "c": "Pasien asidemia, jadi alkalosis respiratorik bukan gangguan primer.", "e": "Gangguan primer dan kompensasi bisa ditentukan tanpa elektrolit; elektrolit diperlukan untuk menghitung anion gap."}, "hy": "Asidosis metabolik: expected PaCO₂ = 1,5 × HCO₃⁻ + 8 ± 2 (Winter) atau 40 − 1,2 × ΔHCO₃⁻ (slide).", "ev": [{"deck": "AB", "page": 28, "quote": "1.2 mmHg decrease in PaCO2 for every 1 mEq/L fall in HCO3-"}], "refs": []}, {"id": "A229", "sec": "anes", "stem": "Hasil pemeriksaan gas darah arteri: pH 7,32; PaCO₂ 23 mmHg; HCO₃⁻ 15 mEq/L. Apakah interpretasinya?", "vig": null, "opts": ["Alkalosis metabolik primer tidak terkompensasi", "Alkalosis metabolik primer disertai asidosis respiratorik", "Alkalosis respiratorik primer tidak terkompensasi", "Asidosis metabolik terkompensasi", "Asidosis metabolik primer disertai alkalosis respiratorik"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "e", "topic": "AB", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "pH 7,32 berarti asidemia. HCO₃⁻ 15 rendah, jadi gangguan primer asidosis metabolik. Expected PaCO₂ = 40 − 1,2 × (24 − 15) = 29,2 mmHg (Winter: 1,5 × 15 + 8 = 30,5 ± 2). PaCO₂ terukur 23 jauh lebih rendah dari perkiraan, berarti ada alkalosis respiratorik yang menyertai (gangguan campuran). Slide menyebut bila PaCO₂ < expected, terdapat coexisting respiratory alkalosis.", "w": {"a": "Pasien asidemia, bukan alkalosis.", "b": "Pasien asidemia, bukan alkalosis.", "c": "Pasien asidemia, sehingga alkalosis respiratorik bukan gangguan primer.", "d": "PaCO₂ 23 lebih rendah dari batas kompensasi (sekitar 28–32), jadi bukan sekadar terkompensasi."}, "hy": "Bandingkan PaCO₂ terukur dengan expected: lebih rendah berarti alkalosis respiratorik tambahan; lebih tinggi berarti asidosis respiratorik tambahan.", "ev": [{"deck": "AB", "page": 28, "quote": "1.2 mmHg decrease in PaCO2 for every 1 mEq/L fall in HCO3-"}, {"deck": "AB", "page": 29, "quote": "PaCO2 < expected PaCO2 > expected Coexisting respiratory alkalosis Coexisting respiratory acidosis"}], "refs": []}, {"id": "A230", "sec": "anes", "stem": "Pasien tersebut mengalami:", "vig": "Pasca bedah torakotomi dilakukan pemeriksaan gas darah. Hasilnya: pH 7,20; PaO₂ 90 mmHg; PaCO₂ 60 mmHg; BE −2.", "opts": ["Asidosis metabolik dengan kompensasi alkalosis respiratorik", "Asidosis respiratorik dengan kompensasi alkalosis metabolik", "Alkalosis metabolik", "Asidosis respiratorik", "Asidosis metabolik"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "d", "topic": "AB", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "pH 7,20 berarti asidemia. PaCO₂ 60 tinggi dan sejalan dengan asidemia, jadi gangguan primernya asidosis respiratorik. BE −2 masih normal (−2 sampai +2), artinya belum ada kompensasi metabolik: asidosis respiratorik akut. Penyebabnya pada pascatorakotomi bisa berupa hipoventilasi karena sisa obat (opioid, pelumpuh otot, anestetik) atau nyeri yang membatasi gerak napas.", "w": {"a": "BE normal berarti tidak ada asidosis metabolik.", "b": "BE normal berarti belum ada kompensasi metabolik.", "c": "Pasien asidemia.", "e": "BE normal berarti komponen metaboliknya normal."}, "hy": "PaCO₂ tinggi + BE normal = asidosis respiratorik akut.", "ev": [{"deck": "AB", "page": 39, "quote": "pH < 7.4 as a result of PaCO2 > 40 mmHg"}], "refs": []}, {"id": "A231", "sec": "anes", "stem": "Penyebab keadaan tersebut di atas, KECUALI:", "vig": "Pasca bedah torakotomi dilakukan pemeriksaan gas darah. Hasilnya: pH 7,20; PaO₂ 90 mmHg; PaCO₂ 60 mmHg; BE −2.", "opts": ["Sisa obat narkotik", "Anestesi yang masih terlalu dalam", "Hiperventilasi", "Sisa obat pelumpuh otot", "Rangsangan nyeri"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "AB", "st": "ppt", "deb": null, "note": "Di Tabulasi tercatat bahwa kasus untuk soal ini sempat tidak muncul saat ujian; kasusnya adalah soal sebelumnya (pascatorakotomi, PaCO₂ tinggi, pH 7,20).", "gl": null, "r": "Asidosis respiratorik pascaoperasi disebabkan hipoventilasi: sisa opioid (depresi pusat napas), anestesi yang masih terlalu dalam, sisa pelumpuh otot (kelemahan otot napas), dan nyeri luka torakotomi yang membuat pasien bernapas dangkal (splinting). Hiperventilasi justru menurunkan PaCO₂ (alkalosis respiratorik), sehingga bukan penyebab.", "w": {"a": "Sisa opioid menekan pusat napas, sehingga PaCO₂ naik.", "b": "Anestesi yang terlalu dalam menekan ventilasi.", "d": "Sisa pelumpuh otot melemahkan otot napas.", "e": "Nyeri torakotomi menyebabkan napas dangkal dan hipoventilasi."}, "hy": "Pascaoperasi PaCO₂ naik: pikirkan opioid, sisa pelumpuh otot, anestetik residu, dan nyeri.", "ev": [{"deck": "AB", "page": 40, "quote": "Sedative or neuromuscular blocking agents"}, {"deck": "GD", "page": 39, "quote": "Hiperventilasi → PaCO2"}], "refs": []}, {"id": "A232", "sec": "anes", "stem": "Penderita syok hipovolemik diperiksa gas darahnya: PaO₂ 80 mmHg; PaCO₂ 40 mmHg; pH 7,2; BE −10. Pernyataan yang benar adalah:", "vig": null, "opts": ["Asidosis disebabkan faktor respiratorik", "Asidosis diatasi dengan natrium bikarbonat", "Asidosis membaik bila diberi cairan", "Asidosis tidak perlu diatasi", "Semua benar"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "c", "topic": "AB", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "pH 7,2 dengan BE −10 dan PaCO₂ normal berarti asidosis metabolik (belum terkompensasi). Pada syok hipovolemik penyebabnya asidosis laktat akibat hipoperfusi. Terapi utamanya memperbaiki perfusi dengan resusitasi cairan (dan darah bila perlu); setelah perfusi pulih, laktat dimetabolisme dan asidosis membaik. Bikarbonat tidak rutin diberikan.", "w": {"a": "PaCO₂ 40 normal, jadi bukan faktor respiratorik; BE −10 menunjukkan gangguan metabolik.", "b": "Bikarbonat tidak memperbaiki penyebab (hipoperfusi) dan punya efek samping.", "d": "Asidosis perlu diatasi dengan mengatasi penyebabnya.", "e": "Hanya c yang benar."}, "hy": "Asidosis laktat karena syok: perbaiki perfusi (cairan, darah, vasopresor sesuai jenis syok).", "ev": [{"deck": "SHOCK", "page": 24, "quote": "lactic acidosis"}, {"deck": "SHOCK", "page": 19, "quote": "Shock is initially reversible"}], "refs": []}, {"id": "A233", "sec": "anes", "stem": "Obat-obatan di bawah ini dapat menaikkan pH atau mengurangi produksi asam lambung sehingga dipakai untuk mencegah penyulit aspirasi asam lambung, kecuali:", "vig": null, "opts": ["Ranitidin", "Aluminium hidroksida", "Simetidin", "Kalsium hidroksida", "Magnesium trisilikat"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "d", "topic": "PREP", "st": "luar", "deb": null, "note": null, "gl": "Pedoman modern menganjurkan antasida nonpartikulat (natrium sitrat) bila dipakai, karena antasida partikulat (aluminium atau magnesium hidroksida) dapat menimbulkan pneumonitis bila teraspirasi.", "r": "Profilaksis aspirasi asam lambung memakai antagonis H₂ (ranitidin, simetidin) atau PPI untuk mengurangi produksi asam, serta antasida untuk menaikkan pH. Antasida yang dikenal adalah aluminium hidroksida, magnesium trisilikat, dan natrium sitrat. Kalsium hidroksida adalah basa kaustik (dipakai dalam kedokteran gigi dan industri), bukan obat antasida oral. Topik ini tidak dibahas di PPT.", "w": {"a": "Ranitidin adalah antagonis H₂ yang mengurangi sekresi asam.", "b": "Aluminium hidroksida adalah antasida.", "c": "Simetidin adalah antagonis H₂.", "e": "Magnesium trisilikat adalah antasida."}, "hy": "Profilaksis aspirasi: H₂-blocker/PPI + natrium sitrat (nonpartikulat) + metoklopramid.", "ev": [], "refs": ["tb_morgan", "asa2017"]}, {"id": "A234", "sec": "anes", "stem": "Pada asidosis metabolik, pemeriksaan gas darah menunjukkan:", "vig": null, "opts": ["pH menurun, PaCO₂ menurun", "pH menurun, PaCO₂ meningkat", "pH meningkat, PaCO₂ menurun", "pH meningkat, PaCO₂ meningkat", "Semua salah"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "a", "topic": "AB", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Pada asidosis metabolik, HCO₃⁻ turun sehingga pH turun. Paru segera berkompensasi dengan hiperventilasi sehingga PaCO₂ ikut turun (slide). Jadi pola khasnya pH turun, HCO₃⁻ turun, dan PaCO₂ turun.", "w": {"b": "pH turun dan PaCO₂ naik adalah pola asidosis respiratorik.", "c": "pH naik dan PaCO₂ turun adalah alkalosis respiratorik.", "d": "pH naik dan PaCO₂ naik adalah alkalosis metabolik dengan kompensasi.", "e": "Opsi a benar."}, "hy": "Gangguan metabolik: PaCO₂ bergerak searah HCO₃⁻ (kompensasi).", "ev": [{"deck": "AB", "page": 52, "quote": "Respiratory compensation occurs rapidly by the lungs (hyperventilation)"}], "refs": []}, {"id": "A235", "sec": "anes", "stem": "Terapi asidosis respiratorik adalah:", "vig": null, "opts": ["Natrium bikarbonat", "Dialisis", "Teknik rebreathing", "Pemberian volume intravaskular", "Dukungan ventilasi mekanik"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "e", "topic": "AB", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "Asidosis respiratorik disebabkan hipoventilasi (CO₂ tertahan). Terapinya meningkatkan ventilasi alveolar: atasi penyebab (misalnya nalokson untuk opioid), lalu dukungan ventilasi (NIV atau intubasi dan ventilasi mekanik) bila perlu (slide Asam-Basa).", "w": {"a": "Bikarbonat tidak mengatasi penyebab dan justru menambah beban CO₂.", "b": "Dialisis untuk gangguan metabolik atau gagal ginjal.", "c": "Rebreathing menaikkan PaCO₂; itu untuk alkalosis respiratorik akibat hiperventilasi psikogenik.", "d": "Volume intravaskular tidak memperbaiki ventilasi."}, "hy": "Asidosis respiratorik: tingkatkan ventilasi. Alkalosis respiratorik psikogenik: reassurance atau rebreathing.", "ev": [{"deck": "AB", "page": 44, "quote": "Impaired gas exchange - intubation (as for indication) - ventilation"}], "refs": []}, {"id": "A236", "sec": "anes", "stem": "Informasi yang tersedia dari hasil analisis gas darah adalah:", "vig": null, "opts": ["Status oksigenasi", "Status ventilasi", "Status asam-basa", "Gangguan primernya", "Semua benar"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": null, "pool": "drill", "key": "e", "topic": "AB", "st": "ppt", "deb": null, "note": null, "gl": null, "r": "BGA memberi PaO₂ dan SaO₂ (status oksigenasi), PaCO₂ (status ventilasi), pH, HCO₃⁻, dan BE (status asam-basa). Dengan pendekatan bertahap, BGA juga menentukan gangguan primer dan kompensasinya. Slide ICU menyusun interpretasi BGA menjadi enam langkah, mulai dari oksigenasi.", "w": {"a": "Benar, tetapi tidak lengkap.", "b": "Benar, tetapi tidak lengkap.", "c": "Benar, tetapi tidak lengkap.", "d": "Benar, tetapi tidak lengkap."}, "hy": "BGA: oksigenasi (PaO₂), ventilasi (PaCO₂), asam-basa (pH, HCO₃⁻, BE).", "ev": [{"deck": "AB", "page": 10, "quote": "PCO2 Respiratory component of acid-base regulation PO2 Reflects the ability of Hb to carry O2"}, {"deck": "ICU2", "page": 18, "quote": "PaO₂ and P/F ratio: is the patient hypoxaemic?"}], "refs": []}, {"id": "A237", "sec": "anes", "stem": "Irama EKG tersebut adalah:", "vig": "Seorang laki-laki 52 tahun dibawa ke UGD pagi ini dalam keadaan tidak sadar, napas ngorok dan tersengal-sengal. Ia mengeluh nyeri dada kiri dan napas berat sejak kemarin sore. Tiba di UGD pasien tampak biru, segera dibawa ke ruang resusitasi, dan dinyatakan henti jantung. Monitor EKG menunjukkan gambaran berikut.", "opts": ["Coarse ventricular fibrillation", "Fine ventricular fibrillation", "Ventricular tachycardia", "Sinus tachycardia", "EMD (electromechanical dissociation)"], "src": ["Tabulasi IPK"], "n": 3, "inc": false, "img": "tb_vf", "pool": "drill", "key": "a", "topic": "CPR", "st": "ppt", "deb": null, "note": "Soal ini muncul tiga kali di Tabulasi dengan gambar EKG yang sama: no. 5 (versi bahasa Inggris, \"two minutes after treatment\"), no. 7 (\"2 menit kemudian gambaran EKG berubah\"), dan no. 8 (EKG awal). Urutan opsi di sini mengikuti no. 8.", "gl": null, "r": "Gambar memperlihatkan gelombang yang sepenuhnya kacau, tanpa kompleks QRS, gelombang P, maupun T yang jelas, dengan amplitudo dan frekuensi yang tidak teratur. Itulah fibrilasi ventrikel. Amplitudonya besar (defleksi tinggi), sehingga termasuk coarse VF. Coarse VF lebih responsif terhadap defibrilasi; fine VF beramplitudo kecil dan bisa sulit dibedakan dari asystole. Slide CPR: coarse VF diberi DC shock, sedangkan fine VF yang meragukan diperlakukan seperti asystole (kompresi dan adrenalin, tanpa DC).", "w": {"b": "Fine VF beramplitudo kecil, hampir datar.", "c": "VT menunjukkan kompleks QRS lebar yang teratur dan seragam.", "d": "Sinus takikardia memiliki gelombang P dan QRS yang teratur, dan pasien bernadi.", "e": "EMD/PEA menampilkan irama terorganisasi mirip EKG normal, tetapi tanpa nadi."}, "hy": "Coarse VF: DC shock. Fine VF yang ragu dengan asystole: CPR + adrenalin, tanpa DC (slide).", "ev": [{"deck": "CPR", "page": 36, "quote": "Coarse Ventriculer Fibrilation NO DC DC"}, {"deck": "CPR", "page": 31, "quote": "VF / VT pulseless = ada gelombang khas – shockable rhythm, harus segera DC-shock"}], "refs": ["panchal2020"]}, {"id": "A238", "sec": "anes", "stem": "Berdasarkan EKG di atas (coarse ventricular fibrillation), tindakan yang harus dilakukan adalah:", "vig": "Seorang laki-laki 52 tahun dibawa ke UGD pagi ini dalam keadaan tidak sadar, napas ngorok dan tersengal-sengal. Ia mengeluh nyeri dada kiri dan napas berat sejak kemarin sore. Tiba di UGD pasien tampak biru, segera dibawa ke ruang resusitasi, dan dinyatakan henti jantung. Monitor EKG menunjukkan gambaran berikut.", "opts": ["Kompresi dada dan napas bantuan (CPR)", "DC shock", "Injeksi adrenalin", "DC shock dan injeksi adrenalin", "Kompresi dada, napas bantuan (CPR), dan injeksi adrenalin"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": "tb_vf", "pool": "drill", "key": "b", "topic": "CPR", "st": "ppt", "deb": "Opsi d juga bisa dibela karena adrenalin termasuk dalam algoritme VF (setelah syok kedua). Kunci memilih b karena slide CPR 36 secara langsung memasangkan coarse VF dengan DC.", "note": null, "gl": null, "r": "VF adalah ritme shockable, dan intervensi yang paling menentukan adalah defibrilasi sedini mungkin (slide CPR 36–37: coarse VF diberi DC; DC shock sebelum 5–10 menit). Setelah satu kali syok, CPR langsung dilanjutkan 2 menit. Adrenalin baru diberikan setelah syok kedua, dan amiodaron setelah syok ketiga (algoritme VF/VT di slide 35). Jadi tindakan spesifik untuk irama ini adalah DC shock.", "w": {"a": "CPR tetap dilakukan sambil menyiapkan defibrilator, tetapi tanpa DC shock VF tidak akan terkonversi.", "c": "Adrenalin saja tanpa defibrilasi bukan tata laksana VF.", "d": "Adrenalin memang bagian algoritme VF, tetapi baru diberikan setelah syok kedua; tindakan pertama dan utama adalah DC shock.", "e": "Ini tata laksana asystole/PEA atau fine VF (ritme non-shockable), bukan coarse VF."}, "hy": "VF/pVT: syok, CPR 2 menit, cek irama, syok, CPR + adrenalin, syok, CPR + amiodaron.", "ev": [{"deck": "CPR", "page": 36, "quote": "Coarse Ventriculer Fibrilation NO DC DC"}, {"deck": "CPR", "page": 37, "quote": "DC shock sedini mungkin (sebelum 5-10 menit)"}], "refs": ["panchal2020"]}, {"id": "A239", "sec": "anes", "stem": "Monitor EKG pasien yang tidak sadar dan nadinya tidak teraba menunjukkan gambaran berikut. Irama EKG tersebut adalah:", "vig": null, "opts": ["Coarse ventricular fibrillation", "Sinus tachycardia", "EMD (electromechanical dissociation)", "Fine ventricular fibrillation", "Ventricular tachycardia"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": "tb_vt", "pool": "drill", "key": "e", "topic": "CPR", "st": "ppt", "deb": null, "note": "Di Tabulasi soal ini (no. 11 bagian RJP) tidak menyebut kondisi nadi; stem di sini menambahkan \"nadi tidak teraba\" sesuai konteks soal tata laksana berikutnya.", "gl": null, "r": "Gambar menunjukkan kompleks QRS lebar, cepat, teratur, dan seragam (monomorfik) tanpa gelombang P yang jelas: takikardia ventrikel. Bila tidak disertai nadi (pulseless VT), tata laksananya sama dengan VF karena termasuk ritme shockable.", "w": {"a": "Coarse VF gelombangnya kacau dan tidak teratur.", "b": "Sinus takikardia QRS-nya sempit dengan gelombang P sebelum setiap QRS.", "c": "EMD/PEA tampak seperti irama normal tanpa nadi.", "d": "Fine VF beramplitudo kecil dan tidak teratur."}, "hy": "VT: QRS lebar, cepat, teratur. Tanpa nadi: DC shock (unsynchronized). Dengan nadi tidak stabil: kardioversi sinkron.", "ev": [{"deck": "CPR", "page": 32, "quote": "Ventriculer tachycardia ( VT –pulseless )"}, {"deck": "CPR", "page": 31, "quote": "VF / VT pulseless = ada gelombang khas – shockable rhythm, harus segera DC-shock"}], "refs": ["panchal2020"]}, {"id": "A240", "sec": "anes", "stem": "Berdasarkan EKG takikardia ventrikel tanpa nadi di atas, tindakan yang harus dilakukan adalah:", "vig": null, "opts": ["Kompresi dada dan napas bantuan (CPR)", "DC shock", "Injeksi adrenalin", "DC shock dan injeksi adrenalin", "Kompresi dada, napas bantuan (CPR), dan injeksi adrenalin"], "src": ["Tabulasi IPK"], "n": 1, "inc": false, "img": "tb_vt", "pool": "drill", "key": "b", "topic": "CPR", "st": "ppt", "deb": "Opsi d bisa dibela karena algoritme pVT juga memuat adrenalin setelah syok kedua. Kunci memilih DC shock sebagai tindakan spesifik untuk ritme ini.", "note": null, "gl": null, "r": "Slide CPR 33 (manajemen VT/VF): bila karotis tidak teraba, berikan a single shock 360 J (monofasik) atau 120–200 J (bifasik), lalu CPR 30:2 selama 2 menit. Bila karotis teraba dengan hemodinamik buruk, dilakukan kardioversi sinkron bertahap; bila hemodinamik baik, amiodaron atau lidokain. Pulseless VT diperlakukan sama dengan VF: tindakan utama defibrilasi.", "w": {"a": "CPR dilakukan, tetapi tanpa syok VT tanpa nadi tidak akan terkonversi.", "c": "Adrenalin saja bukan terapi ritme shockable.", "d": "Adrenalin baru diberikan setelah syok kedua; tindakan pertama adalah DC shock.", "e": "Ini tata laksana ritme non-shockable."}, "hy": "VT tanpa nadi = VF: defibrilasi. VT dengan nadi tidak stabil: kardioversi sinkron.", "ev": [{"deck": "CPR", "page": 33, "quote": "carotis (-)"}, {"deck": "CPR", "page": 33, "quote": "a single shock 360 Joules (Monophasic) 120-200 (Biphasic)"}], "refs": ["panchal2020"]}, {"id": "A241", "sec": "anes", "stem": "Atas dasar apa petugas menyatakan dengan pasti bahwa pasien mengalami henti jantung?", "vig": "Seorang laki-laki 52 tahun dibawa ke UGD pagi ini dalam keadaan tidak sadar, napas ngorok dan tersengal-sengal. Ia mengeluh nyeri dada kiri dan napas berat sejak kemarin sore. Tiba di UGD pasien tampak biru, segera dibawa ke ruang resusitasi, dan dinyatakan henti jantung.", "opts": ["Tidak sadar", "Tidak teraba hangat dan sianotik", "Tidak bernapas", "Tidak ada reaksi terhadap cubitan", "Tidak teraba denyut karotis setelah diperiksa 10 detik"], "src": ["Tabulasi IPK"], "n": 2, "inc": false, "img": null, "pool": "drill", "key": "e", "topic": "CPR", "st": "ppt", "deb": null, "note": "Soal serupa di Tabulasi (no. 10 bagian RJP): \"Diagnosa henti jantung pada orang dewasa dilakukan dengan meraba arteri karotis.\"", "gl": null, "r": "Henti jantung berarti tidak ada sirkulasi efektif, dan di antara pilihan, tanda yang paling langsung adalah tidak terabanya nadi karotis (diperiksa maksimal 10 detik). Slide CPR 31: \"Cardiac arrest = carotis (−)\". Perlu diingat, untuk memulai CPR tenaga kesehatan tidak perlu menunggu kepastian nadi; kombinasi tidak responsif dan napas tidak normal atau gasping sudah cukup (slide CPR 10), karena perabaan nadi saja tidak andal. Napas ngorok tersengal-sengal pada pasien ini adalah agonal gasping, bukan napas normal.", "w": {"a": "Tidak sadar bisa karena banyak sebab (sinkop, hipoglikemia, stroke).", "b": "Sianosis dan akral dingin bisa terjadi pada syok yang masih bernadi.", "c": "Henti napas bisa terjadi dengan nadi yang masih ada (respiratory arrest).", "d": "Tidak responsif terhadap nyeri juga terjadi pada koma."}, "hy": "Diagnosis henti jantung dewasa: nadi karotis (maksimal 10 detik). Mulai CPR bila tidak responsif dan napas tidak normal, jangan tunda karena ragu nadi.", "ev": [{"deck": "CPR", "page": 31, "quote": "1. Cardiac arrest = carotis (-)"}, {"deck": "CPR", "page": 10, "quote": "Palpation of the pulse as the sole in
